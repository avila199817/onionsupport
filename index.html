<!DOCTYPE html>
<html
  lang="es"
  data-theme="dark"
>
<head>
  <!-- =========================================================
       ONION SUPPORT — INDEX / SPA SHELL
       FULL PRO CSP CLEAN V5 PLUS MAX

       OBJETIVOS:
       - CSP clean
       - cero scripts inline
       - cero loader hardcodeado
       - cero flash dark forzado
       - theme preboot externo
       - shell SPA limpio
       - sidebar / topbar montados por JS
       - preparado para dark / light
       - preparado para loader montado por JS
       - base sólida enterprise
  ========================================================= -->

  <!-- =========================
       META BASE
  ========================= -->
  <meta charset="UTF-8">
  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Onion Support</title>

  <meta
    name="description"
    content="Onion Support · Panel SaaS de soporte, incidencias, facturación y gestión interna."
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <meta
    name="color-scheme"
    content="dark light"
  >

  <meta
    name="theme-color"
    content="#1f1f1f"
  >

  <!-- =========================
       BASE SPA
  ========================= -->
  <base href="/">

  <!-- =========================
       ICONS
  ========================= -->
  <link
    rel="icon"
    href="/favicon.ico"
    sizes="any"
  >

  <link
    rel="shortcut icon"
    href="/favicon.ico"
  >

  <!-- =========================
       PERFORMANCE
  ========================= -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <!-- =========================
       FONTS
  ========================= -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  >

  <!-- =========================
       PREBOOT THEME FIX
       CSP CLEAN:
       - sin inline script
       - se ejecuta antes del CSS final
  ========================= -->
  <script
    src="/src/preboot/theme.js"
  ></script>

  <!-- =========================
       CSS ORDER
  ========================= -->

  <!-- TOKENS -->
  <link
    rel="stylesheet"
    href="/src/css/tokens/variables.css"
  >
  <link
    rel="stylesheet"
    href="/src/css/tokens/light.css"
  >

  <!-- CORE -->
  <link
    rel="stylesheet"
    href="/src/css/core/reset.css"
  >
  <link
    rel="stylesheet"
    href="/src/css/core/layout.css"
  >
  <link
    rel="stylesheet"
    href="/src/css/core/core.css"
  >
  <link
    rel="stylesheet"
    href="/src/css/core/loader.css"
  >

  <!-- LAYOUT -->
  <link
    rel="stylesheet"
    href="/src/css/layout/sidebar.css"
  >
  <link
    rel="stylesheet"
    href="/src/css/layout/topbar.css"
  >

  <!-- COMPONENTS -->
  <link
    rel="stylesheet"
    href="/src/css/components/ui.css"
  >

  <!-- VIEWS -->
  <link
    rel="stylesheet"
    href="/src/css/auth/login.css"
  >

  <!-- =========================
       NOSCRIPT CSS EXTERNO
       CSP CLEAN:
       - sin <style> inline
  ========================= -->
  <noscript>
    <link
      rel="stylesheet"
      href="/src/css/core/noscript.css"
    >
  </noscript>
</head>

<body
  data-app="onion"
  data-density="default"
>
  <!-- =========================================================
       NOSCRIPT FALLBACK
  ========================================================= -->
  <noscript>
    <div class="layout">
      <main
        class="main-content"
        role="main"
        aria-label="Contenido principal"
      >
        <div id="app-content">
          <div id="view-container">
            <section class="noscript-box">
              <h1>JavaScript es necesario</h1>

              <p>
                Onion Support necesita JavaScript
                para cargar la navegación SPA,
                el panel, las vistas y la autenticación.
              </p>
            </section>
          </div>
        </div>
      </main>
    </div>
  </noscript>

  <!-- =========================================================
       APP LAYOUT
       - Sidebar montado por JS
       - Topbar montado por JS
       - Loader montado por JS
  ========================================================= -->
  <div
    class="layout"
    id="app-shell"
  >
    <!-- SIDEBAR MOUNT -->

    <!-- TOPBAR MOUNT -->

    <!-- MAIN CONTENT -->
    <main
      class="main-content"
      id="main-content"
      role="main"
      aria-label="Contenido principal"
    >
      <div id="app-content">
        <div
          id="view-container"
          data-view-root
          aria-live="polite"
        ></div>
      </div>
    </main>
  </div>

  <!-- =========================
       APP ENTRY
  ========================= -->
  <script
    type="module"
    src="/src/app.js"
  ></script>
</body>
</html>
