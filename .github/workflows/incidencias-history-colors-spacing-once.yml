name: Incidencias History Colors Spacing Once

on:
  push:
    branches:
      - style/incidencias-history-colors-spacing-20260817
    paths:
      - .github/scripts/patch-incidencias-history-colors-spacing.py
      - .github/workflows/incidencias-history-colors-spacing-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/incidencias-history-colors-spacing-20260817
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply history design patch
        run: python3 .github/scripts/patch-incidencias-history-colors-spacing.py

      - name: Validate JavaScript
        run: node --check src/views/incidencias/incidencias.template.modal.js

      - name: Smoke semantic timeline tones
        run: |
          node --input-type=module <<'NODE'
          import { renderIncidenciasDetailModal } from './src/views/incidencias/incidencias.template.modal.js';

          const detail = {
            ticketId: 'INC-TEST-HISTORY-COLORS',
            subject: 'Prueba de historial',
            description: 'Smoke test',
            status: 'open',
            priority: 'high',
            category: 'hardware',
            displayName: 'Test',
            email: 'test@example.com',
            timeline: [
              { id: '1', kind: 'comment', type: 'comment', title: 'Comentario', body: 'Texto', createdAt: '2026-08-17T10:00:00Z' },
              { id: '2', type: 'created', title: 'Incidencia creada', body: 'Creada', createdAt: '2026-08-17T09:00:00Z' },
              { id: '3', type: 'update', title: 'Actualización', body: 'Se ha añadido 1 adjunto', createdAt: '2026-08-17T08:00:00Z' },
              { id: '4', type: 'update', title: 'Estado', body: 'Incidencia cerrada', createdAt: '2026-08-17T07:00:00Z' },
              { id: '5', type: 'update', title: 'Prioridad', body: 'Prioridad urgente', createdAt: '2026-08-17T06:00:00Z' },
              { id: '6', type: 'update', title: 'Asignación', body: 'Técnico asignado', createdAt: '2026-08-17T05:00:00Z' },
              { id: '7', type: 'update', title: 'Factura', body: 'Factura asociada', createdAt: '2026-08-17T04:00:00Z' },
              { id: '8', type: 'update', title: 'Actualización', body: 'Cambio genérico', createdAt: '2026-08-17T03:00:00Z' },
            ],
          };

          const html = renderIncidenciasDetailModal({
            open: true,
            historyOpen: true,
            detail,
          });

          for (const tone of [
            'comment',
            'created',
            'attachment',
            'closed',
            'priority',
            'assignment',
            'invoice',
            'update',
          ]) {
            if (!html.includes(`tone-${tone}`)) {
              throw new Error(`Missing timeline tone: ${tone}`);
            }
          }
          NODE

      - name: Validate CSS contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path('src/css/views/incidencias/detail.css').read_text(encoding='utf-8')

          required = [
              'padding:\n    0\n    0\n    clamp(\n      24px,\n      2vw,\n      34px\n    );',
              '.incidencias-timeline-card.tone-comment',
              '.incidencias-timeline-card.tone-created',
              '.incidencias-timeline-card.tone-attachment',
              '.incidencias-timeline-card.tone-closed',
              '.incidencias-timeline-card.tone-priority',
              '.incidencias-timeline-card.tone-assignment',
              '.incidencias-timeline-card.tone-invoice',
              '--timeline-tone:',
          ]

          for token in required:
              if token not in css:
                  raise SystemExit(f'Missing CSS contract: {token}')

          if re.search(r':\s*[^;{}\n]*!\s*important\b', css, flags=re.I):
              raise SystemExit('No !important declarations allowed')
          PY

      - name: Commit product changes and remove one-shot files
        run: |
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"

          git rm .github/scripts/patch-incidencias-history-colors-spacing.py \
                 .github/workflows/incidencias-history-colors-spacing-once.yml

          git add src/views/incidencias/incidencias.template.modal.js \
                  src/css/views/incidencias/detail.css

          git commit -m "style(incidencias): equilibrar historial y añadir tonos semánticos"
          git push origin HEAD:style/incidencias-history-colors-spacing-20260817
