name: Incidencias admin editor PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/incidencias-admin-ticket-editor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: feat/incidencias-admin-ticket-editor
          fetch-depth: 0

      - name: Apply canonical product patch
        shell: bash
        run: |
          awk '
            /^[[:space:]]*python - <<'\''PY'\''$/ { capture=1; next }
            capture && /^[[:space:]]*PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/incidencias-admin-editor-patch.yml > /tmp/incidencias-admin-editor.py

          test -s /tmp/incidencias-admin-editor.py

          python - <<'PYFIX'
          from pathlib import Path

          path = Path('/tmp/incidencias-admin-editor.py')
          script = path.read_text(encoding='utf-8')

          def replace_labeled_block(script, label, replacement, end_marker):
              label_token = repr(label)
              pos = script.find(label_token)
              if pos < 0:
                  raise SystemExit(f'{label}: label not found')
              start = script.rfind('text = replace_once(', 0, pos)
              end = script.find(end_marker, pos)
              if start < 0 or end < 0:
                  raise SystemExit(f'{label}: block boundaries not found')
              return script[:start] + replacement + script[end:]

          script = replace_labeled_block(
              script,
              'index detail patch selector',
              '''needle = '          ".incidencias-modal-meta-grid",'
if text.count(needle) != 1:
    raise SystemExit(f"index detail patch selector: expected 1 meta-grid selector, found {text.count(needle)}")
text = text.replace(
    needle,
    needle + '\\n          ".incidencias-modal-admin-editor",',
    1,
)
''',
              '\n\nmarker =',
          )

          script = replace_labeled_block(
              script,
              'css admin responsive 540 padding',
              '''mobile_start = text.rfind('@media (max-width: 540px)')
if mobile_start < 0:
    raise SystemExit('css admin responsive 540 padding: media block not found')
mobile_needle = '  .incidencias-modal-description-section,\\n  .incidencias-modal-contact-section,\\n  .incidencias-modal-current-files,'
mobile_pos = text.find(mobile_needle, mobile_start)
if mobile_pos < 0:
    raise SystemExit('css admin responsive 540 padding: target selector not found in mobile block')
text = text[:mobile_pos] + '  .incidencias-modal-admin-editor,\\n' + text[mobile_pos:]
''',
              '\n\npath.write_text(text, encoding=',
          )

          path.write_text(script, encoding='utf-8')
          PYFIX

          python /tmp/incidencias-admin-editor.py

          git diff --check
          node --check src/views/incidencias/incidencias.options.js
          node --check src/views/incidencias/incidencias.template.create.js
          node --check src/views/incidencias/incidencias.template.modal.js
          node --check src/views/incidencias/index.js

          grep -q 'incidencias.index.extreme.v31.admin-ticket-editor' src/views/incidencias/index.js
          grep -q 'incidencias.template.modal.extreme.v30.admin-ticket-editor' src/views/incidencias/incidencias.template.modal.js
          grep -q 'data-admin-ticket-editor="true"' src/views/incidencias/incidencias.template.modal.js
          grep -q 'DETAIL_ACTIONS.ADMIN_SAVE' src/views/incidencias/index.js
          grep -q 'incidencias-modal-admin-editor' src/css/views/incidencias/detail.css

      - name: Commit product changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/views/incidencias/incidencias.template.create.js \
                  src/views/incidencias/incidencias.template.modal.js \
                  src/views/incidencias/index.js \
                  src/css/views/incidencias/detail.css
          git commit -m 'feat(incidencias): editor admin de estado prioridad y tipo [incidencias-admin-editor-applied]'
          git push origin HEAD:feat/incidencias-admin-ticket-editor
