name: TEMP · polish facturas create

on:
  push:
    branches:
      - polish/facturas-create-extreme-20260817
    paths:
      - .github/workflows/_temp_facturas_create_extreme.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/facturas-create-extreme-20260817
          fetch-depth: 0

      - name: Refactor create factura
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Pattern not found: {label}")
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f"Start marker not found: {label}")
              j = text.find(end, i)
              if j < 0:
                  raise SystemExit(f"End marker not found: {label}")
              return text[:i] + replacement.rstrip() + "\n\n" + text[j:]

          # --------------------------------------------------
          # index.js · search islands, no full modal rerender
          # --------------------------------------------------
          index_path = Path("src/views/facturas/index.js")
          index = index_path.read_text(encoding="utf-8")

          index = replace_once(
              index,
              '  getFacturaCreateBreakdown,\n} from "./facturas.template.create.js";',
              '  getFacturaCreateBreakdown,\n  renderFacturaCreateClientSearchSlot,\n  renderFacturaCreateTicketSearchSlot,\n} from "./facturas.template.create.js";',
              "create template imports",
          )

          index = replace_once(
              index,
              '  "facturas.index.productivo.v12.single-mount-detail-modal";',
              '  "facturas.index.productivo.v13.stable-create-search-islands";',
              "index version",
          )

          index = replace_once(
              index,
              'const SEARCH_DEBOUNCE_MS = 260;',
              'const SEARCH_DEBOUNCE_MS = 180;',
              "search debounce",
          )

          index = replace_once(
              index,
              'const CREATE_MODAL_PANEL_SELECTOR =\n  "[data-facturas-create-modal-panel=\'true\']";\nconst CREATE_MODAL_OVERLAY_SELECTOR =',
              'const CREATE_MODAL_PANEL_SELECTOR =\n  "[data-facturas-create-modal-panel=\'true\']";\nconst CREATE_MODAL_SCROLL_SELECTOR =\n  "[data-facturas-create-body=\'true\']";\nconst CREATE_MODAL_OVERLAY_SELECTOR =',
              "create scroll selector",
          )

          helper_marker = '  function renderCreateModalNow(options = {}) {'
          helper = '''  function createModalRenderPayload() {
            return {
              ...createModal,
              canCreate: isAdmin(),
              admin: isAdmin(),
              role: getCurrentRole(),
            };
          }

          function patchCreateSearchIsland(
            slotName = "",
            html = "",
            { busy = false } = {}
          ) {
            if (
              destroyed ||
              !createModal.open ||
              !createModalHost?.isConnected ||
              !slotName
            ) {
              return false;
            }

            const slot = createModalHost.querySelector(
              `[data-slot="${slotName}"]`
            );

            if (!slot) return false;

            if (slot.innerHTML !== html) {
              slot.innerHTML = html;
            }

            slot.setAttribute(
              "aria-busy",
              busy ? "true" : "false"
            );

            return true;
          }

          function patchCreateClientSearchDom() {
            const html = renderFacturaCreateClientSearchSlot(
              createModalRenderPayload()
            );

            return patchCreateSearchIsland(
              "client-search-results",
              html,
              { busy: createModal.clientSearch.loading }
            );
          }

          function patchCreateTicketSearchDom() {
            const html = renderFacturaCreateTicketSearchSlot(
              createModalRenderPayload()
            );

            const patched = patchCreateSearchIsland(
              "ticket-search-results",
              html,
              { busy: createModal.ticketSearch.loading }
            );

            const refreshButton = createModalHost?.querySelector?.(
              `[data-factura-create-action="${FACTURA_CREATE_ACTIONS.TICKET_REFRESH}"]`
            );

            if (refreshButton) {
              const disabled = Boolean(
                createModal.submitting ||
                createModal.ticketSearch.loading ||
                !createModal.selectedClientes.length
              );

              refreshButton.disabled = disabled;
              refreshButton.setAttribute(
                "aria-disabled",
                disabled ? "true" : "false"
              );
              refreshButton.setAttribute(
                "aria-busy",
                createModal.ticketSearch.loading ? "true" : "false"
              );
              refreshButton.textContent =
                createModal.ticketSearch.loading
                  ? "Cargando..."
                  : "Recargar";
            }

            return patched;
          }

'''
          if helper_marker not in index:
              raise SystemExit("renderCreateModalNow marker not found")
          index = index.replace(helper_marker, helper + helper_marker, 1)

          index = replace_once(
              index,
              '''    const state = captureModalDomState(
                target,
                CREATE_MODAL_PANEL_SELECTOR,
                CREATE_MODAL_PANEL_SELECTOR
              );

              target.innerHTML = renderFacturasCreateModal({
                ...createModal,
                canCreate: isAdmin(),
                admin: isAdmin(),
                role: getCurrentRole(),
              });''',
              '''    const state = captureModalDomState(
                target,
                CREATE_MODAL_PANEL_SELECTOR,
                CREATE_MODAL_SCROLL_SELECTOR
              );

              target.innerHTML = renderFacturasCreateModal(
                createModalRenderPayload()
              );''',
              "create render payload",
          )

          index = replace_once(
              index,
              '      scrollSelector: CREATE_MODAL_PANEL_SELECTOR,',
              '      scrollSelector: CREATE_MODAL_SCROLL_SELECTOR,',
              "create restore scroll selector",
          )

          schedule_client = '''  function scheduleClientSearch(value = "") {
            const query = cleanText(value, "");
            const seq = ++clientSearchSeq;

            createModal.clientSearch.query = query;
            createModal.clientSearch.error = "";
            createModal.clientSearch.empty = false;

            if (clientSearchTimer) {
              window.clearTimeout(clientSearchTimer);
              clientSearchTimer = null;
            }

            if (query.length < SEARCH_MIN_LENGTH) {
              createModal.clientSearch.loading = false;
              createModal.clientSearch.results = [];
              patchCreateClientSearchDom();
              return true;
            }

            createModal.clientSearch.loading = true;
            createModal.clientSearch.results = [];
            patchCreateClientSearchDom();

            clientSearchTimer = window.setTimeout(() => {
              clientSearchTimer = null;
              void runClientSearch(query, seq);
            }, SEARCH_DEBOUNCE_MS);

            return true;
          }'''
          index = replace_between(
              index,
              '  function scheduleClientSearch(value = "") {',
              '  async function runClientSearch(query = "", seq = null) {',
              schedule_client,
              "scheduleClientSearch",
          )

          run_client = '''  async function runClientSearch(query = "", seq = null) {
            const requestQuery = cleanText(query, "");

            const requestSeq =
              Number.isInteger(seq)
                ? seq
                : ++clientSearchSeq;

            try {
              const results = await searchClients(requestQuery);

              if (
                requestSeq !== clientSearchSeq ||
                requestQuery !== createModal.clientSearch.query ||
                destroyed ||
                !createModal.open
              ) {
                return false;
              }

              createModal.clientSearch.loading = false;
              createModal.clientSearch.error = "";
              createModal.clientSearch.results = results;
              createModal.clientSearch.empty = results.length === 0;

              patchCreateClientSearchDom();
              return true;
            } catch (searchError) {
              if (
                requestSeq !== clientSearchSeq ||
                destroyed ||
                !createModal.open
              ) {
                return false;
              }

              createModal.clientSearch.loading = false;
              createModal.clientSearch.results = [];
              createModal.clientSearch.empty = false;
              createModal.clientSearch.error = safeError(
                searchError,
                "No se pudo buscar cliente."
              );

              patchCreateClientSearchDom();
              return false;
            }
          }'''
          index = replace_between(
              index,
              '  async function runClientSearch(query = "", seq = null) {',
              '  function selectClient(index = -1) {',
              run_client,
              "runClientSearch",
          )

          schedule_ticket = '''  function scheduleTicketSearch(value = "") {
            const query = cleanText(value, "");
            const seq = ++ticketSearchSeq;

            createModal.ticketSearch.query = query;
            createModal.ticketSearch.error = "";
            createModal.ticketSearch.empty = false;

            if (ticketSearchTimer) {
              window.clearTimeout(ticketSearchTimer);
              ticketSearchTimer = null;
            }

            if (!createModal.selectedClientes.length) {
              createModal.ticketSearch.loading = false;
              createModal.ticketSearch.results = [];
              patchCreateTicketSearchDom();
              return true;
            }

            createModal.ticketSearch.loading = true;
            createModal.ticketSearch.results = [];
            patchCreateTicketSearchDom();

            ticketSearchTimer = window.setTimeout(() => {
              ticketSearchTimer = null;

              void loadTicketsForSelectedClients({
                query,
                autoSelectLatest: false,
                seq,
              });
            }, SEARCH_DEBOUNCE_MS);

            return true;
          }'''
          index = replace_between(
              index,
              '  function scheduleTicketSearch(value = "") {',
              '  async function loadTicketsForSelectedClients({',
              schedule_ticket,
              "scheduleTicketSearch",
          )

          load_tickets = '''  async function loadTicketsForSelectedClients({
            query = createModal.ticketSearch.query,
            autoSelectLatest = false,
            seq = null,
          } = {}) {
            if (!createModal.selectedClientes.length) {
              createModal.ticketSearch.loading = false;
              createModal.ticketSearch.results = [];
              createModal.ticketSearch.empty = false;
              patchCreateTicketSearchDom();
              return [];
            }

            const requestQuery = cleanText(query, "");

            const requestSeq =
              Number.isInteger(seq)
                ? seq
                : ++ticketSearchSeq;

            const clientKey = [
              ...selectedClienteIds(createModal.selectedClientes),
              ...selectedUserIds(createModal.selectedClientes),
            ]
              .sort()
              .join("|");

            createModal.ticketSearch.query = requestQuery;
            createModal.ticketSearch.loading = true;
            createModal.ticketSearch.error = "";
            createModal.ticketSearch.empty = false;
            createModal.ticketSearch.results = [];

            patchCreateTicketSearchDom();

            try {
              const results = await searchTickets(
                requestQuery,
                createModal.selectedClientes
              );

              const currentClientKey = [
                ...selectedClienteIds(createModal.selectedClientes),
                ...selectedUserIds(createModal.selectedClientes),
              ]
                .sort()
                .join("|");

              if (
                requestSeq !== ticketSearchSeq ||
                clientKey !== currentClientKey ||
                destroyed ||
                !createModal.open
              ) {
                return [];
              }

              createModal.ticketSearch.loading = false;
              createModal.ticketSearch.error = "";
              createModal.ticketSearch.results = results;
              createModal.ticketSearch.empty = results.length === 0;

              if (
                autoSelectLatest &&
                results[0]?.id &&
                !createModal.selectedTickets.length
              ) {
                createModal.selectedTickets = [results[0]];
                syncPrimaryTicketToForm();

                rerenderCreateWithFocus(
                  "[data-field='ticketSearch'], [data-create-field='ticketSearch'], input[name='ticketSearch']"
                );

                return results;
              }

              patchCreateTicketSearchDom();
              return results;
            } catch (searchError) {
              if (
                requestSeq !== ticketSearchSeq ||
                destroyed ||
                !createModal.open
              ) {
                return [];
              }

              createModal.ticketSearch.loading = false;
              createModal.ticketSearch.results = [];
              createModal.ticketSearch.empty = false;
              createModal.ticketSearch.error = safeError(
                searchError,
                "No se pudieron cargar incidencias."
              );

              patchCreateTicketSearchDom();
              return [];
            }
          }'''
          index = replace_between(
              index,
              '  async function loadTicketsForSelectedClients({',
              '  function selectTicket(index = -1) {',
              load_tickets,
              "loadTicketsForSelectedClients",
          )

          index = replace_once(
              index,
              '          localDetailImmediate: true,\n          noSecondOpenAnimation: true,',
              '          localDetailImmediate: true,\n          createSearchDomIslands: true,\n          createSearchNoFullRender: true,\n          createSearchRaceGuard: true,\n          noSecondOpenAnimation: true,',
              "snapshot create policy",
          )

          index_path.write_text(index, encoding="utf-8")

          # --------------------------------------------------
          # template · stable body scroll owner + version
          # --------------------------------------------------
          template_path = Path("src/views/facturas/facturas.template.create.js")
          template = template_path.read_text(encoding="utf-8")

          template = replace_once(
              template,
              '  "facturas.template.create.v4.final-ui-clean";',
              '  "facturas.template.create.v5.stable-search-islands";',
              "template version",
          )

          template = replace_once(
              template,
              '<div class="fac-create-body">',
              '<div class="fac-create-body" data-facturas-create-body="true">',
              "create body scroll owner",
          )

          template_path.write_text(template, encoding="utf-8")

          # --------------------------------------------------
          # CSS · detail-aligned layout, controls and zero !important
          # --------------------------------------------------
          css_path = Path("src/css/views/facturas/create.css")
          css = css_path.read_text(encoding="utf-8")

          css = css.replace(" !important", "")
          css = css.replace(
              "   - Un único scroll en .fac-create-panel.\n   - Header, body y acciones fluyen juntos.",
              "   - Panel estable con header fijo y un único scroll en .fac-create-body.\n   - Búsquedas actualizadas por islas DOM, sin remontar el modal al escribir."
          )

          panel_start = '/* =========================================================\n   PANEL · SINGLE SCROLL\n========================================================= */'
          header_start = '/* =========================================================\n   HEADER\n========================================================= */'
          new_panel = '''/* =========================================================
             PANEL · STABLE SHELL / BODY SCROLL
          ========================================================= */

          .fac-create-panel {
            position: relative;
            isolation: isolate;
            inline-size: var(--fc-width);
            block-size: var(--fc-height);
            min-inline-size: 0;
            min-block-size: 0;
            max-inline-size: calc(100vw - 36px);
            max-block-size: calc(100dvh - 32px);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            overflow: hidden;
            border: 1px solid var(--fc-border);
            border-radius: var(--fc-radius-panel);
            background:
              radial-gradient(circle at 0% 0%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 31%),
              radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--info) 9%, transparent), transparent 30%),
              radial-gradient(circle at 100% 100%, color-mix(in srgb, var(--success) 5%, transparent), transparent 42%),
              linear-gradient(
                180deg,
                color-mix(in srgb, var(--surface-3) 45%, transparent),
                color-mix(in srgb, var(--surface-1) 88%, #000 12%)
              ),
              var(--panel-bg);
            color: var(--text);
            box-shadow: var(--fc-panel-shadow);
            outline: none;
            pointer-events: auto;
            transform-origin: center;
            animation: facCreatePanelIn .20s cubic-bezier(.16, 1, .3, 1) both;
          }

          .fac-create-panel::before {
            content: "";
            position: absolute;
            inset-inline: 28px;
            inset-block-start: 0;
            z-index: 50;
            block-size: 1px;
            pointer-events: none;
            background:
              linear-gradient(
                90deg,
                transparent,
                color-mix(in srgb, var(--accent) 48%, transparent),
                color-mix(in srgb, var(--info) 30%, transparent),
                transparent
              );
            opacity: .92;
          }

          .fac-create-body,
          .fac-create-search-results,
          .fac-create-ticket-list {
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) transparent;
          }

          .fac-create-body::-webkit-scrollbar,
          .fac-create-search-results::-webkit-scrollbar,
          .fac-create-ticket-list::-webkit-scrollbar {
            inline-size: var(--scrollbar-size, 10px);
          }

          .fac-create-body::-webkit-scrollbar-track,
          .fac-create-search-results::-webkit-scrollbar-track,
          .fac-create-ticket-list::-webkit-scrollbar-track {
            background: transparent;
          }

          .fac-create-body::-webkit-scrollbar-thumb,
          .fac-create-search-results::-webkit-scrollbar-thumb,
          .fac-create-ticket-list::-webkit-scrollbar-thumb {
            border: 2px solid transparent;
            border-radius: var(--radius-pill);
            background: var(--scrollbar-thumb);
            background-clip: padding-box;
          }

          .fac-create-panel.is-submitting {
            pointer-events: auto;
          }
'''
          css = replace_between(css, panel_start, header_start, new_panel, "css panel section")

          header_end = '/* =========================================================\n   BODY / FORM / VISUAL ORDER\n========================================================= */'
          new_header = '''/* =========================================================
             HEADER
          ========================================================= */

          .fac-create-header {
            position: relative;
            z-index: 4;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: clamp(14px, 1.2vw, 20px);
            min-inline-size: 0;
            padding:
              clamp(18px, 1.35vw, 24px)
              clamp(20px, 1.8vw, 30px);
            border-bottom: 1px solid var(--fc-border-soft);
            background:
              radial-gradient(circle at 0% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 38%),
              linear-gradient(
                180deg,
                color-mix(in srgb, var(--panel-bg) 96%, #fff 4%),
                color-mix(in srgb, var(--panel-bg) 90%, transparent)
              );
            box-shadow:
              0 12px 30px color-mix(in srgb, #000 16%, transparent),
              inset 0 1px 0 color-mix(in srgb, #fff 7%, transparent);
            backdrop-filter: blur(16px) saturate(1.10);
            -webkit-backdrop-filter: blur(16px) saturate(1.10);
          }

          .fac-create-header::after {
            content: "";
            position: absolute;
            inset-inline: 34% -10%;
            inset-block-end: -70px;
            z-index: -1;
            block-size: 132px;
            pointer-events: none;
            background:
              radial-gradient(circle, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%);
            filter: blur(18px);
            opacity: .7;
          }

          .fac-create-header-copy {
            display: grid;
            gap: 5px;
            min-inline-size: 0;
          }

          .fac-create-header h2 {
            margin: 0;
            max-inline-size: 100%;
            color: var(--text-strong);
            font-size: clamp(28px, 2.15vw, 38px);
            line-height: .98;
            font-weight: var(--weight-black);
            letter-spacing: -.058em;
            text-wrap: balance;
          }

          .fac-create-header p {
            margin: 0;
            max-inline-size: 72ch;
            color: var(--text-muted);
            font-size: 11.5px;
            line-height: 1.35;
            font-weight: var(--weight-semibold);
            text-wrap: pretty;
          }

          .fac-create-close {
            appearance: none;
            inline-size: 44px;
            block-size: 44px;
            padding: 0;
            border: 1px solid var(--btn-secondary-border);
            border-radius: 15px;
            background: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            box-shadow: var(--fc-control-shadow);
            cursor: pointer;
            display: inline-grid;
            place-items: center;
            font-family: var(--font-family);
            line-height: 1;
            transition:
              transform var(--duration-fast) var(--ease-standard),
              border-color var(--duration-fast) var(--ease-standard),
              background var(--duration-fast) var(--ease-standard),
              color var(--duration-fast) var(--ease-standard),
              box-shadow var(--duration-fast) var(--ease-standard),
              opacity var(--duration-fast) var(--ease-standard);
          }

          .fac-create-close svg {
            inline-size: 18px;
            block-size: 18px;
          }

          .fac-create-close:hover:not(:disabled) {
            transform: translateY(-1px);
            border-color:
              color-mix(in srgb, var(--btn-secondary-border) 66%, var(--accent-border));
            background:
              color-mix(in srgb, var(--btn-secondary-bg) 92%, var(--accent) 5%);
            color: var(--text-strong);
            box-shadow: var(--fc-control-shadow-hover);
          }

          .fac-create-close:active:not(:disabled) {
            transform: translateY(0) scale(.985);
          }

          .fac-create-close:disabled {
            cursor: not-allowed;
            opacity: .48;
          }
'''
          css = replace_between(css, header_start, header_end, new_header, "css header section")

          body_end = '/* =========================================================\n   FIELDS / INPUTS / SELECTS\n========================================================= */'
          new_body = '''/* =========================================================
             BODY / FORM / VISUAL ORDER
          ========================================================= */

          .fac-create-body {
            min-inline-size: 0;
            min-block-size: 0;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            padding:
              clamp(18px, 1.45vw, 24px)
              clamp(20px, 1.8vw, 30px)
              clamp(24px, 2vw, 34px);
          }

          .fac-create-form {
            display: grid;
            gap: clamp(14px, 1vw, 18px);
            min-inline-size: 0;
          }

          .fac-create-form > * {
            order: 20;
          }

          .fac-create-form > .fac-create-target,
          .fac-create-form > .fac-create-target--pro {
            order: 1;
          }

          .fac-create-form > .fac-create-total-strip {
            order: 50;
          }

          .fac-create-form > .fac-create-actions,
          .fac-create-form > .fac-create-actions--compact {
            order: 90;
          }

          .fac-create-grid {
            display: grid;
            gap: 12px;
            min-inline-size: 0;
          }

          .fac-create-grid--2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
          }
'''
          css = replace_between(css, header_end, body_end, new_body, "css body section")

          css = replace_once(
              css,
              '  font-size: 11px;\n  font-weight: var(--weight-semibold);\n  line-height: var(--line-normal);\n  outline: none;',
              '  font-size: 12.5px;\n  font-weight: var(--weight-semibold);\n  line-height: var(--line-normal);\n  outline: none;\n  caret-color: var(--text-strong);',
              "control typography/caret",
          )

          css = replace_once(
              css,
              '  min-block-size: 35px;\n  padding-inline: 11px;',
              '  min-block-size: 44px;\n  padding-inline: 13px;',
              "control height",
          )

          css = replace_once(
              css,
              '  min-block-size: 78px;\n  padding: 10px 11px;',
              '  min-block-size: 112px;\n  padding: 13px 14px;',
              "textarea size",
          )

          placeholder = '''.fac-create-input::placeholder,
          .fac-create-textarea::placeholder {
            color: var(--input-placeholder);
          }
'''
          placeholder_new = '''.fac-create-input::placeholder,
          .fac-create-textarea::placeholder {
            color: var(--input-placeholder);
            opacity: 1;
            transition: opacity 90ms ease-out, color 90ms ease-out;
          }

          .fac-create-input:focus::placeholder,
          .fac-create-textarea:focus::placeholder {
            color: transparent;
            opacity: 0;
          }
'''
          css = replace_once(css, placeholder, placeholder_new, "placeholder focus behavior")

          css = replace_once(
              css,
              '.fac-create-input:hover,\n.fac-create-select:hover,\n.fac-create-textarea:hover {',
              '.fac-create-input:hover:not(:disabled),\n.fac-create-select:hover:not(:disabled),\n.fac-create-textarea:hover:not(:disabled) {',
              "control hover",
          )

          css = replace_once(
              css,
              '  min-block-size: 36px;\n  padding-inline: 17px;',
              '  min-block-size: 44px;\n  padding-inline: 20px;',
              "submit size",
          )

          css = replace_once(
              css,
              '  min-block-size: 26px;\n  padding-inline: 8px;',
              '  min-block-size: 32px;\n  padding-inline: 10px;',
              "mini button size",
          )

          css = css.replace(
              '--fc-width: clamp(980px, 66vw, 1280px);',
              '--fc-width: min(1180px, calc(100vw - 48px));'
          )
          css = css.replace(
              '--fc-height: min(92dvh, 990px);',
              '--fc-height: min(92dvh, 940px);'
          )

          css_path.write_text(css, encoding="utf-8")

          # --------------------------------------------------
          # Static checks
          # --------------------------------------------------
          if "!important" in css:
