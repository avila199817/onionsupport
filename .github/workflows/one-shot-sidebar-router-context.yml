name: One-shot Sidebar Router-context reuse patch

on:
  push:
    branches:
      - perf/sidebar-router-context

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply deterministic Sidebar patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/ui/sidebar/index.js")
          source = path.read_text(encoding="utf-8")

          old_version = 'export const SIDEBAR_VERSION =\n  "sidebar.controller.v5-native-runtime-state";'
          new_version = 'export const SIDEBAR_VERSION =\n  "sidebar.controller.v6-router-context-reuse";'
          if source.count(old_version) != 1:
              raise SystemExit("Sidebar version anchor is not unique")
          source = source.replace(old_version, new_version, 1)

          start = source.find("function getContext() {\n")
          end = source.find("\nfunction shouldRenderSidebar(\n", start)
          if start < 0 or end <= start:
              raise SystemExit("Could not isolate Sidebar getContext()")
          replacement = '''function getContext(
            overrides = {}
          ) {
            const supplied =
              isObject(overrides)
                ? overrides
                : {};
          
            const state =
              readCoreState();
          
            const auth =
              supplied.Auth ||
              getAuth();
          
            const router =
              supplied.Router ||
              getRouter();
          
            const authenticated =
              typeof state.authenticated ===
                "boolean"
                ? state.authenticated ===
                  true
                : isAuthenticated();
          
            const rawUser =
              state.user ||
              state.currentUser ||
              authUserFallback();
          
            const role =
              supplied.role ||
              state.role ||
              state.rol ||
              authRoleFallback();
          
            const user =
              getUserViewModel(
                rawUser,
                {
                  authenticated,
                  role,
                }
              );
          
            const suppliedPublicPath =
              cleanText(
                supplied.publicPath,
                ""
              );
          
            const publicPath =
              suppliedPublicPath ||
              currentPublicPath(
                state
              );
          
            const suppliedCanonicalPath =
              cleanText(
                supplied.canonicalPath ||
                supplied.route?.path,
                ""
              );
          
            const canonicalPath =
              suppliedCanonicalPath
                ? normalizePath(
                    suppliedCanonicalPath
                  )
                : currentCanonicalPath(
                    state
                  );
          
            const route =
              supplied.route !==
                undefined
                ? supplied.route
                : getCurrentRoute(
                    publicPath,
                    canonicalPath
                  );
          
            return {
              AppCore,
              Auth:
                auth,
              Router:
                router,
          
              user,
          
              role:
                user.role ||
                "",
          
              authenticated,
          
              hasUser:
                user.hasUser ===
                true,
          
              hasSession:
                authenticated &&
                user.hasUser ===
                  true,
          
              publicPath,
              canonicalPath,
              route,
            };
          }
          '''.replace("          ", "").rstrip()
          source = source[:start] + replacement + source[end:]

          start = source.find("function sync() {\n")
          end = source.find("\n/* =========================================================\n   ACTIONS", start)
          if start < 0 or end <= start:
              raise SystemExit("Could not isolate Sidebar sync()")
          replacement = '''function sync(
            context = {}
          ) {
            if (!isBrowser()) {
              return SidebarUI;
            }
          
            return renderSidebar(
              getContext(
                isObject(context)
                  ? context
                  : {}
              )
            );
          }
          '''.replace("          ", "").rstrip() + "\n"
          source = source[:start] + replacement + source[end:]

          anchor = "        routeChangeFastSync:\n          true,\n"
          if source.count(anchor) != 1:
              raise SystemExit("Sidebar policy anchor is not unique")
          source = source.replace(
              anchor,
              anchor + "\n        routerContextReuse:\n          true,\n",
              1,
          )

          path.write_text(source, encoding="utf-8")
          PY

          node --check src/ui/sidebar/index.js
          git diff --check

      - name: Commit patched Sidebar
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-sidebar-router-context.yml
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git diff --cached --check
          git commit -m "Perf: reuse Router context in Sidebar sync"
          git push origin HEAD:perf/sidebar-router-context
