name: Facturas Resend Polish Bootstrap

on:
  push:
    branches:
      - fix/facturas-mobile-resend-confirm

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused Facturas polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path("src/views/facturas/index.js")
          style_path = Path("src/css/views/facturas/index.css")
          contract_path = Path(".github/scripts/facturas_continuous_scroll_contract.py")

          index = index_path.read_text(encoding="utf-8")
          style = style_path.read_text(encoding="utf-8")
          contract = contract_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  print(f"already patched: {label}")
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          index = replace_once(
              index,
              '"facturas.index.productivo.v17.page-safe-continuous-scroll";',
              '"facturas.index.productivo.v18.mobile-resend-polish";',
              "facturas version",
          )

          helper_anchor = '''/* =========================================================
             CORE / ROLE / ROUTER
          ========================================================= */'''.replace("          ", "")

          helper_block = r'''const FACTURAS_RESEND_CONFIRM_ROOT_ID = "facturas-resend-confirm-root";
          let activeResendConfirm = null;

          function ensureFacturaResendConfirmRoot() {
            if (!isBrowser()) return null;

            let root = document.getElementById(FACTURAS_RESEND_CONFIRM_ROOT_ID);
            if (!root) {
              root = document.createElement("div");
              root.id = FACTURAS_RESEND_CONFIRM_ROOT_ID;
              root.dataset.facturasResendConfirmRoot = "true";
              document.body.appendChild(root);
            }
            return root;
          }

          function confirmFacturaResend({ factura = {}, recipient = "" } = {}) {
            if (!isBrowser()) return Promise.resolve(true);

            const facturaId = getFacturaId(factura);
            if (activeResendConfirm) {
              return activeResendConfirm.facturaId === facturaId
                ? activeResendConfirm.promise
                : Promise.resolve(false);
            }

            const root = ensureFacturaResendConfirmRoot();
            if (!root) return Promise.resolve(false);

            const opener = document.activeElement instanceof HTMLElement
              ? document.activeElement
              : null;

            const promise = new Promise((resolve) => {
              root.replaceChildren();

              const overlay = document.createElement("div");
              overlay.className = "facturas-resend-confirm-overlay";
              overlay.dataset.facturasResendConfirmOverlay = "true";

              const dialog = document.createElement("section");
              dialog.className = "facturas-resend-confirm-dialog";
              dialog.dataset.facturasResendConfirmDialog = "true";
              dialog.setAttribute("role", "alertdialog");
              dialog.setAttribute("aria-modal", "true");
              dialog.setAttribute("aria-labelledby", "facturas-resend-confirm-title");
              dialog.setAttribute("aria-describedby", "facturas-resend-confirm-description");
              dialog.tabIndex = -1;

              const iconBox = document.createElement("div");
              iconBox.className = "facturas-resend-confirm-icon";
              iconBox.setAttribute("aria-hidden", "true");
              const iconMark = document.createElement("span");
              iconMark.textContent = "↻";
              iconBox.appendChild(iconMark);

              const copy = document.createElement("div");
              copy.className = "facturas-resend-confirm-copy";

              const eyebrow = document.createElement("span");
              eyebrow.className = "facturas-resend-confirm-eyebrow";
              eyebrow.textContent = "Reenvío de factura";

              const title = document.createElement("h3");
              title.id = "facturas-resend-confirm-title";
              title.textContent = "Esta factura ya fue enviada";

              const description = document.createElement("p");
              description.id = "facturas-resend-confirm-description";
              description.textContent = recipient
                ? `Ya existe un envío a ${recipient}. Confirma solo si quieres volver a enviar la misma factura.`
                : "Ya existe un envío registrado. Confirma solo si quieres volver a enviar la misma factura.";

              const meta = document.createElement("div");
              meta.className = "facturas-resend-confirm-meta";

              const invoiceChip = document.createElement("span");
              invoiceChip.textContent = getFacturaLabel(factura);
              meta.appendChild(invoiceChip);

              if (recipient) {
                const recipientChip = document.createElement("span");
                recipientChip.textContent = recipient;
                meta.appendChild(recipientChip);
              }

              copy.append(eyebrow, title, description, meta);

              const actions = document.createElement("div");
              actions.className = "facturas-resend-confirm-actions";

              const cancelButton = document.createElement("button");
              cancelButton.type = "button";
              cancelButton.className = "facturas-resend-confirm-btn facturas-resend-confirm-btn--cancel";
              cancelButton.dataset.facturasResendConfirmAction = "cancel";
              cancelButton.textContent = "Cancelar";

              const confirmButton = document.createElement("button");
              confirmButton.type = "button";
              confirmButton.className = "facturas-resend-confirm-btn facturas-resend-confirm-btn--confirm";
              confirmButton.dataset.facturasResendConfirmAction = "confirm";
              confirmButton.textContent = "Reenviar factura";

              actions.append(cancelButton, confirmButton);
              dialog.append(iconBox, copy, actions);
              overlay.appendChild(dialog);
              root.appendChild(overlay);
              document.body.classList.add("facturas-resend-confirm-open");

              let settled = false;

              const cleanup = () => {
                dialog.removeEventListener("keydown", onKeydown);
                overlay.removeEventListener("click", onOverlayClick);
                cancelButton.removeEventListener("click", onCancel);
                confirmButton.removeEventListener("click", onConfirm);
                window.removeEventListener("popstate", onRouteChange);
                window.removeEventListener("hashchange", onRouteChange);
                window.removeEventListener("pagehide", onRouteChange);
                root.replaceChildren();
                document.body.classList.remove("facturas-resend-confirm-open");
              };

              const settle = (value) => {
                if (settled) return;
                settled = true;
                cleanup();
                activeResendConfirm = null;
                try { opener?.focus?.({ preventScroll: true }); } catch { /* noop */ }
                resolve(Boolean(value));
              };

              const onCancel = () => settle(false);
              const onConfirm = () => settle(true);
              const onRouteChange = () => settle(false);

              const onOverlayClick = (event) => {
                if (event.target === overlay) settle(false);
              };

              const onKeydown = (event) => {
                if (event.key === "Escape") {
                  event.preventDefault();
                  settle(false);
                  return;
                }

                if (event.key !== "Tab") return;
                const focusables = focusableElements(dialog);
                if (!focusables.length) {
                  event.preventDefault();
                  dialog.focus({ preventScroll: true });
                  return;
                }

                const firstNode = focusables[0];
                const lastNode = focusables[focusables.length - 1];
                if (event.shiftKey && document.activeElement === firstNode) {
                  event.preventDefault();
                  lastNode.focus({ preventScroll: true });
                } else if (!event.shiftKey && document.activeElement === lastNode) {
                  event.preventDefault();
                  firstNode.focus({ preventScroll: true });
                }
              };

              dialog.addEventListener("keydown", onKeydown);
              overlay.addEventListener("click", onOverlayClick);
              cancelButton.addEventListener("click", onCancel);
              confirmButton.addEventListener("click", onConfirm);
              window.addEventListener("popstate", onRouteChange, { once: true });
              window.addEventListener("hashchange", onRouteChange, { once: true });
              window.addEventListener("pagehide", onRouteChange, { once: true });

              nextFrame(() => {
                try { cancelButton.focus({ preventScroll: true }); } catch { /* noop */ }
              });
            });

            activeResendConfirm = { facturaId, promise };
            return promise;
          }

          '''.replace("          ", "")

          if "function confirmFacturaResend" not in index:
              if index.count(helper_anchor) != 1:
                  raise SystemExit("facturas resend helper anchor missing or duplicated")
              index = index.replace(helper_anchor, helper_block + helper_anchor, 1)

          old_confirm = '''    if (alreadySent && confirmResend && isBrowser()) {
              const recipient = getFacturaEmail(before || {});

              const question = recipient
                ? `Esta factura ya fue enviada a ${recipient}. ¿Quieres volver a enviarla?`
                : "Esta factura ya fue enviada. ¿Quieres volver a enviarla?";

              if (!window.confirm(question)) {
                return false;
              }
            }'''.replace("              ", "    ")

          new_confirm = '''    if (alreadySent && confirmResend && isBrowser()) {
              const recipient = getFacturaEmail(before || {});
              const confirmed = await confirmFacturaResend({
                factura: before || {},
                recipient,
              });
              if (!confirmed) return false;
            }'''.replace("              ", "    ")

          index = replace_once(index, old_confirm, new_confirm, "native resend confirm")

          css_marker = "/* FACTURAS_RESEND_CONFIRM_10_10 */"
          css_block = r'''

          /* FACTURAS_RESEND_CONFIRM_10_10 */
          @layer views {
            body.facturas-resend-confirm-open {
              overflow: hidden;
              overscroll-behavior: none;
            }

            #facturas-resend-confirm-root,
            #facturas-resend-confirm-root *,
            #facturas-resend-confirm-root *::before,
            #facturas-resend-confirm-root *::after {
              box-sizing: border-box;
            }

            #facturas-resend-confirm-root:empty {
              display: none;
            }

            .facturas-resend-confirm-overlay {
              position: fixed;
              inset: 0;
              z-index: calc(var(--z-modal, 1000) + 90);
              display: grid;
              place-items: center;
              padding: clamp(14px, 3vw, 32px);
              overflow: auto;
              background: color-mix(in srgb, var(--ui-detail-modal-overlay-bg, #05070a) 82%, transparent);
              backdrop-filter: blur(9px);
              -webkit-backdrop-filter: blur(9px);
            }

            .facturas-resend-confirm-dialog {
              inline-size: min(520px, 100%);
              min-inline-size: 0;
              display: grid;
              grid-template-columns: 44px minmax(0, 1fr);
              gap: var(--space-md);
              padding: var(--space-lg);
              border: 1px solid var(--border-warning);
              border-radius: var(--card-radius);
              background: var(--card-bg);
              color: var(--text);
              box-shadow: var(--shadow-xl);
              outline: none;
            }

            .facturas-resend-confirm-dialog:focus-visible {
              box-shadow: var(--shadow-xl), var(--focus-ring);
            }

            .facturas-resend-confirm-icon {
              inline-size: 44px;
              block-size: 44px;
              display: grid;
              place-items: center;
              border: 1px solid var(--border-warning);
              border-radius: var(--radius-sm);
              background: var(--warning-bg);
              color: var(--warning-strong, var(--warning));
              font-size: 24px;
              font-weight: var(--weight-black);
              line-height: 1;
            }

            .facturas-resend-confirm-copy {
              min-inline-size: 0;
              display: grid;
              gap: 7px;
            }

            .facturas-resend-confirm-eyebrow {
              color: var(--warning-strong, var(--warning));
              font-size: var(--font-xs);
              font-weight: var(--weight-bold);
              letter-spacing: .055em;
              text-transform: uppercase;
            }

            .facturas-resend-confirm-copy h3 {
              margin: 0;
              color: var(--text-strong);
              font-size: var(--font-xl);
              font-weight: var(--weight-black);
              line-height: 1.15;
              text-wrap: balance;
            }

            .facturas-resend-confirm-copy p {
              margin: 0;
              color: var(--text-muted);
              font-size: var(--font-sm);
              line-height: 1.5;
              overflow-wrap: anywhere;
            }

            .facturas-resend-confirm-meta {
              min-inline-size: 0;
              display: flex;
              flex-wrap: wrap;
              gap: 6px;
              padding-block-start: 2px;
            }

            .facturas-resend-confirm-meta > span {
              min-inline-size: 0;
              max-inline-size: 100%;
              padding: 6px 8px;
              border: 1px solid var(--badge-border);
              border-radius: var(--radius-pill);
              background: var(--badge-bg);
              color: var(--badge-text);
              font-size: var(--font-xs);
              font-weight: var(--weight-semibold);
              line-height: 1.25;
              overflow-wrap: anywhere;
            }

            .facturas-resend-confirm-actions {
              grid-column: 1 / -1;
              display: flex;
              justify-content: flex-end;
              gap: 8px;
            }

            .facturas-resend-confirm-btn {
              appearance: none;
              min-block-size: var(--btn-height-sm);
              display: inline-flex;
              align-items: center;
              justify-content: center;
              gap: 7px;
              margin: 0;
              padding-inline: 13px;
              border: 1px solid var(--btn-secondary-border);
              border-radius: var(--btn-radius);
              background: var(--btn-secondary-bg);
              color: var(--btn-secondary-text);
              cursor: pointer;
              font: inherit;
              font-size: var(--font-xs);
              font-weight: var(--weight-bold);
              line-height: 1;
              white-space: nowrap;
              transition:
                background var(--duration-fast) var(--ease-standard),
                border-color var(--duration-fast) var(--ease-standard),
                color var(--duration-fast) var(--ease-standard),
                transform var(--duration-fast) var(--ease-standard);
            }

            .facturas-resend-confirm-btn--cancel:hover {
              background: var(--btn-secondary-bg-hover);
              border-color: var(--border-strong);
              color: var(--text-strong);
            }

            .facturas-resend-confirm-btn--confirm {
              border-color: var(--border-warning);
              background: var(--warning-bg);
              color: var(--warning-strong, var(--warning));
            }

            .facturas-resend-confirm-btn--confirm:hover {
              background: var(--warning-soft, var(--warning-bg));
              color: var(--text-strong);
              transform: translateY(-1px);
            }

            .facturas-resend-confirm-btn:focus-visible {
              outline: none;
              box-shadow: var(--focus-ring);
            }

            @media (max-width: 680px) {
              .ui-datalist[data-mobile-datalist-layout="facturas"] .facturas-main {
                align-items: start;
              }

              .ui-datalist[data-mobile-datalist-layout="facturas"] .facturas-main-copy,
              .ui-datalist[data-mobile-datalist-layout="facturas"] .facturas-factura-line {
                inline-size: 100%;
                min-inline-size: 0;
                max-inline-size: 100%;
              }

              .ui-datalist[data-mobile-datalist-layout="facturas"] :is(
                .facturas-factura-id,
                .facturas-system-id,
                .facturas-factura-client,
                .facturas-factura-contact,
                .facturas-factura-email
              ) {
                min-inline-size: 0;
                max-inline-size: 100%;
                overflow: visible;
                text-overflow: clip;
                white-space: normal;
                overflow-wrap: anywhere;
                word-break: normal;
              }

              .ui-datalist[data-mobile-datalist-layout="facturas"] .facturas-factura-client {
                line-height: 1.3;
              }
            }

            @media (max-width: 560px) {
              .facturas-resend-confirm-dialog {
                grid-template-columns: 40px minmax(0, 1fr);
                gap: var(--space-sm);
                padding: var(--space-md);
              }

              .facturas-resend-confirm-icon {
                inline-size: 40px;
                block-size: 40px;
                font-size: 21px;
              }

              .facturas-resend-confirm-actions {
                display: grid;
                grid-template-columns: 1fr;
              }

              .facturas-resend-confirm-btn {
                inline-size: 100%;
              }
            }

            @media (prefers-reduced-motion: reduce) {
              .facturas-resend-confirm-btn {
                transition: none;
              }
            }

            @media (forced-colors: active) {
              .facturas-resend-confirm-dialog,
              .facturas-resend-confirm-icon,
              .facturas-resend-confirm-btn,
              .facturas-resend-confirm-meta > span {
                border-color: CanvasText;
                forced-color-adjust: auto;
              }
            }
          }
          '''.replace("          ", "")

          if css_marker not in style:
              style = style.rstrip() + css_block + "\n"

          contract_anchor = "if errors:\n"
          contract_block = '''# Facturas resend UX must stay inside the product visual system, never browser chrome.
          reject(INDEX, "window.confirm(", "Resend confirmation must not use the browser-native confirm dialog")
          require(INDEX, "function confirmFacturaResend", "Resend must expose an accessible custom confirmation flow")
          require(INDEX, 'dialog.setAttribute("role", "alertdialog")', "Resend confirmation must be an alertdialog")
          require(INDEX, 'event.key === "Escape"', "Resend confirmation must support Escape cancellation")
          require(INDEX, "focusableElements(dialog)", "Resend confirmation must trap keyboard focus")
          require(STYLE, ".facturas-resend-confirm-overlay", "Resend confirmation must use the Facturas themed overlay")
          require(STYLE, ".facturas-resend-confirm-dialog", "Resend confirmation must use the Facturas themed dialog")
          require(STYLE, '.ui-datalist[data-mobile-datalist-layout="facturas"]', "Mobile Facturas identity must have a dedicated no-clipping contract")
          require(STYLE, "overflow-wrap: anywhere", "Mobile Facturas identity must wrap long values instead of clipping them")

          '''.replace("          ", "")

          if "Resend confirmation must not use the browser-native confirm dialog" not in contract:
              if contract.count(contract_anchor) != 1:
                  raise SystemExit("facturas contract insertion anchor missing or duplicated")
              contract = contract.replace(contract_anchor, contract_block + contract_anchor, 1)

          index_path.write_text(index, encoding="utf-8")
          style_path.write_text(style, encoding="utf-8")
          contract_path.write_text(contract, encoding="utf-8")
          PY

      - name: Validate focused Facturas change
        shell: bash
        run: |
          node --check src/views/facturas/index.js
          python .github/scripts/facturas_continuous_scroll_contract.py
          python .github/scripts/private_admin_alignment_contract.py
          python .github/scripts/repo_integrity.py
          node .github/scripts/continuous_scroll_smoke.mjs
          git diff --check

      - name: Commit focused Facturas change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "Onion Support Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/facturas/index.js src/css/views/facturas/index.css .github/scripts/facturas_continuous_scroll_contract.py
          git commit -m "fix: polish facturas mobile and resend confirm"
          git push origin HEAD:fix/facturas-mobile-resend-confirm
