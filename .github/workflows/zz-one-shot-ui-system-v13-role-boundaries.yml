name: One-shot UI System V13 Role Boundaries

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

env:
  TARGET_BRANCH: refactor/ui-system-v13-role-boundaries

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/ui-system-v13-role-boundaries'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Guard trigger
        run: |
          set -euo pipefail
          test -f .github/.ui-system-v13-role-boundaries-trigger

      - name: Apply role boundaries V13
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_system_v13_role_boundaries.py

      - name: Validate repository
        run: |
          set -euo pipefail
          python3 .github/scripts/repo_integrity.py
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Validate role boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = (
              'src/features/auth/index.js',
              'src/views/home/home.api.js',
              'src/views/cuenta/cuenta.api.js',
          )
          for raw in targets:
              text = Path(raw).read_text(encoding='utf-8')
              assert not re.search(r'\bfunction\s+normalizeRole\s*\(', text), raw
              assert 'AppCore.normalizeRole(' in text, raw
          auth = Path('src/features/auth/index.js').read_text(encoding='utf-8')
          assert 'VALID_ROLES' not in auth
          assert 'ALLOWED_ROLES' not in auth
          print('Role boundaries V13 OK')
          PY

      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add \
            src/features/auth/index.js \
            src/views/home/home.api.js \
            src/views/cuenta/cuenta.api.js \
            .github/scripts/repo_integrity.py \
            docs/UI_SYSTEM_V13_AUDIT.md
          if git diff --cached --quiet; then
            echo "Sin cambios de migración."
            exit 0
          fi
          git commit -m "refactor(auth): centralizar roles de boundaries en Core"
          git push origin HEAD:${TARGET_BRANCH}
