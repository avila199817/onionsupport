name: One-shot incidencias card labels

on:
  push:
    branches:
      - chore/incidencias-card-labels

permissions:
  contents: write

concurrency:
  group: one-shot-incidencias-card-labels
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/incidencias-card-labels
          fetch-depth: 1
          persist-credentials: true

      - name: Use exact Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Apply exact copy changes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const replaceOnce = (source, before, after, label) => {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`Missing expected text: ${label}`);
            if (source.indexOf(before, first + before.length) >= 0) throw new Error(`Expected unique text: ${label}`);
            return source.slice(0, first) + after + source.slice(first + before.length);
          };

          const update = (path, edits) => {
            let source = readFileSync(path, "utf8");
            for (const [before, after, label] of edits) source = replaceOnce(source, before, after, label);
            writeFileSync(path, source);
          };

          update("src/views/incidencias/incidencias.template.js", [
            ['${facetsLoaded ? "Abiertas cargadas" : "Abiertas"}', 'Abiertas', "open label"],
            ['${facetsLoaded ? "Cerradas cargadas" : "Cerradas"}', 'Cerradas', "closed label"],
            ['${facetsLoaded ? "Urgentes cargadas" : "Urgentes"}', 'Urgentes', "urgent label"],
            ['${vm.statsPartial ? "Importe cargado" : "Importe asociado"}', 'Importe', "amount label"],
          ]);

          update(".github/scripts/incidencias_stats_scope_contract.mjs", [
            ['const loadedLabels = ["Abiertas cargadas", "Cerradas cargadas", "Urgentes cargadas", "Importe cargado"];\nconst completeLabels = ["Abiertas", "Cerradas", "Urgentes", "Importe asociado"];', 'const cardLabels = ["Abiertas", "Cerradas", "Urgentes", "Importe"];', "source contract label fixture"],
            ['assert.deepEqual(cards.map(({ label }, index) => label), scopes.map((scope, index) => (scope === "loaded" ? loadedLabels : completeLabels)[index]));', 'assert.deepEqual(cards.map(({ label }) => label), cardLabels);', "source contract label assertion"],
            ['assert.equal(card(exactHtml, "amount").label, "Importe cargado");', 'assert.equal(card(exactHtml, "amount").label, "Importe");', "exact amount label"],
            ['assert.equal(card(html, "open").label, "Abiertas cargadas", "Unknown/lower-bound remote facets remain loaded");', 'assert.equal(card(html, "open").label, "Abiertas", "Unknown/lower-bound remote facets keep the plain card label");', "uncertain open label"],
            ['assert.equal(card(zeroHtml, "amount").label, "Importe asociado");', 'assert.equal(card(zeroHtml, "amount").label, "Importe");', "zero amount label"],
          ]);

          update("tools/private-kpi-render-browser-contract.mjs", [
            ['const loadedLabels = ["Abiertas cargadas", "Cerradas cargadas", "Urgentes cargadas", "Importe cargado"];\n    const completeLabels = ["Abiertas", "Cerradas", "Urgentes", "Importe asociado"];', 'const cardLabels = ["Abiertas", "Cerradas", "Urgentes", "Importe"];', "browser contract label fixture"],
            ['assert.deepEqual(incidents.map(({ cards }) => cards.map(({ label }) => label)), [loadedLabels, [...completeLabels.slice(0, 3), "Importe cargado"], completeLabels, loadedLabels]);', 'assert.deepEqual(incidents.map(({ cards }) => cards.map(({ label }) => label)), [cardLabels, cardLabels, cardLabels, cardLabels]);', "browser contract label assertion"],
          ]);
          NODE

          git diff --check
          ! grep -Eq 'Abiertas cargadas|Cerradas cargadas|Urgentes cargadas|Importe cargado' src/views/incidencias/incidencias.template.js

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Verify incidence KPI source contract
        run: node .github/scripts/incidencias_stats_scope_contract.mjs

      - name: Verify incidence KPI browser contract
        run: node tools/private-kpi-render-browser-contract.mjs

      - name: Verify production build envelope
        run: npm run build && npm run check:dist

      - name: Commit verified change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/incidencias/incidencias.template.js .github/scripts/incidencias_stats_scope_contract.mjs tools/private-kpi-render-browser-contract.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes produced" >&2; exit 1; }
          git commit -m "fix(incidencias): simplify KPI card labels"
          git push origin HEAD:chore/incidencias-card-labels
