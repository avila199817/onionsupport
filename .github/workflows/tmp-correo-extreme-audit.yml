name: TEMP Correo extreme patch

on:
  push:
    branches:
      - polish/correo-extreme-v7

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, 'run Correo extreme patch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: polish/correo-extreme-v7
          fetch-depth: 0

      - name: Apply fail-closed Correo patch
        run: python3 .github/scripts/tmp_correo_extreme_patch.py

      - name: Validate product patch
        shell: bash
        run: |
          set -euo pipefail
          node --check src/views/correo/index.js
          node --check src/views/correo/correo.template.js
          node --check src/views/correo/correo.api.js
          python3 .github/scripts/correo_integrity.py
          python3 .github/scripts/repo_integrity.py
          bash .github/ci/validate_spa_contracts.sh
          node .github/scripts/continuous_scroll_smoke.mjs
          git diff --check

      - name: Remove temporary bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/tmp_correo_extreme_patch.py
          rm -f .github/workflows/tmp-correo-extreme-audit.yml

      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Onion Support'
          git config user.email 'cristian@onionsupport.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
            exit 1
          fi
          git commit -m 'feat: rematar vista Correo 10/10'
          git push origin HEAD:polish/correo-extreme-v7
