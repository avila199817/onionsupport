name: Facturas Create Polish Bootstrap

on:
  push:
    branches:
      - feat/facturas-create-line-items-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/facturas-create-line-items-polish
          fetch-depth: 0

      - name: Apply focused Facturas create polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          TEMPLATE = Path('src/views/facturas/facturas.template.create.js')
          INDEX = Path('src/views/facturas/index.js')
          STYLE = Path('src/css/views/facturas/create.css')
          CONTRACT = Path('.github/scripts/facturas_continuous_scroll_contract.py')

          def sub_once(text, pattern, repl, label, flags=0):
              out, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return out

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {count}')
              return text.replace(old, new, 1)

          # --------------------------------------------------
          # Template: multi-line editor + no duplicate clears + no redundant footer/policy.
          # --------------------------------------------------
          t = TEMPLATE.read_text(encoding='utf-8')
          t = replace_once(t, 'PRODUCTIVO · TAX PROFILE AWARE · V6', 'PRODUCTIVO · MULTI-LINE BILLING · V7', 'template header version')
          t = replace_once(t, '"facturas.template.create.v6.tax-profile-aware"', '"facturas.template.create.v7.multi-line-billing"', 'template version constant')
          t = replace_once(t, '  SUBMIT: "create-submit",\n', '  SUBMIT: "create-submit",\n  LINE_ADD: "create-line-add",\n  LINE_REMOVE: "create-line-remove",\n', 'line actions')
          t = t.replace('  CLIENT_CLEAR: "create-client-clear",\n', '')
          t = t.replace('  TICKET_CLEAR: "create-ticket-clear",\n', '')

          t = replace_once(
              t,
              'const PAYMENT_STATUS_OPTIONS = Object.freeze([\n  { value: "pendiente", label: "Pendiente" },\n  { value: "pagada", label: "Pagada" },\n]);\n',
              'const PAYMENT_STATUS_OPTIONS = Object.freeze([\n  { value: "pendiente", label: "Pendiente" },\n  { value: "pagada", label: "Pagada" },\n]);\n\nconst LINE_UNIT_OPTIONS = Object.freeze([\n  { value: "h", label: "Horas" },\n  { value: "ud", label: "Unidades" },\n  { value: "servicio", label: "Servicio" },\n  { value: "kit", label: "Kit" },\n]);\n',
              'unit options'
          )

          t = replace_once(
              t,
              '  precioUnitario: 20,\n  fechaServicio: "",\n',
              '  precioUnitario: 20,\n  lineas: Object.freeze([\n    Object.freeze({\n      id: "linea-1",\n      concepto: "Servicios de soporte y asistencia técnica informática",\n      descripcion: "",\n      cantidad: 1,\n      unidad: "h",\n      precioUnitario: 20,\n    }),\n  ]),\n  fechaServicio: "",\n',
              'default lines'
          )

          normalize_block = r'''function normalizeForm\(form = \{\}\) \{.*?\n\}\n\nfunction getInvoiceBreakdown\(form = \{\}\) \{.*?\n\}\n\nfunction buildVm'''
          normalize_repl = r'''function normalizeLineItem(linea = {}, index = 0) {
  const raw = safeObject(linea);
  const defaultConcept = index === 0 ? DEFAULT_FORM.concepto : "";
  const cantidad = Math.max(0, number(first(raw.cantidad, raw.horas, raw.qty, raw.quantity), index === 0 ? DEFAULT_FORM.cantidad : 1));
  const precioUnitario = Math.max(0, number(first(raw.precioUnitario, raw.precio, raw.rate, raw.unitPrice), index === 0 ? DEFAULT_FORM.precioUnitario : 0));

  return {
    id: cleanText(first(raw.id, raw.lineaId), `linea-${index + 1}`),
    concepto: cleanText(first(raw.concepto, raw.title), defaultConcept),
    descripcion: String(first(raw.descripcion, raw.description, raw.detalle, "") ?? "")
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n")
      .trim(),
    cantidad,
    unidad: cleanText(first(raw.unidad, raw.unit), index === 0 ? "h" : "ud"),
    precioUnitario,
  };
}

function normalizeForm(form = {}) {
  const source = safeObject(form);
  const input = {
    ...DEFAULT_FORM,
    fechaServicio: todayInputValue(),
    ...source,
  };

  const rawLineas = safeArray(source.lineas);
  const fallbackLine = {
    id: "linea-1",
    concepto: input.concepto,
    descripcion: input.descripcion,
    cantidad: input.cantidad,
    unidad: first(input.unidad, "h"),
    precioUnitario: input.precioUnitario,
  };
  const lineas = (rawLineas.length ? rawLineas : [fallbackLine])
    .map((linea, index) => normalizeLineItem(linea, index));
  const firstLine = lineas[0] || normalizeLineItem(fallbackLine, 0);

  const clienteTipo = cleanText(
    first(input.clienteTipo, input.tipoCliente, input.tipo, input.type),
    ""
  );
  const clienteNif = cleanText(
    first(input.clienteNif, input.nif, input.cif, input.taxId),
    ""
  ).toUpperCase();

  const taxProfile = getFacturaCreateTaxProfile({
    ...input,
    clienteTipo,
    clienteNif,
  });

  return {
    concepto: firstLine.concepto,
    descripcion: firstLine.descripcion,
    cantidad: firstLine.cantidad,
    precioUnitario: firstLine.precioUnitario,
    lineas,
    fechaServicio: cleanText(input.fechaServicio, todayInputValue()),
    formaPago: cleanText(input.formaPago, DEFAULT_FORM.formaPago),
    estadoPago: cleanText(input.estadoPago, DEFAULT_FORM.estadoPago),
    sendEmail: parseBoolean(input.sendEmail, true),

    clienteId: cleanText(input.clienteId, ""),
    clienteUserId: cleanText(input.clienteUserId, ""),
    clienteNombre: cleanText(input.clienteNombre, ""),
    clienteEmail: cleanText(input.clienteEmail, "").toLowerCase(),
    clienteAvatar: safeImageSrc(input.clienteAvatar),
    clienteTipo,
    clienteNif,
    clienteEsEmpresa: taxProfile.isBusiness,
    aplicaIrpf: taxProfile.aplicaIrpf,

    ticketId: cleanText(input.ticketId, ""),
    incidenciaId: cleanText(input.incidenciaId, ""),
    incidenciaSubject: cleanText(input.incidenciaSubject, ""),
  };
}

function getInvoiceBreakdown(form = {}) {
  const current = normalizeForm(form);
  const taxProfile = getFacturaCreateTaxProfile(current);
  const lineas = current.lineas.map((linea) => ({
    ...linea,
    base: round2(Math.max(0, number(linea.cantidad, 0)) * Math.max(0, number(linea.precioUnitario, 0))),
  }));
  const base = round2(lineas.reduce((sum, linea) => sum + linea.base, 0));

  const ivaRate = DEFAULT_IVA_RATE;
  const irpfRate = taxProfile.aplicaIrpf ? DEFAULT_IRPF_RATE : 0;
  const ivaTotal = round2(base * (ivaRate / 100));
  const irpfTotal = taxProfile.aplicaIrpf
    ? round2(-(base * (irpfRate / 100)))
    : 0;
  const totalFactura = round2(base + ivaTotal + irpfTotal);

  return {
    lineas,
    cantidad: lineas[0]?.cantidad || 0,
    precioUnitario: lineas[0]?.precioUnitario || 0,
    base,
    ivaRate,
    irpfRate,
    ivaTotal,
    irpfTotal,
    totalFactura,
    aplicaIrpf: taxProfile.aplicaIrpf,
    clienteEsEmpresa: taxProfile.isBusiness,
    taxProfile,
  };
}

function buildVm'''
          t = sub_once(t, normalize_block, normalize_repl, 'normalize form/breakdown', flags=re.S)

          avatar_pattern = r'''function renderAvatar\(client = \{\}\) \{.*?\n\}\n\nfunction renderTaxBadge'''
          avatar_repl = r'''function getCreateAvatarTone(client = {}) {
  const current = normalizeClient(client);
  const identity = cleanText(first(current.email, current.name), "cliente");
  let hash = 0;
  for (let index = 0; index < identity.length; index += 1) {
    hash = ((hash << 5) - hash + identity.charCodeAt(index)) | 0;
  }
  return Math.abs(hash) % 10;
}

function renderAvatar(client = {}) {
  const current = normalizeClient(client);
  const src = safeImageSrc(current.avatarUrl);
  const tone = getCreateAvatarTone(current);

  return `
    <span class="fac-create-avatar fac-create-avatar--tone-${tone}${src ? " has-image" : ""}" aria-hidden="true">
      ${src ? `<img src="${attr(src)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : ""}
      <span>${escapeHtml(current.initials)}</span>
    </span>
  `;
}

function renderTaxBadge'''
          t = sub_once(t, avatar_pattern, avatar_repl, 'avatar renderer', flags=re.S)

          ticket_pattern = r'''function renderTicketSearchResults\(vm = \{\}\) \{.*?\n\}\n\nfunction renderSelectedClientes'''
          ticket_repl = r'''function renderTicketSearchResults(vm = {}) {
  const search = vm.ticketSearch;
  if (!vm.selectedClientes.length) {
    return `<div class="fac-create-search-state">Selecciona primero el cliente principal.</div>`;
  }
  if (search.loading) return `<div class="fac-create-search-state">${renderSpinner("Cargando incidencias...")}</div>`;
  if (search.error) return `<div class="fac-create-search-state is-error">${escapeHtml(search.error)}</div>`;
  if (search.empty) return `<div class="fac-create-search-state">No hay incidencias disponibles para este cliente.</div>`;
  if (!search.results.length) return `<div class="fac-create-search-state">No hay incidencias que mostrar para este cliente.</div>`;

  const selectedIds = new Set(vm.selectedTickets.map((item) => cleanText(first(item.ticketId, item.incidenciaId, item.id), "")));

  return `
    <div class="fac-create-search-results" role="listbox" aria-label="Incidencias del cliente">
      ${search.results.map((ticket, index) => {
        const id = cleanText(first(ticket.ticketId, ticket.incidenciaId, ticket.id), "");
        const selected = selectedIds.has(id);
        return `
          <button
            type="button"
            class="fac-create-search-result fac-create-search-result--ticket${selected ? " is-selected" : ""}"
            data-factura-create-action="${FACTURA_CREATE_ACTIONS.TICKET_SELECT}"
            data-ticket-index="${index}"
            role="option"
            aria-selected="${selected ? "true" : "false"}"
            ${selected ? "disabled" : ""}
          >
            <span class="fac-create-result-icon" aria-hidden="true">${icon("ticket")}</span>
            <span class="fac-create-result-copy">
              <strong>${escapeHtml(ticket.subject || ticket.id)}</strong>
              <span>${escapeHtml(ticket.subtitle || ticket.id)}</span>
            </span>
            <span class="fac-create-result-plus" aria-hidden="true">${icon(selected ? "check" : "plus")}</span>
          </button>
        `;
      }).join("")}
    </div>
  `;
}

function renderSelectedClientes'''
          t = sub_once(t, ticket_pattern, ticket_repl, 'ticket visible results', flags=re.S)

          line_helpers = r'''
function lineError(errors = {}, index = 0, field = "") {
  return cleanText(errors?.[`lineas.${index}.${field}`], "");
}

function renderLineItems(vm = {}, disabled = false) {
  const lines = safeArray(vm.form.lineas);
  return `
    <div class="fac-create-line-items" data-line-items="true">
      ${lines.map((linea, index) => {
        const base = round2(number(linea.cantidad, 0) * number(linea.precioUnitario, 0));
        return `
          <article class="fac-create-line-item" data-line-item="true" data-line-index="${index}">
            <header class="fac-create-line-head">
              <div>
                <span class="fac-create-line-kicker">Partida ${String(index + 1).padStart(2, "0")}</span>
                <strong>${escapeHtml(linea.concepto || "Nueva partida")}</strong>
              </div>
              <div class="fac-create-line-head-actions">
                <span class="fac-create-line-total" data-line-total="${index}">${escapeHtml(formatMoney(base))}</span>
                ${lines.length > 1 ? `
                  <button
                    type="button"
                    class="fac-create-icon-btn fac-create-line-remove"
                    data-factura-create-action="${FACTURA_CREATE_ACTIONS.LINE_REMOVE}"
                    data-line-index="${index}"
                    aria-label="Eliminar partida ${index + 1}"
                    ${disabled ? "disabled" : ""}
                  >${icon("close")}</button>
                ` : ""}
              </div>
            </header>

            <div class="fac-create-line-grid">
              <label class="fac-create-field fac-create-line-concept">
                <span class="fac-create-label">Concepto *</span>
                <input
                  class="fac-create-input${lineError(vm.errors, index, "concepto") ? " is-error" : ""}"
                  type="text"
                  value="${attr(linea.concepto)}"
                  data-line-index="${index}"
                  data-line-field="concepto"
                  autocomplete="off"
                  placeholder="Ej. Mano de obra, pasta térmica, desplazamiento..."
                  ${disabled ? "disabled" : ""}
                >
                ${renderFieldError(lineError(vm.errors, index, "concepto"))}
              </label>

              <label class="fac-create-field fac-create-line-description">
                <span class="fac-create-label">Descripción</span>
                <input
                  class="fac-create-input"
                  type="text"
                  value="${attr(linea.descripcion)}"
                  data-line-index="${index}"
                  data-line-field="descripcion"
                  autocomplete="off"
                  placeholder="Detalle opcional de la partida"
                  ${disabled ? "disabled" : ""}
                >
              </label>

              <label class="fac-create-field">
                <span class="fac-create-label">Cantidad *</span>
                <input
                  class="fac-create-input${lineError(vm.errors, index, "cantidad") ? " is-error" : ""}"
                  type="number"
                  min="0.01"
                  step="0.01"
                  value="${attr(linea.cantidad)}"
                  data-line-index="${index}"
                  data-line-field="cantidad"
                  ${disabled ? "disabled" : ""}
                >
                ${renderFieldError(lineError(vm.errors, index, "cantidad"))}
              </label>

              <label class="fac-create-field">
                <span class="fac-create-label">Unidad</span>
                <select class="fac-create-input fac-create-select" data-line-index="${index}" data-line-field="unidad" ${disabled ? "disabled" : ""}>
                  ${LINE_UNIT_OPTIONS.map((option) => `<option value="${attr(option.value)}"${option.value === linea.unidad ? " selected" : ""}>${escapeHtml(option.label)}</option>`).join("")}
                </select>
              </label>

              <label class="fac-create-field">
                <span class="fac-create-label">Precio unitario *</span>
                <input
                  class="fac-create-input${lineError(vm.errors, index, "precioUnitario") ? " is-error" : ""}"
                  type="number"
                  min="0.01"
                  step="0.01"
                  value="${attr(linea.precioUnitario)}"
                  data-line-index="${index}"
                  data-line-field="precioUnitario"
                  ${disabled ? "disabled" : ""}
                >
                ${renderFieldError(lineError(vm.errors, index, "precioUnitario"))}
              </label>
            </div>
          </article>
        `;
      }).join("")}
    </div>
  `;
}

'''
          t = replace_once(t, 'function renderTotalStrip(vm = {}) {', line_helpers + 'function renderTotalStrip(vm = {}) {', 'line item renderer')

          # Remove duplicate section-level clear buttons.
          t = sub_once(t, r'''\n                  \$\{clientCount \? `\n                    <button type="button" class="fac-create-link-btn" data-factura-create-action="\$\{FACTURA_CREATE_ACTIONS\.CLIENT_CLEAR\}">\n                      Limpiar\n                    </button>\n                  ` : ""\}''', '', 'client clear button')
          t = sub_once(t, r'''\n                    \$\{ticketCount \? `\n                      <button type="button" class="fac-create-link-btn" data-factura-create-action="\$\{FACTURA_CREATE_ACTIONS\.TICKET_CLEAR\}">\n                        Limpiar\n                      </button>\n                    ` : ""\}''', '', 'ticket clear button')
          t = t.replace('placeholder="Nombre, email, empresa o usuario..."', 'placeholder="Nombre, email, empresa o NIF..."')
          t = t.replace('<span class="fac-create-label">${ticketCount ? "Añadir otra incidencia" : "Buscar incidencia"}</span>', '<span class="fac-create-label">Filtrar incidencias del cliente</span>')

          section3_pattern = r'''\n              <section class="fac-create-section">\n                <div class="fac-create-section-head">\n                  <div>\n                    <span class="fac-create-step">03</span>.*?\n              </section>\n\n              \$\{renderTotalStrip\(vm\)\}'''
          section3_repl = r'''
              <section class="fac-create-section">
                <div class="fac-create-section-head">
                  <div>
                    <span class="fac-create-step">03</span>
                    <h3>Conceptos e importes</h3>
                    <p>Añade todas las partidas facturables: horas, servicios, materiales, repuestos o consumibles.</p>
                  </div>
                  <div class="fac-create-section-actions">
                    <button
                      type="button"
                      class="fac-create-link-btn fac-create-line-add"
                      data-factura-create-action="${FACTURA_CREATE_ACTIONS.LINE_ADD}"
                      ${disabled ? "disabled" : ""}
                    >${icon("plus")}<span>Añadir concepto</span></button>
                  </div>
                </div>

                ${renderLineItems(vm, disabled)}
                ${renderFieldError(errors.lineas)}

                <div class="fac-create-form-grid fac-create-form-grid--meta">
                  ${renderInput({
                    label: "Fecha de servicio",
                    name: "fechaServicio",
                    value: vm.form.fechaServicio,
                    type: "date",
                    required: true,
                    error: errors.fechaServicio,
                    disabled,
                  })}

                  ${renderSelect({
                    label: "Forma de pago",
                    name: "formaPago",
                    value: vm.form.formaPago,
                    options: PAYMENT_OPTIONS,
                    error: errors.formaPago,
                    disabled,
                  })}

                  ${renderSelect({
                    label: "Estado de pago",
                    name: "estadoPago",
                    value: vm.form.estadoPago,
                    options: PAYMENT_STATUS_OPTIONS,
                    error: errors.estadoPago,
                    disabled,
                  })}

                  <label class="fac-create-toggle">
                    <span>
                      <strong>Enviar por email</strong>
                      <small>Enviar la factura al cliente al finalizar.</small>
                    </span>
                    <span class="fac-create-toggle-control">
                      <input
                        data-field="sendEmail"
                        name="sendEmail"
                        type="checkbox"
                        ${vm.form.sendEmail ? "checked" : ""}
                        ${disabled ? "disabled" : ""}
                      >
                      <span aria-hidden="true"></span>
                    </span>
                  </label>
                </div>
              </section>

              ${renderTotalStrip(vm)}'''
          t = sub_once(t, section3_pattern, section3_repl, 'section 03 multi-line', flags=re.S)

          t = sub_once(t, r'''\n\n              <div class="fac-create-tax-footnote">.*?</div>\n            </div>''', '\n            </div>', 'tax footnote', flags=re.S)
          t = sub_once(t, r'''\n              <div class="fac-create-footer-summary">.*?</div>\n              <div class="fac-create-footer-actions">''', '\n              <div class="fac-create-footer-actions">', 'footer summary', flags=re.S)

          t = sub_once(
              t,
              r'''export function getFacturaCreateFormDefaults\(\) \{.*?\n\}\n\nexport function getFacturaCreateBreakdown''',
              r'''export function getFacturaCreateFormDefaults() {
  const form = normalizeForm({});
  return {
    ...form,
    lineas: form.lineas.map((linea) => ({ ...linea })),
  };
}

export function getFacturaCreateBreakdown''',
              'defaults clone',
              flags=re.S
          )

          validation_pattern = r'''export function validateFacturaCreateForm\(\{.*?\n\}\n\nexport function getFacturaCreateTemplateSnapshot'''
          validation_repl = r'''export function validateFacturaCreateForm({
  form = {},
  selectedClientes = [],
  selectedTickets = [],
} = {}) {
  const normalizedClients = safeArray(selectedClientes).map(normalizeClient);
  const normalizedTickets = safeArray(selectedTickets).map(normalizeTicket);

  const enriched = enrichFormWithPrimaryClient(form, normalizedClients);
  const current = normalizeForm(enriched);
  const errors = {};

  if (!normalizedClients.length) {
    errors.clienteId = "Selecciona al menos un cliente.";
  }

  if (!normalizedTickets.length) {
    errors.incidenciaId = "Selecciona al menos una incidencia vinculada.";
  }

  if (!current.lineas.length) {
    errors.lineas = "Añade al menos una partida a la factura.";
  }

  current.lineas.forEach((linea, index) => {
    if (!linea.concepto || linea.concepto.length < 2) {
      errors[`lineas.${index}.concepto`] = "Indica un concepto válido.";
    }
    if (!(number(linea.cantidad, 0) > 0)) {
      errors[`lineas.${index}.cantidad`] = "La cantidad debe ser mayor que cero.";
    }
    if (!(number(linea.precioUnitario, 0) > 0)) {
      errors[`lineas.${index}.precioUnitario`] = "El precio debe ser mayor que cero.";
    }
  });

  if (!current.fechaServicio) {
    errors.fechaServicio = "Indica la fecha de servicio.";
  }

  const breakdown = getInvoiceBreakdown(current);

  return {
    valid: Object.keys(errors).length === 0,
    errors,
    form: {
      ...current,
      aplicaIrpf: breakdown.aplicaIrpf,
      clienteEsEmpresa: breakdown.clienteEsEmpresa,
      ivaRate: breakdown.ivaRate,
      irpfRate: breakdown.irpfRate,
      regimenFiscal: breakdown.aplicaIrpf ? "iva_irpf" : "iva",
    },
    breakdown,
    taxProfile: breakdown.taxProfile,
  };
}

export function getFacturaCreateTemplateSnapshot'''
          t = sub_once(t, validation_pattern, validation_repl, 'multi-line validation', flags=re.S)
          TEMPLATE.write_text(t, encoding='utf-8')

          # --------------------------------------------------
          # Controller: canonical incidents, persistent visible list, line editing/payload.
          # --------------------------------------------------
          s = INDEX.read_text(encoding='utf-8')
          s = replace_once(s, '"facturas.index.productivo.v19.client-only-create-search"', '"facturas.index.productivo.v20.multi-line-create-polish"', 'index version')
          s = sub_once(
              s,
              r'''const TICKET_SEARCH_ENDPOINTS = Object\.freeze\(\[.*?\]\);''',
              'const TICKET_SEARCH_ENDPOINTS = Object.freeze([\n  "/api/search/incidencias",\n]);',
              'canonical ticket endpoint',
              flags=re.S
          )
          s = s.replace('if (!ticketClienteId && !ticketUserId) return true;', 'if (!ticketClienteId && !ticketUserId) return false;')

          # Per-line state editing and live totals.
          patch_marker = '''    const value =\n      field.type === "checkbox"\n        ? Boolean(field.checked)\n        : field.tagName === "TEXTAREA"\n          ? multilineValue(field.value)\n          : field.value;\n\n    createModal.form = {\n      ...createModal.form,\n      [name]: value,\n    };'''
          patch_repl = '''    const value =\n      field.type === "checkbox"\n        ? Boolean(field.checked)\n        : field.tagName === "TEXTAREA"\n          ? multilineValue(field.value)\n          : field.value;\n\n    const lineField = cleanText(field.dataset?.lineField, "");\n    const lineIndex = number(field.dataset?.lineIndex, -1);\n\n    if (lineField && Number.isInteger(lineIndex) && lineIndex >= 0) {\n      const lineas = safeArray(createModal.form.lineas).map((linea) => ({ ...safeObject(linea) }));\n      if (!lineas[lineIndex]) return false;\n      lineas[lineIndex] = { ...lineas[lineIndex], [lineField]: value };\n      createModal.form = { ...createModal.form, lineas };\n\n      const errorKey = `lineas.${lineIndex}.${lineField}`;\n      if (createModal.errors[errorKey]) {\n        const next = { ...createModal.errors };\n        delete next[errorKey];\n        createModal.errors = next;\n      }\n\n      createModal.serverError = "";\n      patchCreateTotalsDom();\n      return true;\n    }\n\n    createModal.form = {\n      ...createModal.form,\n      [name]: value,\n    };'''
          s = replace_once(s, patch_marker, patch_repl, 'line field state')

          s = replace_once(
              s,
