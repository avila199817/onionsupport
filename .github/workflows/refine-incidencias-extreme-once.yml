name: Refine Incidencias Extreme Once

on:
  push:
    branches:
      - perf/incidencias-extreme-20260817
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply precision refinements
        run: node .github/scripts/refine-incidencias-extreme-once.mjs

      - name: Syntax check every Incidencias module
        shell: bash
        run: |
          set -euo pipefail
          for file in src/views/incidencias/*.js; do
            echo "checking $file"
            node --check "$file"
          done

      - name: Import every Incidencias module
        run: node --input-type=module -e "await import('./src/views/incidencias/incidencias.api.js'); await import('./src/views/incidencias/incidencias.template.js'); await import('./src/views/incidencias/incidencias.template.create.js'); await import('./src/views/incidencias/incidencias.template.modal.js'); await import('./src/views/incidencias/index.js'); console.log('all imports OK')"

      - name: Runtime render smoke test
        shell: bash
        run: |
          cat > /tmp/incidencias-smoke.mjs <<'NODE'
          const api = await import(`${process.cwd()}/src/views/incidencias/incidencias.api.js`);
          const list = await import(`${process.cwd()}/src/views/incidencias/incidencias.template.js`);
          const create = await import(`${process.cwd()}/src/views/incidencias/incidencias.template.create.js`);
          const modal = await import(`${process.cwd()}/src/views/incidencias/incidencias.template.modal.js`);
          const now = new Date().toISOString();
          const ticket = {
            id: 'INC-SMOKE-1', ticketId: 'INC-SMOKE-1', subject: 'Prueba', description: 'Detalle',
            status: 'open', priority: 'high', category: 'technical', displayName: 'Cliente Prueba',
            email: 'cliente@example.com', createdAt: now, updatedAt: now, attachments: [], attachmentsCount: 0,
            comments: [], history: [], invoiceTotal: 0, currency: 'EUR', meta: { frontendReady: true },
          };
          const listHtml = list.renderIncidenciasTemplate({ canonical: true, items: [ticket], total: 1, filter: 'all', search: '', sortOrder: 'desc', visibleLimit: 20, stats: api.computeIncidenciasStats([ticket]) });
          if (!listHtml.includes('INC-SMOKE-1')) throw new Error('list smoke failed');
          const createHtml = create.renderIncidenciasCreateModal({ open: true, admin: true, form: create.getCreateFormDefaults(), errors: {}, userSearch: { query: '', loading: false, error: '', results: [], selectedUser: null, empty: false } });
          if (!createHtml.includes('attachments')) throw new Error('create smoke failed');
          const modalHtml = modal.renderIncidenciasDetailModal({ open: true, detail: ticket, commentDraft: '', pendingFiles: [], feedbackMessage: '', feedbackType: 'info', previewFile: null });
          if (!modalHtml.includes('INC-SMOKE-1')) throw new Error('modal smoke failed');
          if ('fixedTechnician' in api.getIncidenciasApiSnapshot()) throw new Error('fixed technician frontend policy leaked');
          console.log('Incidencias runtime render smoke OK');
          NODE
          node /tmp/incidencias-smoke.mjs

      - name: Verify critical contracts
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'const ACCEPT_ATTRIBUTE = ACCEPT_ATTRIBUTE' src/views/incidencias/incidencias.template.create.js
          ! grep -q 'FIXED_TECHNICIAN' src/views/incidencias/incidencias.api.js
          grep -q 'detailLoadSeq' src/views/incidencias/index.js
          grep -q 'STATUS_MAP' src/views/incidencias/incidencias.template.js
          grep -q 'function patchListDom' src/views/incidencias/index.js

      - name: Commit refinements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/views/incidencias/*.js
          git commit -m 'perf(incidencias): harden extreme runtime path'
          git push origin HEAD:perf/incidencias-extreme-20260817
