<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" fill="none">
  <defs>
    <linearGradient id="hoodie" x1="150" y1="112" x2="275" y2="206" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="desk" x1="70" y1="204" x2="500" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243247"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="monitorFrame" x1="305" y1="62" x2="478" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#475569"/>
      <stop offset=".5" stop-color="#243247"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(284 135) rotate(90) scale(118 214)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#2563EB" stop-opacity=".06"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-50%" width="160%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#020617" flood-opacity=".34"/>
    </filter>
    <filter id="screenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .coder { animation: coder-breathe 5.2s ease-in-out infinite; transform-origin: 218px 156px; }
      .hand-left { animation: type-left .42s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 82% 70%; }
      .hand-right { animation: type-right .34s ease-in-out .08s infinite alternate; transform-box: fill-box; transform-origin: 18% 70%; }
      .key-a { animation: key-tap .42s ease-in-out infinite alternate; }
      .key-b { animation: key-tap .34s ease-in-out .08s infinite alternate; }
      .steam-a { animation: steam-rise 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      .steam-b { animation: steam-rise 3.15s ease-in-out .9s infinite; transform-box: fill-box; transform-origin: center bottom; }
      .cursor { animation: cursor-blink .9s steps(1,end) infinite; }
      .code-a { animation: code-pulse 2.4s ease-in-out infinite; }
      .code-b { animation: code-pulse 2.4s ease-in-out .5s infinite; }
      .code-c { animation: code-pulse 2.4s ease-in-out 1s infinite; }
      .status { animation: status-pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes coder-breathe { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1.8px) } }
      @keyframes type-left { from { transform: rotate(-.8deg) translateY(0) } to { transform: rotate(1.1deg) translateY(1.2px) } }
      @keyframes type-right { from { transform: rotate(.8deg) translateY(.8px) } to { transform: rotate(-1.2deg) translateY(0) } }
      @keyframes key-tap { from { opacity:.35 } to { opacity:1 } }
      @keyframes steam-rise { 0% { opacity:0; transform:translateY(4px) scale(.86) } 24% { opacity:.55 } 72% { opacity:.28 } 100% { opacity:0; transform:translateY(-12px) translateX(3px) scale(1.08) } }
      @keyframes cursor-blink { 0%,49% { opacity:1 } 50%,100% { opacity:.1 } }
      @keyframes code-pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes status-pulse { 0%,100% { opacity:.72; transform:scale(.9) } 50% { opacity:1; transform:scale(1.15) } }
      @media (prefers-reduced-motion: reduce) {
        .coder,.hand-left,.hand-right,.key-a,.key-b,.steam-a,.steam-b,.cursor,.code-a,.code-b,.code-c,.status { animation:none !important; }
      }
    </style>
  </defs>

