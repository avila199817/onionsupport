name: Temporary public home visual PR finalizer

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/public-home-visual-final'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/public-home-visual-final
          fetch-depth: 0

      - name: Reuse exact canonical transformer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/tmp-public-home-visual-final.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          lines = source[start:end]
          out = []
          for line in lines:
              out.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/public_home_visual_final.py').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          python3 /tmp/public_home_visual_final.py

      - name: Validate canonical public home
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/public_home_integrity.py
          grep -F 'public-support.intake.v10-visual-profile' src/features/public-support/index.js
          grep -F 'Cristian_Avila_Formulario.png' src/features/public-support/index.js
          grep -F 'public-support-person' src/css/views/public/support-request.css
          grep -F 'public-support-title-accent' src/css/views/public/support-request.css
          grep -F 'public-support-postal-hint' src/css/views/public/support-request.css
          ! grep -F 'field("country", "País"' src/features/public-support/index.js
          test -s src/media/img/Cristian_Avila_Formulario.png

      - name: Commit final tree and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Onion Support'
          git config user.email 'cristian@onionsupport.com'
          rm -f \
            .github/workflows/tmp-public-home-visual-final.yml \
            .github/workflows/tmp-public-home-visual-pr.yml \
            .github/tmp-public-home-visual-trigger.txt
          git add -A
          git diff --cached --check
          git commit -m 'feat: elevate public home support experience'
          git push origin HEAD:feat/public-home-visual-final
