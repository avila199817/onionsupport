name: Replace Empleados icon once

on:
  push:
    branches:
      - fix/empleados-id-card-icon-final

permissions:
  contents: write

jobs:
  apply:
    name: Apply final Empleados ID-card icon
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/empleados-id-card-icon-final
          fetch-depth: 0
          persist-credentials: true

      - name: Replace icon and validate source
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          OLD_PATH = "M8.5 6V4.75A1.75 1.75 0 0 1 10.25 3h3.5a1.75 1.75 0 0 1 1.75 1.75V6 M5.25 6h13.5A2.25 2.25 0 0 1 21 8.25v9.5A2.25 2.25 0 0 1 18.75 20H5.25A2.25 2.25 0 0 1 3 17.75v-9.5A2.25 2.25 0 0 1 5.25 6Z M3 11.25c2.65 1.45 5.65 2.2 9 2.2s6.35-.75 9-2.2 M9.75 12.9v2.35h4.5V12.9 M18.25 2.75v2.5 M17 4h2.5"
          NEW_PATH = "M4.5 5.25h15a2 2 0 0 1 2 2v9.5a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2v-9.5a2 2 0 0 1 2-2Z M8.25 12.25a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2Z M5.25 16.25c.35-1.75 1.55-2.8 3-2.8s2.65 1.05 3 2.8 M14 8.5h3.75 M14 11.75h3.75 M14 15h2.5"

          OLD_ICON_BASE64 = ""
          NEW_ICON_BASE64 = ""

          def replace_exact(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file_path.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "src/css/components/app-icons.css",
              OLD_ICON_BASE64,
              NEW_ICON_BASE64,
          )
          replace_exact(
              "src/ui/sidebar/template.js",
              OLD_PATH,
              NEW_PATH,
          )
          replace_exact(
              "src/views/empleados/index.js",
              OLD_PATH,
              NEW_PATH,
          )
          replace_exact(
              "src/views/empleados/index.js",
              '"empleados.placeholder.v2-internal-company-polish"',
              '"empleados.placeholder.v3-id-card-final"',
          )

          app_icons = Path("src/css/components/app-icons.css").read_text(encoding="utf-8")
          if app_icons.count("--app-icon-empleados:") != 1:
              raise SystemExit("Empleados icon authority must exist exactly once")
          if OLD_ICON_BASE64 in app_icons or app_icons.count(NEW_ICON_BASE64) != 1:
              raise SystemExit("Canonical Empleados mask replacement failed")

          for source_path in (
              "src/ui/sidebar/template.js",
              "src/views/empleados/index.js",
          ):
              source = Path(source_path).read_text(encoding="utf-8")
              if OLD_PATH in source or source.count(NEW_PATH) != 1:
                  raise SystemExit(f"{source_path}: final SVG invariant failed")

          view_source = Path("src/views/empleados/index.js").read_text(encoding="utf-8")
          if '"empleados.placeholder.v3-id-card-final"' not in view_source:
              raise SystemExit("Empleados view version was not updated")

          print("New Empleados ID-card icon applied and verified")
          PY

          node --check src/ui/sidebar/template.js
          node --check src/views/empleados/index.js
          git diff --check
          git diff --stat

      - name: Commit clean feature diff
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"

          git rm -- .github/workflows/replace-empleados-icon-once.yml
          git add \
            src/css/components/app-icons.css \
            src/ui/sidebar/template.js \
            src/views/empleados/index.js

          git diff --cached --check
          git commit -m "Sustituir icono de Empleados por una acreditación"
          git push origin HEAD:fix/empleados-id-card-icon-final
