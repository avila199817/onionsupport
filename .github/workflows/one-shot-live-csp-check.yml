name: One-shot live CSP check

on:
  push:
    branches:
      - fix/google-csp-preview-final
    paths:
      - .github/workflows/one-shot-live-csp-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live CSP headers
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://onionsupport.com/" "https://www.onionsupport.com/"; do
            echo "===== $url ====="
            tmp="$(mktemp)"
            curl -sSIL --max-redirs 5 -H 'Cache-Control: no-cache' "${url}?csp_probe=${GITHUB_SHA}" -o "$tmp"
            cat "$tmp"
            echo "----- CSP lines -----"
            grep -i '^content-security-policy:' "$tmp" || true
            echo "----- Required host checks -----"
            grep -i '^content-security-policy:' "$tmp" | tail -n1 | grep -F 'https://www.googleadservices.com'
            grep -i '^content-security-policy:' "$tmp" | tail -n1 | grep -F 'https://ad.doubleclick.net'
            grep -i '^content-security-policy:' "$tmp" | tail -n1 | grep -F 'https://fonts.gstatic.com'
            rm -f "$tmp"
          done
