name: Incidencias admin ticket editor

on:
  push:
    branches:
      - feat/incidencias-admin-ticket-editor

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[incidencias-admin-editor-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/incidencias-admin-ticket-editor
          fetch-depth: 0

      - name: Apply canonical admin editor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          # -------------------------------------------------
          # CREATE TEMPLATE · consume canonical option source
          # -------------------------------------------------
          path = Path('src/views/incidencias/incidencias.template.create.js')
          text = path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              '''========================================================= */

