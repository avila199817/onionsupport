name: Trusted PR Integrity

run-name: Trusted PR Integrity · #${{ github.event.pull_request.number }}

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

concurrency:
  group: trusted-pr-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Trusted PR integrity
    runs-on: ubuntu-latest
    timeout-minutes: 7
    if: github.event.action != 'closed'

    outputs:
      candidate_sha: ${{ steps.revisions.outputs.candidate_sha }}
      trusted_sha: ${{ steps.revisions.outputs.trusted_sha }}

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PUBLIC_SITE_URL: "https://www.onionsupport.com"
      DIRECT_API_URL: "https://api.onionsupport.com"

    steps:
      - name: Resolve immutable revisions
        id: revisions
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for value in "${CANDIDATE_SHA}" "${TRUSTED_SHA}"; do
            if [[ ! "${value}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=SHA inválido::Revision no inmutable: '${value}'."
              exit 1
            fi
          done

          if [[ "${CANDIDATE_SHA}" == "${TRUSTED_SHA}" ]]; then
            echo "::error title=Candidate inesperado::Candidate y base no pueden ser idénticos."
            exit 1
          fi

          echo "candidate_sha=${CANDIDATE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "trusted_sha=${TRUSTED_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Candidate SHA: ${CANDIDATE_SHA}"
          echo "Trusted base SHA: ${TRUSTED_SHA}"

      - name: Checkout trusted integrity tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revisions.outputs.trusted_sha }}
          path: trusted-integrity-source
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Stage trusted integrity tooling
        working-directory: trusted-integrity-source
        shell: bash
        run: |
          set -euo pipefail

          destination="${RUNNER_TEMP}/onion-trusted-integrity"
          rm -rf "${destination}"
          mkdir -p "${destination}"

          install -m 0644 .github/ci/validate_candidate_paths.py \
            "${destination}/validate_candidate_paths.py"
          install -m 0644 .github/ci/validate_integrity_candidate.py \
            "${destination}/validate_integrity_candidate.py"
          install -m 0755 .github/ci/validate_static_release.sh \
            "${destination}/validate_static_release.sh"
          install -m 0755 .github/ci/validate_production_contract.sh \
            "${destination}/validate_production_contract.sh"
          install -m 0755 .github/ci/validate_spa_contracts.sh \
            "${destination}/validate_spa_contracts.sh"
          install -m 0644 .github/scripts/repo_integrity.py \
            "${destination}/repo_integrity.py"
          install -m 0644 .github/scripts/app_entrypoint_integrity.py \
            "${destination}/app_entrypoint_integrity.py"
          install -m 0644 .github/scripts/boot_visual_integrity.py \
            "${destination}/boot_visual_integrity.py"
          install -m 0644 .github/scripts/cuenta_integrity.py \
            "${destination}/cuenta_integrity.py"
          install -m 0644 .github/scripts/public_home_integrity.py \
            "${destination}/public_home_integrity.py"
          install -m 0644 .github/scripts/public_home_performance.py \
            "${destination}/public_home_performance.py"

      # Deliberate exception: this checkout contains untrusted PR bytes.
      # Nothing from it is executed as a script, action, hook or dependency.
      - name: Checkout candidate as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revisions.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 2
          submodules: false
          lfs: false
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Assert immutable checkouts
        env:
          CANDIDATE_SHA: ${{ steps.revisions.outputs.candidate_sha }}
          TRUSTED_SHA: ${{ steps.revisions.outputs.trusted_sha }}
        shell: bash
        run: |
          set -euo pipefail

          actual_candidate="$(git -C candidate rev-parse HEAD)"
          actual_trusted="$(git -C trusted-integrity-source rev-parse HEAD)"

          if [[ "${actual_candidate}" != "${CANDIDATE_SHA}" ]]; then
            echo "::error title=Candidate checkout incorrecto::Esperado ${CANDIDATE_SHA}, obtenido ${actual_candidate}."
            exit 1
          fi

          if [[ "${actual_trusted}" != "${TRUSTED_SHA}" ]]; then
            echo "::error title=Trusted checkout incorrecto::Esperado ${TRUSTED_SHA}, obtenido ${actual_trusted}."
            exit 1
          fi

          if [[ -n "$(git -C candidate status --porcelain --untracked-files=all)" ]]; then
            echo "::error title=Candidate checkout sucio::El checkout candidato contiene mutaciones inesperadas."
            git -C candidate status --short
            exit 1
          fi

          echo "Immutable candidate: ${actual_candidate}"
          echo "Immutable trusted base: ${actual_trusted}"

      - name: Validate candidate path boundary
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        shell: bash
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/validate_candidate_paths.py"

      - name: Validate candidate SWA helper syntax as data
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail

          bash -n .github/ci/validate_static_release.sh
          bash -n .github/ci/validate_production_contract.sh
          bash -n .github/ci/validate_spa_contracts.sh

          echo "Candidate SWA helper syntax OK."

      - name: Validate static release contract
        working-directory: candidate
        shell: bash
        run: bash "${RUNNER_TEMP}/onion-trusted-integrity/validate_static_release.sh"

      - name: Validate production SEO and routing contract
        working-directory: candidate
        shell: bash
        run: bash "${RUNNER_TEMP}/onion-trusted-integrity/validate_production_contract.sh"

      - name: Reject legacy API domain
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail

          legacy_domain="onionit"".""net"

          if git grep -n -I -F "${legacy_domain}" -- .; then
            echo "::error title=Dominio API legado detectado::El release aún contiene referencias a ${legacy_domain}."
            exit 1
          fi

          echo "Sin referencias al dominio API legado."

      - name: Validate critical SPA contracts
        working-directory: candidate
        shell: bash
        run: bash "${RUNNER_TEMP}/onion-trusted-integrity/validate_spa_contracts.sh"

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate JavaScript syntax as data
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            find src -type f -name '*.js' -print0 | sort -z
          )

          if (( ${#files[@]} == 0 )); then
            echo "::error title=JavaScript ausente::No JavaScript files found under src/."
            exit 1
          fi

          failed=0

          for file in "${files[@]}"; do
            if ! node --check "${file}" >/dev/null 2>&1; then
              echo "::error title=JavaScript syntax inválida::${file}"
              failed=1
            fi
          done

          (( failed == 0 )) || exit 1
          echo "JavaScript syntax OK · ${#files[@]} files"

      - name: Validate repository contracts
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/repo_integrity.py"

      - name: Validate single app entrypoint
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/app_entrypoint_integrity.py"

      - name: Validate boot visual contract
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/boot_visual_integrity.py"

      - name: Validate Cuenta canonical surface
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/cuenta_integrity.py"

      - name: Validate public frontend contract
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/public_home_integrity.py"

      - name: Validate public-home frame budget
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/public_home_performance.py"

      - name: Validate candidate CI and static syntax
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/validate_integrity_candidate.py"

      - name: Assert candidate remains unmodified
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::error title=Candidate mutado::La validación trusted modificó el checkout candidato."
            git status --short
            exit 1
          fi

          echo "Candidate remains byte-for-byte unmodified."

      - name: Reject unresolved merge markers
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE '^(<<<<<<< |>>>>>>> )' \
            src .github staticwebapp.config.json robots.txt sitemap.xml; then
            echo "::error title=Merge markers::Unresolved merge markers detected."
            exit 1
          fi

      - name: Validate candidate commit whitespace
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD

  deploy_preview:
    name: Deploy trusted PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - integrity

    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read

    env:
      VALIDATED_SHA: ${{ needs.integrity.outputs.candidate_sha }}
      TRUSTED_SHA: ${{ needs.integrity.outputs.trusted_sha }}

    steps:
      - name: Resolve preview environment
        id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          preview="pr${PR_NUMBER}"

          if [[ ! "${preview}" =~ ^[A-Za-z0-9]{1,16}$ ]]; then
            echo "::error title=Preview environment inválido::Nombre '${preview}' fuera del contrato."
            exit 1
          fi

          echo "name=${preview}" >> "${GITHUB_OUTPUT}"
          echo "Trusted preview environment: ${preview}"

      - name: Checkout trusted preview tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TRUSTED_SHA }}
          path: trusted-preview-source
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Stage trusted preview verifier
        working-directory: trusted-preview-source
        shell: bash
        run: |
          set -euo pipefail

          install -m 0755 .github/ci/verify_release_bytes.sh \
            "${RUNNER_TEMP}/verify_release_bytes.sh"

      - name: Checkout validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VALIDATED_SHA }}
          path: candidate
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Assert immutable preview inputs
        shell: bash
        run: |
          set -euo pipefail

          actual_candidate="$(git -C candidate rev-parse HEAD)"
          actual_trusted="$(git -C trusted-preview-source rev-parse HEAD)"

          if [[ "${actual_candidate}" != "${VALIDATED_SHA}" ]]; then
            echo "::error title=Candidate preview incorrecto::Esperado ${VALIDATED_SHA}, obtenido ${actual_candidate}."
            exit 1
          fi

          if [[ "${actual_trusted}" != "${TRUSTED_SHA}" ]]; then
            echo "::error title=Trusted preview incorrecto::Esperado ${TRUSTED_SHA}, obtenido ${actual_trusted}."
            exit 1
          fi

          if [[ -n "$(git -C candidate status --porcelain --untracked-files=all)" ]]; then
            echo "::error title=Candidate preview sucio::El checkout candidato contiene mutaciones."
            git -C candidate status --short
            exit 1
          fi

          echo "Immutable preview candidate: ${actual_candidate}"
          echo "Immutable preview tooling: ${actual_trusted}"

      - name: Validate preview deployment token
        env:
          SWA_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SWA_API_TOKEN:-}" ]]; then
            echo "::error title=Secret no configurado::Falta AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E."
            exit 1
          fi

      - name: Deploy trusted static preview
        id: deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}
          action: upload
          app_location: candidate
          api_location: ""
          output_location: ""
          skip_app_build: true
          deployment_environment: ${{ steps.preview.outputs.name }}

      - name: Verify trusted preview release bytes
        working-directory: candidate
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          VERIFY_CANONICAL: "false"
        shell: bash
        run: bash "${RUNNER_TEMP}/verify_release_bytes.sh"

      - name: Preview summary
        if: always()
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          PREVIEW_ENV: ${{ steps.preview.outputs.name }}
        shell: bash
        run: |
          {
            echo "## Trusted SWA preview"
            echo
            echo "- Environment: \`${PREVIEW_ENV}\`"
            echo "- Candidate SHA: \`${VALIDATED_SHA}\`"
            if [[ -n "${DEPLOYED_URL:-}" ]]; then
              echo "- URL: ${DEPLOYED_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  close_preview:
    name: Close trusted PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read

    steps:
      - name: Resolve preview environment
        id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          preview="pr${PR_NUMBER}"

          if [[ ! "${preview}" =~ ^[A-Za-z0-9]{1,16}$ ]]; then
            echo "::error title=Preview environment inválido::Nombre '${preview}' fuera del contrato."
            exit 1
          fi

          echo "name=${preview}" >> "${GITHUB_OUTPUT}"
          echo "Closing trusted preview environment: ${preview}"

      - name: Validate preview deployment token
        env:
          SWA_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SWA_API_TOKEN:-}" ]]; then
            echo "::error title=Secret no configurado::Falta AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E."
            exit 1
          fi

      - name: Close trusted Azure SWA preview
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}
          action: close
          deployment_environment: ${{ steps.preview.outputs.name }}
