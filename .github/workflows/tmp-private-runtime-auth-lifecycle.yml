name: TEMP Private Runtime Auth Lifecycle

on:
  push:
    branches:
      - refactor/private-runtime-auth-lifecycle

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/private-runtime-auth-lifecycle
          fetch-depth: 0

      - name: Guard completed refactor
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[private-runtime-auth-done\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply private runtime/auth refactor
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 .github/tmp/refactor_private_runtime_auth_lifecycle.py
          python3 .github/tmp/fix_private_runtime_contracts.py

      - name: Validate refactor
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          node --check src/features/private-runtime-ui/index.js
          node --check src/app/index.js
          node --check src/app/enhancements.js
          node --check src/router/index.js
          node --check src/views/public/login/index.js
          node --experimental-default-type=module .github/scripts/private_runtime_auth_contract.mjs
          python3 .github/scripts/app_entrypoint_integrity.py
          bash .github/ci/validate_spa_contracts.sh
          git diff --check

      - name: Commit refactor
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Onion Support CI"
          git config user.email "cristian@onionsupport.com"
          git add -A src/features/private-runtime-ui src/app/index.js src/app/enhancements.js src/router/index.js src/views/public/login/index.js src/css/tokens/variables.css src/css/core/layout.css src/css/layout/chrome.css .github/scripts/private_runtime_auth_contract.mjs .github/scripts/app_entrypoint_integrity.py .github/ci/validate_spa_contracts.sh
          git commit -m "refactor: runtime privado sólo después de Auth [private-runtime-auth-done]"
          git push origin HEAD:refactor/private-runtime-auth-lifecycle
