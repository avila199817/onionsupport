name: Incidencias polish PR helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.pull_request.head.sha, '0000000000000000000000000000000000000000') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Extract and run focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/incidencias-polish-branch.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(src) if line.strip() == '- name: Apply focused Incidencias polish')
          run_line = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(src)) if src[i].strip().startswith('- name: Validate JS and diff'))
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in src[run_line + 1:end]) + '\n'
          Path('/tmp/incidencias-polish.sh').write_text(block, encoding='utf-8')
          PY
          bash /tmp/incidencias-polish.sh
          node --check src/views/incidencias/incidencias.template.js
          node --check src/views/incidencias/index.js
          git diff --check

      - name: Commit focused patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/views/incidencias/incidencias.template.js src/views/incidencias/index.js src/css/views/incidencias/index.css
          git commit -m 'fix(incidencias): polish categories avatars and attachments [incidencias-polish-applied]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
