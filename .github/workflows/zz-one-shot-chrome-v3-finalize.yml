name: One-shot App Chrome V3 finalize

on:
  push:
    branches:
      - refactor/app-chrome-v3-single-layout

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/app-chrome-v3-single-layout

      - name: Fix App Chrome stacking authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/css/layout/chrome.css")
          text = p.read_text(encoding="utf-8")

          if "--chrome-z-root:" not in text:
              marker = "  --chrome-z-topbar: var(--z-topbar, 50);\n"
              if marker not in text:
                  raise SystemExit("chrome.css: z token marker missing")
              text = text.replace(
                  marker,
                  "  --chrome-z-root: var(--z-sidebar, 40);\n" + marker,
                  1,
              )

          root_marker = (
              "  block-size: 100vh;\n"
              "  block-size: 100svh;\n"
              "  block-size: 100dvh;\n\n"
              "  pointer-events: none;\n"
              "  isolation: isolate;\n"
          )
          root_replacement = (
              "  block-size: 100vh;\n"
              "  block-size: 100svh;\n"
              "  block-size: 100dvh;\n\n"
              "  z-index: var(--chrome-z-root);\n\n"
              "  pointer-events: none;\n"
              "  isolation: isolate;\n"
          )

          if "z-index: var(--chrome-z-root);" not in text:
              if root_marker not in text:
                  raise SystemExit("chrome.css: root geometry marker missing")
              text = text.replace(root_marker, root_replacement, 1)

          p.write_text(text, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '--chrome-z-root:' src/css/layout/chrome.css
          grep -q 'z-index: var(--chrome-z-root);' src/css/layout/chrome.css
          test ! -f src/css/layout/mobile-shell.css
          ! grep -q '@layer layout' src/css/layout/chrome.css
          ! grep -q 'SIDEBAR OFFSET BRIDGE' src/css/layout/topbar.css
          python .github/scripts/repo_integrity.py
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add src/css/layout/chrome.css
          git commit -m "fix(chrome): fijar stacking context del shell"
          git push origin HEAD:refactor/app-chrome-v3-single-layout
