name: TEMP Chrome Root Aware Contract

on:
  push:
    branches:
      - ci/chrome-root-aware-contract

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[chrome-root-aware-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ci/chrome-root-aware-contract
          fetch-depth: 1
          persist-credentials: true

      - name: Update integrity contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/repo_integrity.py')
          text = p.read_text(encoding='utf-8')
          old = '''    if '/src/ui/chrome/index.js' not in index_text:\n        errors.append("index.html :: debe cargar App Chrome canónico directamente")\n'''
          new = '''    preboot_path = SRC / "preboot" / "public-home-preload.js"\n    try:\n        preboot_text = preboot_path.read_text(encoding="utf-8")\n    except OSError as error:\n        errors.append(f"src/preboot/public-home-preload.js :: ilegible: {error}")\n        preboot_text = ""\n\n    direct_chrome_preload = '/src/ui/chrome/index.js' in index_text\n    root_aware_chrome_preload = (\n        '/src/preboot/public-home-preload.js' in index_text\n        and 'window.location.pathname !== "/"' in preboot_text\n        and '"/src/ui/chrome/index.js"' in preboot_text\n        and 'link.rel = "modulepreload"' in preboot_text\n    )\n\n    if not (direct_chrome_preload or root_aware_chrome_preload):\n        errors.append(\n            "App Chrome debe precargarse directamente o mediante el preboot privado root-aware"\n        )\n'''
          if old not in text:
              raise SystemExit('chrome integrity anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/scripts/repo_integrity.py
          python -m py_compile .github/scripts/repo_integrity.py
          git diff --check

      - name: Commit contract update
        shell: bash
        run: |
          git config user.name "Onion Support CI"
          git config user.email "cristian@onionsupport.com"
          git add .github/scripts/repo_integrity.py
          git commit -m "ci: aceptar preload Chrome root-aware [chrome-root-aware-applied]"
          git push origin HEAD:ci/chrome-root-aware-contract
