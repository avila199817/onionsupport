name: One-shot server god mode polish

on:
  push:
    branches:
      - fix/server-god-mode-polish

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply exact polish
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          template = Path("src/views/server/server.template.js")
          text = template.read_text(encoding="utf-8")

          old = '''      status: "healthy",\n      result: "Disponible",\n      detail:\n        "Probe expuesto por el backend.",'''
          new = '''      status: "unknown",\n      result: "Disponible",\n      detail:\n        "Probe expuesto por el backend; no ejecutado en esta carga.",'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"template: expected 1 readiness/liveness block, got {count}")

          template.write_text(text.replace(old, new, 1), encoding="utf-8")

          css = Path("src/css/views/servidor/index.css")
          css_text = css.read_text(encoding="utf-8")
          count = css_text.count("background: var(--solid-muted);")
          if count != 2:
              raise SystemExit(f"css: expected 2 solid-muted uses, got {count}")

          css.write_text(
              css_text.replace(
                  "background: var(--solid-muted);",
                  "background: var(--badge-bg);",
              ),
              encoding="utf-8",
          )
          PY

          node --check src/views/server/server.template.js
          python3 .github/scripts/repo_integrity.py

          if grep -Fq -- '--solid-muted' src/css/views/servidor/index.css; then
            echo "::error::Queda un token --solid-muted no definido."
            exit 1
          fi

          if grep -A14 -F 'key === "ready"' src/views/server/server.template.js | grep -Fq 'status: "healthy"'; then
            echo "::error::Readiness/Liveness no consultados no deben marcarse healthy."
            exit 1
          fi

      - name: Commit polished source and remove one-shot workflow
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/zz-one-shot-server-god-polish.yml
          git add src/views/server/server.template.js src/css/views/servidor/index.css

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Nada que commitear."
            exit 0
          fi

          git commit -m "fix(server): pulir semántica de probes y meter"
          git push origin HEAD:fix/server-god-mode-polish
