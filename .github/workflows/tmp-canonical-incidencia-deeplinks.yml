name: TEMP Canonical Incidencia Deeplinks

on:
  push:
    branches:
      - feat/canonical-incidencia-deeplinks

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-incidencia-deeplinks-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/canonical-incidencia-deeplinks
          fetch-depth: 0

      - name: Apply canonical incidencia deeplink architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------------------------------------------------------
          # 1) Router: detail routes resolve to the canonical owner view.
          # ---------------------------------------------------------
          routes_path = Path('src/router/routes.js')
          routes = routes_path.read_text()

          helper = r'''
const PRIVATE_DETAIL_TICKET_PATTERN =
  /^INC-[A-Z0-9-]{6,120}$/i;

function resolvePrivateDetailRoutePath(
  path = "/"
) {
  const clean = normalizePath(path);
  const scoped = getUserScopedRouteInfo(clean);
  const candidate = scoped.scoped
    ? (
        scoped.restPath ||
        scoped.canonicalPath ||
        "/"
      )
    : clean;

  if (
    isSingleSegmentChildPath(
      candidate,
      ROUTE_PATHS.INCIDENCIAS
    )
  ) {
    const suffix = candidate.slice(
      ROUTE_PATHS.INCIDENCIAS.length + 1
    );

    if (PRIVATE_DETAIL_TICKET_PATTERN.test(suffix)) {
      return ROUTE_PATHS.INCIDENCIAS;
    }
  }

  if (
    isSingleSegmentChildPath(
      candidate,
      "/tickets"
    )
  ) {
    const suffix = candidate.slice("/tickets/".length);

    if (PRIVATE_DETAIL_TICKET_PATTERN.test(suffix)) {
      return ROUTE_PATHS.INCIDENCIAS;
    }
  }

  return "";
}

'''

          anchor = 'function resolvePublicAliasPath(\n'
          if 'function resolvePrivateDetailRoutePath(' not in routes:
              if anchor not in routes:
                  raise SystemExit('routes.js: anchor resolvePublicAliasPath not found')
              routes = routes.replace(anchor, helper + anchor, 1)

          lookup_anchor = '''  const scoped = getUserScopedRouteInfo(\n    clean\n  );\n'''
          lookup_insert = '''  const privateDetailLookup =\n    resolvePrivateDetailRoutePath(\n      clean\n    );\n\n  if (privateDetailLookup) {\n    return privateDetailLookup;\n  }\n\n'''
          if 'const privateDetailLookup =' not in routes:
              pos = routes.find('export function resolveRouteLookupPath(')
              if pos < 0:
                  raise SystemExit('routes.js: resolveRouteLookupPath not found')
              tail = routes[pos:]
              rel = tail.find(lookup_anchor)
              if rel < 0:
                  raise SystemExit('routes.js: scoped lookup anchor not found')
              absolute = pos + rel
              routes = routes[:absolute] + lookup_insert + routes[absolute:]

          routes_path.write_text(routes)

          # ---------------------------------------------------------
          # 2) Main: pre-router canonicalization must reach Router.start().
          # ---------------------------------------------------------
          main_path = Path('src/main.js')
          main = main_path.read_text()
          old = '''  const rawInitialPath = getInitialPath();\n  const publicHomeFastPath = isExactPublicHome(rawInitialPath);\n'''
          new = '''  let rawInitialPath = getInitialPath();\n  const publicHomeFastPath = isExactPublicHome(rawInitialPath);\n'''
          if old in main:
              main = main.replace(old, new, 1)
          elif 'let rawInitialPath = getInitialPath();' not in main:
              raise SystemExit('main.js: rawInitialPath declaration anchor not found')

          pre = '''  if (!publicHomeFastPath) {\n    await enhancements.initPreRouter();\n  }\n\n  const safeInitialPath = redact(rawInitialPath) || "/";\n'''
          post = '''  if (!publicHomeFastPath) {\n    await enhancements.initPreRouter();\n\n    /*\n      Las mejoras pre-router pueden canonicalizar enlaces privados antes de\n      que el Router resuelva la vista. El handoff debe usar la URL resultante,\n      no la captura previa a esa canonicalización.\n    */\n    rawInitialPath = getInitialPath();\n  }\n\n  const safeInitialPath = redact(rawInitialPath) || "/";\n'''
          if pre in main:
              main = main.replace(pre, post, 1)
          elif 'rawInitialPath = getInitialPath();' not in main[main.find('await enhancements.initPreRouter();'):]:
              raise SystemExit('main.js: pre-router canonicalization anchor not found')
          main_path.write_text(main)

          # ---------------------------------------------------------
          # 3) Incidencias: stable bridge to its canonical controller.
          # ---------------------------------------------------------
          incidencias_path = Path('src/views/incidencias/index.js')
          incidencias = incidencias_path.read_text()
          bridge = r'''
export async function openIncidenciaDetailById(
  ticketId = "",
  openerNode = null
) {
  try {
    if (
      !lastInstance ||
      typeof lastInstance.openDetail !== "function"
    ) {
      return false;
    }

    return Boolean(
      await lastInstance.openDetail(
        ticketId,
        openerNode
      )
    );
  } catch {
    return false;
  }
}

'''
          if 'export async function openIncidenciaDetailById(' not in incidencias:
              anchor = 'export function destroy() {'
              if anchor not in incidencias:
                  raise SystemExit('incidencias/index.js: destroy export anchor not found')
              incidencias = incidencias.replace(anchor, bridge + anchor, 1)
          incidencias_path.write_text(incidencias)

          # ---------------------------------------------------------
          # 4) Deeplink: direct links mount Incidencias + canonical modal.
          # ---------------------------------------------------------
          deeplink = r'''/* =========================================================
   Onion Support - Incidencia Canonical Deep Link

   Contrato:
   - URL canónica compartible: /@{slug}/incidencias/<INC-ID>.
   - Un deeplink de incidencia abre la vista propietaria Incidencias y su
     controller/modal canónico, con Histórico, adjuntos, edición y cierre.
   - El overlay global queda reservado para aperturas rápidas desde otras vistas.
   - Mantiene compatibilidad con /tickets/<INC-ID>, /incidencias/<INC-ID>,
     ?ticketId=..., ?incidenciaId=... y ?entity=incidencia&entityId=....
   - Sin clicks sintéticos, sin búsqueda de filas y sin HTTP propio.
========================================================= */

export const TICKET_DEEPLINK_VERSION =
  "ticket-deeplink.v4-canonical-owner-modal";

const INCIDENCIAS_PATH = "/incidencias";
const LEGACY_TICKETS_PREFIX = "/tickets/";
const TICKET_ID_PATTERN = /^INC-[A-Z0-9-]{6,120}$/i;
const SCOPED_DETAIL_PATTERN = /^\/@([^/]+)\/incidencias\/([^/?#]+)\/?$/i;
const UNSCOPED_DETAIL_PATTERN = /^\/incidencias\/([^/?#]+)\/?$/i;
const VIEW_ROOT_SELECTOR = "#view-container, [data-router-view='true']";
const MODAL_ROOT_SELECTOR = "[data-incidencias-modal-root='true']";
const MAX_WAIT_MS = 20_000;

let ticketId = "";
let source = "";
let observer = null;
let observerInstallHandler = null;
let timeoutId = 0;
let attemptPromise = null;
let modalOpened = false;
let finished = false;

function isBrowser() {
  return typeof window !== "undefined" && typeof document !== "undefined";
}

function cleanText(value = "") {
  return String(value ?? "")
    .replace(/[\r\n\t]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function safeDecode(value = "") {
  try {
    return decodeURIComponent(String(value ?? ""));
  } catch {
    return String(value ?? "");
  }
}

function normalizeTicketId(value = "") {
  const id = cleanText(safeDecode(value));
  return TICKET_ID_PATTERN.test(id) ? id.toUpperCase() : "";
}

function currentUrl() {
  if (!isBrowser()) return null;

  try {
    return new URL(window.location.href);
  } catch {
    return null;
  }
}

function scopedDetailFromPath(pathname = "") {
  const match = cleanText(pathname).match(SCOPED_DETAIL_PATTERN);
  const id = normalizeTicketId(match?.[2] || "");

  return id
    ? {
        slug: cleanText(match?.[1], ""),
        id,
      }
    : null;
}

function unscopedDetailFromPath(pathname = "") {
  const match = cleanText(pathname).match(UNSCOPED_DETAIL_PATTERN);
  return normalizeTicketId(match?.[1] || "");
}

function legacyTicketFromPath(pathname = "") {
  const path = cleanText(pathname);
  if (!path.toLowerCase().startsWith(LEGACY_TICKETS_PREFIX)) return "";

  const suffix = path.slice(LEGACY_TICKETS_PREFIX.length);
  if (!suffix || suffix.includes("/")) return "";
  return normalizeTicketId(suffix);
}

function queryTicket(url = null) {
  if (!url) return "";

  return normalizeTicketId(
    url.searchParams.get("ticketId") ||
    url.searchParams.get("incidenciaId") ||
    (
      url.searchParams.get("entity") === "incidencia"
        ? url.searchParams.get("entityId")
        : ""
    ) ||
    ""
  );
}

function scopedBase(pathname = "") {
  const match = cleanText(pathname).match(/^\/@([^/]+)(?:\/incidencias)?\/?$/i);
  return match?.[1]
    ? `/@${match[1]}`
    : "";
}

function clearLegacyQuery(url = null) {
  if (!url) return false;
  url.searchParams.delete("ticketId");
  url.searchParams.delete("incidenciaId");
  url.searchParams.delete("entity");
  url.searchParams.delete("entityId");
  return true;
}

function replaceUrl(url = null) {
  if (!url || !isBrowser()) return false;

  try {
    window.history.replaceState(
      window.history.state,
      "",
      `${url.pathname}${url.search}${url.hash}`
    );
    return true;
  } catch {
    return false;
  }
}

function resolveAndCanonicalize() {
  const url = currentUrl();
  if (!url) return "";

  const scoped = scopedDetailFromPath(url.pathname);
  if (scoped?.id) {
    source = "scoped-detail";
    clearLegacyQuery(url);
    replaceUrl(url);
    return scoped.id;
  }

  const unscoped = unscopedDetailFromPath(url.pathname);
  if (unscoped) {
    source = "unscoped-detail";
    clearLegacyQuery(url);
    replaceUrl(url);
    return unscoped;
  }

  const legacy = legacyTicketFromPath(url.pathname);
  if (legacy) {
    source = "legacy-ticket-path";
    url.pathname = `${INCIDENCIAS_PATH}/${legacy}`;
    clearLegacyQuery(url);
    replaceUrl(url);
    return legacy;
  }

  const queryId = queryTicket(url);
  if (!queryId) return "";

  source = "legacy-query";
  const base = scopedBase(url.pathname);
  url.pathname = base
    ? `${base}${INCIDENCIAS_PATH}/${queryId}`
    : `${INCIDENCIAS_PATH}/${queryId}`;
  clearLegacyQuery(url);
  replaceUrl(url);
  return queryId;
}

function viewRoot() {
  return isBrowser()
    ? document.querySelector(VIEW_ROOT_SELECTOR)
    : null;
}

function modalIsOpen(root = viewRoot()) {
  return Boolean(root?.querySelector?.(MODAL_ROOT_SELECTOR));
}

function baseIncidenciasPath(pathname = "") {
  const scoped = scopedDetailFromPath(pathname);
  if (scoped?.slug) {
    return `/@${scoped.slug}${INCIDENCIAS_PATH}`;
  }

  return INCIDENCIAS_PATH;
}

function cleanUrlAfterClose() {
  const url = currentUrl();
  if (!url) return false;

  url.pathname = baseIncidenciasPath(url.pathname);
  clearLegacyQuery(url);
  return replaceUrl(url);
}

function stop() {
  if (finished) return false;
  finished = true;

  observer?.disconnect?.();
  observer = null;

  if (observerInstallHandler) {
    window.removeEventListener("onion:main:ready", observerInstallHandler);
    observerInstallHandler = null;
  }

  if (timeoutId) {
    window.clearTimeout(timeoutId);
    timeoutId = 0;
  }

  return true;
}

async function attemptOpen() {
  if (finished || !ticketId || !isBrowser()) return false;
  if (attemptPromise) return attemptPromise;

  attemptPromise = (async () => {
    try {
      const module = await import("../../views/incidencias/index.js");
      const open = module?.openIncidenciaDetailById;
      if (typeof open !== "function") return false;

      const opened = await open(ticketId, null);
      if (!opened) return false;

      modalOpened = true;
      return true;
    } catch {
      return false;
    }
  })().finally(() => {
    attemptPromise = null;
  });

  return attemptPromise;
}

function onMutation() {
  if (finished) return;

  if (!modalOpened) {
    void attemptOpen();
    return;
  }

  if (!modalIsOpen()) {
    cleanUrlAfterClose();
    stop();
  }
}

function installObserver() {
  if (!isBrowser() || !ticketId || finished) return false;
  if (observer) return true;

  const root = viewRoot();
  if (!root) return false;

  observer = new MutationObserver(onMutation);
  observer.observe(root, {
    childList: true,
    subtree: true,
  });

  void attemptOpen();

  timeoutId = window.setTimeout(() => {
    stop();
  }, MAX_WAIT_MS);

  return true;
}

function scheduleObserver() {
  if (!ticketId || !isBrowser()) return false;
  if (installObserver()) return true;

  if (!observerInstallHandler) {
    observerInstallHandler = () => {
      observerInstallHandler = null;
      installObserver();
      void attemptOpen();
    };

    window.addEventListener(
      "onion:main:ready",
      observerInstallHandler,
      { once: true }
    );
  }

  return false;
}

ticketId = resolveAndCanonicalize();
scheduleObserver();

export function destroyTicketDeeplink() {
  if (!isBrowser()) return false;
  return stop();
}

export function getTicketDeeplinkSnapshot() {
  return Object.freeze({
    version: TICKET_DEEPLINK_VERSION,
    active: Boolean(ticketId),
    ticketId: ticketId ? "***" : "",
    source,
    modalOpened,
    modalOpen: isBrowser() ? modalIsOpen() : false,
    finished,
    strategy: "canonical-owner-modal",
  });
}

export default Object.freeze({
  version: TICKET_DEEPLINK_VERSION,
  getSnapshot: getTicketDeeplinkSnapshot,
  destroy: destroyTicketDeeplink,
});
'''
          Path('src/features/ticket-deeplink/index.js').write_text(deeplink)

          # ---------------------------------------------------------
          # 5) Contract: pretty route + canonical owner modal, no click hacks.
          # ---------------------------------------------------------
          contract_path = Path('.github/scripts/entity_overlay_contract.mjs')
          contract = contract_path.read_text()
          if 'resolveRouteLookupPath' not in contract:
              contract = contract.replace(
                  'import path from "node:path";\n',
                  'import path from "node:path";\n\nimport { resolveRouteLookupPath } from "../../src/router/routes.js";\n',
                  1,
              )

          old_asserts = '''assert.match(deeplink, /entityId/);\nassert.match(deeplink, /entity/);\nassert.doesNotMatch(deeplink, /\\.click\\(\\)/);\n'''
          new_asserts = '''assert.match(deeplink, /canonical-owner-modal/);\nassert.match(deeplink, /openIncidenciaDetailById/);\nassert.match(deeplink, /SCOPED_DETAIL_PATTERN/);\nassert.doesNotMatch(deeplink, /\\.click\\(\\)/);\nassert.equal(\n  resolveRouteLookupPath("/@cristian/incidencias/INC-20260827-D03089"),\n  "/incidencias"\n);\nassert.equal(\n  resolveRouteLookupPath("/incidencias/INC-20260827-D03089"),\n  "/incidencias"\n);\nassert.equal(\n  resolveRouteLookupPath("/tickets/INC-20260827-D03089"),\n  "/incidencias"\n);\n'''
          if old_asserts in contract:
              contract = contract.replace(old_asserts, new_asserts, 1)
          elif 'canonical-owner-modal' not in contract:
              raise SystemExit('entity_overlay_contract.mjs: deeplink asserts anchor not found')
          contract = contract.replace(
              '"Entity overlay contract: PASS · lazy adapters · global intents · view-independent deeplinks"',
              '"Entity overlay contract: PASS · lazy overlays · canonical incidencia owner deeplinks"',
          )
          contract_path.write_text(contract)
          PY

      - name: Validate implementation
        shell: bash
        run: |
          node --check src/main.js
          node --check src/router/routes.js
          node --check src/views/incidencias/index.js
          node --check src/features/ticket-deeplink/index.js
          node --experimental-default-type=module .github/scripts/entity_overlay_contract.mjs
          python3 .github/scripts/app_entrypoint_integrity.py
          bash .github/ci/validate_spa_contracts.sh
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "Onion Support CI"
          git config user.email "cristian@onionsupport.com"
          git add src/main.js src/router/routes.js src/views/incidencias/index.js src/features/ticket-deeplink/index.js .github/scripts/entity_overlay_contract.mjs
          git commit -m "feat: canonicalizar deeplinks de incidencias [canonical-incidencia-deeplinks-patched]"
          git push origin HEAD:feat/canonical-incidencia-deeplinks
