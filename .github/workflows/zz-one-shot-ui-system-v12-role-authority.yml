name: One-shot UI System V12 Role Authority

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

env:
  TARGET_BRANCH: refactor/ui-system-v12-role-authority

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/ui-system-v12-role-authority'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Guard trigger
        run: |
          set -euo pipefail
          test -f .github/.ui-system-v12-role-authority-trigger

      - name: Apply UI role authority V12
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_system_v12_role_authority.py

      - name: Validate repository
        run: |
          set -euo pipefail
          python3 .github/scripts/repo_integrity.py
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Validate role authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = (
              'src/views/home/index.js',
              'src/views/server/index.js',
              'src/ui/topbar/index.js',
              'src/ui/sidebar/index.js',
              'src/ui/sidebar/template.js',
              'src/views/incidencias/index.js',
              'src/views/usuarios/index.js',
              'src/views/clientes/index.js',
              'src/views/facturas/index.js',
          )
          canonical = 0
          dead = 0
          for raw in targets:
              text = Path(raw).read_text(encoding='utf-8')
              assert not re.search(r'\bfunction\s+normalizeRole\s*\(', text), raw
              if 'AppCore.normalizeRole(' in text:
                  canonical += 1
              else:
                  dead += 1
                  assert not re.search(r'(?<![\w.])normalizeRole\s*\(', text), raw
          assert canonical == 7, canonical
          assert dead == 2, dead
          print(f'UI canonical role authority OK · canonical={canonical} · dead={dead}')
          PY

      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add src .github/scripts/repo_integrity.py docs/UI_SYSTEM_V12_AUDIT.md
          if git diff --cached --quiet; then
            echo "Sin cambios de migración."
            exit 0
          fi
          git commit -m "refactor(ui): centralizar roles en AppCore"
          git push origin HEAD:${TARGET_BRANCH}
