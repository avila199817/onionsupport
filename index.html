<!DOCTYPE html>
<html lang="es">
<head>
  <!-- =========================
       META BASE
  ========================= -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Onion Support</title>
  <meta
    name="description"
    content="Onion Support · Panel SaaS de soporte, incidencias, facturación y gestión interna."
  >
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0c11">

  <!-- =========================
       BASE (PORTABLE / SPA)
       Usa rutas relativas para que funcione
       mejor en local y en subcarpetas.
  ========================= -->
  <base href="./">

  <!-- =========================
       ICONS
  ========================= -->
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="shortcut icon" href="./favicon.ico">

  <!-- =========================
       PERFORMANCE
  ========================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- =========================
       FONTS
  ========================= -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  >

  <!-- =========================
       CSS ORDER (CRÍTICO)
  ========================= -->

  <!-- TOKENS -->
  <link rel="stylesheet" href="./src/css/tokens/variables.css">
  <link rel="stylesheet" href="./src/css/tokens/light.css">

  <!-- RESET -->
  <link rel="stylesheet" href="./src/css/core/reset.css">

  <!-- CORE -->
  <link rel="stylesheet" href="./src/css/core/layout.css">
  <link rel="stylesheet" href="./src/css/core/core.css">
  <link rel="stylesheet" href="./src/css/core/loader.css">

  <!-- LAYOUT -->
  <link rel="stylesheet" href="./src/css/layout/sidebar.css">
  <link rel="stylesheet" href="./src/css/layout/topbar.css">

  <!-- COMPONENTS -->
  <link rel="stylesheet" href="./src/css/components/ui.css">

  <!-- VIEWS -->
  <link rel="stylesheet" href="./src/css/auth/login.css">

  <!-- =========================
       NOSCRIPT
  ========================= -->
  <noscript>
    <style>
      #app-loader { display: none !important; }
      .layout { visibility: visible !important; opacity: 1 !important; }
      body {
        margin: 0;
        padding: 24px;
        font-family: Inter, system-ui, sans-serif;
        background: #0a0c11;
        color: #fff;
      }
      .noscript-box {
        max-width: 720px;
        margin: 40px auto;
        padding: 20px 24px;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,.08);
        background: rgba(255,255,255,.04);
      }
    </style>

    <div class="noscript-box">
      ⚠️ Esta aplicación requiere JavaScript para funcionar correctamente.
    </div>
  </noscript>
</head>

<body class="loading" data-app="onion" data-theme="dark">
  <!-- =========================
       APP LOADER
  ========================= -->
  <div id="app-loader" aria-hidden="true">
    <div class="loader-center">
      <img
        class="loader-logo loader-dark"
        src="./src/media/img/favicon_white.png"
        alt="Onion Support"
        width="64"
        height="64"
        decoding="async"
      >
      <img
        class="loader-logo loader-light"
        src="./src/media/img/favicon_black.png"
        alt="Onion Support"
        width="64"
        height="64"
        decoding="async"
      >
    </div>
  </div>

  <!-- =========================
       APP LAYOUT
  ========================= -->
  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" aria-label="Barra lateral principal">
      <div class="sidebar-top">
        <!-- LOGO -->
        <a
          href="./"
          data-spa
          class="logo"
          id="homeLink"
          aria-label="Ir al inicio"
        >
          <img
            class="logo-dark"
            draggable="false"
            src="./src/media/img/favicon_white.png"
            alt="Onion Support"
            width="36"
            height="36"
            decoding="async"
          >
          <img
            class="logo-light"
            draggable="false"
            src="./src/media/img/favicon_black.png"
            alt="Onion Support"
            width="36"
            height="36"
            decoding="async"
          >
        </a>

        <!-- BOTÓN SIDEBAR -->
        <button
          type="button"
          class="sidebar-toggle"
          id="toggleSidebar"
          data-tooltip="Cerrar barra lateral"
          aria-label="Cerrar barra lateral"
          aria-controls="sidebar-menu"
          aria-expanded="true"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect
              x="3"
              y="4"
              width="18"
              height="16"
              rx="3"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <path
              d="M9 4v16"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>

      <!-- NAV -->
      <nav class="sidebar-menu" id="sidebar-menu" aria-label="Navegación principal">
        <a href="./incidencias" data-spa class="menu-item" data-tooltip="Incidencias">
          <span aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3
                1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2
                0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0
                1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0A1.7 1.7 0 0 0 10
                3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7
                1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span data-i18n="Incidencias">Incidencias</span>
        </a>

        <a href="./facturas" data-spa class="menu-item" data-tooltip="Facturas">
          <span aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M6 2h9l5 5v15H6z" stroke="currentColor" stroke-width="1.6"/>
              <path d="M14 2v6h6" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </span>
          <span data-i18n="Facturas">Facturas</span>
        </a>

        <a href="./usuarios" data-spa class="menu-item" data-tooltip="Usuarios" data-role="admin">
          <span aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </span>
          <span data-i18n="Usuarios">Usuarios</span>
        </a>

        <a href="./clientes" data-spa class="menu-item" data-tooltip="Clientes" data-role="admin">
          <span aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="6.5" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
              <circle cx="17.5" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
              <path d="M4 20c0-3.5 3.5-5.5 8-5.5s8 2 8 5.5" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </span>
          <span data-i18n="Clientes">Clientes</span>
        </a>

        <a href="./cuenta" data-spa class="menu-item" data-tooltip="Cuenta">
          <span aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M5.5 21a6.5 6.5 0 0 1 13 0" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </span>
          <span data-i18n="Cuenta">Cuenta</span>
        </a>

        <a href="./ajustes" data-spa class="menu-item" data-tooltip="Ajustes">
          <span aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M4 6h10" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="16" cy="6" r="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 12h6" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 18h12" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="18" cy="18" r="2" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </span>
          <span data-i18n="Ajustes">Ajustes</span>
        </a>
      </nav>

      <!-- SECTION -->
      <div class="sidebar-section" aria-label="Recientes">
        <span class="section-title">Recientes</span>
      </div>

      <!-- USER -->
      <div class="sidebar-footer">
        <div
          class="user"
          id="userToggle"
          role="button"
          tabindex="0"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="userDropdown"
        >
          <div class="avatar" id="sidebar-avatar" aria-label="Avatar usuario">ON</div>

          <div class="user-info">
            <span class="name" id="sidebar-name">Usuario</span>
            <span class="plan">Go Plan</span>
          </div>

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </div>

        <!-- DROPDOWN -->
        <div class="user-dropdown" id="userDropdown" role="menu" aria-label="Menú de usuario">
          <div class="dropdown-item" role="menuitem" tabindex="-1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            Añadir cuenta
          </div>

          <div class="dropdown-divider" role="separator"></div>

          <div class="dropdown-item" role="menuitem" tabindex="-1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 4v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M8 8l4-4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5 20h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            Cambiar plan
          </div>

          <div class="dropdown-item" role="menuitem" tabindex="-1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.6" fill="none"/>
            </svg>
            Perfil
          </div>

          <div class="dropdown-item" role="menuitem" tabindex="-1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12h16" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            Configuración
          </div>

          <div class="dropdown-divider" role="separator"></div>

          <div class="dropdown-item" role="menuitem" tabindex="-1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
              <path d="M12 16v-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="12" cy="8" r="1" fill="currentColor"/>
            </svg>
            Ayuda
          </div>

          <div class="dropdown-item" id="logoutBtn" role="menuitem" tabindex="-1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 4h5v16H4z" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            Cerrar sesión
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <main id="app-content" class="main-content" role="main">
      <!-- TOPBAR -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="topbar-title" id="topbar-title">Onion Support</h1>
        </div>

        <div class="topbar-right">
          <div class="topbar-search-wrap">
            <svg class="topbar-search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
              <path d="M20 20l-3-3" stroke="currentColor" stroke-width="2"/>
            </svg>

            <input
              type="search"
              id="topbar-search"
              class="topbar-search"
              placeholder="Buscar..."
              autocomplete="off"
              aria-label="Buscar en la aplicación"
            >

            <div
              id="topbar-search-results"
              class="topbar-search-results"
              hidden
              aria-live="polite"
            ></div>
          </div>
        </div>
      </header>

      <!-- CONTENEDORES DINÁMICOS -->
      <div id="topbarview-container" data-dynamic></div>
      <div id="tablehead-container" data-dynamic></div>

      <!-- VIEW ROOT -->
      <div id="view-container"></div>
    </main>
  </div>

  <!-- =========================
       APP ENTRY
  ========================= -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
