name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: azure-static-web-apps-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_LOCATION: "/"
  API_LOCATION: ""
  OUTPUT_LOCATION: ""
  PRODUCTION_BRANCH: "main"
  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}

jobs:
  build_and_deploy_job:
    name: Deploy Static Web App
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
          fetch-depth: 1

      - name: Validate static app files
        shell: bash
        run: |
          set -euo pipefail

          APP_ROOT="${APP_LOCATION%/}"

          if [ -z "$APP_ROOT" ]; then
            APP_ROOT="."
          fi

          echo "App root: $APP_ROOT"

          if [ ! -f "$APP_ROOT/index.html" ]; then
            echo "::error file=$APP_ROOT/index.html::No se encontró index.html. Azure Static Web Apps necesita un archivo index.html en app_location cuando skip_app_build=true."
            exit 1
          fi

          if [ ! -f "$APP_ROOT/staticwebapp.config.json" ]; then
            echo "::warning file=$APP_ROOT/staticwebapp.config.json::No se encontró staticwebapp.config.json. Para una SPA con rutas internas, conviene añadir navigationFallback."
          fi

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload

          production_branch: ${{ env.PRODUCTION_BRANCH }}

          app_location: ${{ env.APP_LOCATION }}
          api_location: ${{ env.API_LOCATION }}
          output_location: ${{ env.OUTPUT_LOCATION }}

          skip_app_build: true
          skip_api_build: true

  close_pull_request_job:
    name: Close Pull Request Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Close Azure Static Web Apps preview environment
        id: close_preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
