ROUTE_STYLES = (ROOT / "src/router/styles.js").read_text(encoding="utf-8")
errors = []

def require(source, snippet, message):
    if snippet not in source: errors.append(message)

def reject(source, snippet, message):
    if snippet in source: errors.append(message)

require(INDEX, 'correo.view.microsoft.production.v7-extreme', 'Correo must keep the hardened v7 controller')
require(TEMPLATE, 'correo.template.microsoft.production.v7-extreme', 'Correo must keep the hardened v7 template')
