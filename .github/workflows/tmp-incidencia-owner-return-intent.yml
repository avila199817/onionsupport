name: TEMP Incidencia Owner Return Intent

on:
  push:
    branches:
      - fix/incidencia-owner-return-intent

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/incidencia-owner-return-intent
          fetch-depth: 0
      - name: Guard
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[incidencia-return-intent-done\]'; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Patch
        if: steps.guard.outputs.skip != 'true'
        run: python3 .github/tmp/fix_incidencia_owner_return_intent.py
      - name: Validate
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          node --check src/features/entity-overlay/index.js
          node --experimental-default-type=module .github/scripts/entity_overlay_contract.mjs
          bash .github/ci/validate_spa_contracts.sh
          git diff --check
      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "Onion Support CI"
          git config user.email "cristian@onionsupport.com"
          git add src/features/entity-overlay/index.js .github/scripts/entity_overlay_contract.mjs
          git commit -m "fix: respetar navegación explícita al cerrar incidencia [incidencia-return-intent-done]"
          git push origin HEAD:fix/incidencia-owner-return-intent
