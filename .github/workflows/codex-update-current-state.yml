name: Codex Update Current State

on:
  push:
    branches:
      - codex/update-current-state-2026-09-06

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  update-state:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Update canonical project state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          project = "docs/PROJECT_CONTEXT.md"

          replace_once(
              project,
              "La última versión funcional desplegada y verificada al abrir este bloque es [`b3662615743e542c1467102a6fc706d2b310a3d6`](https://github.com/avila199817/onionsupport/commit/b3662615743e542c1467102a6fc706d2b310a3d6). Los commits posteriores que sólo actualicen documentación deben distinguirse de esta referencia de runtime.",
              "La última versión funcional desplegada y verificada es [`1f220dc51d53a50212ef1b415707388fa030abf7`](https://github.com/avila199817/onionsupport/commit/1f220dc51d53a50212ef1b415707388fa030abf7), cierre de [PR #525](https://github.com/avila199817/onionsupport/pull/525). El corte backend coordinado para identidad es [`d5ccad6b1debd99391a0c0dcacdc617f92ec14c8`](https://github.com/avila199817/oniontech/commit/d5ccad6b1debd99391a0c0dcacdc617f92ec14c8), integrado mediante [oniontech #496](https://github.com/avila199817/oniontech/pull/496). Los commits posteriores que sólo actualicen documentación deben distinguirse de estas referencias de runtime.",
          )

          replace_once(
              project,
              "| Identidad visual estable por userId | Implementado en este bloque; release acreditada por el workflow de su commit | AvatarSystem prioriza userId; se migran primera pintura de detalle, comentarios, seguimiento, perfil técnico y caché de soporte. Los contratos cubren cambios de correo, alias vacíos, IDs conflictivos y transporte del ID original a la API. |",
              "| Identidad visual estable por userId | Desplegada y verificada en producción | [Frontend #524](https://github.com/avila199817/onionsupport/pull/524) y [backend #496](https://github.com/avila199817/oniontech/pull/496). AvatarSystem prioriza userId; se migraron primera pintura de detalle, comentarios, seguimiento, perfil técnico y caché de soporte. Los contratos cubren cambios de correo, alias vacíos, IDs conflictivos y transporte del ID original a la API. |\n| Fachadas legacy de Clientes | Retiradas, desplegadas y verificadas | [Frontend #525](https://github.com/avila199817/onionsupport/pull/525) eliminó `clientes.index.legacy.js`, `clientes.template.legacy.js` y `clientes.api.legacy.js`. `index.js` abre directamente `clientes.create-controller.js`, conserva el refresco tras crear y el contrato impide reintroducir esas rutas. |",
          )

          marker = "La publicación de `b3662615` tiene evidencias separadas:"
          latest_evidence = """La publicación de `1f220dc5` tiene evidencias separadas:\n\n- [Repository Integrity, run 34022425774](https://github.com/avila199817/onionsupport/actions/runs/34022425774): contratos, sintaxis, higiene, SPA crítica y contrato de Clientes correctos.\n- [Azure Static Web Apps, run 34022425762](https://github.com/avila199817/onionsupport/actions/runs/34022425762): artefacto exacto validado y despliegue de producción correcto; después se verificaron canonicalización, bytes, seguridad, routing y backend.\n- [Production Verification, run 34022531542](https://github.com/avila199817/onionsupport/actions/runs/34022531542): rebuild reproducible, bytes canónicos, seguridad/routing/backend y Google Measurement correctos contra el SHA desplegado.\n- [Disponibilidad, run 34022531443](https://github.com/avila199817/onionsupport/actions/runs/34022531443): monitor y tres rondas sobre HTML/grafo crítico correctos, sin incidente persistente.\n- [Lighthouse, run 34022531451](https://github.com/avila199817/onionsupport/actions/runs/34022531451): móvil y escritorio completaron cinco muestras por superficie; `/login` mantuvo `noindex, follow`. Los avisos móviles permanecen documentados abajo.\n- [IndexNow, run 34022531455](https://github.com/avila199817/onionsupport/actions/runs/34022531455): clave y payload validados y URLs enviadas correctamente.\n\n"""
          replace_once(project, marker, latest_evidence + marker)

          replace_once(
              project,
              "En la revisión más reciente `b3662615`, Lighthouse midió rendimiento móvil de portada **83** y TBT mediano **518 ms**; acceso tuvo LCP mediano **2.525 ms**. Las medianas de rendimiento de escritorio fueron 99/99/100 para portada/acceso/servicio. Frente al monitor anterior, portada móvil pasó de 86 a 83 y TBT de 205 a 518 ms. Son observaciones sintéticas y no demuestran causalidad de AvatarSystem. Estos avisos siguen abiertos sin rebajar presupuestos.",
              "En la revisión desplegada `1f220dc5`, el [run Lighthouse 34022531451](https://github.com/avila199817/onionsupport/actions/runs/34022531451) midió en móvil una mediana de rendimiento de portada **85**, CLS **0,000** y TBT **474 ms** frente al presupuesto de 300 ms; `/login` obtuvo rendimiento **97** y LCP mediano **2.520 ms** frente a 2.500 ms. `reparacion-ordenadores` obtuvo rendimiento móvil **100**. En escritorio las medianas de rendimiento fueron **99/99/100** para portada/acceso/servicio, con TBT mediano de portada de **23 ms**. Son observaciones sintéticas y no demuestran causalidad de AvatarSystem ni de la retirada de fachadas; los avisos móviles siguen abiertos sin rebajar presupuestos.",
          )

          roadmap = "docs/ROADMAP.md"

          replace_once(
              roadmap,
              "La base funcional desplegada y verificada al iniciar el bloque de identidad estable es\n[b3662615](https://github.com/avila199817/onionsupport/commit/b3662615743e542c1467102a6fc706d2b310a3d6), con evidencias de publicación en [PROJECT_CONTEXT.md](PROJECT_CONTEXT.md).",
              "La base funcional desplegada y verificada para iniciar F1 es\n[1f220dc5](https://github.com/avila199817/onionsupport/commit/1f220dc51d53a50212ef1b415707388fa030abf7), con evidencias de publicación en [PROJECT_CONTEXT.md](PROJECT_CONTEXT.md). El backend coordinado de identidad está en\n[d5ccad6b](https://github.com/avila199817/oniontech/commit/d5ccad6b1debd99391a0c0dcacdc617f92ec14c8).",
          )

          replace_once(
              roadmap,
              "El bloque de identidad establece userId como semilla visual estable y una selección\ncanónica del avatar del perfil en backend. Se migran consumidores, proyecciones y\ncachés de contenido; se retiran selectores duplicados y el puente de avatar técnico. El borrado de una foto actual\ndebe prevalecer frente a alias o snapshots antiguos. Los contratos y fixtures comprueban\ncambio de correo, perfil sin foto, IDs de cliente/usuario distintos y aislamiento\nentre identidades. No completa por sí solo F1.",
              "El bloque de identidad quedó cerrado mediante [frontend #524](https://github.com/avila199817/onionsupport/pull/524) y [backend #496](https://github.com/avila199817/oniontech/pull/496): userId es la semilla visual estable, la selección de avatar de perfil es canónica y se migraron consumidores, proyecciones y cachés de contenido. Se retiraron selectores duplicados y el puente de avatar técnico; un borrado actual prevalece frente a alias o snapshots antiguos. Los contratos cubren cambio de correo, perfil sin foto, IDs de cliente/usuario distintos y aislamiento entre identidades. Este cierre no sustituye la prueba autenticada F1.",
          )

          replace_once(
              roadmap,
              "Repetir la medición en CI con el mismo SHA y condiciones antes de optimizar. El corte\nactual dejó portada Lighthouse en **87 móvil / 100 escritorio**, CLS móvil **0,000**,\nTBT móvil **404 ms frente a 300 ms** y LCP del acceso **2.573 ms frente a 2.500 ms**.\nSon muestras sintéticas, no telemetría de usuarios.",
              "Repetir la medición en CI con el mismo SHA y condiciones antes de optimizar. En el corte\n`1f220dc5`, la portada obtuvo mediana Lighthouse **85 móvil / 99 escritorio**, CLS móvil **0,000**,\nTBT móvil **474 ms frente a 300 ms** y `/login` LCP móvil **2.520 ms frente a 2.500 ms**.\nEl servicio auditado obtuvo **100** de rendimiento en móvil y escritorio. Son muestras sintéticas, no telemetría de usuarios.",
          )
          PY

      - name: Retire helper workflow from candidate tree
        run: git rm -f .github/workflows/codex-update-current-state.yml

      - name: Install dependencies
        run: npm ci

      - name: Validate source contracts
        run: npm run validate:source

      - name: Commit canonical state update
        shell: bash
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes generated"; exit 1; }
          git commit -m "docs: actualizar corte canónico tras consolidación"
          git push origin HEAD:codex/update-current-state-2026-09-06
