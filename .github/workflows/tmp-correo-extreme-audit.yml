name: TEMP Correo extreme patch

on:
  push:
    branches:
      - polish/correo-extreme-v7

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, 'bootstrap Correo extreme patch runner') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: polish/correo-extreme-v7
          fetch-depth: 0

      - name: Decode and apply patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/correo_patch.py
          python3 /tmp/correo_patch.py
          rm src/css/views/correo/viewport.css

      - name: Validate product patch
        shell: bash
        run: |
          set -euo pipefail
          node --check src/views/correo/index.js
          node --check src/views/correo/correo.template.js
          node --check src/views/correo/correo.api.js
          python3 .github/scripts/correo_integrity.py
          python3 .github/scripts/repo_integrity.py
          python3 .github/scripts/private_admin_alignment_contract.py
          bash .github/ci/validate_spa_contracts.sh
          node .github/scripts/continuous_scroll_smoke.mjs
          git diff --check

      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add src/views/correo/index.js src/views/correo/correo.template.js src/css/views/correo/index.css src/css/views/correo/viewport.css src/router/styles.js .github/scripts/correo_integrity.py .github/workflows/repo-integrity.yml
          git commit -m "feat: rematar Correo a contrato extremo"
          git push origin HEAD:polish/correo-extreme-v7
