name: WhatsApp route bootstrap

on:
  push:
    branches:
      - feat/whatsapp-route-ready

permissions:
  contents: write

jobs:
  prepare-route:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use exact Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Patch canonical WhatsApp route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Core route authority: /whatsapp is a real private admin route.
          replace_once(
              "src/core/config.js",
              '  empleados: "/empleados",\n  correo: "/correo",',
              '  empleados: "/empleados",\n  whatsapp: "/whatsapp",\n  correo: "/correo",',
          )
          replace_once(
              "src/core/config.js",
              '  ROUTES.empleados,\n  ROUTES.correo,',
              '  ROUTES.empleados,\n  ROUTES.whatsapp,\n  ROUTES.correo,',
          )

          # Router: canonical path/name + lazy loader + admin-only route.
          replace_once(
              "src/router/routes.js",
              '  EMPLEADOS:\n    ROUTES.empleados ||\n    "/empleados",\n\n  CORREO:',
              '  EMPLEADOS:\n    ROUTES.empleados ||\n    "/empleados",\n\n  WHATSAPP:\n    ROUTES.whatsapp ||\n    "/whatsapp",\n\n  CORREO:',
          )
          replace_once(
              "src/router/routes.js",
              '  EMPLEADOS: "empleados",\n  CORREO: "correo",',
              '  EMPLEADOS: "empleados",\n  WHATSAPP: "whatsapp",\n  CORREO: "correo",',
          )
          replace_once(
              "src/router/routes.js",
              '  correo: Object.freeze({\n    moduleKey: "correo",',
              '  whatsapp: Object.freeze({\n    moduleKey: "whatsapp",\n    loadModule: () =>\n      import(\n        "../views/whatsapp/index.js"\n      ),\n    names: Object.freeze([\n      "WhatsAppView",\n    ]),\n  }),\n\n  correo: Object.freeze({\n    moduleKey: "correo",',
          )
          replace_once(
              "src/router/routes.js",
              '  createRoute({\n    path: ROUTE_PATHS.CORREO,',
              '  createRoute({\n    path: ROUTE_PATHS.WHATSAPP,\n    name: ROUTE_NAMES.WHATSAPP,\n    title: "WhatsApp",\n    viewKey: "whatsapp",\n    adminOnly: true,\n    order: 54,\n  }),\n\n  createRoute({\n    path: ROUTE_PATHS.CORREO,',
          )

          # Route CSS manifest: every real view keeps the same loader contract.
          replace_once(
              "src/router/styles.js",
              '  correo: Object.freeze([\n    "/src/css/views/correo/index.css",\n  ]),',
              '  whatsapp: Object.freeze([\n    "/src/css/views/whatsapp/index.css",\n  ]),\n\n  correo: Object.freeze([\n    "/src/css/views/correo/index.css",\n  ]),',
          )

          # Sidebar: consume the core route when available and preserve the icon fallback.
          replace_once(
              "src/ui/sidebar/index.js",
              'const WHATSAPP_SIDEBAR_PATH =\n  "/whatsapp";',
              'const WHATSAPP_SIDEBAR_PATH =\n  ROUTES.whatsapp ||\n  "/whatsapp";',
          )
          replace_once(
              "src/ui/sidebar/index.js",
              '  if (\n    clean ===\n    ROUTES.empleados\n  ) {\n    return "empleados";\n  }',
              '  if (\n    clean ===\n    ROUTES.whatsapp\n  ) {\n    return "whatsapp";\n  }\n\n  if (\n    clean ===\n    ROUTES.empleados\n  ) {\n    return "empleados";\n  }',
          )

          # Minimal routed surface only. No inbox, no API calls, no provider logic yet.
          view = r'''/* =========================================================
             Onion Support - WhatsApp
             Archivo: /src/views/whatsapp/index.js

             ROUTED PLACEHOLDER · ADMIN ONLY · NO DATA PLANE

             Responsabilidad actual:
             - Dar destino real y estable a /whatsapp.
             - Mantener el shell SPA, Router y Sidebar canónicos.
             - Reservar una superficie accesible para la futura bandeja.
             - NO llamar todavía al backend ni a Meta.
             - NO mantener estado de conversaciones.
             - NO crear listeners globales, timers, storage ni sockets.
          ========================================================= */

          "use strict";

          export const WHATSAPP_VIEW_VERSION =
            "whatsapp.view.v1-routed-placeholder";

          export const WHATSAPP_VIEW_NAME =
            "WhatsAppView";

          export const WHATSAPP_CANONICAL_PATH =
            "/whatsapp";

          function isBrowser() {
            return (
              typeof window !== "undefined" &&
              typeof document !== "undefined"
            );
          }

          function create(tag, options = {}) {
            const node = document.createElement(tag);

            if (options.className) {
              node.className = options.className;
            }

            if (options.text) {
              node.textContent = String(options.text);
            }

            for (const [name, value] of Object.entries(options.attrs || {})) {
              if (value === null || value === undefined || value === false) continue;
              node.setAttribute(name, value === true ? "true" : String(value));
            }

            return node;
          }

          export function WhatsAppView(host = null) {
            if (
              !isBrowser() ||
              !host ||
              host.nodeType !== 1 ||
              typeof host.replaceChildren !== "function"
            ) {
              return null;
            }

            const titleId = "whatsapp-prepared-title";

            const root = create("section", {
              className: "whatsapp-page",
              attrs: {
                "data-view": "whatsapp",
                "data-whatsapp-phase": "prepared",
                "aria-labelledby": titleId,
              },
            });

            const card = create("div", {
              className: "whatsapp-prepared",
              attrs: {
                "data-whatsapp-prepared": "true",
              },
            });

            const badge = create("span", {
              className: "whatsapp-prepared-badge",
              text: "Canal preparado",
            });

            const title = create("h1", {
              className: "whatsapp-prepared-title",
              text: "WhatsApp",
              attrs: {
                id: titleId,
              },
            });

            const copy = create("p", {
              className: "whatsapp-prepared-copy",
              text: "La ruta ya está conectada al sistema central. La bandeja de conversaciones se construirá en el siguiente paso.",
            });

            card.append(badge, title, copy);
            root.append(card);
            host.replaceChildren(root);

            let destroyed = false;

            const destroy = () => {
              if (destroyed) return false;
              destroyed = true;

              if (root.parentNode === host) {
                root.remove();
              }

              return true;
            };

            return Object.freeze({
              version: WHATSAPP_VIEW_VERSION,
              path: WHATSAPP_CANONICAL_PATH,
              prepared: true,
              destroy,
              cleanup: destroy,
              unmount: destroy,
            });
          }

          export default WhatsAppView;
          '''

          css = r'''/* =========================================================
             ONION SUPPORT — WHATSAPP ROUTED PLACEHOLDER
             Superficie mínima. La futura bandeja sustituirá este bloque.
          ========================================================= */

          .whatsapp-page {
            min-block-size: 100%;
            display: grid;
            place-items: center;
            padding: clamp(24px, 5vw, 64px);
          }

          .whatsapp-prepared {
            inline-size: min(100%, 680px);
            padding: clamp(24px, 4vw, 42px);
            border: 1px solid var(--border, rgba(255, 255, 255, .10));
            border-radius: 18px;
            background: var(--surface-raised, var(--card-bg, rgba(255, 255, 255, .035)));
            box-shadow: var(--shadow-sm, 0 16px 40px rgba(0, 0, 0, .12));
          }

          .whatsapp-prepared-badge {
            display: inline-flex;
            align-items: center;
            min-block-size: 28px;
            padding-inline: 10px;
            border: 1px solid var(--border, rgba(255, 255, 255, .10));
            border-radius: 999px;
            color: var(--text-muted, #a7a7a7);
            font-size: 12px;
            font-weight: 700;
          }

          .whatsapp-prepared-title {
            margin: 18px 0 8px;
            color: var(--text-strong, #f7f7f7);
            font-size: clamp(28px, 4vw, 40px);
            line-height: 1.05;
            letter-spacing: -.03em;
          }

          .whatsapp-prepared-copy {
            max-inline-size: 58ch;
            margin: 0;
            color: var(--text-muted, #a7a7a7);
            font-size: 15px;
            line-height: 1.6;
          }

          @media (forced-colors: active) {
            .whatsapp-prepared,
            .whatsapp-prepared-badge {
              border-color: CanvasText;
            }
          }
          '''

          Path("src/views/whatsapp").mkdir(parents=True, exist_ok=True)
          Path("src/css/views/whatsapp").mkdir(parents=True, exist_ok=True)
          Path("src/views/whatsapp/index.js").write_text(view, encoding="utf-8")
          Path("src/css/views/whatsapp/index.css").write_text(css, encoding="utf-8")

          contract = r'''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          const [config, routes, styles, sidebar, view, css] = await Promise.all([
            readFile("src/core/config.js", "utf8"),
            readFile("src/router/routes.js", "utf8"),
            readFile("src/router/styles.js", "utf8"),
            readFile("src/ui/sidebar/index.js", "utf8"),
            readFile("src/views/whatsapp/index.js", "utf8"),
            readFile("src/css/views/whatsapp/index.css", "utf8"),
          ]);

          assert.match(config, /whatsapp:\s*"\/whatsapp"/);
          assert.match(config, /ADMIN_ROUTES[\s\S]*ROUTES\.whatsapp/);

          assert.match(routes, /WHATSAPP:\s*\n\s*ROUTES\.whatsapp\s*\|\|\s*\n\s*"\/whatsapp"/);
          assert.match(routes, /WHATSAPP:\s*"whatsapp"/);
          assert.match(routes, /whatsapp:\s*Object\.freeze\(\{[\s\S]*?\.\.\/views\/whatsapp\/index\.js[\s\S]*?WhatsAppView/);
          assert.match(routes, /path:\s*ROUTE_PATHS\.WHATSAPP,[\s\S]*?name:\s*ROUTE_NAMES\.WHATSAPP,[\s\S]*?title:\s*"WhatsApp",[\s\S]*?viewKey:\s*"whatsapp",[\s\S]*?adminOnly:\s*true,[\s\S]*?order:\s*54/);

          const whatsappRouteIndex = routes.indexOf("path: ROUTE_PATHS.WHATSAPP");
          const correoRouteIndex = routes.indexOf("path: ROUTE_PATHS.CORREO");
          assert.ok(whatsappRouteIndex >= 0 && correoRouteIndex > whatsappRouteIndex, "WhatsApp must remain immediately ahead of Correo in route order");

          assert.match(styles, /whatsapp:\s*Object\.freeze\(\[\s*"\/src\/css\/views\/whatsapp\/index\.css"/);
          assert.match(sidebar, /const WHATSAPP_SIDEBAR_PATH =\s*ROUTES\.whatsapp\s*\|\|\s*"\/whatsapp"/);
          assert.match(sidebar, /clean ===\s*ROUTES\.whatsapp[\s\S]*?return "whatsapp"/);
          assert.match(sidebar, /!seen\.has\([\s\S]*?WHATSAPP_SIDEBAR_PATH/);

          assert.match(view, /export function WhatsAppView\(host = null\)/);
          assert.match(view, /data-whatsapp-phase/);
          assert.match(view, /"prepared"/);
          assert.match(view, /host\.replaceChildren\(root\)/);
          assert.doesNotMatch(view, /\bfetch\s*\(/);
          assert.doesNotMatch(view, /\bHttp\s*\./);
          assert.doesNotMatch(view, /\/api\/whatsapp/);
          assert.doesNotMatch(view, /localStorage|sessionStorage|WebSocket|EventSource/);

          assert.match(css, /\.whatsapp-page/);
          assert.match(css, /\.whatsapp-prepared/);

          console.log("WhatsApp route contract: PASS · routed admin placeholder · no data plane");
          '''

          Path(".github/scripts/whatsapp_route_contract.mjs").write_text(contract, encoding="utf-8")

          replace_once(
              "package.json",
              'node .github/scripts/usuarios_session_order_contract.mjs && python3 .github/scripts/repo_integrity.py',
              'node .github/scripts/usuarios_session_order_contract.mjs && node .github/scripts/whatsapp_route_contract.mjs && python3 .github/scripts/repo_integrity.py',
          )

          # Remove this one-shot workflow before validating/committing so the final PR has no bootstrap machinery.
          Path(".github/workflows/whatsapp-route-bootstrap.yml").unlink()
          PY

      - name: Validate prepared route
        shell: bash
        run: |
          set -euo pipefail
          node --check src/views/whatsapp/index.js
          node --check .github/scripts/whatsapp_route_contract.mjs
          node .github/scripts/whatsapp_route_contract.mjs
          python3 .github/scripts/repo_integrity.py

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          npm ci --ignore-scripts

      - name: Validate source contracts
        shell: bash
        env:
          PUBLIC_SITE_URL: https://onionsupport.com
          DIRECT_API_URL: https://api.onionsupport.com
        run: |
          set -euo pipefail
          npm run validate:source

      - name: Commit prepared route
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Onion Support Automation"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(whatsapp): connect prepared admin route"
          git push origin HEAD:feat/whatsapp-route-ready
