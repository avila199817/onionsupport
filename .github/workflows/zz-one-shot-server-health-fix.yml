name: One-shot server health transport fix

on:
  push:
    branches:
      - fix/server-health-direct-backend

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply exact transport patch
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> bool:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 0 and new in text:
                  return False
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              return True

          changed = False

          config = Path("src/core/config.js")
          changed |= replace_once(
              config,
              'export const CONFIG_VERSION = "core.config.production.v5-route-contract";',
              'export const CONFIG_VERSION = "core.config.production.v6-split-origin-health";',
          )
          changed |= replace_once(
              config,
              '''export const CANONICAL_PRODUCTION_API_BASE = "https://www.onionsupport.com";\n\nexport const CANONICAL_BACKEND_API_ORIGINS = Object.freeze([\n  CANONICAL_PRODUCTION_API_BASE,\n  "https://api.onionit.net",\n]);''',
              '''export const CANONICAL_PRODUCTION_API_BASE = "https://www.onionsupport.com";\n\nexport const CANONICAL_DIRECT_BACKEND_API_BASE = "https://api.onionit.net";\n\nexport const CANONICAL_BACKEND_API_ORIGINS = Object.freeze([\n  CANONICAL_PRODUCTION_API_BASE,\n  CANONICAL_DIRECT_BACKEND_API_BASE,\n]);\n\n/*\n  Azure Static Web Apps sólo enruta el backend enlazado bajo /api.\n  Los health del App Service viven en /health, así que deben salir\n  directamente al origen canónico del backend.\n*/\nexport const DIRECT_BACKEND_API_PREFIXES = Object.freeze([\n  "/health",\n]);''',
          )

          http = Path("src/core/http.js")
          changed |= replace_once(
              http,
              'export const HTTP_VERSION =\n  "core.http.refresh.blob.v6-hardened";',
              'export const HTTP_VERSION =\n  "core.http.refresh.blob.v7-split-origin-health";',
          )
          changed |= replace_once(
              http,
              '''  SENSITIVE_QUERY_PARAMS,\n  getApiBase,''',
              '''  SENSITIVE_QUERY_PARAMS,\n  CANONICAL_DIRECT_BACKEND_API_BASE,\n  DIRECT_BACKEND_API_PREFIXES,\n  getApiBase,''',
          )
          changed |= replace_once(
              http,
              '''function getApiOrigin() {\n  return (\n    DEFAULT_API_BASE ||\n    getApiBase()\n  );\n}\n\nfunction endpointToPath(''',
              '''function getApiOrigin() {\n  return (\n    DEFAULT_API_BASE ||\n    getApiBase()\n  );\n}\n\nfunction shouldUseDirectBackendOrigin(\n  path = ""\n) {\n  const normalized =\n    normalizeEndpointPath(\n      path\n    );\n\n  if (!normalized) {\n    return false;\n  }\n\n  return DIRECT_BACKEND_API_PREFIXES\n    .some((prefix) => {\n      const target =\n        normalizeEndpointPath(\n          prefix\n        );\n\n      return Boolean(\n        target &&\n        (\n          normalized === target ||\n          normalized.startsWith(\n            `${target}/`\n          )\n        )\n      );\n    });\n}\n\nfunction endpointToPath(''',
          )
          changed |= replace_once(
              http,
              '''  const base =\n    getApiOrigin()\n      .replace(\n        /\\/+$/g,\n        ""\n      );''',
              '''  const base =\n    (\n      shouldUseDirectBackendOrigin(\n        path\n      )\n        ? CANONICAL_DIRECT_BACKEND_API_BASE\n        : getApiOrigin()\n    )\n      .replace(\n        /\\/+$/g,\n        ""\n      );''',
          )

          integrity = Path(".github/scripts/repo_integrity.py")
          changed |= replace_once(
              integrity,
              '''def validate_css_references(errors: list[str]) -> None:\n''',
              '''def validate_api_transport_contract(errors: list[str]) -> None:\n    """Keep same-origin /api traffic and direct /health traffic explicit.\n\n    Azure Static Web Apps proxies the linked backend only under /api. Root-level\n    /health endpoints otherwise fall through to the SPA and return index.html.\n    """\n\n    config_text = (SRC / "core" / "config.js").read_text(encoding="utf-8")\n    http_text = (SRC / "core" / "http.js").read_text(encoding="utf-8")\n\n    required_config = (\n        'CANONICAL_PRODUCTION_API_BASE = "https://www.onionsupport.com"',\n        'CANONICAL_DIRECT_BACKEND_API_BASE = "https://api.onionit.net"',\n        'DIRECT_BACKEND_API_PREFIXES = Object.freeze([',\n        '"/health"',\n    )\n\n    for snippet in required_config:\n        if snippet not in config_text:\n            errors.append(\n                f"src/core/config.js :: falta contrato de transporte API: {snippet}"\n            )\n\n    required_http = (\n        "CANONICAL_DIRECT_BACKEND_API_BASE",\n        "DIRECT_BACKEND_API_PREFIXES",\n        "shouldUseDirectBackendOrigin",\n    )\n\n    for snippet in required_http:\n        if snippet not in http_text:\n            errors.append(\n                f"src/core/http.js :: falta routing directo de health: {snippet}"\n            )\n\n\ndef validate_css_references(errors: list[str]) -> None:\n''',
          )
          changed |= replace_once(
              integrity,
              '''    validate_private_route_contract(errors)\n    validate_css_references(errors)''',
              '''    validate_private_route_contract(errors)\n    validate_api_transport_contract(errors)\n    validate_css_references(errors)''',
          )

          docs = Path("docs/PROJECT_CONTEXT.md")
          changed |= replace_once(
              docs,
              '''- Frontend canónico: `https://www.onionsupport.com`\n- API canónica: `https://api.onionit.net`''',
              '''- Frontend canónico: `https://www.onionsupport.com`\n- API canónica: `https://api.onionit.net`\n- Transporte browser: `/api/*` permanece same-origin mediante Azure Static Web Apps; `/health/*` sale directo a `https://api.onionit.net` porque los health del App Service viven fuera del prefijo `/api`.''',
          )

          if not changed:
              print("Patch already applied; nothing to commit.")
          else:
              print("Patch applied successfully.")
          PY

          python3 .github/scripts/repo_integrity.py

          for file in src/core/config.js src/core/http.js; do
            node --check "$file"
          done

      - name: Commit patch if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- src/core/config.js src/core/http.js .github/scripts/repo_integrity.py docs/PROJECT_CONTEXT.md; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/config.js src/core/http.js .github/scripts/repo_integrity.py docs/PROJECT_CONTEXT.md
          git commit -m "fix(server): enrutar health al backend directo"
          git push origin HEAD:fix/server-health-direct-backend
