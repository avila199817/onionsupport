name: Servidor navigation latency bootstrap v2

on:
  push:
    branches:
      - fix/servidor-route-lag

permissions:
  contents: write

jobs:
  prepare-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use exact Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Patch Servidor navigation lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex anchor, found {count}: {pattern}")
              p.write_text(next_text, encoding="utf-8")

          index_path = "src/views/server/index.js"

          # Controller owns the current observability request.
          replace_once(
              index_path,
              "    loadSequence: 0,\n    loadTask: null,\n\n    clickHandler: null,",
              "    loadSequence: 0,\n    loadTask: null,\n    loadAbortController: null,\n\n    clickHandler: null,",
          )

          abort_helpers = r'''  function abortLoad(
            reason = "server-load-aborted"
          ) {
            const requestController =
              state.loadAbortController;

            state.loadAbortController =
              null;

            if (!requestController) {
              return false;
            }

            try {
              if (
                requestController.signal
                  ?.aborted !== true
              ) {
                requestController.abort(
                  reason
                );
              }
            } catch {
              try {
                requestController.abort();
              } catch {
                // noop
              }
            }

            return true;
          }

          function createLoadSignal() {
            abortLoad(
              "server-load-replaced"
            );

            if (
              typeof AbortController ===
              "undefined"
            ) {
              return null;
            }

            const requestController =
              new AbortController();

            state.loadAbortController =
              requestController;

            return requestController.signal;
          }

'''

          replace_once(
              index_path,
              "  async function load({\n",
              abort_helpers + "  async function load({\n",
          )

          # Avoid a second full DOM reconstruction during route entry.
          replace_once(
              index_path,
              '''  async function load({
            silent = false,
            force = false,
          } = {}) {''',
              '''  async function load({
            silent = false,
            force = false,
            paintPending = true,
          } = {}) {''',
          )

          replace_once(
              index_path,
              '''    const hadSnapshot =
              Boolean(
                state.snapshot
                  ?.checkedAt
              );

            state.error = "";''',
              '''    const hadSnapshot =
              Boolean(
                state.snapshot
                  ?.checkedAt
              );

            const requestSignal =
              createLoadSignal();

            state.error = "";''',
          )

          replace_once(
              index_path,
              '''    paint({
              mode:
                state.loading
                  ? "loading"
                  : "auto",
            });''',
              '''    if (paintPending) {
              paint({
                mode:
                  state.loading
                    ? "loading"
                    : "auto",
              });
            }''',
          )

          # Forward controller-owned cancellation into both dashboard sources.
          regex_once(
              index_path,
              r'''(?P<prefix>\s*const snapshot =\n\s*force\n\s*\? await refreshServerSnapshotApi\(\{\n\s*source:\n\s*`\$\{SERVIDOR_INDEX_SOURCE\}\.refresh`,)(?P<mid>\n\s*\}\)\n\s*: await loadServerSnapshotApi\(\{\n\s*source:\n\s*`\$\{SERVIDOR_INDEX_SOURCE\}\.load`,)(?P<end>\n\s*\}\);)''',
              r'''\g<prefix>
                signal:
                  requestSignal,\g<mid>
                signal:
                  requestSignal,\g<end>''',
          )

          replace_once(
              index_path,
              '''        if (
                  state.loadTask ===
                  task
                ) {
                  state.loadTask =
                    null;
                }''',
              '''        if (
                  state.loadAbortController
                    ?.signal ===
                  requestSignal
                ) {
                  state.loadAbortController =
                    null;
                }

                if (
                  state.loadTask ===
                  task
                ) {
                  state.loadTask =
                    null;
                }''',
          )

          # Main fix: mount paints cache/loading synchronously, then returns the
          # real controller immediately. Router atomic commit is no longer gated
          # by /health/internal + /health/costs.
          replace_once(
              index_path,
              '''    await load({
              force: false,
              silent:
                Boolean(
                  cached
                ),
            });

            return getSnapshot();''',
              '''    void load({
              force: false,
              silent:
                Boolean(
                  cached
                ),
              paintPending: false,
            });

            return controller;''',
          )

          replace_once(
              index_path,
              '''    state.loadSequence += 1;

            stopLive({''',
              '''    state.loadSequence += 1;

            abortLoad(
              "server-view-destroyed"
            );

            stopLive({''',
          )

          # Core HTTP already supports AbortSignal; the Server boundary was
          # dropping it. Preserve it for both GET and request fallbacks.
          base_path = Path("src/views/server/server.api.base.js")
          base = base_path.read_text(encoding="utf-8")
          source_anchor = '''          source:
                    cleanText(
                      options.source,
                      "views.server.api"
                    ),'''
          count = base.count(source_anchor)
          if count != 2:
              raise SystemExit(f"server.api.base.js: expected 2 source anchors, found {count}")
          base = base.replace(
              source_anchor,
              source_anchor + '''

                  signal:
                    options.signal ||
                    null,'''
          )
          base_path.write_text(base, encoding="utf-8")

          cost_path = Path("src/views/server/server.api.js")
          cost = cost_path.read_text(encoding="utf-8")
          cost_anchor = '      source: safeText(options.source, "views.server.api.costs"),'
          count = cost.count(cost_anchor)
          if count != 2:
              raise SystemExit(f"server.api.js: expected 2 cost source anchors, found {count}")
          cost = cost.replace(
              cost_anchor,
              cost_anchor + '\n      signal: options.signal || null,'
          )
          cost_path.write_text(cost, encoding="utf-8")

          contract = r'''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          const [index, apiBase, api] = await Promise.all([
            readFile("src/views/server/index.js", "utf8"),
            readFile("src/views/server/server.api.base.js", "utf8"),
            readFile("src/views/server/server.api.js", "utf8"),
          ]);

          const mountStart = index.indexOf("  async function mount(");
          const destroyStart = index.indexOf("  async function destroy(");
          assert.ok(mountStart >= 0 && destroyStart > mountStart, "Servidor mount/destroy boundaries must exist");
          const mount = index.slice(mountStart, destroyStart);

          assert.match(mount, /void load\(\{/);
          assert.match(mount, /paintPending:\s*false/);
          assert.match(mount, /return controller;/);
          assert.doesNotMatch(mount, /await load\(\{/);

          assert.match(index, /loadAbortController:\s*null/);
          assert.match(index, /function abortLoad\(/);
          assert.match(index, /server-view-destroyed/);
          assert.match(index, /signal:\s*requestSignal/);

          const baseSignalCount = (apiBase.match(/signal:\s*\n\s*options\.signal\s*\|\|\s*\n\s*null/g) || []).length;
          assert.equal(baseSignalCount, 2, "Health GET/request must both forward the abort signal");

          const costSignalCount = (api.match(/signal:\s*options\.signal\s*\|\|\s*null/g) || []).length;
          assert.equal(costSignalCount, 2, "Cost GET/request must both forward the abort signal");

          assert.match(api, /const healthPromise = Base\.loadServerSnapshot\(opts\);/);
          assert.match(api, /const costsPromise = resolveCostsForDashboard\(opts\);/);

          console.log("Servidor navigation performance contract: PASS · immediate route commit · single entry paint · abortable health/cost I/O");
          '''

          Path(".github/scripts/servidor_navigation_performance_contract.mjs").write_text(contract, encoding="utf-8")

          replace_once(
              "package.json",
              'node .github/scripts/whatsapp_route_contract.mjs && python3 .github/scripts/repo_integrity.py',
              'node .github/scripts/whatsapp_route_contract.mjs && node .github/scripts/servidor_navigation_performance_contract.mjs && python3 .github/scripts/repo_integrity.py',
          )
          PY

      - name: Validate focused fix
        shell: bash
        run: |
          set -euo pipefail
          node --check src/views/server/index.js
          node --check src/views/server/server.api.base.js
          node --check src/views/server/server.api.js
          node --check .github/scripts/servidor_navigation_performance_contract.mjs
          node .github/scripts/servidor_navigation_performance_contract.mjs
          python3 .github/scripts/repo_integrity.py

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Create final local commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/servidor-lag-bootstrap.yml
          rm -f .github/workflows/servidor-lag-bootstrap-v2.yml
          git config user.name "Onion Support Automation"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "perf(servidor): commit route before observability I/O"

      - name: Validate final committed candidate
        shell: bash
        env:
          PUBLIC_SITE_URL: https://onionsupport.com
          DIRECT_API_URL: https://api.onionsupport.com
        run: |
          set -euo pipefail
          test ! -e .github/workflows/servidor-lag-bootstrap.yml
          test ! -e .github/workflows/servidor-lag-bootstrap-v2.yml
          git status --short
          npm run validate

      - name: Push validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/servidor-route-lag
