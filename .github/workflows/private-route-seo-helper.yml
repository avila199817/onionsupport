name: Private Route SEO Helper

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Align Correo private-route SEO contract
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, got {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          swa = "staticwebapp.config.json"
          replace_once(
              swa,
              '''    {\n      "route": "/usuarios*",\n      "rewrite": "/index.html",\n      "headers": {\n        "Cache-Control": "no-cache, no-store, must-revalidate",\n        "Pragma": "no-cache",\n        "Expires": "0",\n        "X-Robots-Tag": "noindex, nofollow"\n      }\n    },\n    {\n      "route": "/servidor*",''',
              '''    {\n      "route": "/usuarios*",\n      "rewrite": "/index.html",\n      "headers": {\n        "Cache-Control": "no-cache, no-store, must-revalidate",\n        "Pragma": "no-cache",\n        "Expires": "0",\n        "X-Robots-Tag": "noindex, nofollow"\n      }\n    },\n    {\n      "route": "/correo*",\n      "rewrite": "/index.html",\n      "headers": {\n        "Cache-Control": "no-cache, no-store, must-revalidate",\n        "Pragma": "no-cache",\n        "Expires": "0",\n        "X-Robots-Tag": "noindex, nofollow"\n      }\n    },\n    {\n      "route": "/servidor*",''',
          )

          robots = "robots.txt"
          replace_once(
              robots,
              'Disallow: /usuarios\nDisallow: /servidor\n',
              'Disallow: /usuarios\nDisallow: /correo\nDisallow: /servidor\n',
          )

          workflow = ".github/workflows/azure-static-web-apps-polite-bay-086469a1e.yml"
          p = Path(workflow)
          text = p.read_text(encoding="utf-8")
          targets = [
              (
                  '              "Disallow: /usuarios",\n              "Disallow: /servidor",\n',
                  '              "Disallow: /usuarios",\n              "Disallow: /correo",\n              "Disallow: /servidor",\n',
              ),
              (
                  '                  "/usuarios",\n                  "/servidor",\n',
                  '                  "/usuarios",\n                  "/correo",\n                  "/servidor",\n',
              ),
              (
                  '              "/usuarios*",\n              "/servidor*",\n',
                  '              "/usuarios*",\n              "/correo*",\n              "/servidor*",\n',
              ),
          ]

          for old, new in targets:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Azure workflow: expected one route target, got {count}")
              text = text.replace(old, new)

          p.write_text(text, encoding="utf-8")

          Path(".github/workflows/private-route-seo-helper.yml").unlink()
          PY

          python3 -m json.tool staticwebapp.config.json >/dev/null
          python3 .github/scripts/repo_integrity.py
          git diff --check

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git commit -m "fix(seo): alinear Correo como ruta privada"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
