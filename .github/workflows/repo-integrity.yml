name: Repository Integrity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src -type f -name '*.js' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "No JavaScript files found under src/"
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done
          echo "JavaScript syntax OK · ${#files[@]} files"

      - name: Validate repository contracts
        run: python3 .github/scripts/repo_integrity.py

      - name: Validate static host JSON
        run: python3 -m json.tool staticwebapp.config.json >/dev/null

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<< |>>>>>>> )' src .github staticwebapp.config.json robots.txt sitemap.xml; then
            echo "Unresolved merge markers detected"
            exit 1
          fi

      - name: Validate whitespace
        run: git diff --check HEAD^ HEAD 2>/dev/null || git diff --check
