<!DOCTYPE html>
<html lang="es">
<head>
  <!-- =========================================================
       ONION SUPPORT — INDEX / SPA SHELL
       PRO SAAS PANEL / FINAL PRO SYSTEM
       Shell SPA final alineado con:
       - layout.css final
       - sidebar.css final
       - topbar.css final
       - loader.css final
       - tooltips custom por data-tooltip
       - sidebar montado desde JS
       - sidebar desktop / mobile
       - loader limpio
       - topbar / tablehead / dynamic slots
       - base href coherente
  ========================================================= -->

  <!-- =========================
       META BASE
  ========================= -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Onion Support</title>
  <meta
    name="description"
    content="Onion Support · Panel SaaS de soporte, incidencias, facturación y gestión interna."
  >
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1f1f1f">

  <!-- =========================
       BASE SPA
  ========================= -->
  <base href="/">

  <!-- =========================
       ICONS
  ========================= -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico">

  <!-- =========================
       PERFORMANCE
  ========================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- =========================
       FONTS
  ========================= -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  >

  <!-- =========================
       CSS ORDER
  ========================= -->

  <!-- TOKENS -->
  <link rel="stylesheet" href="/src/css/tokens/variables.css">
  <link rel="stylesheet" href="/src/css/tokens/light.css">

  <!-- CORE / RESET -->
  <link rel="stylesheet" href="/src/css/core/reset.css">
  <link rel="stylesheet" href="/src/css/core/layout.css">
  <link rel="stylesheet" href="/src/css/core/core.css">
  <link rel="stylesheet" href="/src/css/core/loader.css">

  <!-- LAYOUT -->
  <link rel="stylesheet" href="/src/css/layout/sidebar.css">
  <link rel="stylesheet" href="/src/css/layout/topbar.css">

  <!-- COMPONENTS -->
  <link rel="stylesheet" href="/src/css/components/ui.css">

  <!-- VIEWS -->
  <link rel="stylesheet" href="/src/css/auth/login.css">

  <!-- =========================
       NOSCRIPT
  ========================= -->
  <noscript>
    <style>
      html,
      body{
        margin:0;
        min-height:100%;
        background:#1f1f1f;
        color:#ffffff;
        font-family:Inter, system-ui, sans-serif;
      }

      #app-loader{
        display:none !important;
      }

      .layout{
        display:block !important;
        visibility:visible !important;
        opacity:1 !important;
        min-height:100vh;
      }

      .sidebar,
      .topbar,
      .table-head{
        display:none !important;
      }

      .main-content,
      #app-content,
      #view-container{
        display:block !important;
        min-height:100vh;
        width:100%;
        margin:0;
        padding:0;
      }

      #view-container{
        padding:24px;
      }

      .noscript-box{
        max-width:760px;
        margin:48px auto;
        padding:24px 28px;
        border-radius:18px;
        border:1px solid rgba(255,255,255,.08);
        background:rgba(255,255,255,.04);
        box-shadow:0 18px 40px rgba(0,0,0,.24);
      }

      .noscript-box h1{
        margin:0 0 12px;
        font-size:28px;
        line-height:1.1;
      }

      .noscript-box p{
        margin:0;
        line-height:1.55;
        color:rgba(255,255,255,.78);
      }
    </style>
  </noscript>
</head>

<body
  class="loading"
  data-app="onion"
  data-theme="dark"
  data-density="default"
>
  <!-- =========================================================
       APP LOADER
  ========================================================= -->
  <div id="app-loader" aria-hidden="true">
    <div class="loader-center">
      <div class="loader-core"></div>

      <img
        class="loader-logo loader-dark"
        src="/src/media/img/favicon_white.png"
        alt="Onion Support"
        width="64"
        height="64"
        decoding="async"
        draggable="false"
      >

      <img
        class="loader-logo loader-light"
        src="/src/media/img/favicon_black.png"
        alt="Onion Support"
        width="64"
        height="64"
        decoding="async"
        draggable="false"
      >

      <span class="loader-label">Cargando panel</span>
    </div>
  </div>

  <!-- =========================================================
       NOSCRIPT FALLBACK
  ========================================================= -->
  <noscript>
    <div class="layout">
      <main class="main-content" role="main" aria-label="Contenido principal">
        <div id="app-content">
          <div id="view-container">
            <section class="noscript-box">
              <h1>JavaScript es necesario</h1>
              <p>
                Onion Support necesita JavaScript para cargar la navegación SPA,
                el panel, las vistas y la autenticación.
              </p>
            </section>
          </div>
        </div>
      </main>
    </div>
  </noscript>

  <!-- =========================================================
       APP LAYOUT
       Sidebar montado dinámicamente desde src/ui/sidebar.js
  ========================================================= -->
  <div class="layout" id="app-shell">
    <!-- =========================
         MAIN CONTENT SHELL
    ========================= -->
    <main
      class="main-content"
      id="main-content"
      role="main"
      aria-label="Contenido principal"
    >
      <!-- TOPBAR -->
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button
            type="button"
            class="topbar-mobile-toggle"
            id="toggleSidebarMobile"
            aria-label="Abrir navegación"
            aria-controls="sidebar-menu"
            aria-expanded="false"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path d="M4 7h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M4 12h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>

          <h1 class="topbar-title" id="topbar-title">Onion Support</h1>
        </div>

        <div class="topbar-right">
          <div class="topbar-search-wrap">
            <svg
              class="topbar-search-icon"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
              <path d="M20 20l-3-3" stroke="currentColor" stroke-width="2"/>
            </svg>

            <input
              type="search"
              id="topbar-search"
              class="topbar-search"
              placeholder="Buscar..."
              autocomplete="off"
              inputmode="search"
              aria-label="Buscar en la aplicación"
              aria-controls="topbar-search-results"
              aria-expanded="false"
              aria-autocomplete="list"
            >

            <div
              id="topbar-search-results"
              class="topbar-search-results"
              hidden
              aria-live="polite"
            ></div>
          </div>
        </div>
      </header>

      <!-- APP CONTENT -->
      <div id="app-content">
        <!-- VIEW ROOT -->
        <div
          id="view-container"
          data-view-root
          aria-live="polite"
        ></div>
      </div>
    </main>
  </div>

  <!-- =========================
       APP ENTRY
  ========================= -->
  <script type="module" src="/src/app.js"></script>
</body>
</html>
