name: Incidencias History Mode Once

on:
  push:
    branches:
      - fix/incidencias-history-mode-user-close-20260817
    paths:
      - .github/scripts/patch-incidencias-history-mode.py
      - .github/workflows/incidencias-history-mode-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/incidencias-history-mode-user-close-20260817
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch
        run: python3 .github/scripts/patch-incidencias-history-mode.py

      - name: Validate JS syntax
        run: |
          node --check src/views/incidencias/index.js
          node --check src/views/incidencias/incidencias.template.modal.js

      - name: Validate history mode render
        run: |
          node --input-type=module <<'NODE'
          import {
            renderIncidenciasDetailModal,
            DETAIL_ACTIONS,
          } from './src/views/incidencias/incidencias.template.modal.js';

          const detail = {
            ticketId: 'INC-20260817-ABC123',
            subject: 'Prueba historial',
            description: 'Detalle',
            status: 'open',
            priority: 'high',
            category: 'access',
            history: [
              {
                id: 'h1',
                type: 'created',
                message: 'Incidencia creada',
                createdAt: '2026-08-17T08:00:00.000Z',
              },
              {
                id: 'h2',
                type: 'update',
                message: 'Incidencia actualizada',
                createdAt: '2026-08-17T08:05:00.000Z',
              },
            ],
          };

          const ticketHtml = renderIncidenciasDetailModal({
            open: true,
            detail,
            historyOpen: false,
            admin: false,
            role: 'user',
          });

          const historyHtml = renderIncidenciasDetailModal({
            open: true,
            detail,
            historyOpen: true,
            admin: false,
            role: 'user',
          });

          if (!ticketHtml.includes('data-history-mode="ticket"')) {
            throw new Error('Ticket mode missing');
          }
          if (!ticketHtml.includes('data-modal-composer="true"')) {
            throw new Error('Ticket composer missing');
          }
          if (ticketHtml.includes('incidencias-modal-history-view')) {
            throw new Error('History view must stay lazy while closed');
          }
          if (!historyHtml.includes('data-history-mode="history"')) {
            throw new Error('History mode missing');
          }
          if (!historyHtml.includes('incidencias-modal-history-view')) {
            throw new Error('History view missing');
          }
          if (!historyHtml.includes('Incidencia actualizada')) {
            throw new Error('Timeline content missing');
          }
          if (historyHtml.includes('data-modal-composer="true"')) {
            throw new Error('Composer must not render behind history mode');
          }
          if (!historyHtml.includes('Volver al ticket')) {
            throw new Error('History back action missing');
          }
          if (!historyHtml.includes('aria-pressed="true"')) {
            throw new Error('Header history active state missing');
          }
          if (!ticketHtml.includes(DETAIL_ACTIONS.TICKET_CLOSE)) {
            throw new Error('Normal user must see close-ticket action on own open ticket');
          }
          NODE

      - name: Validate controller/CSS contracts
        run: |
          grep -F 'incidencias.index.extreme.v25.history-mode' src/views/incidencias/index.js
          grep -F 'currentHistoryMode !== nextHistoryMode' src/views/incidencias/index.js
          grep -F 'currentBody.replaceWith(' src/views/incidencias/index.js
          grep -F 'incidencias.template.modal.extreme.v25.history-mode' src/views/incidencias/incidencias.template.modal.js
          grep -F 'data-history-mode="${vm.historyOpen ? "history" : "ticket"}"' src/views/incidencias/incidencias.template.modal.js
          grep -F '.incidencias-modal-history-view {' src/css/views/incidencias/detail.css
          python3 - <<'PY'
          from pathlib import Path
          import re
          css = Path('src/css/views/incidencias/detail.css').read_text(encoding='utf-8')
          if re.search(r':\s*[^;{}\n]*!\s*important\b', css, flags=re.I):
              raise SystemExit('detail.css contains !important')
          PY

      - name: Commit product changes and remove one-shot files
        run: |
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git rm -f .github/scripts/patch-incidencias-history-mode.py \
                    .github/workflows/incidencias-history-mode-once.yml
          git add src/views/incidencias/index.js \
                  src/views/incidencias/incidencias.template.modal.js \
                  src/css/views/incidencias/detail.css
          git commit -m "fix(incidencias): convertir historial en modo visible del modal"
          git push origin HEAD:fix/incidencias-history-mode-user-close-20260817
