name: One-shot Sidebar V15 Recovery

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

env:
  TARGET_BRANCH: fix/sidebar-core-role-crash

jobs:
  recover:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/sidebar-core-role-crash'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Guard trigger
        run: |
          set -euo pipefail
          test -f .github/.sidebar-v15-recovery-trigger

      - name: Repair sidebar role authority
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_sidebar_core_role_crash.py

      - name: Validate repository
        run: |
          set -euo pipefail
          python3 .github/scripts/repo_integrity.py
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Validate sidebar runtime contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('src/ui/sidebar/template.js').read_text(encoding='utf-8')
          assert 'import { AppCore } from "../../core/index.js";' in text
          assert 'AppCore.normalizeRole(' in text
          assert not re.search(r'\.map\(\s*normalizeRole\s*\)', text)
          assert not re.search(r'\bfunction\s+normalizeRole\s*\(', text)
          assert 'sidebar.template.unified.v6-core-role-authority' in text
          print('Sidebar runtime role authority V15 OK')
          PY

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add src/ui/sidebar/template.js .github/scripts/repo_integrity.py docs/UI_SYSTEM_V15_SIDEBAR_RECOVERY.md
          if git diff --cached --quiet; then
            echo "Sin cambios de reparación."
            exit 0
          fi
          git commit -m "fix(sidebar): restaurar montaje con rol canónico"
          git push origin HEAD:${TARGET_BRANCH}
