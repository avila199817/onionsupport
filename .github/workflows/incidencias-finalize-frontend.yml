name: Incidencias Frontend Finalizer

on:
  push:
    branches:
      - main
    paths:
      - .github/ci/incidencias-finalize-frontend-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Make one-shot migration parser export-aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/incidencias_finalize_frontend.py')
          text = path.read_text(encoding='utf-8')
          old = r'(?:async\s+)?function\s+'
          new = r'(?:export\s+)?(?:async\s+)?function\s+'
          if text.count(old) != 1:
              raise SystemExit(f'finalizer parser marker mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply final Incidencias hardening
        run: python3 .github/scripts/incidencias_finalize_frontend.py

      - name: Validate changed JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check src/views/incidencias/index.js
          node --check src/views/incidencias/incidencias.api.impl.js
          node --check src/views/incidencias/incidencias.template.js
          node --check src/features/incidencias-detail-state/index.js

      - name: Validate scale contract
        run: python3 .github/scripts/incidencias_scale_contract.py

      - name: Validate repository contracts
        run: python3 .github/scripts/repo_integrity.py

      - name: Validate critical SPA contracts
        run: bash .github/ci/validate_spa_contracts.sh

      - name: Commit final Incidencias runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Onion Support CI"
          git config user.email "ci@onionsupport.com"
          git add \
            src/views/incidencias/index.js \
            src/views/incidencias/incidencias.api.impl.js \
            src/views/incidencias/incidencias.template.js \
            src/features/incidencias-detail-state/index.js
          if git diff --cached --quiet; then
            echo "No frontend runtime changes required."
            exit 0
          fi
          git commit -m "feat(incidencias): finalize production scale hardening"
          git push origin HEAD:main
