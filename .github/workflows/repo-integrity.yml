name: Repository Integrity

# Validate both pull-request candidates and the canonical main branch.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Use exact Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src -type f -name '*.js' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "No JavaScript files found under src/"
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done
          echo "JavaScript syntax OK · ${#files[@]} files"

      # LA MISMA LISTA QUE EXIGE EL DESPLIEGUE, EJECUTADA ANTES DEL MERGE.
      #
      # `validate:source` era la puerta del `push` a main --dentro de
      # `validate:ci`-- y NO la de las PR, así que un contrato podía pasar la
      # revisión en verde y romper la publicación después de fusionar. Ocurrió:
      # una capa copió una clase del shell, `modal-shell-contract` lo rechazaba
      # y la PR no lo ejecutaba.
      #
      # Se invoca el COMANDO, no una copia de su lista: si alguien añade un
      # contrato a `validate:source`, entra aquí solo. Los pasos que repetían a
      # mano trece de sus entradas se han retirado por eso mismo.
      #
      # Este job no tiene secretos, no persiste credenciales, no construye, no
      # publica y sólo pide `contents: read`. Los contratos son de fuente: se
      # ejecutan sobre un árbol sin dependencias instaladas.
      - name: Validate every source contract the release gate requires
        run: npm run validate:source

      - name: Validate public footer policy transition
        run: python3 .github/scripts/public_footer_policy_regression.py

      - name: Validate Google measurement contract
        run: python3 .github/scripts/google_measurement_contract.py

      - name: Validate workflow runtime and production provenance contracts
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}
        run: python3 .github/ci/validate_integrity_candidate.py

      - name: Validate public path hygiene
        run: python3 -I .github/scripts/public_path_hygiene.py

      - name: Validate Incidencias scale contract
        run: python3 .github/scripts/incidencias_scale_contract.py

      - name: Validate Clientes scale contract
        run: python3 .github/scripts/clientes_scale_contract.py

      - name: Validate Facturas continuous-scroll contract
        run: python3 .github/scripts/facturas_continuous_scroll_contract.py

      - name: Validate Usuarios scale contract
        run: python3 .github/scripts/usuarios_scale_contract.py

      - name: Validate private admin cross-view alignment
        run: python3 .github/scripts/private_admin_alignment_contract.py

      - name: Validate private Create modal parity
        run: python3 .github/scripts/private_create_modal_contract.py

      - name: Validate Correo canonical surface
        run: python3 .github/scripts/correo_integrity.py

      - name: Validate continuous-scroll markup
        run: node .github/scripts/continuous_scroll_smoke.mjs

      - name: Validate single app entrypoint
        run: python3 .github/scripts/app_entrypoint_integrity.py

      - name: Validate boot visual contract
        run: python3 .github/scripts/boot_visual_integrity.py

      - name: Validate Cuenta canonical surface
        run: python3 .github/scripts/cuenta_integrity.py

      - name: Validate production verifier syntax
        run: python3 -m py_compile .github/scripts/production_verify.py

      - name: Validate production dist workflow regression
        run: node tools/production-dist-workflow-regression.mjs

      - name: Validate production availability monitor
        run: node .github/scripts/production-availability-contract.mjs

      - name: Validate static host JSON
        run: python3 -m json.tool staticwebapp.config.json >/dev/null

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<< |>>>>>>> )' src .github staticwebapp.config.json robots.txt sitemap.xml; then
            echo "Unresolved merge markers detected"
            exit 1
          fi

      - name: Validate whitespace
        run: git diff --check HEAD^ HEAD 2>/dev/null || git diff --check
