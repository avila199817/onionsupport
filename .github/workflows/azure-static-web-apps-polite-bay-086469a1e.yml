# =========================================================
# ONION SUPPORT — AZURE STATIC WEB APPS CI/CD
# Production contract:
#   Frontend canonical: https://onionsupport.com
#   Production API:     https://api.onionsupport.com/api/*
#   Direct backend:     https://api.onionsupport.com
#   Azure SWA:          onion-panel
#   SWA plan:           Free
#   Linked backend:      none
#
# Design goals:
#   - Validate the exact commit that is deployed.
#   - Build and validate the production dist in a job without secrets.
#   - Transfer only the exact dist envelope to a fresh deploy runner.
#   - Deploy static files directly (no Oryx/application build).
#   - Never retry an upload blindly.
#   - Validate the Azure origin redirect, then poll canonical exact bytes.
#   - Make production verification blocking.
#   - Keep PR preview lifecycle deterministic.
#   - Pin third-party actions by immutable commit SHA.
# =========================================================

name: Azure Static Web Apps CI/CD

run-name: SWA · ${{ github.event_name }} · ${{ github.ref_name || 'manual' }}

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "compiled-dist or emergency known-good legacy root"
        required: true
        default: compiled-dist
        type: choice
        options:
          - compiled-dist
          - legacy-root

concurrency:
  group: swa-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PRODUCTION_RELEASE_CONTRACT: "compiled-dist-v1"
  API_LOCATION: ""
  OUTPUT_LOCATION: ""
  AZURE_PRODUCTION_ORIGIN: "https://polite-bay-086469a1e.1.azurestaticapps.net"
  PUBLIC_SITE_URL: "https://onionsupport.com"
  DIRECT_API_URL: "https://api.onionsupport.com"

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    if: github.ref_name == 'main'

    outputs:
      validated_sha: ${{ steps.revision.outputs.sha }}
      deployment_mode: ${{ steps.revision.outputs.mode }}
      app_location: ${{ steps.revision.outputs.app_location }}
      production_artifact_id: ${{ steps.upload_release.outputs.artifact-id }}
      production_artifact_digest: ${{ steps.upload_release.outputs.artifact-digest }}
      production_artifact_name: ${{ steps.artifact_name.outputs.name }}
      production_manifest_digest: ${{ steps.production_envelope.outputs.manifest_digest }}

    defaults:
      run:
        working-directory: candidate

    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'legacy-root' && 'edbdf2429b85a3de405d18aa58bd85eb319bd6de' || github.sha }}
          path: candidate
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Lock validated revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.deployment_mode || 'compiled-dist' }}
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'legacy-root' && 'edbdf2429b85a3de405d18aa58bd85eb319bd6de' || github.sha }}
          KNOWN_GOOD_LEGACY_SHA: edbdf2429b85a3de405d18aa58bd85eb319bd6de
        run: |
          set -euo pipefail

          checked_sha="$(git rev-parse HEAD)"
          mode="compiled-dist"
          app_location="production-artifact/dist"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${REQUESTED_MODE}" in
              compiled-dist)
                ;;
              legacy-root)
                mode="legacy-root"
                app_location="/"
                if [[ "${checked_sha}" != "${KNOWN_GOOD_LEGACY_SHA}" ]]; then
                  echo "::error title=Rollback no inmutable::Esperado ${KNOWN_GOOD_LEGACY_SHA}, obtenido ${checked_sha}."
                  exit 1
                fi
                ;;
              *)
                echo "::error title=Modo de deploy inválido::${REQUESTED_MODE}"
                exit 1
                ;;
            esac
          fi

          if [[ "${checked_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error title=Checkout no determinista::Esperado ${EXPECTED_SHA}, obtenido ${checked_sha}."
            exit 1
          fi

          echo "sha=${checked_sha}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "app_location=${app_location}" >> "${GITHUB_OUTPUT}"
          echo "Validated SHA: ${checked_sha} · mode=${mode} · app_location=${app_location}"

      - name: Require merged pull request for automatic production
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail

          response="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/commits/${REVISION}/pulls"
          )"

          merged_main_count="$(
            jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length' \
              <<< "$response"
          )"

          if [[ "$merged_main_count" -lt 1 ]]; then
            echo "::error title=Automatic production rejected::${REVISION} is not associated with a merged PR targeting main."
            echo "Use a pull request, or workflow_dispatch for an explicit emergency release."
            exit 1
          fi

          echo "Automatic production provenance verified through a merged PR targeting main."

      - name: Stage trusted validation tooling
        run: |
          set -euo pipefail

          destination="${RUNNER_TEMP}/onion-validation"
          rm -rf "${destination}"
          mkdir -p "${destination}"

          source_root="."
          echo "Production release: validators taken from exact release SHA."

          install -m 0755 "${source_root}/.github/ci/validate_static_release.sh"             "${destination}/validate_static_release.sh"
          install -m 0755 "${source_root}/.github/ci/validate_production_contract.sh"             "${destination}/validate_production_contract.sh"
          install -m 0755 "${source_root}/.github/ci/validate_spa_contracts.sh"             "${destination}/validate_spa_contracts.sh"
          install -m 0644 "${source_root}/.github/scripts/repo_integrity.py"             "${destination}/repo_integrity.py"
          install -m 0644 "${source_root}/.github/scripts/artifact_hygiene.py"           "${destination}/artifact_hygiene.py"
          install -m 0755 "${source_root}/.github/ci/validate_candidate_paths.py" "${destination}/validate_candidate_paths.py"

      - name: Validate candidate path boundary
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-validation/validate_candidate_paths.py"

      - name: Validate static release contract
        run: bash "${RUNNER_TEMP}/onion-validation/validate_static_release.sh"

      - name: Validate repository integrity
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/onion-validation/repo_integrity.py"

      - name: Validate repository artifact hygiene
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/onion-validation/artifact_hygiene.py"

      - name: Validate production SEO and routing contract
        run: bash "${RUNNER_TEMP}/onion-validation/validate_production_contract.sh"

      - name: Verify external canonical hostname redirects
        run: >-
          python3 .github/scripts/production_verify.py
          --base-url "${PUBLIC_SITE_URL}"
          --revision "${{ steps.revision.outputs.sha }}"
          --attempts 1
          --delay 0
          --redirects-only

      - name: Reject legacy API domain from runtime
        run: |
          set -euo pipefail

          legacy_domain="onionit"".""net"

          if git grep -n -I -F "${legacy_domain}" -- . \
            ':(exclude).github/**' \
            ':(exclude)docs/**' \
            ':(exclude)tests/**' \
            ':(exclude)test/**' \
            ':(exclude)fixtures/**'; then
            echo "::error title=Dominio API legado detectado::El runtime aún contiene referencias a ${legacy_domain}."
            exit 1
          fi

          echo "Runtime desplegable sin referencias al dominio API legado."

      - name: Use exact Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Validate critical SPA contracts
        run: bash "${RUNNER_TEMP}/onion-validation/validate_spa_contracts.sh"

      - name: Use exact npm
        if: steps.revision.outputs.mode == 'compiled-dist'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare npm@10.9.8 --activate
          [[ "$(node --version)" == "v22.23.2" ]]
          [[ "$(npm --version)" == "10.9.8" ]]

      # This entire job has contents:read and no production secret. The browser
      # contract therefore cannot persist hooks into the fresh deploy runner.
      - name: Install locked release dependencies
        if: steps.revision.outputs.mode == 'compiled-dist'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and validate production dist without secrets
        if: steps.revision.outputs.mode == 'compiled-dist'
        env:
          ONION_RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: npm run validate:ci

      - name: Materialize exact production artifact
        if: steps.revision.outputs.mode == 'compiled-dist'
        id: production_envelope
        env:
          ONION_ARTIFACT_DIR: ${{ github.workspace }}/candidate/production-artifact
          ONION_RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ -e production-artifact ]]; then
            echo "::error title=Envelope productivo preexistente::production-artifact debe crearse desde cero."
            exit 1
          fi

          mkdir production-artifact
          cp -a dist production-artifact/dist
          cp -a build-metadata production-artifact/build-metadata

          mapfile -d '' roots < <(
            find production-artifact -mindepth 1 -maxdepth 1 -printf '%f\0' | sort -z
          )
          if (( ${#roots[@]} != 2 )) || \
            [[ "${roots[0]}" != "build-metadata" ]] || \
            [[ "${roots[1]}" != "dist" ]]; then
            echo "::error title=Envelope productivo no exacto::Sólo se permiten dist y build-metadata."
            printf 'Root inesperado: %q\n' "${roots[@]}"
            exit 1
          fi

          for path in production-artifact/dist production-artifact/build-metadata; do
            if [[ ! -d "${path}" ]] || [[ -L "${path}" ]]; then
              echo "::error title=Envelope productivo inválido::${path} debe ser un directorio real."
              exit 1
            fi
          done

          node tools/verify-artifact-envelope.mjs

          manifest_digest="$(sha256sum production-artifact/build-metadata/release-manifest.json | awk '{print $1}')"
          if [[ ! "${manifest_digest}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Digest de manifest productivo inválido::${manifest_digest}"
            exit 1
          fi
          echo "manifest_digest=${manifest_digest}" >> "${GITHUB_OUTPUT}"

      - name: Name immutable production artifact
        if: steps.revision.outputs.mode == 'compiled-dist'
        id: artifact_name
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: echo "name=frontend-production-dist-${RELEASE_SHA}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload exact production artifact
        if: steps.revision.outputs.mode == 'compiled-dist'
        id: upload_release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: |
            candidate/production-artifact/dist
            candidate/production-artifact/build-metadata
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  deploy_production:
    name: Deploy production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - validate

    # Production deploys only from the canonical main ref.
    if: github.ref_name == 'main'

    permissions:
      contents: read

    env:
      VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
      DEPLOYMENT_MODE: ${{ needs.validate.outputs.deployment_mode }}
      APP_LOCATION: ${{ needs.validate.outputs.app_location }}
      PRODUCTION_ARTIFACT_DIGEST: ${{ needs.validate.outputs.production_artifact_digest }}
      PRODUCTION_MANIFEST_DIGEST: ${{ needs.validate.outputs.production_manifest_digest }}

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.VALIDATED_SHA }}
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Assert immutable release input
        run: |
          set -euo pipefail

          checked_sha="$(git rev-parse HEAD)"

          if [[ "${checked_sha}" != "${VALIDATED_SHA}" ]]; then
            echo "::error title=SHA de deploy incorrecto::Validado ${VALIDATED_SHA}, checkout ${checked_sha}."
            exit 1
          fi

          echo "Deploying immutable SHA: ${VALIDATED_SHA}"

      - name: Download exact production artifact by ID
        if: env.DEPLOYMENT_MODE == 'compiled-dist'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.production_artifact_id }}
          path: production-artifact
          merge-multiple: true

      - name: Use exact Node 22 for artifact verification
        if: env.DEPLOYMENT_MODE == 'compiled-dist'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Validate exact production artifact before token access
        if: env.DEPLOYMENT_MODE == 'compiled-dist'
        env:
          ONION_ARTIFACT_DIR: ${{ github.workspace }}/production-artifact
          ONION_RELEASE_SHA: ${{ env.VALIDATED_SHA }}
          EXPECTED_MANIFEST_DIGEST: ${{ env.PRODUCTION_MANIFEST_DIGEST }}
        run: |
          set -euo pipefail

          if [[ ! "${PRODUCTION_ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]; then
            echo "::error title=Digest de artifact productivo inválido::${PRODUCTION_ARTIFACT_DIGEST}"
            exit 1
          fi

          mapfile -d '' roots < <(
            find production-artifact -mindepth 1 -maxdepth 1 -printf '%f\0' | sort -z
          )
          if (( ${#roots[@]} != 2 )) || \
            [[ "${roots[0]}" != "build-metadata" ]] || \
            [[ "${roots[1]}" != "dist" ]]; then
            echo "::error title=Artifact productivo descargado no exacto::Sólo se permiten dist y build-metadata."
            printf 'Root inesperado: %q\n' "${roots[@]}"
            exit 1
          fi

          for path in production-artifact/dist production-artifact/build-metadata; do
            if [[ ! -d "${path}" ]] || [[ -L "${path}" ]]; then
              echo "::error title=Artifact productivo descargado inválido::${path} debe ser un directorio real."
              exit 1
            fi
          done

          node tools/verify-artifact-envelope.mjs
          echo "Production artifact ID: ${{ needs.validate.outputs.production_artifact_id }}"
          echo "Production archive digest: ${PRODUCTION_ARTIFACT_DIGEST}"
          echo "Production manifest digest: ${PRODUCTION_MANIFEST_DIGEST}"

      - name: Validate deployment token
        env:
          SWA_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}
        run: |
          set -euo pipefail

          if [[ -z "${SWA_API_TOKEN:-}" ]]; then
            echo "::error title=Secret no configurado::Falta AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E."
            exit 1
          fi

      - name: Stage production verifiers
        run: |
          install -m 0755 .github/ci/verify_release_bytes.sh "${RUNNER_TEMP}/verify_release_bytes.sh"
          install -m 0755 .github/ci/verify_production.sh "${RUNNER_TEMP}/verify_production.sh"

      - name: Deploy compiled static SPA
        id: deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}
          action: upload
          app_location: ${{ env.APP_LOCATION }}
          api_location: ${{ env.API_LOCATION }}
          output_location: ${{ env.OUTPUT_LOCATION }}
          skip_app_build: true

      - name: Verify Azure production origin canonicalizes exactly
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          set -euo pipefail

          azure_origin="${DEPLOYED_URL%/}"
          expected_origin="${AZURE_PRODUCTION_ORIGIN%/}"
          canonical="${PUBLIC_SITE_URL%/}"

          if [[ "${azure_origin}" != "${expected_origin}" ]]; then
            echo "::error title=Origen Azure inesperado::El action devolvió '${azure_origin}'; esperado '${expected_origin}'."
            exit 1
          fi

          if [[ "${canonical}" != "https://onionsupport.com" ]]; then
            echo "::error title=Canonical productivo inesperado::PUBLIC_SITE_URL='${canonical}'."
            exit 1
          fi

          for attempt in $(seq 1 8); do
            mismatch=0

            for route in "/" "/login" "/@ci-probe/incidencias/ci-ticket"; do
              query="origin_probe=${VALIDATED_SHA}&preserve=1&attempt=${attempt}"
              requested="${azure_origin}${route}?${query}"
              expected="${canonical}${route}?${query}"

              if ! response="$(
                curl \
                  --silent \
                  --show-error \
                  --connect-timeout 10 \
                  --max-time 30 \
                  --dump-header - \
                  --output /dev/null \
                  --write-out $'\nONION_STATUS:%{http_code}\n' \
                  -H "Cache-Control: no-cache" \
                  -H "Pragma: no-cache" \
                  "${requested}"
              )"; then
                mismatch=1
                break
              fi

              status="$(
                awk -F: '$1 == "ONION_STATUS" { value=$2 } END { print value }' <<< "${response}"
              )"
              location="$(
                awk -F': *' '
                  tolower($1) == "location" {
                    sub(/^[^:]+:[[:space:]]*/, "")
                    sub(/\r$/, "")
                    value=$0
                  }
                  END { print value }
                ' <<< "${response}"
              )"

              if [[ "${status}" != "301" ]] || [[ "${location}" != "${expected}" ]]; then
                mismatch=1
                break
              fi
            done

            if [[ "${mismatch}" == "0" ]]; then
              echo "Azure production origin redirects to canonical in one exact path/query-preserving hop."
              break
            fi

            if [[ "${attempt}" == "8" ]]; then
              echo "::error title=Redirect Azure inesperado::El origen no respondió 301 hacia el canonical exacto tras 8 intentos."
              exit 1
            fi

            echo "Azure origin propagation pending (${attempt}/8); retrying in 5s..."
            sleep 5
          done

      - name: Verify canonical dist bytes
        if: env.DEPLOYMENT_MODE == 'compiled-dist'
        env:
          DEPLOYED_URL: ${{ env.PUBLIC_SITE_URL }}
          ONION_ARTIFACT_DIR: ${{ github.workspace }}/production-artifact
          ONION_RELEASE_SHA: ${{ env.VALIDATED_SHA }}
          EXPECTED_MANIFEST_DIGEST: ${{ env.PRODUCTION_MANIFEST_DIGEST }}
        run: node tools/verify-deployed-dist.mjs

      - name: Verify known-good legacy canonical bytes
        if: env.DEPLOYMENT_MODE == 'legacy-root'
        env:
          DEPLOYED_URL: ${{ env.PUBLIC_SITE_URL }}
          VERIFY_CANONICAL: "false"
        run: bash "${RUNNER_TEMP}/verify_release_bytes.sh"

      - name: Verify production security, routing and backend
        run: bash "${RUNNER_TEMP}/verify_production.sh"
