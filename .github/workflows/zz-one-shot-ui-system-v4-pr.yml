name: One-shot UI System V4 PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-system-v4-repo-sweep
          fetch-depth: 0

      - name: Apply UI System V4 migration
        run: python3 .github/scripts/ui_system_v4_migrate.py

      - name: Validate contracts
        run: |
          python3 -m py_compile .github/scripts/repo_integrity.py
          node --check src/router/styles.js
          node --check src/ui/chrome/index.js
          node --check src/ui/chrome/template.js
          python3 .github/scripts/repo_integrity.py

      - name: Commit migration
        run: |
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor(ui): consolidar autoridades y retirar bridges legacy"
          git push origin HEAD:refactor/ui-system-v4-repo-sweep
