name: Polish Empleados v2

on:
  push:
    branches:
      - polish-empleados-sidebar-interno

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: polish-empleados-sidebar-interno
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and verify
        run: |
          set -euo pipefail
          python3 .github/scripts/polish_empleados_runner.py
          node --check src/router/routes.js
          node --check src/ui/sidebar/index.js
          node --check src/ui/sidebar/template.js
          node --check src/views/empleados/index.js
          git diff --check
          git diff --stat

      - name: Commit clean feature diff
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git rm -f \
            .github/workflows/polish-empleados-once.yml \
            .github/workflows/polish-empleados-v2.yml \
            .github/scripts/polish_empleados_once.py \
            .github/scripts/polish_empleados_runner.py
          git add \
            src/router/routes.js \
            src/css/components/app-icons.css \
            src/css/layout/sidebar.icons.css \
            src/css/layout/sidebar.executive.css \
            src/ui/sidebar/template.js \
            src/views/empleados/index.js
          git diff --cached --check
          git commit -m "Pulir icono y bloque interno de Empleados"
          git push origin HEAD:polish-empleados-sidebar-interno
