# =========================================================
# ONION SUPPORT — PRODUCTION AVAILABILITY MONITOR
# Persistent, dependency-free verification of the canonical HTML + asset graph.
# Opens one deduplicated GitHub issue only after repeated unavailability and
# closes it automatically after verified recovery. It never redeploys blindly.
# =========================================================

name: Production Availability Monitor

run-name: Availability · ${{ github.event_name }} · ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  pull_request:
    paths:
      - ".github/workflows/production-availability.yml"
      - ".github/scripts/production-availability-*.mjs"
      - ".github/workflows/repo-integrity.yml"

  workflow_run:
    workflows:
      - "Azure Static Web Apps CI/CD"
    types:
      - completed

  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-availability-${{ github.event.pull_request.number || 'canonical' }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate availability monitor contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout monitor source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Use exact Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Validate monitor policy and syntax
        run: node .github/scripts/production-availability-contract.mjs

  probe:
    name: Probe canonical production
    if: github.event_name != 'pull_request'
    needs:
      - contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout exact monitored revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Use exact Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Probe HTML and critical asset graph in three rounds
        id: availability
        continue-on-error: true
        env:
          PUBLIC_SITE_URL: https://onionsupport.com
          PROBE_ROUNDS: "3"
          PROBE_MIN_SUCCESS_ROUNDS: "2"
          PROBE_DELAY_MS: "15000"
          PROBE_TIMEOUT_MS: "30000"
          PROBE_CONCURRENCY: "8"
          PROBE_OUTPUT: ${{ runner.temp }}/production-availability-report.json
          PROBE_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node .github/scripts/production-availability-probe.mjs

      - name: Synchronize deduplicated availability incident
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_REPORT: ${{ runner.temp }}/production-availability-report.json
        run: node .github/scripts/production-availability-incident.mjs

      - name: Upload private diagnostic report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-availability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-availability-report.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

      - name: Enforce persistent availability
        if: steps.availability.outcome == 'failure'
        run: |
          echo "Production did not reach the minimum successful probe rounds."
          exit 1
