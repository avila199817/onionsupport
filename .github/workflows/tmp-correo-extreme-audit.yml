name: TEMP Correo extreme patch

on:
  push:
    branches:
      - polish/correo-extreme-v7

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, 'bootstrap Correo extreme patch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: polish/correo-extreme-v7
          fetch-depth: 0

      - name: Apply Correo extreme hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          index_path = root / 'src/views/correo/index.js'
          template_path = root / 'src/views/correo/correo.template.js'
          base_css_path = root / 'src/css/views/correo/index.css'
          viewport_css_path = root / 'src/css/views/correo/viewport.css'
          styles_path = root / 'src/router/styles.js'
          workflow_path = root / '.github/workflows/repo-integrity.yml'
          contract_path = root / '.github/scripts/correo_integrity.py'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          def replace_between(text, start, end, new, label):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'{label}: start not found')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'{label}: end not found')
              return text[:a] + new + text[b:]

          # -------------------------------------------------
          # index.js
          # -------------------------------------------------
          src = index_path.read_text(encoding='utf-8')
          src = replace_once(src, '  renderComposeModal,\n', '  renderComposeModal,\n  renderConfirmModal,\n', 'confirm import')
          src = replace_once(src,
              'export const CORREO_VIEW_VERSION = "correo.view.microsoft.production.v6-canonical-user";',
              'export const CORREO_VIEW_VERSION = "correo.view.microsoft.production.v7-extreme";\n\nconst VIEW_CACHE_TTL_MS = 60_000;',
              'view version')
          src = replace_once(src, 'const VIEW_CACHE = {\n  status: null,', 'const VIEW_CACHE = {\n  ownerKey: "",\n  status: null,', 'cache owner')

          new_user = '''function readOnionUser() {
  let raw = null;

  try {
    raw =
      AppCore?.getCurrentUser?.() ||
      AppCore?.getState?.()?.user ||
      AppCore?.state?.user ||
      DefaultAuth?.getUser?.() ||
      DefaultAuth?.getCurrentUser?.() ||
      null;
  } catch {
    raw = null;
  }

  let user = null;
  try { user = AppCore?.publicUser?.(raw) || null; } catch { user = null; }

  const displayName = cleanText(user?.displayName, "Usuario");
  const avatarUrl = sanitizeRuntimeImageUrl(user?.avatarUrl || "");
  const cacheKey = safeLower(
    raw?.userId || raw?.id || raw?.uid || raw?.emailLower || raw?.email ||
    raw?.preferred_username || raw?.username || ""
  );

  return Object.freeze({
    displayName,
    avatarUrl,
    initials: initialsFrom(displayName),
    cacheKey,
  });
}

