name: Facturas Client Only Bootstrap

on:
  push:
    branches:
      - fix/facturas-create-client-only

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Facturas client-only search fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path("src/views/facturas/index.js")
          contract_path = Path(".github/scripts/facturas_continuous_scroll_contract.py")

          index = index_path.read_text(encoding="utf-8")
          contract = contract_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              if new in text:
                  print(f"already patched: {label}")
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          index = replace_once(
              index,
              '"facturas.index.productivo.v18.mobile-resend-polish";',
              '"facturas.index.productivo.v19.client-only-create-search";',
              "facturas version",
          )

          old_comment = '''/*
            Búsquedas de selección para alta de Facturas.
            Priorizar los routers /api/search canónicos del backend y conservar sólo
            fallbacks que existen realmente. Evita 404 legacy y, sobre todo, evita que
            /api/clientes (listado general) intercepte una consulta antes del buscador.
          */'''.replace("          ", "")
          new_comment = '''/*
            Búsquedas de selección para alta de Facturas.
            La entidad seleccionable es exclusivamente Cliente. El backend ya expone
            /api/search/clientes como router canónico sobre el contenedor de clientes;
            nunca degradar a /api/search/users ni /api/users porque mezclaría usuarios
            internos con entidades facturables.
          */'''.replace("          ", "")
          index = replace_once(index, old_comment, new_comment, "client search comment")

          old_endpoints = '''const CLIENT_SEARCH_ENDPOINTS = Object.freeze([
            "/api/search/clientes",
            "/api/search/users",
            "/api/users",
          ]);'''.replace("          ", "")
          new_endpoints = '''const CLIENT_SEARCH_ENDPOINTS = Object.freeze([
            "/api/search/clientes",
          ]);'''.replace("          ", "")
          index = replace_once(index, old_endpoints, new_endpoints, "client search endpoints")

          contract_anchor = '''# Facturas resend UX must stay inside the product visual system, never browser chrome.'''
          contract_block = '''# Invoice creation must select billing clients only; user search is a different domain.
          require(
              INDEX,
              'const CLIENT_SEARCH_ENDPOINTS = Object.freeze([\\n  "/api/search/clientes",\\n]);',
              "Create-invoice client search must use only the canonical clientes search endpoint",
          )
          reject(INDEX, '"/api/search/users"', "Create-invoice client search must never fall back to user search")
          reject(INDEX, '"/api/users"', "Create-invoice client search must never fall back to the users listing")

          '''.replace("          ", "")

          if "Create-invoice client search must use only the canonical clientes search endpoint" not in contract:
              if contract.count(contract_anchor) != 1:
                  raise SystemExit("facturas client-only contract anchor missing or duplicated")
              contract = contract.replace(contract_anchor, contract_block + contract_anchor, 1)

          index_path.write_text(index, encoding="utf-8")
          contract_path.write_text(contract, encoding="utf-8")
          PY

      - name: Validate focused Facturas change
        shell: bash
        run: |
          node --check src/views/facturas/index.js
          python .github/scripts/facturas_continuous_scroll_contract.py
          python .github/scripts/private_admin_alignment_contract.py
          python .github/scripts/repo_integrity.py
          node .github/scripts/continuous_scroll_smoke.mjs
          git diff --check

      - name: Commit focused Facturas change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No product diff to commit"
            exit 0
          fi
          git config user.name "Onion Support Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/facturas/index.js .github/scripts/facturas_continuous_scroll_contract.py
          git commit -m "fix: restrict invoice client search to clientes"
          git push origin HEAD:fix/facturas-create-client-only
