name: One-shot Google Ads CSP endpoints

on:
  push:
    branches:
      - fix/google-ads-csp-endpoints

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/google-ads-csp-endpoints
          fetch-depth: 0

      - name: Patch CSP for Google Ads and Tag Assistant
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('staticwebapp.config.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          csp = data['globalHeaders']['Content-Security-Policy']

          directives = {}
          order = []
          for raw in csp.split(';'):
              raw = raw.strip()
              if not raw:
                  continue
              parts = raw.split()
              name = parts[0]
              directives[name] = parts[1:]
              order.append(name)

          def ensure(name, *sources):
              if name not in directives:
                  directives[name] = []
                  # Keep script-src-elem beside script-src when possible.
                  if name == 'script-src-elem' and 'script-src' in order:
                      order.insert(order.index('script-src') + 1, name)
                  else:
                      order.append(name)
              for source in sources:
                  if source not in directives[name]:
                      directives[name].append(source)

          ensure('script-src',
                 'https://www.googletagmanager.com',
                 'https://*.googletagmanager.com',
                 'https://www.googleadservices.com')
          ensure('script-src-elem',
                 "'self'",
                 'https://www.googletagmanager.com',
                 'https://*.googletagmanager.com',
                 'https://www.googleadservices.com')
          ensure('img-src',
                 'https://*.googletagmanager.com',
                 'https://www.googleadservices.com',
                 'https://googleads.g.doubleclick.net')
          ensure('connect-src',
                 'https://*.googletagmanager.com',
                 'https://www.googleadservices.com',
                 'https://googleads.g.doubleclick.net')

          data['globalHeaders']['Content-Security-Policy'] = '; '.join(
              [name + (' ' + ' '.join(directives[name]) if directives[name] else '') for name in order]
          ) + ';'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Validate CSP patch
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool staticwebapp.config.json >/dev/null
          grep -F "script-src-elem 'self' https://www.googletagmanager.com https://*.googletagmanager.com https://www.googleadservices.com" staticwebapp.config.json
          grep -F "https://googleads.g.doubleclick.net" staticwebapp.config.json
          grep -F "https://www.googleadservices.com" staticwebapp.config.json

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-google-ads-csp.yml
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add staticwebapp.config.json .github/workflows/one-shot-google-ads-csp.yml
          git commit -m "fix(csp): allow Google Ads conversion endpoints"
          git push origin HEAD:fix/google-ads-csp-endpoints
