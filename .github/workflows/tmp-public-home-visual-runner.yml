name: Temporary public home visual runner

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/public-home-visual-final'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/public-home-visual-final
          fetch-depth: 0
      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tmp_public_home_visual_final.py
          python3 .github/scripts/public_home_integrity.py
          grep -F 'Cristian_Avila_Formulario.png' src/features/public-support/index.js
          grep -F 'public-support-person' src/features/public-support/index.js
          grep -F 'public-support-title-accent' src/css/views/public/support-request.css
          grep -F 'public-support-postal-hint' src/css/views/public/support-request.css
          ! grep -F 'field("country", "País"' src/features/public-support/index.js
          grep -F 'country: "España"' src/features/public-support/index.js
          test -s src/media/img/Cristian_Avila_Formulario.png
      - name: Commit final product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Onion Support'
          git config user.email 'cristian@onionsupport.com'
          rm -f .github/scripts/tmp_public_home_visual_final.py
          rm -f .github/workflows/tmp-public-home-visual-final.yml
          rm -f .github/workflows/tmp-public-home-visual-pr.yml
          rm -f .github/workflows/tmp-public-home-visual-runner.yml
          rm -f .github/tmp-public-home-visual-trigger.txt
          rm -f .github/tmp-public-home-visual-trigger-v2.txt
          rm -f .github/tmp-public-home-visual-trigger-v3.txt
          git add -A
          git diff --cached --check
          git commit -m 'feat: elevate public home support experience'
          git push origin HEAD:feat/public-home-visual-final
