name: Incidencias Stat Cards Once

on:
  push:
    branches:
      - ux/incidencias-stat-cards-interactive-20260817

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux/incidencias-stat-cards-interactive-20260817
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Incidencias stat-card interaction polish
        run: python3 .github/scripts/patch-incidencias-stat-cards.py

      - name: Validate JS syntax
        run: |
          node --check src/views/incidencias/incidencias.template.js
          node --check src/views/incidencias/index.js
          node --check src/views/incidencias/incidencias.api.js
          node --check src/views/incidencias/incidencias.template.create.js
          node --check src/views/incidencias/incidencias.template.modal.js

      - name: Smoke interactive stat cards
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {
            renderIncidenciasTemplate,
            INCIDENCIAS_ACTIONS,
          } from './src/views/incidencias/incidencias.template.js';

          const items = [
            { ticketId: 'INC-A', subject: 'Importe 450', status: 'open', priority: 'medium', invoiceTotal: 450, createdAt: '2026-08-17T10:00:00Z', updatedAt: '2026-08-17T10:00:00Z' },
            { ticketId: 'INC-B', subject: 'Importe 500 urgente', status: 'closed', priority: 'urgent', invoiceTotal: 500, createdAt: '2026-08-17T09:00:00Z', updatedAt: '2026-08-17T09:00:00Z' },
            { ticketId: 'INC-C', subject: 'Importe 300 critica', status: 'open', priority: 'critical', invoiceTotal: 300, createdAt: '2026-08-17T11:00:00Z', updatedAt: '2026-08-17T11:00:00Z' },
          ];

          const base = {
            canonical: true,
            items,
            total: items.length,
            visibleLimit: 20,
            stats: { total: 3, open: 2, closed: 1, urgent: 2, attachments: 0, invoiceTotal: 1250, lastUpdateTs: Date.parse('2026-08-17T11:00:00Z') },
          };

          const urgent = renderIncidenciasTemplate({ ...base, filter: 'urgent', sortMode: 'date', sortOrder: 'desc' });
          for (const token of [
            `data-incidencias-action="${INCIDENCIAS_ACTIONS.STAT_APPLY}"`,
            'data-stat="open"',
            'data-stat="closed"',
            'data-stat="urgent"',
            'data-stat="amount"',
            'data-filter="urgent"',
          ]) {
            if (!urgent.includes(token)) throw new Error(`Missing token: ${token}`);
          }
          if (urgent.includes('data-ticket-id="INC-A"')) throw new Error('Non-urgent ticket leaked into urgent filter');
          if (!urgent.includes('data-ticket-id="INC-B"') || !urgent.includes('data-ticket-id="INC-C"')) throw new Error('Urgent/critical tickets were not rendered');

          const amount = renderIncidenciasTemplate({ ...base, filter: 'all', sortMode: 'amount', sortOrder: 'desc' });
          const b = amount.indexOf('data-ticket-id="INC-B"');
          const a = amount.indexOf('data-ticket-id="INC-A"');
          const c = amount.indexOf('data-ticket-id="INC-C"');
          if (!(b >= 0 && a >= 0 && c >= 0 && b < a && a < c)) throw new Error('Amount descending order is incorrect');
          if (!amount.includes('Importe ↓')) throw new Error('Amount sort label is not visible');

          console.log('Interactive stat-card smoke OK');
          NODE

      - name: Validate controller and CSS contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('src/views/incidencias/index.js').read_text(encoding='utf-8')
          css = Path('src/css/views/incidencias/index.css').read_text(encoding='utf-8')
          template = Path('src/views/incidencias/incidencias.template.js').read_text(encoding='utf-8')

          for token in ['let sortMode =', 'INCIDENCIAS_ACTIONS.STAT_APPLY', 'function applyStatAction(', 'sortMode = "amount";']:
              if token not in index:
                  raise SystemExit(f'Missing controller token: {token}')

          if 'function filteredItems()' in index:
              raise SystemExit('Duplicate filteredItems implementation still exists')

          for token in ['.incidencias-stat-card:focus-visible', '.incidencias-stat-card.is-active', 'cursor: pointer;']:
              if token not in css:
                  raise SystemExit(f'Missing CSS token: {token}')

          for token in ['STAT_APPLY: "stat-apply"', 'function normalizeSortMode(', 'if (f === "urgent") return isUrgent(it);', 'sortMode === "amount"']:
              if token not in template:
                  raise SystemExit(f'Missing template token: {token}')

          print('Controller/CSS contract OK')
          PY

      - name: Commit product changes and clean one-shot files
        shell: bash
        run: |
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git rm .github/workflows/incidencias-stat-cards-once.yml .github/scripts/patch-incidencias-stat-cards.py
          git add src/views/incidencias/incidencias.template.js src/views/incidencias/index.js src/css/views/incidencias/index.css
          git commit -m "feat(incidencias): cards de resumen interactivas y orden por importe"
          git push origin ux/incidencias-stat-cards-interactive-20260817
