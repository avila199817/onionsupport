name: Trusted PR Integrity

run-name: Trusted PR Integrity · #${{ github.event.pull_request.number }}

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

concurrency:
  group: trusted-pr-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Trusted PR integrity
    runs-on: ubuntu-latest
    timeout-minutes: 7
    if: github.event.action != 'closed'

    outputs:
      candidate_sha: ${{ steps.revisions.outputs.candidate_sha }}
      trusted_sha: ${{ steps.revisions.outputs.trusted_sha }}

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PUBLIC_SITE_URL: "https://onionsupport.com"
      DIRECT_API_URL: "https://api.onionsupport.com"

    steps:
      - name: Resolve immutable revisions
        id: revisions
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for value in "${CANDIDATE_SHA}" "${TRUSTED_SHA}"; do
            if [[ ! "${value}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=SHA inválido::Revision no inmutable: '${value}'."
              exit 1
            fi
          done

          if [[ "${CANDIDATE_SHA}" == "${TRUSTED_SHA}" ]]; then
            echo "::error title=Candidate inesperado::Candidate y base no pueden ser idénticos."
            exit 1
          fi

          echo "candidate_sha=${CANDIDATE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "trusted_sha=${TRUSTED_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Candidate SHA: ${CANDIDATE_SHA}"
          echo "Trusted base SHA: ${TRUSTED_SHA}"

      - name: Checkout trusted integrity tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revisions.outputs.trusted_sha }}
          path: trusted-integrity-source
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Stage trusted integrity tooling
        working-directory: trusted-integrity-source
        shell: bash
        run: |
          set -euo pipefail

          destination="${RUNNER_TEMP}/onion-trusted-integrity"
          rm -rf "${destination}"
          mkdir -p "${destination}"

          install -m 0644 .github/ci/validate_candidate_paths.py \
            "${destination}/validate_candidate_paths.py"
          install -m 0644 .github/ci/validate_integrity_candidate.py \
            "${destination}/validate_integrity_candidate.py"
          install -m 0755 .github/ci/validate_static_release.sh \
            "${destination}/validate_static_release.sh"
          install -m 0755 .github/ci/validate_production_contract.sh \
            "${destination}/validate_production_contract.sh"
          install -m 0755 .github/ci/validate_spa_contracts.sh \
            "${destination}/validate_spa_contracts.sh"
          install -m 0644 .github/scripts/repo_integrity.py \
            "${destination}/repo_integrity.py"
          install -m 0644 .github/scripts/app_entrypoint_integrity.py \
            "${destination}/app_entrypoint_integrity.py"
          install -m 0644 .github/scripts/boot_visual_integrity.py \
            "${destination}/boot_visual_integrity.py"
          install -m 0644 .github/scripts/cuenta_integrity.py \
            "${destination}/cuenta_integrity.py"
          install -m 0644 .github/scripts/public_home_integrity.py \
            "${destination}/public_home_integrity.py"
          install -m 0644 .github/scripts/public_home_performance.py \
            "${destination}/public_home_performance.py"

      # Deliberate exception: this checkout contains untrusted PR bytes.
      # Nothing from it is executed as a script, action, hook or dependency.
      - name: Checkout candidate as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revisions.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 2
          submodules: false
          lfs: false
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Assert immutable checkouts
        env:
          CANDIDATE_SHA: ${{ steps.revisions.outputs.candidate_sha }}
          TRUSTED_SHA: ${{ steps.revisions.outputs.trusted_sha }}
        shell: bash
        run: |
          set -euo pipefail

          actual_candidate="$(git -C candidate rev-parse HEAD)"
          actual_trusted="$(git -C trusted-integrity-source rev-parse HEAD)"

          if [[ "${actual_candidate}" != "${CANDIDATE_SHA}" ]]; then
            echo "::error title=Candidate checkout incorrecto::Esperado ${CANDIDATE_SHA}, obtenido ${actual_candidate}."
            exit 1
          fi

          if [[ "${actual_trusted}" != "${TRUSTED_SHA}" ]]; then
            echo "::error title=Trusted checkout incorrecto::Esperado ${TRUSTED_SHA}, obtenido ${actual_trusted}."
            exit 1
          fi

          if [[ -n "$(git -C candidate status --porcelain --untracked-files=all)" ]]; then
            echo "::error title=Candidate checkout sucio::El checkout candidato contiene mutaciones inesperadas."
            git -C candidate status --short
            exit 1
          fi

          echo "Immutable candidate: ${actual_candidate}"
          echo "Immutable trusted base: ${actual_trusted}"

      - name: Validate candidate path boundary
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        shell: bash
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/validate_candidate_paths.py"

      - name: Validate candidate canonical site
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail

          marker=".github/ci/canonical-apex-v1"

          if [[ ! -f "${marker}" ]] || [[ "$(cat "${marker}")" != "canonical-apex-v1" ]]; then
            echo "::error file=${marker},title=Marcador canonical inválido::Debe existir y contener exactamente canonical-apex-v1."
            exit 1
          fi

          echo "PUBLIC_SITE_URL=https://onionsupport.com" >> "${GITHUB_ENV}"
          echo "Candidate canonical: https://onionsupport.com"

      - name: Validate candidate SWA helper syntax as data
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail

          bash -n .github/ci/validate_static_release.sh
          bash -n .github/ci/validate_production_contract.sh
          bash -n .github/ci/validate_spa_contracts.sh

          echo "Candidate SWA helper syntax OK."

      - name: Validate static release contract
        working-directory: candidate
        shell: bash
        run: bash "${RUNNER_TEMP}/onion-trusted-integrity/validate_static_release.sh"

      - name: Validate production SEO and routing contract
        working-directory: candidate
        shell: bash
        run: bash "${RUNNER_TEMP}/onion-trusted-integrity/validate_production_contract.sh"

      - name: Reject legacy API domain from runtime
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail

          legacy_domain="onionit"".""net"

          if git grep -n -I -F "${legacy_domain}" -- . \
            ':(exclude).github/**' \
            ':(exclude)docs/**' \
            ':(exclude)tests/**' \
            ':(exclude)test/**' \
            ':(exclude)fixtures/**'; then
            echo "::error title=Dominio API legado detectado::El runtime aún contiene referencias a ${legacy_domain}."
            exit 1
          fi

          echo "Runtime desplegable sin referencias al dominio API legado."

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate critical SPA contracts
        working-directory: candidate
        shell: bash
        run: bash "${RUNNER_TEMP}/onion-trusted-integrity/validate_spa_contracts.sh"

      - name: Validate JavaScript syntax as data
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            find src -type f -name '*.js' -print0 | sort -z
          )

          if (( ${#files[@]} == 0 )); then
            echo "::error title=JavaScript ausente::No JavaScript files found under src/."
            exit 1
          fi

          failed=0

          for file in "${files[@]}"; do
            if ! node --check "${file}" >/dev/null 2>&1; then
              echo "::error title=JavaScript syntax inválida::${file}"
              failed=1
            fi
          done

          (( failed == 0 )) || exit 1
          echo "JavaScript syntax OK · ${#files[@]} files"

      - name: Validate repository contracts
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/repo_integrity.py"

      - name: Validate single app entrypoint
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/app_entrypoint_integrity.py"

      - name: Validate boot visual contract
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/boot_visual_integrity.py"

      - name: Validate Cuenta canonical surface
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/cuenta_integrity.py"

      - name: Validate public frontend contract
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/public_home_integrity.py"

      - name: Validate public-home frame budget
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/public_home_performance.py"

      - name: Validate candidate CI and static syntax
        working-directory: candidate
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-trusted-integrity/validate_integrity_candidate.py"

      - name: Assert candidate remains unmodified
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::error title=Candidate mutado::La validación trusted modificó el checkout candidato."
            git status --short
            exit 1
          fi

          echo "Candidate remains byte-for-byte unmodified."

      - name: Reject unresolved merge markers
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE '^(<<<<<<< |>>>>>>> )' \
            src .github staticwebapp.config.json robots.txt sitemap.xml; then
            echo "::error title=Merge markers::Unresolved merge markers detected."
            exit 1
          fi

      - name: Validate candidate commit whitespace
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD

  build_candidate_dist:
    name: Build candidate dist without secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - integrity

    if: github.event.action != 'closed'

    permissions:
      contents: read

    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Checkout candidate build input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.integrity.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Assert immutable candidate build input
        working-directory: candidate
        env:
          CANDIDATE_SHA: ${{ needs.integrity.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${CANDIDATE_SHA}" ]]; then
            echo "::error title=Candidate build incorrecto::Esperado ${CANDIDATE_SHA}, obtenido ${actual_sha}."
            exit 1
          fi

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::error title=Candidate build sucio::El checkout contiene mutaciones previas."
            git status --short
            exit 1
          fi

      - name: Use exact Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Use exact npm
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare npm@10.9.8 --activate
          [[ "$(node --version)" == "v22.23.2" ]]
          [[ "$(npm --version)" == "10.9.8" ]]

      # This job intentionally executes candidate build code, but it has no
      # secrets, no write permission and no persisted checkout credentials.
      - name: Install locked candidate dependencies
        working-directory: candidate
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and self-check candidate artifact
        working-directory: candidate
        env:
          ONION_RELEASE_SHA: ${{ needs.integrity.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run check:dist
          npm run build:repro
          npm run test:browser:dist

      - name: Assert tracked candidate remains unmodified
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error title=Build mutó archivos versionados::"
            git status --short
            exit 1
          fi

      - name: Name immutable build artifact
        id: artifact
        env:
          CANDIDATE_SHA: ${{ needs.integrity.outputs.candidate_sha }}
        shell: bash
        run: echo "name=frontend-dist-${CANDIDATE_SHA}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload candidate artifact for trusted validation
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            candidate/dist
            candidate/build-metadata
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  validate_dist_artifact:
    name: Validate dist with trusted base tooling
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs:
      - integrity
      - build_candidate_dist

    if: github.event.action != 'closed'

    permissions:
      contents: read

    outputs:
      trusted_artifact_id: ${{ steps.upload_trusted.outputs.artifact-id }}
      trusted_artifact_digest: ${{ steps.upload_trusted.outputs.artifact-digest }}
      trusted_artifact_name: ${{ steps.trusted_artifact.outputs.name }}
      trusted_manifest_digest: ${{ steps.provenance.outputs.manifest_digest }}

    steps:
      - name: Checkout trusted dist validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.integrity.outputs.trusted_sha }}
          path: trusted-validator
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      # Data-only checkout: no candidate script, action, hook or dependency is
      # executed in this trusted validation job.
      - name: Checkout candidate source as validation data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.integrity.outputs.candidate_sha }}
          path: candidate-data
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Download exact candidate artifact by ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build_candidate_dist.outputs.artifact_id }}
          path: artifact
          merge-multiple: true

      - name: Use exact Node 22 for trusted validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Use exact trusted npm
        working-directory: trusted-validator
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare npm@10.9.8 --activate
          [[ "$(node --version)" == "v22.23.2" ]]
          [[ "$(npm --version)" == "10.9.8" ]]

      - name: Prove trusted provenance regressions
        working-directory: trusted-validator
        shell: bash
        run: npm run test:trusted-build

      - name: Stage candidate data behind trusted build tooling
        env:
          ONION_TRUSTED_SOURCE_DIR: ${{ github.workspace }}/trusted-validator
          ONION_CANDIDATE_SOURCE_DIR: ${{ github.workspace }}/candidate-data
          ONION_STAGED_BUILD_DIR: ${{ github.workspace }}/trusted-rebuild
        shell: bash
        run: node trusted-validator/tools/stage-trusted-build.mjs

      - name: Install locked trusted build dependencies
        working-directory: trusted-rebuild
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Only package.json, lockfile, Vite config and tools from the immutable
      # base are executable here. Candidate HTML/src/static files are data.
      - name: Build trusted reference from candidate data
        working-directory: trusted-rebuild
        env:
          ONION_RELEASE_SHA: ${{ needs.integrity.outputs.candidate_sha }}
          ONION_CANDIDATE_SOURCE_DIR: ${{ github.workspace }}/candidate-data
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run check:dist
          npm run build:repro

      - name: Materialize exact trusted artifact in this runner
        shell: bash
        run: |
          set -euo pipefail

          if [[ -e trusted-artifact ]]; then
            echo "::error title=Envelope trusted preexistente::trusted-artifact debe crearse desde cero en este job."
            exit 1
          fi

          mkdir trusted-artifact
          cp -a trusted-rebuild/dist trusted-artifact/dist
          cp -a trusted-rebuild/build-metadata trusted-artifact/build-metadata

          mapfile -d '' roots < <(
            find trusted-artifact -mindepth 1 -maxdepth 1 -printf '%f\0' | sort -z
          )
          if (( ${#roots[@]} != 2 )) || \
            [[ "${roots[0]}" != "build-metadata" ]] || \
            [[ "${roots[1]}" != "dist" ]]; then
            echo "::error title=Envelope trusted no exacto::Sólo se permiten dist y build-metadata."
            printf 'Root inesperado: %q\n' "${roots[@]}"
            exit 1
          fi

          for path in trusted-artifact/dist trusted-artifact/build-metadata; do
            if [[ ! -d "${path}" ]] || [[ -L "${path}" ]]; then
              echo "::error title=Envelope trusted inválido::${path} debe ser un directorio real."
              exit 1
            fi
          done

      - name: Validate candidate artifact and prove trusted byte provenance
        id: provenance
        env:
          ONION_BUILD_OUT_DIR: ${{ github.workspace }}/artifact/dist
          ONION_BUILD_METADATA_DIR: ${{ github.workspace }}/artifact/build-metadata
          ONION_CANDIDATE_SOURCE_DIR: ${{ github.workspace }}/candidate-data
          ONION_CANDIDATE_ARTIFACT_DIR: ${{ github.workspace }}/artifact
          ONION_TRUSTED_ARTIFACT_DIR: ${{ github.workspace }}/trusted-artifact
          ONION_ARTIFACT_DIR: ${{ github.workspace }}/artifact
          ONION_RELEASE_SHA: ${{ needs.integrity.outputs.candidate_sha }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build_candidate_dist.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail

          trusted_sha="$(git -C trusted-validator rev-parse HEAD)"
          candidate_sha="$(git -C candidate-data rev-parse HEAD)"
          if [[ "${trusted_sha}" != "${{ needs.integrity.outputs.trusted_sha }}" ]]; then
            echo "::error title=Validador trusted incorrecto::SHA inesperado ${trusted_sha}."
            exit 1
          fi

          if [[ "${candidate_sha}" != "${ONION_RELEASE_SHA}" ]]; then
            echo "::error title=Candidate data incorrecto::SHA inesperado ${candidate_sha}."
            exit 1
          fi

          if [[ ! "${EXPECTED_ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]; then
            echo "::error title=Digest de artifact inválido::${EXPECTED_ARTIFACT_DIGEST}"
            exit 1
          fi

          for path in \
            artifact/dist \
            artifact/build-metadata \
            trusted-artifact/dist \
            trusted-artifact/build-metadata; do
            if [[ ! -d "${path}" ]] || [[ -L "${path}" ]]; then
              echo "::error title=Raíz de artifact ausente::${path} debe existir en este runner y ser un directorio real."
              exit 1
            fi
          done

          node trusted-validator/tools/validate-dist.mjs
          node trusted-validator/tools/verify-artifact-envelope.mjs
          node trusted-validator/tools/compare-build-artifacts.mjs

          manifest_digest="$(sha256sum trusted-artifact/build-metadata/release-manifest.json | awk '{print $1}')"
          if [[ ! "${manifest_digest}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Digest de manifest inválido::${manifest_digest}"
            exit 1
          fi
          echo "manifest_digest=${manifest_digest}" >> "${GITHUB_OUTPUT}"

          echo "Candidate artifact ID: ${{ needs.build_candidate_dist.outputs.artifact_id }}"
          echo "Candidate archive digest: ${EXPECTED_ARTIFACT_DIGEST}"
          echo "Trusted manifest digest: ${manifest_digest}"

      - name: Name trusted rebuild artifact
        id: trusted_artifact
        env:
          CANDIDATE_SHA: ${{ needs.integrity.outputs.candidate_sha }}
        shell: bash
        run: echo "name=frontend-trusted-dist-${CANDIDATE_SHA}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload trusted rebuild for later preview deployment
        id: upload_trusted
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ steps.trusted_artifact.outputs.name }}
          path: |
            trusted-artifact/dist
            trusted-artifact/build-metadata
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  # Bootstrap PR-A itself still runs the old workflow from its base and deploys
  # the legacy root. Once PR-A is on main, later PRs consume only this artifact
  # rebuilt with base tooling. Production remains on the legacy root workflow.
  deploy_preview:
    name: Deploy trusted PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - integrity
      - validate_dist_artifact

    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read

    env:
      VALIDATED_SHA: ${{ needs.integrity.outputs.candidate_sha }}
      TRUSTED_SHA: ${{ needs.integrity.outputs.trusted_sha }}
      TRUSTED_MANIFEST_DIGEST: ${{ needs.validate_dist_artifact.outputs.trusted_manifest_digest }}

    steps:
      - name: Resolve preview environment
        id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          preview="pr${PR_NUMBER}"

          if [[ ! "${preview}" =~ ^[A-Za-z0-9]{1,16}$ ]]; then
            echo "::error title=Preview environment inválido::Nombre '${preview}' fuera del contrato."
            exit 1
          fi

          echo "name=${preview}" >> "${GITHUB_OUTPUT}"
          echo "Trusted preview environment: ${preview}"

      - name: Checkout trusted preview tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TRUSTED_SHA }}
          path: trusted-preview-source
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Download exact trusted rebuild by ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate_dist_artifact.outputs.trusted_artifact_id }}
          path: trusted-artifact
          merge-multiple: true

      - name: Use exact Node 22 for trusted artifact verification
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Assert immutable preview inputs
        env:
          EXPECTED_ARCHIVE_DIGEST: ${{ needs.validate_dist_artifact.outputs.trusted_artifact_digest }}
          ONION_ARTIFACT_DIR: ${{ github.workspace }}/trusted-artifact
          ONION_RELEASE_SHA: ${{ env.VALIDATED_SHA }}
          EXPECTED_MANIFEST_DIGEST: ${{ env.TRUSTED_MANIFEST_DIGEST }}
        shell: bash
        run: |
          set -euo pipefail

          actual_trusted="$(git -C trusted-preview-source rev-parse HEAD)"

          if [[ "${actual_trusted}" != "${TRUSTED_SHA}" ]]; then
            echo "::error title=Trusted preview incorrecto::Esperado ${TRUSTED_SHA}, obtenido ${actual_trusted}."
            exit 1
          fi

          if [[ ! "${EXPECTED_ARCHIVE_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]; then
            echo "::error title=Digest de artifact trusted inválido::${EXPECTED_ARCHIVE_DIGEST}"
            exit 1
          fi

          if [[ ! "${TRUSTED_MANIFEST_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Digest de manifest trusted inválido::${TRUSTED_MANIFEST_DIGEST}"
            exit 1
          fi

          node trusted-preview-source/tools/verify-artifact-envelope.mjs

          echo "Trusted artifact ID: ${{ needs.validate_dist_artifact.outputs.trusted_artifact_id }}"
          echo "Trusted artifact digest: ${EXPECTED_ARCHIVE_DIGEST}"
          echo "Immutable preview tooling: ${actual_trusted}"

      - name: Validate preview deployment token
        env:
          SWA_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SWA_API_TOKEN:-}" ]]; then
            echo "::error title=Secret no configurado::Falta AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E."
            exit 1
          fi

      - name: Deploy trusted static preview
        id: deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}
          action: upload
          app_location: trusted-artifact/dist
          api_location: ""
          output_location: ""
          skip_app_build: true
          deployment_environment: ${{ steps.preview.outputs.name }}

      - name: Verify trusted preview release bytes
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          ONION_ARTIFACT_DIR: ${{ github.workspace }}/trusted-artifact
          ONION_RELEASE_SHA: ${{ env.VALIDATED_SHA }}
          EXPECTED_MANIFEST_DIGEST: ${{ env.TRUSTED_MANIFEST_DIGEST }}
        shell: bash
        run: node trusted-preview-source/tools/verify-deployed-dist.mjs

      - name: Preview summary
        if: always()
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          PREVIEW_ENV: ${{ steps.preview.outputs.name }}
        shell: bash
        run: |
          {
            echo "## Trusted SWA preview"
            echo
            echo "- Environment: \`${PREVIEW_ENV}\`"
            echo "- Candidate SHA: \`${VALIDATED_SHA}\`"
            if [[ -n "${DEPLOYED_URL:-}" ]]; then
              echo "- URL: ${DEPLOYED_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  close_preview:
    name: Close trusted PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read

    steps:
      - name: Resolve preview environment
        id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          preview="pr${PR_NUMBER}"

          if [[ ! "${preview}" =~ ^[A-Za-z0-9]{1,16}$ ]]; then
            echo "::error title=Preview environment inválido::Nombre '${preview}' fuera del contrato."
            exit 1
          fi

          echo "name=${preview}" >> "${GITHUB_OUTPUT}"
          echo "Closing trusted preview environment: ${preview}"

      - name: Validate preview deployment token
        env:
          SWA_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SWA_API_TOKEN:-}" ]]; then
            echo "::error title=Secret no configurado::Falta AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E."
            exit 1
          fi

      - name: Close trusted Azure SWA preview
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}
          action: close
          deployment_environment: ${{ steps.preview.outputs.name }}
