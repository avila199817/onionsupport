# =========================================================
# ONION SUPPORT — PUBLIC HOME INTEGRITY
# Contrato único para landing, intake, arranque visual, rendimiento y mejoras públicas.
# =========================================================

name: Public Home Integrity

run-name: Public Home · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name || 'manual' }}

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "docs/PUBLIC_TICKET_INTAKE.md"
      - "src/app/enhancements.js"
      - "src/app/loader.js"
      - "src/features/public-support/**"
      - "src/features/public-support-progress/**"
      - "src/features/public-home-experience/**"
      - "src/views/public/home/**"
      - "src/css/app.css"
      - "src/css/views/public/**"
      - ".github/scripts/public_home_integrity.py"
      - ".github/scripts/public_home_performance.py"
      - ".github/scripts/boot_visual_integrity.py"
      - ".github/workflows/public-home-contract.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-home-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public home
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout authoritative source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate public JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app/enhancements.js
          node --check src/app/loader.js
          node --check src/features/public-support/index.js
          node --check src/features/public-support-progress/index.js
          node --check src/features/public-home-experience/index.js
          node --check src/views/public/home/index.js
          node --check src/views/public/home/template.js

      - name: Validate public frontend contract
        run: python3 .github/scripts/public_home_integrity.py

      - name: Validate public-home frame budget
        run: python3 .github/scripts/public_home_performance.py

      - name: Validate cold-boot visual contract
        run: python3 .github/scripts/boot_visual_integrity.py
