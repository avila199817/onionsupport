name: Apply public home integrity version

on:
  push:
    branches:
      - fix/public-home-integrity-version

permissions:
  contents: write

jobs:
  apply:
    name: Align public home integrity versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout working branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/public-home-integrity-version
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: true

      - name: Align authoritative version assertions
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/public_home_integrity.py')
          source = path.read_text(encoding='utf-8')

          replacements = (
              (
                  'public-support.intake.v9-structured-address',
                  'public-support.intake.v10-canonical-panel-handoff',
                  'public support version',
              ),
              (
                  'public-home.experience.v3-coalesced-observer',
                  'public-home.experience.v4-canonical-session-handoff',
                  'public home experience version',
              ),
          )

          changed = False
          for old, new, label in replacements:
              if old in source:
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f'{label}: expected one old token, found {count}')
                  source = source.replace(old, new, 1)
                  changed = True
              elif new not in source:
                  raise SystemExit(f'{label}: neither old nor new token found')

          if changed:
              path.write_text(source, encoding='utf-8')

          print('integrity versions aligned' if changed else 'integrity versions already aligned')
          PY

      - name: Validate public home contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/public_home_integrity.py
          git diff --check

      - name: Commit authoritative contract update
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo 'Branch already contains the requested contract alignment.'
            exit 0
          fi

          git config user.name 'Onion Support'
          git config user.email 'cristian@onionsupport.com'
          git add .github/scripts/public_home_integrity.py
          git commit -m 'test(public): alinear versiones del contrato home'
          git push origin "HEAD:${GITHUB_REF_NAME}"
