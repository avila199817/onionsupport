name: TEMP Refactor Home Entity Rows

on:
  push:
    branches:
      - refactor/home-entity-row-hit-targets

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/home-entity-row-hit-targets
          fetch-depth: 0

      - name: Apply structural refactor
        shell: bash
        run: python3 .github/tmp/refactor_home_entity_rows.py

      - name: Validate structural contract
        shell: bash
        run: |
          node --check src/views/home/home.template.js
          node --experimental-default-type=module .github/scripts/entity_overlay_contract.mjs
          python3 .github/scripts/app_entrypoint_integrity.py
          bash .github/ci/validate_spa_contracts.sh
          git diff --check

      - name: Commit refactor when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Onion Support CI"
          git config user.email "cristian@onionsupport.com"
          git add src/views/home/home.template.js src/css/views/home/index.css .github/scripts/entity_overlay_contract.mjs
          git commit -m "refactor: desacoplar interacción del layout de filas Home [home-row-refactor-done]"
          git push origin HEAD:refactor/home-entity-row-hit-targets
