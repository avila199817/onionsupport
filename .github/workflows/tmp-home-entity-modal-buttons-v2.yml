name: TEMP Home Entity Modal Buttons V2

on:
  push:
    branches:
      - feat/home-entity-modal-buttons

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/home-entity-modal-buttons
          fetch-depth: 0

      - name: Guard patched commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[home-entity-modal-buttons-patched\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply Home patch
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: python3 .github/tmp/home_entity_modal_buttons_patch.py

      - name: Validate Home modal buttons
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          node --check src/views/home/home.template.js
          node --experimental-default-type=module .github/scripts/entity_overlay_contract.mjs
          python3 .github/scripts/app_entrypoint_integrity.py
          bash .github/ci/validate_spa_contracts.sh
          git diff --check

      - name: Commit Home modal buttons
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Onion Support CI"
          git config user.email "cristian@onionsupport.com"
          git add src/views/home/home.template.js src/css/views/home/index.css .github/scripts/entity_overlay_contract.mjs
          git commit -m "feat: abrir entidades del Home en modal [home-entity-modal-buttons-patched]"
          git push origin HEAD:feat/home-entity-modal-buttons
