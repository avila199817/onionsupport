name: Repository Contract Sweep 2 PR Helper

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout sweep branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply contract sweep
        run: |
          set -euo pipefail
          python3 .github/scripts/repo_contract_sweep_2.py
          python3 .github/scripts/repo_integrity.py
          git diff --check

      - name: Commit sweep
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add src/core/config.js src/router/routes.js src/ui/topbar/index.js src/ui/sidebar/index.js src/ui/sidebar/template.js
          git commit -m "refactor(core): alinear rutas, shell y medios runtime"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
