name: TEMP Correo final UX polish

on:
  push:
    branches:
      - polish/correo-final-ux-signature

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'run Correo final UX polish')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: polish/correo-final-ux-signature
          fetch-depth: 0

      - name: Apply fail-closed patch
        run: python3 .github/scripts/tmp_correo_final_ux_patch.py

      - name: Validate final Correo patch
        shell: bash
        run: |
          set -euo pipefail
          node --check src/views/correo/index.js
          node --check src/views/correo/correo.template.js
          python3 .github/scripts/correo_integrity.py
          python3 .github/scripts/repo_integrity.py
          bash .github/ci/validate_spa_contracts.sh
          node .github/scripts/continuous_scroll_smoke.mjs
          python3 .github/scripts/artifact_hygiene.py
          git diff --check

      - name: Commit product changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Onion Support'
          git config user.email 'cristian@onionsupport.com'
          git add src/views/correo/index.js src/views/correo/correo.template.js src/css/views/correo/index.css .github/scripts/correo_integrity.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
            exit 1
          fi
          git commit -m 'fix: afinar UX final de Correo y firma'
          git push origin HEAD:polish/correo-final-ux-signature
