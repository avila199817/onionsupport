name: Incidencias avatar tone fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Resolve avatar gradients at avatar scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/css/views/incidencias/index.css')
          text = path.read_text(encoding='utf-8')
          old = 'background: var(--inc-avatar-bg);'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 avatar backgrounds, found {count}')
          text = text.replace(old, 'background: linear-gradient(135deg, var(--inc-avatar-a), var(--inc-avatar-b));')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/css/views/incidencias/index.css
          git commit -m 'fix(incidencias): resolve avatar tones per identity [incidencias-avatar-tone-applied]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
