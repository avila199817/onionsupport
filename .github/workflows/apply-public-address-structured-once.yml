name: Apply structured public address once

on:
  push:
    branches:
      - fix/public-address-structured
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'fix/public-address-structured')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/public-address-structured
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact structured-address patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/features/public-support/index.js')
          s = p.read_text(encoding='utf-8')

          def replace_exact(before, after, label):
              global s
              n = s.count(before)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {n}')
              s = s.replace(before, after, 1)

          replace_exact(
              '${field("address", "Dirección", "text", "Calle, número, localidad y CP", "street-address", 220)}',
              '''${field("address", "Calle y número", "text", "Calle, número", "address-line1", 180)}
          ${field("addressLine2", "Piso / puerta", "text", "Piso, puerta, escalera (opcional)", "address-line2", 120, "", "", { required: false })}
          ${field("postalCode", "Código postal", "text", "08001", "postal-code", 5, "numeric")}
          ${field("city", "Ciudad", "text", "Barcelona", "address-level2", 90)}
          ${field("province", "Provincia", "text", "Barcelona", "address-level1", 90)}
          ${field("country", "País", "text", "España", "country-name", 90, "", "España", { readonly: true })}''',
              'form fields'
          )

          replace_exact(
              '''function field(name, label, type, placeholder, autocomplete, maxlength, inputmode = "", value = "") {
  const mode = inputmode ? ` inputmode="${inputmode}"` : "";
  const initialValue = value ? ` value="${value}"` : "";
  const phoneAttrs = name === "phone"
    ? ` aria-label="Teléfono de España"`
    : "";

  return `<div class="public-support-field">
    <label for="public-support-${name}">${label}</label>
    <input id="public-support-${name}" name="${name}" type="${type}"${mode}${initialValue}${phoneAttrs}
      autocomplete="${autocomplete}" maxlength="${maxlength}" required placeholder="${placeholder}">
    ${errorNode(name)}
  </div>`;
}''',
              '''function field(
  name,
  label,
  type,
  placeholder,
  autocomplete,
  maxlength,
  inputmode = "",
  value = "",
  options = {}
) {
  const mode = inputmode ? ` inputmode="${inputmode}"` : "";
  const initialValue = value ? ` value="${value}"` : "";
  const required = options?.required === false ? "" : " required";
  const readonly = options?.readonly === true
    ? ` readonly aria-readonly="true"`
    : "";
  const phoneAttrs = name === "phone"
    ? ` aria-label="Teléfono de España"`
    : "";

  return `<div class="public-support-field">
    <label for="public-support-${name}">${label}</label>
    <input id="public-support-${name}" name="${name}" type="${type}"${mode}${initialValue}${phoneAttrs}${readonly}
      autocomplete="${autocomplete}" maxlength="${maxlength}"${required} placeholder="${placeholder}">
    ${errorNode(name)}
  </div>`;
}''',
              'field helper'
          )

          replace_exact(
              '''function avatar(user) {''',
              '''function addressParts(user) {
  const value = first(user?.address, user?.direccion, user?.profile?.address, "");

  if (typeof value === "string") {
    return {
      address: text(value),
      addressLine2: "",
      postalCode: "",
      city: "",
      province: "",
      country: "España",
    };
  }

  const current = object(value) || {};
  return {
    address: text(first(current.street, current.line1, current.calle, "")),
    addressLine2: text(first(current.line2, current.linea2, "")),
    postalCode: text(first(current.postalCode, current.zip, current.cp, "")),
    city: text(first(current.city, current.locality, current.localidad, current.ciudad, "")),
    province: text(first(current.region, current.province, current.provincia, "")),
    country: text(first(current.country, current.pais, "España"), "España"),
  };
}

function avatar(user) {''',
              'addressParts helper'
          )

          replace_exact(
              '''  const values = {
    email: email(user),
    address: address(user),
  };''',
              '''  const values = {
    email: email(user),
    ...addressParts(user),
  };''',
              'prefill values'
          )

          replace_exact(
              '''    address: (v) => v.length >= 8 ? "" : "Introduce una dirección completa.",
    subject: (v) => v.length >= 4 ? "" : "Resume el problema en el asunto.",''',
              '''    address: (v) => v.length >= 5 ? "" : "Introduce la calle y el número.",
    postalCode: (v) => /^\\d{5}$/.test(v) ? "" : "Introduce un código postal español válido de 5 dígitos.",
    city: (v) => v.length >= 2 ? "" : "Introduce la ciudad.",
    province: (v) => v.length >= 2 ? "" : "Introduce la provincia.",
    country: (v) => {
      const normalized = text(v)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\\u0300-\\u036f]/g, "");
      return ["espana", "es", "spain"].includes(normalized)
        ? ""
        : "Este formulario solo admite direcciones de España.";
    },
    subject: (v) => v.length >= 4 ? "" : "Resume el problema en el asunto.",''',
              'validation rules'
          )

          replace_exact(
              '''    phone: normalizeSpanishPhone(data.get("phone")),
    address: text(data.get("address")).slice(0, 220),
    subject: text(data.get("subject")).slice(0, 140),''',
              '''    phone: normalizeSpanishPhone(data.get("phone")),
    address: text(data.get("address")).slice(0, 180),
    addressLine2: text(data.get("addressLine2")).slice(0, 120),
    postalCode: text(data.get("postalCode")).slice(0, 5),
    city: text(data.get("city")).slice(0, 90),
    province: text(data.get("province")).slice(0, 90),
    country: "España",
    subject: text(data.get("subject")).slice(0, 140),''',
              'payload fields'
          )

          for token in (
              'name="addressLine2"',
              'name="postalCode"',
              'name="city"',
              'name="province"',
              'name="country"',
              'postalCode: text(data.get("postalCode"))',
              'city: text(data.get("city"))',
              'province: text(data.get("province"))',
              'country: "España"',
              '...addressParts(user)',
          ):
              if token not in s:
                  raise SystemExit(f'missing invariant: {token}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate syntax and public-home contract
        shell: bash
        run: |
          set -euo pipefail
          node --check src/features/public-support/index.js
          python3 .github/scripts/public_home_integrity.py
          python3 .github/scripts/public_home_performance.py
          python3 .github/scripts/boot_visual_integrity.py

      - name: Commit patched frontend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/public-support/index.js
          if git diff --cached --quiet; then
            echo "No frontend changes to commit"
            exit 0
          fi
          git commit -m "fix: structure public support address"
          git push origin HEAD:fix/public-address-structured
