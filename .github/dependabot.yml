version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Madrid"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
    groups:
      npm-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:15"
      timezone: "Europe/Madrid"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
