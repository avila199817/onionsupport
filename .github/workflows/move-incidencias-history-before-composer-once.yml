name: Move Incidencias History Before Composer Once

on:
  push:
    branches:
      - fix/incidencias-history-visible-20260817
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Move history before composer
        run: python3 .github/scripts/move-incidencias-history-before-composer-once.py

      - name: Validate modal syntax and order
        shell: bash
        run: |
          set -euo pipefail
          node --check src/views/incidencias/incidencias.template.modal.js
          node --input-type=module <<'NODE'
          import { renderIncidenciasDetailModal } from './src/views/incidencias/incidencias.template.modal.js';
          const html = renderIncidenciasDetailModal({
            open: true,
            historyOpen: false,
            detail: {
              ticketId: 'INC-TEST-HISTORY',
              subject: 'Prueba historial visible',
              status: 'closed',
              priority: 'high',
              category: 'hardware',
              requesterSnapshot: { name: 'Cliente', email: 'cliente@example.com' },
              history: [{ id: 'h1', title: 'Cambio', body: 'Prueba', createdAt: '2026-08-17T07:00:00Z' }],
            },
          });
          const history = html.indexOf('data-modal-history-slot="true"');
          const composer = html.indexOf('data-modal-composer-slot="true"');
          if (history < 0 || composer < 0) throw new Error('history/composer slot missing');
          if (history > composer) throw new Error('history must render before composer');
          if (!html.includes('Ver historial')) throw new Error('history toggle copy missing');
          console.log('history-first modal smoke ok');
          NODE

      - name: Commit production fix and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/move-incidencias-history-before-composer-once.py
          git rm .github/workflows/move-incidencias-history-before-composer-once.yml
          git add src/views/incidencias/incidencias.template.modal.js
          git commit -m 'fix(incidencias): keep history visible before update composer'
          git push origin HEAD:fix/incidencias-history-visible-20260817
