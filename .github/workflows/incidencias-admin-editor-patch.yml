}

.incidencias-modal-admin-select-chevron {
  position: absolute;
  inset-block-start: 50%;
  inset-inline-end: 13px;
  transform: translateY(-54%);
  pointer-events: none;
  color: var(--text-muted);
  font-size: 16px;
