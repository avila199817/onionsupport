name: Facturas Create Polish Bootstrap

on:
  push:
    branches:
      - feat/facturas-create-line-items-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/facturas-create-line-items-polish
          fetch-depth: 0

      - name: Apply focused Facturas create polish
        shell: bash
        run: |
          set +e
          output="$(python .github/scripts/facturas_create_polish_bootstrap.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -Fq "retain ticket results after select: expected 1 match, got 0" <<<"$output"
          python .github/scripts/facturas_create_polish_bootstrap_v3.py

      - name: Validate focused Facturas create change
        shell: bash
        run: |
          node --check src/views/facturas/facturas.template.create.js
          node --check src/views/facturas/index.js
          python .github/scripts/facturas_continuous_scroll_contract.py
          python .github/scripts/private_admin_alignment_contract.py
          python .github/scripts/repo_integrity.py
          node .github/scripts/continuous_scroll_smoke.mjs
          git diff --check
          git status --short

      - name: Commit focused Facturas create change
        shell: bash
        run: |
          git config user.name "Onion Support Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/facturas/facturas.template.create.js src/views/facturas/index.js src/css/views/facturas/create.css .github/scripts/facturas_continuous_scroll_contract.py
          git commit -m "feat: polish multi-line invoice creation"
          git push origin HEAD:feat/facturas-create-line-items-polish
