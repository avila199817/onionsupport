<!DOCTYPE html>
<html
  lang="es"
  data-app="onion"
  data-app-name="Onion Support"
  data-theme="dark"
  data-theme-mode="system"
  data-theme-source="initial"
  data-route-mode="boot"
  data-shell-state="booting"
  class="app-booting app-loading theme-dark"
>
<head>
  <!-- =========================================================
       ONION SUPPORT — INDEX / SPA SHELL
       Archivo: /index.html

       PRO SAAS PANEL · PRIVATE SPA · ENTERPRISE BOOT SHELL
       CSP READY · ZERO INLINE JS/CSS · NO EXTERNAL FONTS
       TOKEN PRO SYSTEM · STATIC LOADER · THEME PREBOOT
       FINAL EXTREME 10/10

       OBJETIVOS:
       - shell SPA privado, no landing pública
       - sin scripts inline
       - sin CSS inline
       - sin Google Fonts / fonts.gstatic / dependencias externas
       - CSS centralizado desde /src/css/app.css
       - variables.css como Token Pro System / fuente de verdad
       - theme system-first con preboot externo
       - loader estático visible desde refresh
       - logos del loader theme-aware:
         · dark  -> /src/media/img/favicon_white.png
         · light -> /src/media/img/favicon_black.png
       - sidebar/topbar montados por JS
       - tablehead dinámico preparado
       - restore de sesión sin flash visual
       - URLs SPA resueltas por Azure Static Web Apps
       - no indexar rutas privadas/auth/técnicas
       - favicon real sin manifest fantasma
       - preparado para CSP estricta vía headers

       IMPORTANTE:
       - /src/preboot/theme.js debe ser JS puro.
       - /src/preboot/theme.js no debe contener <script>.
       - /src/preboot/theme.js no debe contener HTML.
       - /src/css/app.css importa tokens/core/layout/components/views/auth.
       - index.html debe empezar siempre por <!DOCTYPE html>.
       - Las fuentes se resuelven desde variables.css con stack system-ui.
       - La CSP real debe aplicarse preferentemente desde headers,
         por ejemplo staticwebapp.config.json en Azure Static Web Apps.
  ========================================================= -->

  <!-- =========================
       META BASE
  ========================= -->
  <meta charset="UTF-8">

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Onion Support</title>

  <meta
    name="application-name"
    content="Onion Support"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Onion Support"
  >

  <meta
    name="description"
    content="Onion Support · Panel privado SaaS de soporte, incidencias, facturación y gestión interna."
  >

  <meta
    name="generator"
    content="Onion Support SPA"
  >

  <!-- =========================
       PRIVACY / INDEXING
       App privada: no indexar panel/auth/rutas SPA.
  ========================= -->
  <meta
    name="robots"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="googlebot"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="bingbot"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <meta
    name="format-detection"
    content="telephone=no, date=no, address=no, email=no"
  >

  <!-- =========================
       THEME / BROWSER CHROME
       El valor real se puede actualizar desde theme.js / runtime.
  ========================= -->
  <meta
    name="color-scheme"
    content="dark light"
  >

  <meta
    name="theme-color"
    content="#0a0c11"
    data-onion-theme-color="true"
  >

  <meta
    name="msapplication-TileColor"
    content="#0a0c11"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <!-- =========================
       BASE SPA
       Correcto para Azure Static Web Apps sirviendo desde raíz.
  ========================= -->
  <base href="/">

  <!-- =========================
       FAVICON / APP ICONS
       Sin manifest hasta crear /site.webmanifest real.
       Esto evita 404 innecesarios en consola.
  ========================= -->
  <link
    rel="icon"
    href="/src/media/img/favicon_black_circle.png"
    type="image/png"
  >

  <link
    rel="shortcut icon"
    href="/src/media/img/favicon_black_circle.png"
    type="image/png"
  >

  <link
    rel="apple-touch-icon"
    href="/src/media/img/favicon_black_circle.png"
  >

  <!-- =========================
       PERFORMANCE · APP ASSETS
       Sin preconnect/dns-prefetch a Google Fonts.
       Sin fuentes externas.
  ========================= -->

  <!-- Loader inicial para tema dark / fondo oscuro -->
  <link
    rel="preload"
    href="/src/media/img/favicon_white.png"
    as="image"
    type="image/png"
    fetchpriority="high"
  >

  <!-- Loader inicial para tema light / fondo claro -->
  <link
    rel="preload"
    href="/src/media/img/favicon_black.png"
    as="image"
    type="image/png"
    fetchpriority="low"
  >

  <!-- Entrada principal SPA -->
  <link
    rel="modulepreload"
    href="/src/main.js"
  >

  <!-- =========================
       PREBOOT THEME
       CSP READY:
       - externo
       - síncrono
       - antes del CSS final
       - resuelve data-theme real:
         dark/light según system o storage

       NOTA:
       - En head normalmente document.body aún no existe.
       - theme.js debe actualizar document.documentElement.
       - theme.js ya sincroniza body en DOMContentLoaded.
  ========================= -->
  <script src="/src/preboot/theme.js"></script>

  <!-- =========================
       CSS ENTRYPOINT
       /src/css/app.css importa:
       - tokens/variables.css
       - tokens/light.css
       - core/reset.css
       - core/layout.css
       - core/core.css
       - core/loader.css
       - layout/sidebar.css
       - layout/topbar.css
       - components/ui.css
       - views/*.css
       - auth/login.css

       IMPORTANTE:
       - No meter <style> inline.
       - No meter CSS dinámico desde JS salvo fallback extremo.
       - Las vistas viven en /src/css/views/.
  ========================= -->
  <link
    rel="stylesheet"
    href="/src/css/app.css"
  >

  <!-- =========================
       NOSCRIPT CSS EXTERNO
       CSP READY:
       - sin <style> inline
       - separado porque solo aplica sin JS
  ========================= -->
  <noscript>
    <link
      rel="stylesheet"
      href="/src/css/core/noscript.css"
    >
  </noscript>
</head>

<body
  class="app-booting app-loading theme-dark"
  data-app="onion"
  data-app-name="Onion Support"
  data-density="default"
  data-app-loading="true"
  data-authenticated="false"
  data-route-mode="boot"
  data-shell-state="booting"
  data-theme="dark"
  data-theme-mode="system"
  data-theme-source="initial"
>
  <!-- =========================================================
       ACCESSIBILITY · SKIP LINK
       Requiere estilos globales tipo .sr-only / .sr-only-focusable.
       Si no existen, puede añadirse soporte en core.css/layout.css.
  ========================================================= -->
  <a
    class="sr-only sr-only-focusable app-skip-link"
    href="#main-content"
    data-skip-link="true"
  >
    Saltar al contenido principal
  </a>

  <!-- =========================================================
       BOOT LOADER ESTÁTICO
       - visible desde refresh antes de JS
       - controlado después por src/app/loader.js / main.js
       - sin inline script
       - sin inline style
       - logos dependientes de html[data-theme]
       - fallback textual/accesible estable
       - app-loader__logo--dark:
         logo blanco para fondos oscuros
       - app-loader__logo--light:
         logo negro para fondos claros
  ========================================================= -->
  <div
    id="app-loader"
    class="app-loader is-visible"
    data-app-loader="true"
    data-loader-visible="true"
    data-loader-state="booting"
    role="status"
    aria-live="polite"
    aria-busy="true"
    aria-hidden="false"
  >
    <div
      class="app-loader__backdrop"
      data-loader-backdrop="true"
      aria-hidden="true"
    ></div>

    <div
      class="app-loader__card"
      data-loader-card="true"
    >
      <div
        class="app-loader__brand"
        data-loader-brand="true"
        aria-hidden="true"
      >
        <img
          class="app-loader__logo app-loader__logo--dark"
          src="/src/media/img/favicon_white.png"
          alt=""
          width="64"
          height="64"
          loading="eager"
          decoding="async"
          fetchpriority="high"
          draggable="false"
        >

        <img
          class="app-loader__logo app-loader__logo--light"
          src="/src/media/img/favicon_black.png"
          alt=""
          width="64"
          height="64"
          loading="eager"
          decoding="async"
          fetchpriority="low"
          draggable="false"
        >

        <div
          class="app-loader__logo-fallback"
          data-loader-logo-fallback="true"
          aria-hidden="true"
        >
          O
        </div>
      </div>

      <div class="app-loader__copy">
        <strong class="app-loader__title">
          Onion Support
        </strong>

        <span class="app-loader__text">
          Cargando sesión...
        </span>

        <small class="app-loader__subtext">
          Preparando panel seguro
        </small>
      </div>

      <div
        class="app-loader__bar"
        aria-hidden="true"
      >
        <span class="app-loader__bar-fill"></span>
      </div>
    </div>
  </div>

  <!-- =========================================================
       NOSCRIPT FALLBACK
       Si JS está desactivado, noscript.css debe:
       - ocultar loader si procede
       - mostrar layout noscript de forma usable
  ========================================================= -->
  <noscript>
    <div class="layout noscript-layout">
      <main
        class="main-content noscript-main"
        role="main"
        aria-label="Contenido principal"
      >
        <div id="noscript-content">
          <section class="noscript-box">
            <h1>JavaScript es necesario</h1>

            <p>
              Onion Support necesita JavaScript para cargar
              la navegación SPA, el panel, las vistas y la autenticación.
            </p>
          </section>
        </div>
      </main>
    </div>
  </noscript>

  <!-- =========================================================
       APP LAYOUT
       - Sidebar montado por JS
       - Topbar montado por JS
       - Tablehead dinámico preparado
       - View root estable para Router
       - Loader inicial ya existe y lo controla JS
       - El layout debe reservar ancho sidebar desde CSS/tokens
  ========================================================= -->
  <div
    id="app-shell"
    class="layout app-shell"
    data-app-shell="true"
    data-shell="booting"
    data-route-mode="boot"
    data-shell-interactive="false"
    aria-busy="true"
    aria-hidden="false"
  >
    <!-- =========================
         SIDEBAR MOUNT
    ========================= -->
    <div
      id="sidebar-mount"
      data-sidebar-mount="true"
      aria-hidden="false"
    ></div>

    <!-- =========================
         TOPBAR MOUNT
    ========================= -->
    <div
      id="topbar-mount"
      data-topbar-mount="true"
      aria-hidden="false"
    ></div>

    <!-- =========================
         MAIN CONTENT
    ========================= -->
    <main
      id="main-content"
      class="main-content"
      role="main"
      aria-label="Contenido principal"
      tabindex="-1"
      aria-busy="true"
      data-main-content="true"
      data-route-mode="boot"
    >
      <!-- =========================
           TABLEHEAD DYNAMIC SLOT
      ========================= -->
      <div
        id="table-head"
        class="table-head"
        data-tablehead="true"
        hidden
        aria-hidden="true"
      >
        <div
          id="tablehead-container"
          data-tablehead-container="true"
        ></div>
      </div>

      <!-- =========================
           VIEW ROOT
      ========================= -->
      <div
        id="app-content"
        data-app-content="true"
      >
        <div
          id="view-container"
          data-view-root="true"
          data-router-view="true"
          aria-live="polite"
          aria-busy="true"
        ></div>
      </div>
    </main>
  </div>

  <!-- =========================
       APP ENTRY
       CSP READY:
       - módulo externo
       - sin inline bootstrap
  ========================= -->
  <script
    type="module"
    src="/src/main.js"
  ></script>
</body>
</html>
