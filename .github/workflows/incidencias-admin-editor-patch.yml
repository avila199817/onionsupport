  background: var(--btn-primary-bg-hover);
  color: var(--btn-primary-text);
  transform: translateY(-1px);
}

.incidencias-modal-admin-save-btn:active:not(:disabled) {
  background: var(--btn-primary-bg-active);
  transform: translateY(0);
}

/* =========================================================
   TECHNICIAN
========================================================= */
'''
          s = s.replace(tech_marker, css, 1)

          # Tablet/mobile layout.
          mobile720 = s.find('@media (max-width: 720px)')
          contact = '  .incidencias-modal-contact-grid {\n    grid-template-columns: 1fr;\n  }'
