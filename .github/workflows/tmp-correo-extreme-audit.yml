          helper_new = helper_anchor + '''
  function abortListRequest(reason = "correo-list-superseded") {
    if (!listAbortController) return false;
    try { listAbortController.abort(reason); } catch { /* noop */ }
    listAbortController = null;
    return true;
  }

  function beginListRequest() {
    abortListRequest();
    const controller = new AbortController();
    listAbortController = controller;
    return controller;
  }

  function focusableElements(container = null) {
    if (!container) return [];
    return [...container.querySelectorAll(
      'button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'
    )].filter((node) => !node.hidden && node.getAttribute("aria-hidden") !== "true");
  }

  function rememberModalFocus() {
    const active = document.activeElement;
    modalReturnFocus = active && host.contains(active) ? active : null;
  }

  function restoreModalFocus() {
    const target = modalReturnFocus;
    modalReturnFocus = null;
    try { target?.focus?.({ preventScroll: true }); } catch { /* noop */ }
  }

  function trapModalFocus(event) {
    if (event.key !== "Tab") return false;
    const dialog = host.querySelector('[role="dialog"][aria-modal="true"], [role="alertdialog"][aria-modal="true"]');
    if (!dialog) return false;
    const focusables = focusableElements(dialog);
    if (!focusables.length) {
      event.preventDefault();
      dialog.focus?.({ preventScroll: true });
      return true;
    }
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    const active = document.activeElement;
    if (event.shiftKey && (active === first || !dialog.contains(active))) {
      event.preventDefault();
      last.focus({ preventScroll: true });
      return true;
    }
    if (!event.shiftKey && (active === last || !dialog.contains(active))) {
      event.preventDefault();
      first.focus({ preventScroll: true });
      return true;
    }
    return false;
  }

  function settleConfirmation(answer = false) {
    const resolver = confirmResolver;
    confirmResolver = null;
    const root = host.querySelector("[data-correo-modal-root]");
    if (root) root.replaceChildren();
    document.documentElement.classList.remove("correo-modal-open");
    restoreModalFocus();
    resolver?.(answer === true);
  }

  function requestConfirmation(config = {}) {
    if (confirmResolver || state.busyAction) return Promise.resolve(false);
    const root = host.querySelector("[data-correo-modal-root]");
    if (!root) return Promise.resolve(false);
    rememberModalFocus();
    root.innerHTML = renderConfirmModal(config);
    document.documentElement.classList.add("correo-modal-open");
    return new Promise((resolve) => {
      confirmResolver = resolve;
      requestAnimationFrame(() => {
        root.querySelector("[data-correo-confirm-cancel]")?.focus?.({ preventScroll: true });
      });
    });
  }
