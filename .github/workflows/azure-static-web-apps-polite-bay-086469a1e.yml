# =========================================================
# ONION SUPPORT — AZURE STATIC WEB APPS CI/CD
# Producción: SPA estática + landing pública indexable
# Canonical SEO: https://onionsupport.com/
# Área privada: noindex / nofollow
# Checkout: última fuente autoritativa (main / rama PR interna)
# Evita desplegar snapshots obsoletos al reintentar ejecuciones
# =========================================================

name: Azure Static Web Apps CI/CD

run-name: SWA · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name || 'manual' }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

  workflow_dispatch:

concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  APP_LOCATION: "/"
  API_LOCATION: ""
  OUTPUT_LOCATION: ""
  PRODUCTION_BRANCH: "main"
  PUBLIC_SITE_URL: "https://onionsupport.com"
  DEPLOY_COOLDOWN_SECONDS: "45"
  DEPLOY_RETRY_SECONDS: "75"
  PRODUCTION_VERIFY_DELAY_SECONDS: "25"

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    if: >-
      (
        github.event_name == 'push' &&
        github.ref_name == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == 'main'
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.base_ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    env:
      SWA_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}

    steps:
      - name: Checkout authoritative source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Resolve checked out revision
        id: revision
        run: |
          set -euo pipefail

          checked_sha="$(git rev-parse HEAD)"
          checked_branch="$(git branch --show-current || true)"

          echo "sha=${checked_sha}" >> "${GITHUB_OUTPUT}"

          echo "Event SHA: ${GITHUB_SHA}"
          echo "Checked-out SHA: ${checked_sha}"
          echo "Checked-out branch: ${checked_branch:-detached}"

          if [[ -f "robots.txt" ]]; then
            echo "robots.txt SHA256: $(sha256sum robots.txt | awk '{print $1}')"
            printf "robots.txt primera línea: "
            head -n 1 robots.txt || true
          fi

          if [[ -f "sitemap.xml" ]]; then
            echo "sitemap.xml SHA256: $(sha256sum sitemap.xml | awk '{print $1}')"
            printf "sitemap.xml primera línea: "
            head -n 1 sitemap.xml || true
          fi

      - name: Validate deploy contract
        run: |
          set -euo pipefail

          if [[ -z "${SWA_API_TOKEN:-}" ]]; then
            echo "::error title=Secret no configurado::Falta el secret AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E."
            exit 1
          fi

          required_files=(
            "index.html"
            "staticwebapp.config.json"
            "site.webmanifest"
            "robots.txt"
            "sitemap.xml"
            "favicon.ico"

            "src/main.js"

            "src/app/index.js"
            "src/app/loader.js"

            "src/core/config.js"
            "src/core/http.js"
            "src/core/index.js"

            "src/features/auth/index.js"

            "src/router/index.js"
            "src/router/routes.js"

            "src/preboot/theme.js"

            "src/css/app.css"
            "src/css/core/noscript.css"
            "src/css/auth/login.css"

            "src/views/public/index.js"

            "src/views/public/login/index.js"
            "src/views/public/login/template.js"

            "src/views/public/password-reset/index.js"
            "src/views/public/password-reset/template.js"

            "src/ui/toast/index.js"
            "src/ui/sidebar/index.js"
            "src/ui/sidebar/template.js"
            "src/ui/topbar/index.js"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file,title=Archivo obligatorio no encontrado::No existe: $file"
              exit 1
            fi
          done

          removed_files=(
            "BingSiteAuth.xml"
            "manifest.json"
            "sw.js"
            "apple-touch-icon.png"
          )

          for file in "${removed_files[@]}"; do
            if [[ -e "$file" ]]; then
              echo "::error file=$file,title=Archivo eliminado reaparecido::Debe eliminarse del repo: $file"
              exit 1
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          import sys

          roots = [
              Path("src"),
              Path(".github"),
          ]

          bad_paths = []

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*"):
                  parts = path.parts

                  for part in parts:
                      if part != part.strip():
                          bad_paths.append(str(path))
                          break

          if bad_paths:
              for path in bad_paths:
                  print(f"::error file={path},title=Ruta con espacios inválidos::El path contiene espacios al inicio/final. Renombra la carpeta/archivo.")
              sys.exit(1)

          print("Paths sin espacios iniciales/finales OK.")
          PY

          python3 -m json.tool staticwebapp.config.json >/dev/null
          python3 -m json.tool site.webmanifest >/dev/null

          required_index_refs=(
            "/favicon.ico"
            "/site.webmanifest"
            "/src/preboot/theme.js"
            "/src/css/app.css"
            "/src/css/core/noscript.css"
            "/src/main.js"
          )

          for ref in "${required_index_refs[@]}"; do
            if ! grep -Fq "$ref" index.html; then
              echo "::error file=index.html,title=Referencia obligatoria no encontrada::Falta referencia: $ref"
              exit 1
            fi
          done

          forbidden_public_refs=(
            "/src/media/img/favicon_black_circle.png"
            "/src/media/img/favicon_white.png"
            "/src/media/img/favicon_black.png"
            "?v="
          )

          for ref in "${forbidden_public_refs[@]}"; do
            if grep -Fq "$ref" index.html site.webmanifest robots.txt 2>/dev/null; then
              echo "::error title=Referencia pública obsoleta::No debe quedar '${ref}' en index.html, site.webmanifest ni robots.txt."
              exit 1
            fi
          done

          if grep -Fq "BingSiteAuth.xml" index.html site.webmanifest robots.txt 2>/dev/null; then
            echo "::error title=Referencia obsoleta::No debe quedar BingSiteAuth.xml en index.html, site.webmanifest ni robots.txt."
            exit 1
          fi

          echo "Contrato mínimo de archivos OK."

      - name: Validate SEO contract
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import json
          import os
          import sys
          import xml.etree.ElementTree as ET

          base = os.environ["PUBLIC_SITE_URL"].rstrip("/")
          expected_home = f"{base}/"
          expected_sitemap = f"{base}/sitemap.xml"
          canonical_host = urlsplit(expected_home).netloc

          errors = []

          def add_error(path, message):
              errors.append((str(path), message))

          def contains_directive(lines, expected):
              expected = expected.strip().lower()
              return any(line.strip().lower() == expected for line in lines)

          # -------------------------------------------------
          # robots.txt
          # -------------------------------------------------
          robots_path = Path("robots.txt")
          robots_text = robots_path.read_text(encoding="utf-8")
          robots_lines = [
              line.strip()
              for line in robots_text.splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]

          if robots_text.lstrip().startswith("<"):
              first_line = robots_text.lstrip().splitlines()[0][:180]
              add_error(
                  robots_path,
                  "robots.txt contiene XML/HTML. Debe ser texto plano del protocolo robots. "
                  f"Primera línea detectada: {first_line!r}"
              )

          required_robots = [
              "User-agent: *",
              "Allow: /",
              "Disallow: /login",
              "Disallow: /password-request",
              "Disallow: /password-reset",
              "Disallow: /activate-account",
              "Disallow: /dashboard",
              "Disallow: /incidencias",
              "Disallow: /facturas",
              "Disallow: /clientes",
              "Disallow: /usuarios",
              "Disallow: /servidor",
              "Disallow: /cuenta",
              "Disallow: /ajustes",
              "Disallow: /@*",
              "Disallow: /api/",
              "Disallow: /.auth/",
              f"Sitemap: {expected_sitemap}",
          ]

          for directive in required_robots:
              if not contains_directive(robots_lines, directive):
                  add_error(
                      robots_path,
                      f"Falta directiva SEO obligatoria: {directive}"
                  )

          # -------------------------------------------------
          # sitemap.xml
          # -------------------------------------------------
          sitemap_path = Path("sitemap.xml")

          try:
              tree = ET.parse(sitemap_path)
              root = tree.getroot()
          except ET.ParseError as error:
              add_error(sitemap_path, f"XML inválido: {error}")
              root = None

          sitemap_urls = []

          if root is not None:
              expected_root = "{http://www.sitemaps.org/schemas/sitemap/0.9}urlset"

              if root.tag != expected_root:
                  add_error(
                      sitemap_path,
                      "La raíz debe ser urlset con namespace http://www.sitemaps.org/schemas/sitemap/0.9."
                  )

              namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              sitemap_urls = [
                  (node.text or "").strip()
                  for node in root.findall("sm:url/sm:loc", namespace)
                  if (node.text or "").strip()
              ]

              if not sitemap_urls:
                  add_error(sitemap_path, "El sitemap no contiene ninguna URL <loc>.")

              if len(sitemap_urls) != len(set(sitemap_urls)):
                  add_error(sitemap_path, "El sitemap contiene URLs duplicadas.")

              if expected_home not in sitemap_urls:
                  add_error(
                      sitemap_path,
                      f"Debe incluir la URL canónica principal: {expected_home}"
                  )

              private_prefixes = (
                  "/login",
                  "/password-request",
                  "/password-reset",
                  "/activate-account",
                  "/dashboard",
                  "/incidencias",
                  "/facturas",
                  "/clientes",
                  "/usuarios",
                  "/servidor",
                  "/cuenta",
                  "/ajustes",
                  "/@",
                  "/api/",
                  "/.auth/",
                  "/docs/",
                  "/config/",
              )

              for loc in sitemap_urls:
                  parsed = urlsplit(loc)
                  path = parsed.path or "/"

                  if parsed.scheme != "https":
                      add_error(sitemap_path, f"URL no HTTPS en sitemap: {loc}")

                  if parsed.netloc != canonical_host:
                      add_error(
                          sitemap_path,
                          f"Host no canónico en sitemap: {loc}. Esperado: {canonical_host}"
                      )

                  if parsed.query or parsed.fragment:
                      add_error(
                          sitemap_path,
                          f"El sitemap no debe publicar query strings ni fragmentos: {loc}"
                      )

                  if any(
                      path == prefix.rstrip("/") or path.startswith(prefix)
                      for prefix in private_prefixes
                  ):
                      add_error(
                          sitemap_path,
                          f"Ruta privada/noindex incluida en sitemap: {loc}"
                      )

          # -------------------------------------------------
          # index.html SEO
          # -------------------------------------------------
          class SeoParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.canonicals = []
                  self.meta_robots = []

              def handle_starttag(self, tag, attrs):
                  attrs = {k.lower(): (v or "") for k, v in (attrs or [])}
                  tag = tag.lower()

                  if tag == "link":
                      rel = {token.lower() for token in attrs.get("rel", "").split()}
                      if "canonical" in rel:
                          self.canonicals.append(attrs.get("href", "").strip())

                  if tag == "meta":
                      name = attrs.get("name", "").strip().lower()
                      if name in {"robots", "googlebot"}:
                          self.meta_robots.append(
                              (name, attrs.get("content", "").strip().lower())
                          )

          index_path = Path("index.html")
          index_text = index_path.read_text(encoding="utf-8")
          parser = SeoParser()
          parser.feed(index_text)

          if parser.canonicals != [expected_home]:
              add_error(
                  index_path,
                  f"Canonical inválido. Esperado exactamente uno: {expected_home}"
              )

          robots_meta = {
              name: content
              for name, content in parser.meta_robots
          }

          for name in ("robots", "googlebot"):
              content = robots_meta.get(name, "")
              directives = {
                  token.strip()
                  for token in content.split(",")
                  if token.strip()
              }

              if not {"index", "follow"}.issubset(directives):
                  add_error(
                      index_path,
                      f"Meta {name} debe permitir index, follow en la landing pública."
                  )

          # -------------------------------------------------
          # staticwebapp.config.json SEO
          # -------------------------------------------------
          config_path = Path("staticwebapp.config.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))

          exclusions = set(
              config.get("navigationFallback", {}).get("exclude", [])
          )

          for required_exclusion in ("/robots.txt", "/sitemap.xml"):
              if required_exclusion not in exclusions:
                  add_error(
                      config_path,
                      f"navigationFallback.exclude debe contener {required_exclusion}"
                  )

          routes = config.get("routes", [])

          def find_route(route_name):
              for route in routes:
                  if route.get("route") == route_name:
                      return route
              return None

          root_route = find_route("/")

          if not root_route:
              add_error(config_path, "Falta la ruta pública /.")
          else:
              root_xrobots = (
                  root_route.get("headers", {})
                  .get("X-Robots-Tag", "")
                  .lower()
              )

              if "index" not in root_xrobots or "follow" not in root_xrobots:
                  add_error(
                      config_path,
                      "La ruta / debe enviar X-Robots-Tag: index, follow."
                  )

          for public_asset in ("/robots.txt", "/sitemap.xml"):
              route = find_route(public_asset)

              if not route:
                  add_error(
                      config_path,
                      f"Falta configuración explícita para {public_asset}."
                  )
                  continue

              if int(route.get("statusCode", 200)) >= 400:
                  add_error(
                      config_path,
                      f"{public_asset} no puede estar configurado como error HTTP."
                  )

          private_routes = (
              "/login",
              "/password-request",
              "/password-reset*",
              "/activate-account*",
              "/dashboard*",
              "/@*",
              "/incidencias*",
              "/facturas*",
              "/clientes*",
              "/usuarios*",
              "/servidor*",
              "/cuenta*",
              "/ajustes*",
          )

          for private_route in private_routes:
              route = find_route(private_route)

              if not route:
                  add_error(
                      config_path,
                      f"Falta contrato noindex para ruta privada: {private_route}"
                  )
                  continue

              xrobots = (
                  route.get("headers", {})
                  .get("X-Robots-Tag", "")
                  .lower()
              )

              if "noindex" not in xrobots:
                  add_error(
                      config_path,
                      f"La ruta privada {private_route} debe enviar X-Robots-Tag: noindex."
                  )

          if errors:
              for path, message in errors:
                  print(
                      f"::error file={path},title=Contrato SEO inválido::{message}"
                  )
              sys.exit(1)

          print(
              f"Contrato SEO OK. Canonical={expected_home} · "
              f"Sitemap URLs={len(sitemap_urls)}"
          )
          PY

      - name: Validate local public references
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import json
          import re
          import sys

          root = Path(".").resolve()
          errors = []

          def add_error(path, message):
              errors.append((str(path), message))

          def is_external(ref):
              ref = (ref or "").strip()
              if not ref:
                  return True
              if ref.startswith("#"):
                  return True
              if ref.startswith("//"):
                  return True
              if re.match(r"^[a-zA-Z][a-zA-Z0-9+.-]*:", ref):
                  return True
              return False

          def ref_to_path(ref):
              ref = (ref or "").strip()
              if is_external(ref):
                  return None

              parsed = urlsplit(ref)
              path = parsed.path or ""

              if not path or path == "/":
                  return None

              if path.startswith("/"):
                  return root / path.lstrip("/")

              return root / path

          def check_ref(owner, ref):
              path = ref_to_path(ref)

              if path is None:
                  return

              if not path.exists():
                  add_error(owner, f"Referencia local inexistente: {ref}")

          class IndexRefParser(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs or [])

                  if tag in {"script", "img", "source", "video", "audio"}:
                      check_ref("index.html", attrs.get("src", ""))

                  if tag == "link":
                      check_ref("index.html", attrs.get("href", ""))

          index_html = Path("index.html").read_text(encoding="utf-8")
          IndexRefParser().feed(index_html)

          manifest = json.loads(Path("site.webmanifest").read_text(encoding="utf-8"))

          for icon in manifest.get("icons", []):
              if isinstance(icon, dict):
                  check_ref("site.webmanifest", icon.get("src", ""))

          if errors:
              for path, message in errors:
                  print(f"::error file={path},title=Referencia local inexistente::{message}")
              sys.exit(1)

          print("Referencias públicas locales OK.")
          PY

      - name: Audit JS imports non blocking
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".").resolve()
          warnings = []

          import_patterns = [
              re.compile(r"""import\s+(?:[^'"]+?\s+from\s+)?['"]([^'"]+)['"]"""),
              re.compile(r"""export\s+[^'"]+?\s+from\s+['"]([^'"]+)['"]"""),
              re.compile(r"""import\s*\(\s*['"]([^'"]+)['"]\s*\)"""),
          ]

          def resolve_module(base_file, spec):
              spec = (spec or "").strip()

              if not spec:
                  return True

              if spec.startswith(("http://", "https://", "data:", "blob:")):
                  return True

              if not (spec.startswith("./") or spec.startswith("../") or spec.startswith("/")):
                  return True

              if spec.startswith("/"):
                  base = root / spec.lstrip("/")
              else:
                  base = (base_file.parent / spec).resolve()

              candidates = [base]

              if base.suffix == "":
                  candidates.append(base.with_suffix(".js"))
                  candidates.append(base / "index.js")

              return any(candidate.exists() and candidate.is_file() for candidate in candidates)

          for js_file in sorted(Path("src").rglob("*.js")):
              text = js_file.read_text(encoding="utf-8")

              for pattern in import_patterns:
                  for match in pattern.finditer(text):
                      spec = match.group(1)

                      if not resolve_module(js_file.resolve(), spec):
                          warnings.append((js_file, spec))

          if warnings:
              print("Imports locales inexistentes detectados. No bloquean deploy, pero deben limpiarse:")
              for js_file, spec in warnings:
                  print(f"::warning file={js_file},title=Import local inexistente::{spec}")
          else:
              print("Auditoría de imports locales OK.")
          PY

      - name: Validate critical SPA contracts
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import sys

          checks = [
              (
                  "src/views/public/index.js",
                  [
                      "PUBLIC_SHARED_VERSION",
                      "PUBLIC_AUTH_LOGO",
                      "export function escapeHtml",
                      "export function escapeAttr",
                      "export function renderPublicShell",
                      "export function safeAssetSrc",
                      "export function safeInternalHref",
                  ],
                  [
                      "LOGIN_VIEW_VERSION",
                      "renderLoginView",
                  ],
              ),
              (
                  "src/views/public/login/index.js",
                  [
                      "LOGIN_VIEW_VERSION",
                      "renderLoginView",
                      "Auth as DefaultAuth",
                      "createLoginTemplate",
                      "goAfterLogin",
                  ],
                  [],
              ),
              (
                  "src/views/public/login/template.js",
                  [
                      "LOGIN_TEMPLATE_VERSION",
                      "data-login-form",
                      "login-identifier",
                      "data-login-password",
                      "data-login-submit",
                      "data-login-forgot-password",
                      "ROUTES.passwordRequest",
                  ],
                  [],
              ),
              (
                  "src/views/public/password-reset/index.js",
                  [
                      "PASSWORD_RESET_VIEW_VERSION",
                      "renderPasswordResetView",
                      "requestPasswordReset",
                      "confirmResetPassword",
                      "PasswordRequestView",
                      "PasswordResetView",
                  ],
                  [],
              ),
              (
                  "src/views/public/password-reset/template.js",
                  [
                      "PASSWORD_RESET_TEMPLATE_VERSION",
                      "createPasswordResetTemplate",
                      "data-password-reset-form",
                      "data-password-reset-submit",
                      "password-reset-identifier",
                      "password-reset-password",
                      "password-reset-confirm",
                  ],
                  [],
              ),
              (
                  "src/router/routes.js",
                  [
                      "ROUTES_VERSION",
                      "PASSWORD_REQUEST",
                      'viewKey: "password-request"',
                      'import("../views/public/password-reset/index.js")',
                      '"PasswordRequestView"',
                  ],
                  [],
              ),
              (
                  "src/router/index.js",
                  [
                      "ROUTER_VERSION",
                      "Router",
                      "start",
                      "bind",
                      "onClick",
                      "a[data-spa]",
                      "a[data-route]",
                  ],
                  [],
              ),
              (
                  "src/app/index.js",
                  [
                      "APP_VERSION",
                      "restoreSession",
                      "Router",
                      "start",
                  ],
                  [],
              ),
          ]

          failed = False

          for file_path, required_tokens, forbidden_tokens in checks:
              path = Path(file_path)

              if not path.is_file():
                  print(f"::error file={file_path},title=Contrato SPA inválido::No existe el archivo.")
                  failed = True
                  continue

              text = path.read_text(encoding="utf-8")

              for token in required_tokens:
                  if token not in text:
                      print(f"::error file={file_path},title=Contrato SPA incompleto::Falta token esperado: {token}")
                      failed = True

              for token in forbidden_tokens:
                  if token in text:
                      print(f"::error file={file_path},title=Contrato SPA contaminado::Token prohibido encontrado: {token}")
                      failed = True

          if failed:
              sys.exit(1)

          print("Contratos críticos SPA públicos/router OK.")
          PY

      - name: Deployment cooldown
        run: |
          set -euo pipefail
          echo "Esperando ${DEPLOY_COOLDOWN_SECONDS}s para evitar solapar despliegues en Azure SWA..."
          sleep "${DEPLOY_COOLDOWN_SECONDS}"

      - name: Deploy static SPA attempt 1
        id: deploy_1
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          production_branch: ${{ env.PRODUCTION_BRANCH }}
          app_location: ${{ env.APP_LOCATION }}
          api_location: ${{ env.API_LOCATION }}
          output_location: ${{ env.OUTPUT_LOCATION }}
          skip_app_build: true
          skip_api_build: true

      - name: Wait before retry 2
        if: steps.deploy_1.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "Deploy attempt 1 falló. Esperando ${DEPLOY_RETRY_SECONDS}s antes del segundo intento..."
          sleep "${DEPLOY_RETRY_SECONDS}"

      - name: Deploy static SPA attempt 2
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure'
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          production_branch: ${{ env.PRODUCTION_BRANCH }}
          app_location: ${{ env.APP_LOCATION }}
          api_location: ${{ env.API_LOCATION }}
          output_location: ${{ env.OUTPUT_LOCATION }}
          skip_app_build: true
          skip_api_build: true

      - name: Wait before retry 3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "Deploy attempt 2 falló. Esperando ${DEPLOY_RETRY_SECONDS}s antes del tercer intento..."
          sleep "${DEPLOY_RETRY_SECONDS}"

      - name: Deploy static SPA attempt 3
        id: deploy_3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          production_branch: ${{ env.PRODUCTION_BRANCH }}
          app_location: ${{ env.APP_LOCATION }}
          api_location: ${{ env.API_LOCATION }}
          output_location: ${{ env.OUTPUT_LOCATION }}
          skip_app_build: true
          skip_api_build: true

      - name: Verify deployment result
        run: |
          set -euo pipefail

          deploy_1="${{ steps.deploy_1.outcome || 'skipped' }}"
          deploy_2="${{ steps.deploy_2.outcome || 'skipped' }}"
          deploy_3="${{ steps.deploy_3.outcome || 'skipped' }}"

          echo "Deploy attempt 1: ${deploy_1}"
          echo "Deploy attempt 2: ${deploy_2}"
          echo "Deploy attempt 3: ${deploy_3}"

          if [[ "${deploy_1}" == "success" || "${deploy_2}" == "success" || "${deploy_3}" == "success" ]]; then
            echo "Azure SWA deploy OK."
            exit 0
          fi

          echo "::error title=Deploy fallido::Azure SWA rechazó el despliegue tras 3 intentos."
          exit 1

      - name: Verify production files non blocking
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          base="${PUBLIC_SITE_URL%/}"

          echo "Esperando ${PRODUCTION_VERIFY_DELAY_SECONDS}s antes de verificar producción..."
          sleep "${PRODUCTION_VERIFY_DELAY_SECONDS}"

          checks=(
            "/index.html|/src/main.js"
            "/src/main.js|/src/app/index.js"
            "/src/app/index.js|APP_VERSION"
            "/src/core/config.js|CONFIG_VERSION"
            "/src/core/http.js|HTTP_VERSION"
            "/src/core/index.js|CORE_VERSION"
            "/src/features/auth/index.js|AUTH_VERSION"
            "/src/router/index.js|ROUTER_VERSION"
            "/src/router/routes.js|ROUTES_VERSION"
            "/src/views/public/index.js|PUBLIC_SHARED_VERSION"
            "/src/views/public/login/index.js|LOGIN_VIEW_VERSION"
            "/src/views/public/login/template.js|LOGIN_TEMPLATE_VERSION"
            "/src/views/public/password-reset/index.js|PASSWORD_RESET_VIEW_VERSION"
            "/src/views/public/password-reset/template.js|PASSWORD_RESET_TEMPLATE_VERSION"
          )

          failed=0

          for check in "${checks[@]}"; do
            path="${check%%|*}"
            marker="${check#*|}"
            url="${base}${path}?deploy_check=${{ steps.revision.outputs.sha }}"

            echo "Verificando ${url}"

            status="$(curl -L -sS -o /tmp/swa-check-body -w "%{http_code}" \
              --retry 8 \
              --retry-delay 10 \
              --retry-all-errors \
              "${url}" || true)"

            if [[ "${status}" != "200" ]]; then
              echo "::warning title=Archivo no publicado::${path} respondió HTTP ${status} en producción."
              head -c 700 /tmp/swa-check-body || true
              echo
              failed=1
              continue
            fi

            if ! grep -Fq "${marker}" /tmp/swa-check-body; then
              echo "::warning title=Contenido inesperado::${path} respondió 200, pero no contiene el marcador esperado '${marker}'."
              head -c 700 /tmp/swa-check-body || true
              echo
              failed=1
              continue
            fi
          done

          if [[ "${failed}" == "1" ]]; then
            echo "::warning title=Verificación de producción incompleta::El deploy terminó, pero algún archivo aún no se sirve o no coincide. Puede ser propagación/cache o token apuntando a otra SWA."
          else
            echo "Producción sirve los módulos SPA requeridos."
          fi

      - name: Verify production SEO files non blocking
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          base="${PUBLIC_SITE_URL%/}"
          failed=0

          verify_200_with_marker() {
            local path="$1"
            local marker="$2"
            local url="${base}${path}?deploy_check=${{ steps.revision.outputs.sha }}"
            local body="/tmp/swa-seo-${RANDOM}.body"

            echo "Verificando SEO ${url}"

            status="$(curl -L -sS -o "${body}" -w "%{http_code}" \
              --retry 8 \
              --retry-delay 10 \
              --retry-all-errors \
              "${url}" || true)"

            if [[ "${status}" != "200" ]]; then
              echo "::warning title=SEO no publicado::${path} respondió HTTP ${status}."
              head -c 700 "${body}" 2>/dev/null || true
              echo
              failed=1
              rm -f "${body}"
              return
            fi

            if ! grep -Fq "${marker}" "${body}"; then
              echo "::warning title=SEO inesperado::${path} respondió 200, pero no contiene '${marker}'."
              head -c 700 "${body}" || true
              echo
              failed=1
            fi

            rm -f "${body}"
          }

          verify_200_with_marker "/robots.txt" "User-agent: *"
          verify_200_with_marker "/sitemap.xml" "<urlset"
          verify_200_with_marker "/" "rel=\"canonical\""

          robots_url="${base}/robots.txt?deploy_check=${{ steps.revision.outputs.sha }}"
          robots_body="$(curl -L -sS \
            --retry 6 \
            --retry-delay 10 \
            --retry-all-errors \
            "${robots_url}" || true)"

          expected_sitemap="Sitemap: ${base}/sitemap.xml"

          if [[ "${robots_body}" != *"${expected_sitemap}"* ]]; then
            echo "::warning title=robots.txt sin sitemap::No contiene '${expected_sitemap}'."
            failed=1
          fi

          sitemap_url="${base}/sitemap.xml?deploy_check=${{ steps.revision.outputs.sha }}"
          sitemap_body="$(curl -L -sS \
            --retry 6 \
            --retry-delay 10 \
            --retry-all-errors \
            "${sitemap_url}" || true)"

          expected_loc="<loc>${base}/</loc>"

          if [[ "${sitemap_body}" != *"${expected_loc}"* ]]; then
            echo "::warning title=Sitemap sin canonical::No contiene '${expected_loc}'."
            failed=1
          fi

          if [[ "${failed}" == "1" ]]; then
            echo "::warning title=Verificación SEO incompleta::El deploy terminó, pero robots/sitemap/canonical aún no coinciden en producción. Puede ser propagación o caché."
          else
            echo "SEO de producción verificado: robots.txt, sitemap.xml y canonical."
          fi

      - name: Verify production SPA routes non blocking
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          base="${PUBLIC_SITE_URL%/}"

          routes=(
            "/login"
            "/password-request"
            "/password-reset"
            "/activate-account"
          )

          failed=0

          for route in "${routes[@]}"; do
            url="${base}${route}?route_check=${{ steps.revision.outputs.sha }}"

            echo "Verificando ruta SPA ${url}"

            status="$(curl -L -sS -o /tmp/swa-route-body -w "%{http_code}" \
              --retry 6 \
              --retry-delay 10 \
              --retry-all-errors \
              "${url}" || true)"

            if [[ "${status}" != "200" ]]; then
              echo "::warning title=Ruta SPA no disponible::${route} respondió HTTP ${status}."
              head -c 700 /tmp/swa-route-body || true
              echo
              failed=1
              continue
            fi

            if ! grep -Fq "/src/main.js" /tmp/swa-route-body; then
              echo "::warning title=Fallback SPA inválido::${route} no devolvió index.html con /src/main.js."
              head -c 700 /tmp/swa-route-body || true
              echo
              failed=1
              continue
            fi
          done

          if [[ "${failed}" == "1" ]]; then
            echo "::warning title=Verificación de rutas incompleta::El deploy terminó, pero alguna ruta pública aún no responde como SPA."
          else
            echo "Rutas públicas SPA verificadas."
          fi

  close_preview:
    name: Close PR Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository

    env:
      SWA_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}

    steps:
      - name: Validate deployment token
        run: |
          set -euo pipefail

          if [[ -z "${SWA_API_TOKEN:-}" ]]; then
            echo "::error title=Secret no configurado::Falta el secret AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E."
            exit 1
          fi

      - name: Close PR preview attempt 1
        id: close_preview_1
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: close

      - name: Wait before close preview retry
        if: steps.close_preview_1.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "Close preview falló. Esperando ${DEPLOY_RETRY_SECONDS}s antes de reintentar..."
          sleep "${DEPLOY_RETRY_SECONDS}"

      - name: Close PR preview attempt 2
        id: close_preview_2
        if: steps.close_preview_1.outcome == 'failure'
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: close

      - name: Verify close preview result
        run: |
          set -euo pipefail

          close_1="${{ steps.close_preview_1.outcome || 'skipped' }}"
          close_2="${{ steps.close_preview_2.outcome || 'skipped' }}"

          echo "Close preview attempt 1: ${close_1}"
          echo "Close preview attempt 2: ${close_2}"

          if [[ "${close_1}" == "success" || "${close_2}" == "success" ]]; then
            echo "Azure SWA preview close OK."
            exit 0
          fi

          echo "::error title=Close preview fallido::Azure SWA rechazó el cierre del preview tras 2 intentos."
          exit 1
