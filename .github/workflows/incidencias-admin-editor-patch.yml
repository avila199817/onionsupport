    grid-template-columns: 1fr;
  }

  .incidencias-modal-admin-save-btn {
    justify-self: stretch;
    inline-size: 100%;
  }

'''
          s = s[:pos] + responsive + s[pos:]

          mobile540 = s.find('@media (max-width: 540px)')
          target = '  .incidencias-modal-description-section,\n  .incidencias-modal-contact-section,\n  .incidencias-modal-current-files,'
          pos = s.find(target, mobile540)
          if mobile540 < 0 or pos < 0:
