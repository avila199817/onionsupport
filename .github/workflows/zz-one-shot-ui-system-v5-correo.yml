name: One-shot UI System V5 Correo

on:
  push:
    branches:
      - refactor/ui-system-v5-correo-cascade

permissions:
  contents: write

env:
  TARGET_BRANCH: refactor/ui-system-v5-correo-cascade

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Guard trigger
        run: |
          set -euo pipefail
          test -f .github/.ui-system-v5-correo-trigger || {
            echo "Trigger aún no presente; no hay migración que aplicar."
            exit 0
          }

      - name: Apply Correo cascade V5
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_system_v5_correo_cascade.py

      - name: Validate repository
        run: |
          set -euo pipefail
          python3 .github/scripts/repo_integrity.py
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add src/css/views/correo/viewport.css .github/scripts/repo_integrity.py docs/UI_SYSTEM_V5_AUDIT.md
          if git diff --cached --quiet; then
            echo "Sin cambios de migración."
            exit 0
          fi
          git commit -m "refactor(correo): normalizar cascada y retirar prioridad forzada"
          git push origin HEAD:${TARGET_BRANCH}
