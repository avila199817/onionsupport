name: Temporary Facturas filter counts patch

on:
  push:
    branches:
      - fix/facturas-filter-counts-parity
    paths:
      - .github/workflows/temp-facturas-filter-counts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/facturas-filter-counts-parity
          fetch-depth: 0

      - name: Apply narrow template patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- src/features/facturas-autorefresh/index.js
          git rm -f src/features/facturas-filter-counts/index.js

          python - <<'PY'
          from pathlib import Path

          path = Path("src/views/facturas/facturas.template.js")
          source = path.read_text(encoding="utf-8")

          anchor = '  const tooltip = getSortButtonTooltip(option, sortMode);\n\n  return `'
          replacement = '  const tooltip = getSortButtonTooltip(option, sortMode);\n  const filterCounts = computeFilterCounts(getInputItems(data), data);\n\n  return `'
          if source.count(anchor) != 1:
              raise SystemExit(f"renderFilters anchor mismatch: {source.count(anchor)}")
          source = source.replace(anchor, replacement, 1)

          badge_anchor = '<span>${escapeHtml(filter.label)}</span></button>`;'
          badge_replacement = '<span>${escapeHtml(filter.label)}</span><strong>${escapeHtml(String(filterCounts[filter.key] || 0))}</strong></button>`;'
          if source.count(badge_anchor) != 1:
              raise SystemExit(f"filter pill anchor mismatch: {source.count(badge_anchor)}")
          source = source.replace(badge_anchor, badge_replacement, 1)

          path.write_text(source, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/facturas/facturas.template.js src/features/facturas-autorefresh/index.js src/features/facturas-filter-counts/index.js
          git commit -m "fix(facturas): mostrar conteos en filtros"
          git push origin HEAD:fix/facturas-filter-counts-parity
