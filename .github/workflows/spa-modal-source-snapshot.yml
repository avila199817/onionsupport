name: SPA modal regression diagnostics
on:
  push:
    branches:
      - fix/spa-modal-attachments-home-20260909
permissions:
  contents: read
concurrency:
  group: spa-modal-regression-diagnostics
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Browser regressions
        shell: bash
        run: |
          set -euo pipefail
          node tools/private-domain-contracts.mjs --browser 2>&1 | tee "${RUNNER_TEMP}/spa-modal-tests.log"
          if test -f tools/spa-modal-regression.mjs; then
            node tools/spa-modal-regression.mjs 2>&1 | tee -a "${RUNNER_TEMP}/spa-modal-tests.log"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: spa-modal-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/spa-modal-tests.log
            /tmp/spa-modal-evidence
          retention-days: 3
          if-no-files-found: error
