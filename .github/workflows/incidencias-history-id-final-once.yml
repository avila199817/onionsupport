name: Incidencias History ID Final Once

on:
  push:
    branches:
      - fix/incidencias-history-open-id-chip-20260817
    paths:
      - .github/scripts/patch-incidencias-history-id-final.py
      - .github/workflows/incidencias-history-id-final-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/incidencias-history-open-id-chip-20260817
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch
        run: python3 .github/scripts/patch-incidencias-history-id-final.py

      - name: Validate JS syntax
        run: |
          node --check src/views/incidencias/index.js
          node --check src/views/incidencias/incidencias.template.modal.js

      - name: Validate rendered history and ID consistency
        run: |
          node --input-type=module <<'NODE'
          import {
            renderIncidenciasDetailModal,
            DETAIL_ACTIONS,
          } from './src/views/incidencias/incidencias.template.modal.js';

          const detail = {
            ticketId: 'INC-20260810-867010',
            subject: 'Actualización de hardware.',
            description: 'Adjunto foto del equipo instalado.',
            status: 'closed',
            priority: 'high',
            category: 'hardware',
            history: [{
              id: 'h1',
              type: 'created',
              action: 'created',
              message: 'Incidencia creada por administrador',
              createdAt: '2026-08-10T12:13:23.193Z',
              byName: 'Cristian Ávila Luque',
            }],
          };

          const closedHtml = renderIncidenciasDetailModal({
            open: true,
            detail,
            historyOpen: false,
            admin: true,
            role: 'admin',
          });

          const openHtml = renderIncidenciasDetailModal({
            open: true,
            detail,
            historyOpen: true,
            admin: true,
            role: 'admin',
          });

          if (!closedHtml.includes(DETAIL_ACTIONS.HISTORY_REVEAL)) {
            throw new Error('Header history action missing');
          }
          if (!openHtml.includes('id="incidencias-modal-history-content"')) {
            throw new Error('Open history does not render content');
          }
          if (!openHtml.includes('aria-expanded="true"')) {
            throw new Error('History disclosure does not expose open state');
          }
          if (!openHtml.includes('INC-202…867010')) {
            throw new Error('Canonical numeric-tail ticket ID is formatted inconsistently');
          }
          if (openHtml.includes('>#867010<')) {
            throw new Error('Legacy numeric-tail chip formatting still present');
          }
          NODE

      - name: Validate controller hard-render contract
        run: |
          grep -F 'fullRender: true' src/views/incidencias/index.js
          grep -F 'fullRender: openingHistory' src/views/incidencias/index.js
          grep -F 'incidencias.index.extreme.v24.history-open-hard-render' src/views/incidencias/index.js
          grep -F 'incidencias.template.modal.extreme.v24.consistent-id-chip' src/views/incidencias/incidencias.template.modal.js

      - name: Commit product changes and remove one-shot files
        run: |
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git rm -f .github/scripts/patch-incidencias-history-id-final.py \
                    .github/workflows/incidencias-history-id-final-once.yml
          git add src/views/incidencias/index.js \
                  src/views/incidencias/incidencias.template.modal.js
          git commit -m "fix(incidencias): abrir historial y unificar ID visible"
          git push origin HEAD:fix/incidencias-history-open-id-chip-20260817
