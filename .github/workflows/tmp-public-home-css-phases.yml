name: TEMP Public Home CSS Phases

on:
  push:
    branches:
      - perf/public-home-css-phases

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[css-phases-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: perf/public-home-css-phases
          fetch-depth: 1
          persist-credentials: true

      - name: Apply phased public-home CSS loading
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          styles_path = Path('src/router/styles.js')
          styles = styles_path.read_text(encoding='utf-8')

          replacements = []

          replacements.append((
              '  "route-styles.v12-route-minimal-public-home";',
              '  "route-styles.v13-public-home-phased-css";'
          ))

          replacements.append((
              'const MEDIA_INACTIVE =\n  "not all";\n',
              '''const MEDIA_INACTIVE =\n  "not all";\n\nconst PUBLIC_HOME_VIEW_KEY =\n  "public-home";\n\nconst PUBLIC_HOME_CRITICAL_HREFS =\n  new Set([\n    "/src/css/views/public/index.css",\n    "/src/css/views/public/home-experience.css",\n  ]);\n'''
          ))

          replacements.append((
              '''            setManagedLinkActive(\n              link,\n              activeHrefs.has(\n                normalized\n              ),\n              activeHrefs.has(\n                normalized\n              )\n                ? "active"\n                : "cached"\n            );''',
              '''            const shouldRemainActive =\n              activeHrefs.has(\n                normalized\n              ) ||\n              preparedHrefs.has(\n                normalized\n              );\n\n            setManagedLinkActive(\n              link,\n              shouldRemainActive,\n              shouldRemainActive\n                ? "active"\n                : "cached"\n            );'''
          ))

          replacements.append((
              '''  const loaded =\n    await Promise.all(\n      hrefs.map(\n        (href) =>\n          loadOne(\n            href,\n            signal\n          )\n      )\n    );''',
              '''  const blockingHrefs =\n    viewKey ===\n    PUBLIC_HOME_VIEW_KEY\n      ? hrefs.filter(\n          (href) =>\n            PUBLIC_HOME_CRITICAL_HREFS.has(\n              href\n            )\n        )\n      : hrefs;\n\n  const deferredHrefs =\n    viewKey ===\n    PUBLIC_HOME_VIEW_KEY\n      ? hrefs.filter(\n          (href) =>\n            !PUBLIC_HOME_CRITICAL_HREFS.has(\n              href\n            )\n        )\n      : [];\n\n  if (\n    deferredHrefs.length\n  ) {\n    void Promise.all(\n      deferredHrefs.map(\n        (href) =>\n          loadOne(\n            href,\n            null\n          )\n      )\n    ).catch(\n      () => false\n    );\n  }\n\n  const loaded =\n    await Promise.all(\n      blockingHrefs.map(\n        (href) =>\n          loadOne(\n            href,\n            signal\n          )\n      )\n    );'''
          ))

          replacements.append((
              '''    setManagedLinkActive(\n      link,\n      true,\n      activeHrefs.has(\n        href\n      )\n        ? "active"\n        : "prepared"\n    );''',
              '''    const deferUntilLoaded =\n      viewKey ===\n        PUBLIC_HOME_VIEW_KEY &&\n      !PUBLIC_HOME_CRITICAL_HREFS.has(\n        href\n      ) &&\n      !loadedHrefs.has(\n        href\n      ) &&\n      !link.sheet;\n\n    setManagedLinkActive(\n      link,\n      !deferUntilLoaded,\n      deferUntilLoaded\n        ? "deferred"\n        : activeHrefs.has(\n            href\n          )\n          ? "active"\n          : "prepared"\n    );'''
          ))

          replacements.append((
              '''    const active =\n      nextActive.has(\n        href\n      );\n\n    setManagedLinkActive(\n      link,\n      active,\n      active\n        ? "active"\n        : "cached"\n    );''',
              '''    const active =\n      nextActive.has(\n        href\n      );\n\n    const deferUntilLoaded =\n      active &&\n      viewKey ===\n        PUBLIC_HOME_VIEW_KEY &&\n      !PUBLIC_HOME_CRITICAL_HREFS.has(\n        href\n      ) &&\n      !loadedHrefs.has(\n        href\n      ) &&\n      !link.sheet;\n\n    setManagedLinkActive(\n      link,\n      active &&\n        !deferUntilLoaded,\n      active\n        ? deferUntilLoaded\n          ? "deferred"\n          : "active"\n        : "cached"\n    );'''
          ))

          for old, new in replacements:
              count = styles.count(old)
              if count != 1:
                  raise SystemExit(f'Patch styles.js ambiguo: esperado 1, encontrado {count}: {old[:80]!r}')
              styles = styles.replace(old, new, 1)

          styles_path.write_text(styles, encoding='utf-8')

          preload_path = Path('src/preboot/public-home-preload.js')
          preload = preload_path.read_text(encoding='utf-8')
          for line in (
              '      { rel: "preload", as: "style", href: "/src/css/views/public/support-request.css" },\n',
              '      { rel: "preload", as: "style", href: "/src/css/views/public/public-support-progress.css" },\n',
          ):
              if preload.count(line) != 1:
                  raise SystemExit(f'Preload secundario no canónico: {line.strip()}')
              preload = preload.replace(line, '', 1)
          preload_path.write_text(preload, encoding='utf-8')
          PY

          node --check src/router/styles.js
          node --check src/preboot/public-home-preload.js
          git diff --check
          git diff -- src/router/styles.js src/preboot/public-home-preload.js

      - name: Commit phased CSS loader and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Onion Support CI"
          git config user.email "cristian@onionsupport.com"
          git rm .github/workflows/tmp-public-home-css-phases.yml
          git add src/router/styles.js src/preboot/public-home-preload.js
          git commit -m "perf: separar CSS crítico y secundario de public-home [css-phases-applied]"
          git push origin HEAD:perf/public-home-css-phases
