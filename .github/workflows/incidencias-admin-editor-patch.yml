name: Incidencias admin ticket editor

on:
  push:
    branches:
      - feat/incidencias-admin-ticket-editor

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[incidencias-admin-editor-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/incidencias-admin-ticket-editor
          fetch-depth: 0

      - name: Apply product changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # CREATE: share the exact classification source with the detail editor.
          p = Path('src/views/incidencias/incidencias.template.create.js')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              'export const INCIDENCIAS_CREATE_TEMPLATE_VERSION =\n  "incidencias.template.create.extreme.v21.role-aware";',
              'import {\n  INCIDENCIA_CATEGORY_OPTIONS,\n  INCIDENCIA_PRIORITY_OPTIONS,\n} from "./incidencias.options.js";\n\nexport const INCIDENCIAS_CREATE_TEMPLATE_VERSION =\n  "incidencias.template.create.extreme.v22.canonical-options";',
              'create imports/version',
          )
          start = s.index('const CATEGORY_OPTIONS = Object.freeze([')
          end_marker = 'const DEFAULT_FORM = Object.freeze({'
          end = s.index(end_marker, start)
          s = s[:start] + 'const CATEGORY_OPTIONS = INCIDENCIA_CATEGORY_OPTIONS;\nconst PRIORITY_OPTIONS = INCIDENCIA_PRIORITY_OPTIONS;\n\n' + s[end:]
          p.write_text(s, encoding='utf-8')

          # DETAIL TEMPLATE: admin-only editor.
          p = Path('src/views/incidencias/incidencias.template.modal.js')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              'export const INCIDENCIAS_MODAL_TEMPLATE_VERSION =\n  "incidencias.template.modal.extreme.v29.user-contact-privacy";',
              'import {\n  INCIDENCIA_STATUS_OPTIONS,\n  INCIDENCIA_PRIORITY_OPTIONS,\n  INCIDENCIA_CATEGORY_OPTIONS,\n  normalizeIncidenciaStatus,\n  normalizeIncidenciaPriority,\n  normalizeIncidenciaCategory,\n} from "./incidencias.options.js";\n\nexport const INCIDENCIAS_MODAL_TEMPLATE_VERSION =\n  "incidencias.template.modal.extreme.v30.admin-ticket-editor";',
              'modal imports/version',
          )
          s = once(
              s,
              '  COPY_ID: "detail-copy-id",\n\n  COMMENT_SUBMIT:',
              '  COPY_ID: "detail-copy-id",\n  ADMIN_SAVE: "detail-admin-save",\n\n  COMMENT_SUBMIT:',
              'modal action',
          )

          content_marker = '''/* =========================================================
   CONTENT
========================================================= */

function renderDescription(
'''
          if s.count(content_marker) != 1:
              raise SystemExit('modal content marker not unique')

          editor = r'''/* =========================================================
   CONTENT
========================================================= */

function renderAdminSelect({
  label = "",
  name = "",
  value = "",
  options = [],
  disabled = false,
} = {}) {
  return `
    <label class="incidencias-modal-admin-field">
      <span class="incidencias-modal-admin-label">${escapeHtml(label)}</span>
      <span class="incidencias-modal-admin-select-wrap">
        <select
          class="incidencias-modal-admin-select"
          name="${attr(name)}"
          data-detail-field="${attr(name)}"
          ${disabledAttrs(disabled, false)}
        >
          ${safeArray(options).map((item) => `
            <option value="${attr(item.value)}"${item.value === value ? " selected" : ""}>${escapeHtml(item.label)}</option>
          `).join("")}
        </select>
        <span class="incidencias-modal-admin-select-chevron" aria-hidden="true">⌄</span>
      </span>
    </label>
  `;
}

function renderAdminTicketEditor(vm = {}) {
  if (!vm.admin) return "";

  const detail = safeObject(vm.detail);
  const draft = safeObject(vm.adminDraft);
  const status = normalizeIncidenciaStatus(draft.status || vm.status, "open");
  const priority = normalizeIncidenciaPriority(draft.priority || getPriority(detail), "medium");
  const category = normalizeIncidenciaCategory(draft.category || getCategory(detail), "general");

  return `
    <section
      class="incidencias-modal-admin-editor"
      data-admin-ticket-editor-section="true"
      aria-labelledby="incidencias-modal-admin-editor-title"
    >
      <div class="incidencias-modal-section-head incidencias-modal-admin-head">
        <div>
          <h3 id="incidencias-modal-admin-editor-title">Gestión del ticket</h3>
          <span>Estado, prioridad y tipo de incidencia</span>
        </div>
        <span class="incidencias-modal-admin-badge">Administrador</span>
      </div>

      <form class="incidencias-modal-admin-form" data-admin-ticket-editor="true" autocomplete="off">
        <div class="incidencias-modal-admin-grid">
          ${renderAdminSelect({ label: "Estado", name: "status", value: status, options: INCIDENCIA_STATUS_OPTIONS, disabled: vm.submitting })}
          ${renderAdminSelect({ label: "Prioridad", name: "priority", value: priority, options: INCIDENCIA_PRIORITY_OPTIONS, disabled: vm.submitting })}
          ${renderAdminSelect({ label: "Tipo de incidencia", name: "category", value: category, options: INCIDENCIA_CATEGORY_OPTIONS, disabled: vm.submitting })}
        </div>

        <button
          type="button"
          class="incidencias-modal-admin-save-btn"
          data-detail-action="${DETAIL_ACTIONS.ADMIN_SAVE}"
          ${disabledAttrs(vm.submitting, vm.submitting)}
        >
          ${vm.submitting && vm.operation === "admin-update"
            ? renderInlineSpinner("Guardando...")
            : "Guardar cambios"}
        </button>
      </form>
    </section>
  `;
}

function renderDescription(
'''
          s = s.replace(content_marker, editor, 1)
          s = once(
              s,
              '    ${renderDescription(detail)}\n\n    ${vm.admin ? renderContactBlock(detail) : ""}',
              '    ${renderAdminTicketEditor(vm)}\n\n    ${renderDescription(detail)}\n\n    ${vm.admin ? renderContactBlock(detail) : ""}',
              'modal editor placement',
          )
          s = once(
              s,
              '    fields: [\n      "comment",\n      "attachments",\n    ],\n\n    limits:',
              '    fields: [\n      "comment",\n      "attachments",\n    ],\n\n    adminFields: [\n      "status",\n      "priority",\n      "category",\n    ],\n\n    limits:',
              'modal snapshot',
          )
          p.write_text(s, encoding='utf-8')

          # CONTROLLER: explicit admin save, canonical reopen and PATCH.
          p = Path('src/views/incidencias/index.js')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              '  createIncidencia,\n  loadIncidenciaDetail,',
              '  createIncidencia,\n  updateIncidencia,\n  loadIncidenciaDetail,',
              'index update import',
          )
          s = once(
              s,
              '} from "./incidencias.template.modal.js";\n\nexport const INCIDENCIAS_INDEX_VERSION =\n  "incidencias.index.extreme.v30.attachments-sort";',
              '} from "./incidencias.template.modal.js";\n\nimport {\n  normalizeIncidenciaStatus,\n  normalizeIncidenciaPriority,\n  normalizeIncidenciaCategory,\n} from "./incidencias.options.js";\n\nexport const INCIDENCIAS_INDEX_VERSION =\n  "incidencias.index.extreme.v31.admin-ticket-editor";',
              'index options/version',
          )

          meta_selector = '          ".incidencias-modal-meta-grid",\n'
          if s.count(meta_selector) != 1:
              raise SystemExit(f'index meta selector expected 1, found {s.count(meta_selector)}')
          s = s.replace(meta_selector, meta_selector + '          ".incidencias-modal-admin-editor",\n', 1)

          s = once(
              s,
              '    commentDraft: "",\n    pendingFiles: [],',
              '    commentDraft: "",\n    pendingFiles: [],\n    adminDraft: null,',
              'index detail state adminDraft',
          )
          s = once(
              s,
              '    detailModal.commentDraft = "";\n    detailModal.pendingFiles = [];',
              '    detailModal.commentDraft = "";\n    detailModal.pendingFiles = [];\n    detailModal.adminDraft = null;',
              'index reset adminDraft',
          )

          marker = '  function ticketIsAlreadyClosed() {\n'
          if s.count(marker) != 1:
              raise SystemExit('index close marker not unique')

          logic = r'''  function getCurrentAdminClassification() {
    const detail = safeObject(detailModal.detail, {});

    return {
      status: normalizeIncidenciaStatus(
        first(detail.status, detail.estado, detail.statusKey, detail.lifecycle?.status, "open"),
        "open"
      ),
      priority: normalizeIncidenciaPriority(
        first(detail.priority, detail.prioridad, detail.severity, "medium"),
        "medium"
      ),
      category: normalizeIncidenciaCategory(
        first(detail.category, detail.categoria, detail.tipo, detail.type, "general"),
        "general"
      ),
    };
  }

  function readAdminTicketEditor(formNode = null) {
    if (!formNode) return null;

    const status = normalizeIncidenciaStatus(readField(formNode, "status"), "");
    const priority = normalizeIncidenciaPriority(readField(formNode, "priority"), "");
    const category = normalizeIncidenciaCategory(readField(formNode, "category"), "");

    return status && priority && category
      ? { status, priority, category }
      : null;
  }

  async function saveAdminTicketChanges(formNode = null) {
    if (!detailModal.open || detailModal.submitting) return false;

    if (!isAdmin()) {
      detailModal.feedbackMessage = "Solo un administrador puede modificar la clasificación de una incidencia.";
      detailModal.feedbackType = "error";
      renderModals({ immediate: true });
      return false;
    }

    const ticketId = getTicketId(detailModal.detail);
    const desired = readAdminTicketEditor(formNode);

    if (!ticketId || !desired) {
      detailModal.feedbackMessage = "No se pudieron leer los cambios administrativos del ticket.";
      detailModal.feedbackType = "error";
      renderModals({ immediate: true });
      return false;
    }

    const current = getCurrentAdminClassification();
    const statusChanged = desired.status !== current.status;
    const priorityChanged = desired.priority !== current.priority;
    const categoryChanged = desired.category !== current.category;

    if (!statusChanged && !priorityChanged && !categoryChanged) {
      detailModal.feedbackMessage = "No hay cambios administrativos pendientes.";
      detailModal.feedbackType = "info";
      renderModals({ immediate: true, focusSelector: ".incidencias-modal-admin-save-btn" });
      return true;
    }

    detailModal.adminDraft = { ...desired };
    detailModal.submitting = true;
    detailModal.operation = "admin-update";
    detailModal.closeConfirmOpen = false;
    detailModal.feedbackMessage = "";
    detailModal.feedbackType = "info";
    renderModals({ immediate: true });

    let nextDetail = detailModal.detail;
    let reopened = false;

    try {
      if (current.status === "closed" && desired.status !== "closed") {
        const reopenResult = await reopenIncidencia(ticketId);
        if (!reopenResult) {
          throw new Error("El backend no confirmó la reapertura de la incidencia.");
        }
        nextDetail = mergeTicketData(nextDetail || {}, reopenResult);
        reopened = true;
      }

      const changes = {};

      if (priorityChanged) {
        changes.priority = desired.priority;
        changes.prioridad = desired.priority;
      }

      if (categoryChanged) {
        changes.category = desired.category;
        changes.categoria = desired.category;
        changes.tipo = desired.category;
        changes.type = desired.category;
      }

      const effectiveStatus = reopened ? "open" : current.status;
      if (desired.status !== effectiveStatus) {
        changes.status = desired.status;
        changes.estado = desired.status;
      }

      if (Object.keys(changes).length) {
        let updated = await updateIncidencia(ticketId, changes);
        if (!updated) {
          updated = await loadIncidenciaDetail(ticketId, { force: true, cache: false });
        }
        if (!updated) {
          throw new Error("El backend no devolvió la incidencia actualizada.");
        }
        nextDetail = mergeTicketData(nextDetail || {}, updated);
      }

      detailModal.detail = nextDetail;
      detailModal.adminDraft = null;
      detailModal.submitting = false;
      detailModal.operation = "";
      detailModal.feedbackMessage = "Estado, prioridad y tipo actualizados correctamente.";
      detailModal.feedbackType = "success";

      items = upsertByTicketId(items, nextDetail);
      render({ skipModals: true });
      renderModals({ immediate: true, focusSelector: ".incidencias-modal-admin-save-btn" });
      return true;
    } catch (adminUpdateError) {
      detailModal.detail = nextDetail;
      detailModal.submitting = false;
      detailModal.operation = "";
      items = upsertByTicketId(items, nextDetail);

      detailModal.feedbackMessage = safeError(
        adminUpdateError,
        reopened
          ? "La incidencia se reabrió, pero no se pudieron guardar el resto de cambios."
          : "No se pudieron guardar los cambios administrativos."
      );
      detailModal.feedbackType = "error";

      render({ skipModals: true });
      renderModals({ immediate: true, focusSelector: ".incidencias-modal-admin-save-btn" });
      return false;
    }
  }

  function ticketIsAlreadyClosed() {
'''
          s = s.replace(marker, logic, 1)

          s = once(
              s,
              '    if (\n      type ===\n      DETAIL_ACTIONS.TICKET_CLOSE\n    ) {',
              '    if (\n      type ===\n      DETAIL_ACTIONS.ADMIN_SAVE\n    ) {\n      return saveAdminTicketChanges(\n        node?.closest?.("[data-admin-ticket-editor=\'true\']") ||\n        node?.closest?.("form")\n      );\n    }\n\n    if (\n      type ===\n      DETAIL_ACTIONS.TICKET_CLOSE\n    ) {',
              'index admin action',
          )
          p.write_text(s, encoding='utf-8')

          # CSS: same card/input/button token system, no private palette.
          p = Path('src/css/views/incidencias/detail.css')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              '.incidencias-modal-meta-card,\n.incidencias-modal-description-section,',
              '.incidencias-modal-meta-card,\n.incidencias-modal-admin-editor,\n.incidencias-modal-description-section,',
              'css shared card',
          )
          s = once(
              s,
              '.incidencias-modal-history-jump-btn,\n.incidencias-modal-close-btn,\n.incidencias-modal-preview-btn,',
              '.incidencias-modal-history-jump-btn,\n.incidencias-modal-close-btn,\n.incidencias-modal-admin-save-btn,\n.incidencias-modal-preview-btn,',
              'css shared button',
          )
          s = once(
              s,
              '.incidencias-modal-close-ticket-btn:focus-visible,\n.incidencias-modal-preview-btn:focus-visible,',
              '.incidencias-modal-close-ticket-btn:focus-visible,\n.incidencias-modal-admin-save-btn:focus-visible,\n.incidencias-modal-preview-btn:focus-visible,',
              'css focus',
          )
          s = once(
              s,
              '.incidencias-modal-close-ticket-btn:disabled,\n.incidencias-modal-preview-btn:disabled,',
              '.incidencias-modal-close-ticket-btn:disabled,\n.incidencias-modal-admin-save-btn:disabled,\n.incidencias-modal-preview-btn:disabled,',
              'css disabled',
          )
          s = once(
              s,
              '.incidencias-modal-description-section,\n.incidencias-modal-contact-section,\n.incidencias-modal-current-files,\n.incidencias-modal-history-section {\n  padding: var(--space-md);\n}',
              '.incidencias-modal-admin-editor,\n.incidencias-modal-description-section,\n.incidencias-modal-contact-section,\n.incidencias-modal-current-files,\n.incidencias-modal-history-section {\n  padding: var(--space-md);\n}',
              'css section padding',
          )

          tech_marker = '''/* =========================================================
   TECHNICIAN
========================================================= */
'''
          if s.count(tech_marker) != 1:
              raise SystemExit('css technician marker not unique')

          css = r'''/* =========================================================
   ADMIN TICKET EDITOR
========================================================= */

.incidencias-modal-admin-editor {
  display: grid;
  gap: var(--space-sm);
}

.incidencias-modal-admin-head {
  margin-block-end: 0;
}

.incidencias-modal-admin-head > div {
  min-inline-size: 0;
  display: grid;
  gap: 3px;
}

.incidencias-modal-admin-head > div > span {
  color: var(--text-muted);
  font-size: var(--font-xs);
  font-weight: var(--weight-medium);
  line-height: 1.35;
}

.incidencias-modal-admin-badge {
  min-block-size: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding-inline: 9px;
  border: 1px solid var(--badge-border);
  border-radius: var(--radius-pill);
  background: var(--badge-bg);
  color: var(--badge-text);
  font-size: 9px;
  font-weight: var(--weight-bold);
  line-height: 1;
  white-space: nowrap;
}

.incidencias-modal-admin-form {
  min-inline-size: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: var(--space-sm);
}

.incidencias-modal-admin-grid {
  min-inline-size: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-sm);
}

.incidencias-modal-admin-field {
  min-inline-size: 0;
  display: grid;
  gap: 6px;
}

.incidencias-modal-admin-label {
  color: var(--text-muted);
  font-size: var(--font-xs);
  font-weight: var(--weight-bold);
  line-height: 1.2;
}

.incidencias-modal-admin-select-wrap {
  position: relative;
  min-inline-size: 0;
  display: block;
}

.incidencias-modal-admin-select {
  appearance: none;
  -webkit-appearance: none;
  inline-size: 100%;
  min-inline-size: 0;
  min-block-size: var(--input-height);
  margin: 0;
  padding: 0 38px 0 13px;
  border: 1px solid var(--input-border);
  border-radius: var(--input-radius);
  outline: none;
  background: var(--input-bg);
  color: var(--input-text, var(--text-strong));
  box-shadow: var(--input-shadow, none);
  cursor: pointer;
  font: inherit;
  font-size: var(--font-md);
  font-weight: var(--weight-medium);
  line-height: 1.4;
  transition:
    background var(--duration-fast) var(--ease-standard),
    border-color var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard),
    opacity var(--duration-fast) var(--ease-standard);
}

.incidencias-modal-admin-select:hover:not(:disabled) {
  background: var(--input-bg-hover);
  border-color: var(--input-border-hover);
}

.incidencias-modal-admin-select:focus-visible {
  background: var(--input-bg-focus);
  border-color: var(--input-border-focus);
  box-shadow: var(--focus-ring);
}

.incidencias-modal-admin-select:disabled {
  cursor: not-allowed;
  background: var(--input-disabled-bg);
