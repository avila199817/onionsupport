name: TEMP Fix Modal Owner Actions

on:
  push:
    branches:
      - fix/modal-owner-view-actions

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[modal-owner-actions-fixed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/modal-owner-view-actions
          fetch-depth: 1
          persist-credentials: true

      - name: Apply modal interaction hotfix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/entity-overlay/index.js')
          text = path.read_text(encoding='utf-8')

          old_close = '''function close(options = {}) {
            const entry = topEntry();
            if (!entry) return false;

            clearCloseFallback();

            const marker = currentMarker();
            const canGoBack =
              options?.fromPopstate !== true &&
              entry.historyMode === "push" &&
              marker?.token === entry.token;

            if (canGoBack) {
              try {
                window.history.back();
                closeFallbackTimer = window.setTimeout(() => {
                  closeFallbackTimer = 0;
                  if (topEntry() === entry) removeTop({ syncUrl: true });
                }, CLOSE_HISTORY_FALLBACK_MS);
                return true;
              } catch {
                // fallback below
              }
            }

            return removeTop({ syncUrl: true });
          }
          '''
          new_close = '''function close(options = {}) {
            const entry = topEntry();
            if (!entry) return false;

            clearCloseFallback();

            /*
              El cierre desde UI debe ser determinista e inmediato. Delegarlo a
              history.back() podía dejar el overlay visible cuando Router y el
              listener de popstate competían por la misma navegación.
            */
            return removeTop({
              syncUrl: options?.syncUrl !== false,
              restore: options?.restore !== false,
            });
          }
          '''
          if old_close not in text:
            raise SystemExit('close block not found')
          text = text.replace(old_close, new_close, 1)

          marker = 'function onDocumentClick(event) {'
          helper = '''const OWNER_ROUTE_SEGMENTS = Object.freeze({
            factura: Object.freeze(["facturas"]),
            incidencia: Object.freeze(["incidencias", "tickets"]),
            cliente: Object.freeze(["clientes"]),
            usuario: Object.freeze(["usuarios"]),
          });

          function currentRouteSegments() {
            if (!isBrowser()) return [];

            try {
              return String(window.location?.pathname || "/")
                .toLowerCase()
                .split("/")
                .map((part) => part.trim())
                .filter(Boolean);
            } catch {
              return [];
            }
          }

          function isCanonicalOwnerRoute(type = "") {
            const entityType = normalizeEntityType(type);
            const owners = OWNER_ROUTE_SEGMENTS[entityType] || [];
            if (!owners.length) return false;

            const segments = currentRouteSegments();
            return owners.some((owner) => segments.includes(owner));
          }

          function hasExplicitOverlayTrigger(target = null) {
            const element = target?.nodeType === 3 ? target.parentElement : target;
            if (!element || typeof element.closest !== "function") return false;

            return Boolean(
              element.closest(
                "[data-entity-overlay-open='true'], " +
                "[data-entity-overlay-trigger='true'], " +
                "[data-entity-overlay-action='open']"
              )
            );
          }

          '''
          if marker not in text:
            raise SystemExit('onDocumentClick marker not found')
          text = text.replace(marker, helper + marker, 1)

          old_click = '''  const intent = inferEntityIntentFromElement(event.target);
            if (!intent || !canOpen(intent.type, intent.id)) return;

            stopEntityClick(event);
          '''
          new_click = '''  const intent = inferEntityIntentFromElement(event.target);
            if (!intent || !canOpen(intent.type, intent.id)) return;

            /*
              En la vista propietaria manda su controller canónico. El overlay
              global sólo intercepta allí cuando el elemento lo pide de forma
              explícita. Así se conservan Histórico, edición, adjuntos y cierre.
            */
            if (
              isCanonicalOwnerRoute(intent.type) &&
              !hasExplicitOverlayTrigger(event.target)
            ) {
              return;
            }

            stopEntityClick(event);
          '''
          if old_click not in text:
            raise SystemExit('document click block not found')
          text = text.replace(old_click, new_click, 1)

          old_pop = '''  const intent = urlIntent();
            if (intent) {
              void open({
                ...intent,
                historyMode: "none",
                source: "url-popstate",
              });
            }
          '''
          new_pop = '''  const intent = urlIntent();
            if (intent && isCanonicalOwnerRoute(intent.type)) {
              writeUrlForEntry(null, "replace");
              return;
            }

            if (intent) {
              void open({
                ...intent,
                historyMode: "none",
                source: "url-popstate",
              });
            }
          '''
          if old_pop not in text:
            raise SystemExit('popstate URL block not found')
          text = text.replace(old_pop, new_pop, 1)

          old_init = '''  const intent = urlIntent();
            if (intent && !stack.length) {
              void open({
                ...intent,
                historyMode: "replace",
                source: "url-init",
              });
            }
          '''
          new_init = '''  const intent = urlIntent();
            if (intent && isCanonicalOwnerRoute(intent.type)) {
              writeUrlForEntry(null, "replace");
            } else if (intent && !stack.length) {
              void open({
                ...intent,
                historyMode: "replace",
                source: "url-init",
              });
            }
          '''
          if old_init not in text:
            raise SystemExit('init URL block not found')
          text = text.replace(old_init, new_init, 1)

          path.write_text(text, encoding='utf-8')

          contract = Path('.github/scripts/entity_overlay_contract.mjs')
          c = contract.read_text(encoding='utf-8')
          anchor = 'assert.match(overlay, /data-entity-overlay-panel/);\n'
          addition = '''assert.match(overlay, /isCanonicalOwnerRoute/);
          assert.match(overlay, /hasExplicitOverlayTrigger/);
          assert.match(overlay, /syncUrl: options\\?\\.syncUrl !== false/);
          '''
          if anchor not in c:
            raise SystemExit('entity overlay contract anchor not found')
          c = c.replace(anchor, anchor + addition, 1)
          contract.write_text(c, encoding='utf-8')
          PY

      - name: Validate hotfix
        shell: bash
        run: |
          set -euo pipefail
          node --check src/features/entity-overlay/index.js
          node .github/scripts/entity_overlay_contract.mjs
          python3 .github/scripts/app_entrypoint_integrity.py
          bash .github/ci/validate_spa_contracts.sh

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Onion Support CI"
          git config user.email "cristian@onionsupport.com"
          git rm .github/workflows/tmp-fix-modal-owner-actions.yml
          git add src/features/entity-overlay/index.js .github/scripts/entity_overlay_contract.mjs
          git commit -m "fix: restaurar acciones de modales canónicos [modal-owner-actions-fixed]"
          git push origin HEAD:fix/modal-owner-view-actions
