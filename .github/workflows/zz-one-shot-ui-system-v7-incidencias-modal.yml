name: One-shot UI System V7 Incidencias Detail Modal

on:
  push:
    branches:
      - refactor/ui-system-v7-incidencias-detail-modal

permissions:
  contents: write

env:
  TARGET_BRANCH: refactor/ui-system-v7-incidencias-detail-modal

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Guard trigger
        run: |
          set -euo pipefail
          test -f .github/.ui-system-v7-incidencias-modal-trigger || {
            echo "Trigger aún no presente; no hay migración que aplicar."
            exit 0
          }

      - name: Apply Incidencias Detail Modal V7
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_system_v7_incidencias_modal.py

      - name: Validate repository
        run: |
          set -euo pipefail
          python3 .github/scripts/repo_integrity.py
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Validate generated CSS shape
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for raw in (
              'src/css/components/detail-modal.css',
              'src/css/views/incidencias/detail.css',
          ):
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'{raw} tiene llaves desbalanceadas')
          print('V7 CSS shape OK')
          PY

      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add \
            src/css/views/incidencias/detail.css \
            src/css/components/detail-modal.css \
            src/views/incidencias/incidencias.template.modal.js \
            src/router/styles.js \
            .github/scripts/repo_integrity.py \
            docs/UI_SYSTEM_V7_AUDIT.md
          if git diff --cached --quiet; then
            echo "Sin cambios de migración."
            exit 0
          fi
          git commit -m "refactor(incidencias): compartir Detail Modal transversal"
          git push origin HEAD:${TARGET_BRANCH}
