name: Facturas Resend Polish Bootstrap V3

on:
  push:
    branches:
      - fix/facturas-mobile-resend-confirm

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped Facturas polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/facturas-resend-polish-bootstrap-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate focused Facturas change"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          code = textwrap.dedent(source[start:end])

          replacements = [
              (
                  'if "window.confirm(question)" in index:\n    pattern = re.compile(',
                  'if "¿Quieres volver a enviarla?" in index:\n    pattern = re.compile(',
              ),
              (
                  'if "window.confirm(question)" in index:\n    raise SystemExit("native resend confirm survived replacement")',
                  'if "¿Quieres volver a enviarla?" in index:\n    raise SystemExit("native resend confirm survived replacement")',
              ),
              (
                  'reject(INDEX, "window.confirm(", "Resend confirmation must not use the browser-native confirm dialog")',
                  'reject(INDEX, "¿Quieres volver a enviarla?", "Resend confirmation must not use the browser-native confirm dialog")',
              ),
          ]
          for old, new in replacements:
              if code.count(old) != 1:
                  raise SystemExit(f'V3 patch source anchor mismatch: {old[:72]}')
              code = code.replace(old, new, 1)

          exec(compile(code, 'facturas-resend-polish-bootstrap-v3', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate focused Facturas change
        shell: bash
        run: |
          node --check src/views/facturas/index.js
          python .github/scripts/facturas_continuous_scroll_contract.py
          python .github/scripts/private_admin_alignment_contract.py
          python .github/scripts/repo_integrity.py
          node .github/scripts/continuous_scroll_smoke.mjs
          git diff --check

      - name: Commit focused Facturas change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "Onion Support Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/facturas/index.js src/css/views/facturas/index.css .github/scripts/facturas_continuous_scroll_contract.py
          git commit -m "fix: polish facturas mobile and resend confirm"
          git push origin HEAD:fix/facturas-mobile-resend-confirm
