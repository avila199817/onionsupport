name: TEMP Generate hero WebP

on:
  push:
    branches:
      - perf/public-home-image-lcp

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated-image]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: perf/public-home-image-lcp
          fetch-depth: 1
          persist-credentials: true

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Generate responsive WebP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          src = Path('src/media/img/Cristian_Avila.png')
          outdir = src.parent
          image = ImageOps.exif_transpose(Image.open(src))

          if image.mode not in ('RGB', 'RGBA'):
              image = image.convert('RGBA' if 'A' in image.getbands() else 'RGB')

          original_w, original_h = image.size
          print(f'Original: {original_w}x{original_h}')

          for target_w in (480, 960):
              width = min(target_w, original_w)
              height = round(original_h * width / original_w)
              resized = image if width == original_w else image.resize((width, height), Image.Resampling.LANCZOS)
              output = outdir / f'Cristian_Avila_{target_w}.webp'
              resized.save(output, 'WEBP', quality=82, method=6, exact=True)
              print(f'{output}: {output.stat().st_size} bytes ({width}x{height})')
          PY

          ls -lh src/media/img/Cristian_Avila_*.webp

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Onion Support CI"
          git config user.email "cristian@onionsupport.com"
          git add src/media/img/Cristian_Avila_480.webp src/media/img/Cristian_Avila_960.webp
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "perf: generar imágenes WebP responsivas del hero [generated-image]"
          git push origin HEAD:perf/public-home-image-lcp
