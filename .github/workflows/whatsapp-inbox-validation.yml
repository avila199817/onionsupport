name: WhatsApp inbox validation

on:
  push:
    branches:
      - feat/whatsapp-inbox-pro

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use exact Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Use exact npm
        shell: bash
        run: npm install --global npm@10.9.8

      - name: Install locked dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Validate complete candidate
        shell: bash
        env:
          PUBLIC_SITE_URL: https://onionsupport.com
          DIRECT_API_URL: https://api.onionsupport.com
        run: npm run validate
