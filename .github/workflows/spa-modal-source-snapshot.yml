name: SPA modal regression diagnostics
on:
  push:
    branches:
      - fix/spa-modal-attachments-home-20260909
permissions:
  contents: read
concurrency:
  group: spa-modal-regression-diagnostics
  cancel-in-progress: true
env:
  BASE_SHA: f7348006fe147cff128b2c5db3b85619b8e1bde9
  MANIFEST_SHA: dee512ede82f4aa9a0a86815653ab71ecf3a5cda5b1fffa8583f1dcddcc1cc1c
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.ready.outputs.artifact-id }}
      patch_sha: ${{ steps.prepare.outputs.patch_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Prepare exact clean reviewed candidate on merged contract base
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/spa-ready"
          cp .github/ci/spa-candidate-manifest.json "${RUNNER_TEMP}/spa-ready/manifest.json"
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = ''.join(Path(f'.github/ci/spa-candidate-{i}.b64').read_text().strip() for i in range(4))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'cd7c349370368a59ae1a690578679332a0000168f4e4ed9e7fdedb9a9ba66b45'
          assert hashlib.sha256(Path('.github/ci/spa-regression-refinement.patch').read_bytes()).hexdigest() == 'd59627d5b17346b6b02aa4b5d6b443e96f836d2d92a964079fe9b25ad11feeff'
          Path(os.environ['RUNNER_TEMP'], 'spa.patch').write_bytes(patch)
          PY
          git apply --check "${RUNNER_TEMP}/spa.patch"
          git apply "${RUNNER_TEMP}/spa.patch"
          git apply .github/ci/spa-regression-refinement.patch
          rm .github/ci/spa-candidate-{0,1,2,3}.b64 .github/ci/spa-regression-refinement.patch .github/ci/spa-candidate-manifest.json .github/workflows/spa-modal-source-snapshot.yml
          git fetch --depth=1 origin "${BASE_SHA}"
          git add -A
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          manifest = Path(os.environ['RUNNER_TEMP'], 'spa-ready/manifest.json').read_bytes()
          assert hashlib.sha256(manifest).hexdigest() == os.environ['MANIFEST_SHA']
          files = json.loads(manifest)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', os.environ['BASE_SHA']], text=True).splitlines()
          assert set(changed) == set(files), changed
          for name, digest in files.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          candidate=$(git commit-tree "$tree" -p "${BASE_SHA}" -m 'fix(spa): unify Home entity identity and owner-scoped attachment lifecycle')
          git checkout --detach "$candidate"
          git diff "${BASE_SHA}" HEAD --binary > "${RUNNER_TEMP}/spa-ready/candidate.patch"
          echo "patch_sha=$(sha256sum "${RUNNER_TEMP}/spa-ready/candidate.patch" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
      - name: Install locked dependencies without secrets
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise corrected Home and attachment flows
        shell: bash
        env:
          SPA_MODAL_EVIDENCE: /tmp/spa-modal-evidence/after
        run: |
          set -euo pipefail
          node tools/private-domain-contracts.mjs --browser 2>&1 | tee "${RUNNER_TEMP}/spa-modal-after.log"
      - name: Validate full production candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:ci 2>&1 | tee "${RUNNER_TEMP}/spa-modal-ci.log"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: ready
        with:
          name: spa-reviewed-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/spa-ready
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: spa-modal-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/spa-modal-*.log
            /tmp/spa-modal-evidence
          retention-days: 3
          if-no-files-found: error
  publish-reviewed-feature-branch:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f7348006fe147cff128b2c5db3b85619b8e1bde9
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.regression.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/spa-ready
      - name: Publish verified bytes only; never execute candidate code or modify main
        shell: bash
        env:
          PATCH_SHA: ${{ needs.regression.outputs.patch_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'], 'spa-ready')
          assert hashlib.sha256((root / 'manifest.json').read_bytes()).hexdigest() == os.environ['MANIFEST_SHA']
          assert hashlib.sha256((root / 'candidate.patch').read_bytes()).hexdigest() == os.environ['PATCH_SHA']
          PY
          git apply --check "${RUNNER_TEMP}/spa-ready/candidate.patch"
          git apply "${RUNNER_TEMP}/spa-ready/candidate.patch"
          git add -A
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          files = json.loads(Path(os.environ['RUNNER_TEMP'], 'spa-ready/manifest.json').read_text())
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(changed) == set(files)
          for name, digest in files.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(spa): unify Home entity identity and owner-scoped attachment lifecycle'
          git push origin HEAD:refs/heads/fix/spa-modal-owner-final-20260909
          echo "Validated feature commit: $(git rev-parse HEAD)" >> "${GITHUB_STEP_SUMMARY}"
