name: Incidencias Composer Yellow Once

on:
  push:
    branches:
      - style/incidencias-composer-yellow-20260817
    paths:
      - .github/scripts/patch-incidencias-composer-yellow.py
      - .github/workflows/incidencias-composer-yellow-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/incidencias-composer-yellow-20260817
          fetch-depth: 0

      - name: Apply composer yellow patch
        run: python3 .github/scripts/patch-incidencias-composer-yellow.py

      - name: Validate composer color contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = Path('src/css/views/incidencias/detail.css').read_text(encoding='utf-8')
          start = css.index('.incidencias-modal-composer {')
          end = css.index('.incidencias-modal-composer-head {', start)
          block = css[start:end]
          for token in ('var(--idm-warning) 50%', 'var(--idm-warning) 68%', 'var(--idm-warning) 58%'):
              if token not in block:
                  raise SystemExit(f'Missing {token}')
          if 'var(--idm-accent) 26%' in block or 'var(--idm-accent) 52%' in block:
              raise SystemExit('Legacy composer accent border remains')
          PY

      - name: Commit CSS and remove one-shot files
        run: |
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git rm .github/scripts/patch-incidencias-composer-yellow.py \
                 .github/workflows/incidencias-composer-yellow-once.yml
          git add src/css/views/incidencias/detail.css
          git commit -m "style(incidencias): dejar todos los composers en amarillo"
          git push origin HEAD:style/incidencias-composer-yellow-20260817
