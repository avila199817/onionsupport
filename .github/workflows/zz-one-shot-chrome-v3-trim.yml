name: One-shot App Chrome V3 trim

on:
  push:
    branches:
      - refactor/app-chrome-v3-single-layout

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/app-chrome-v3-single-layout

      - name: Remove obsolete geometry authorities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def remove_section(path: str, start_prefix: str, end_prefix: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              start = text.find(start_prefix)
              if start < 0:
                  raise SystemExit(f"{path}: start marker missing: {start_prefix!r}")
              end = text.find(end_prefix, start + len(start_prefix))
              if end < 0:
                  raise SystemExit(f"{path}: end marker missing: {end_prefix!r}")
              p.write_text(text[:start] + text[end:], encoding="utf-8")

          remove_section(
              "src/css/layout/topbar.css",
              "/* =========================================================\n   SIDEBAR OFFSET BRIDGE",
              "/* =========================================================\n   TOKENS",
          )
          remove_section(
              "src/css/layout/topbar.css",
              "/* =========================================================\n   MOUNT",
              "/* =========================================================\n   TOPBAR BASE",
          )
          remove_section(
              "src/css/layout/sidebar.css",
              "/* =========================================================\n   MOBILE",
              "/* =========================================================\n   POINTER / ACCESSIBILITY",
          )
          remove_section(
              "src/css/core/layout.css",
              "/* =========================================================\n   SIDEBAR WIDTH AUTHORITY",
              "/* =========================================================\n   APP SHELL",
          )
          remove_section(
              "src/css/core/layout.css",
              "/* =========================================================\n   MOUNT LAYERS",
              "/* =========================================================\n   BOOT / READY",
          )

          replacements = {
              "src/css/layout/topbar.css": (
                  "   - Respetar sidebar open/collapsed/hidden.\n",
                  "   - Limitarse a skin y componentes internos; geometría global -> chrome.css.\n",
              ),
              "src/css/layout/sidebar.css": (
                  "   - Mantener desktop rail, mobile rail/drawer, dropdown y avatar.\n",
                  "   - Mantener navegación/dropdown/avatar; geometría global -> chrome.css.\n",
              ),
              "src/css/core/layout.css": (
                  "   - Offset de Sidebar para main/tablehead.\n",
                  "   - Consumir el offset canónico publicado por App Chrome.\n",
              ),
          }

          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{path}: replacement marker missing")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate trimmed architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f src/css/layout/chrome.css
          test ! -f src/css/layout/mobile-shell.css
          ! grep -q '@layer layout' src/css/layout/chrome.css
          ! grep -q 'SIDEBAR OFFSET BRIDGE' src/css/layout/topbar.css
          ! grep -q 'SIDEBAR WIDTH AUTHORITY' src/css/core/layout.css
          ! grep -q 'MOUNT LAYERS' src/css/core/layout.css
          python .github/scripts/repo_integrity.py
          git diff --check

      - name: Commit trim
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add src/css/layout/topbar.css src/css/layout/sidebar.css src/css/core/layout.css
          git commit -m "refactor(chrome): retirar geometría duplicada"
          git push origin HEAD:refactor/app-chrome-v3-single-layout
