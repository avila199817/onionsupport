name: TEMP Public Hydration Idle

on:
  push:
    branches:
      - perf/public-home-third-party-idle

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[public-hydration-idle-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: perf/public-home-third-party-idle
          fetch-depth: 1
          persist-credentials: true

      - name: Patch public hydration scheduling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/app/index.js')
          text = p.read_text(encoding='utf-8')

          old = '''const PUBLIC_HOME_PATH = "/";\n\nconst AUTH_BOOT_OPTIONS =\n'''
          new = '''const PUBLIC_HOME_PATH = "/";\nconst PUBLIC_HYDRATION_DELAY_MS = 7000;\nconst PUBLIC_HYDRATION_INTERACTION_EVENTS =\n  Object.freeze(["pointerdown", "keydown", "touchstart"]);\n\nconst AUTH_BOOT_OPTIONS =\n'''
          if old not in text:
              raise SystemExit('constants anchor not found')
          text = text.replace(old, new, 1)

          old = '''let bootPromise = null;\nlet publicHydrationPromise = null;\nlet ready = false;\n'''
          new = '''let bootPromise = null;\nlet publicHydrationPromise = null;\nlet publicHydrationTimer = 0;\nlet publicHydrationInteractionHandler = null;\nlet ready = false;\n'''
          if old not in text:
              raise SystemExit('state anchor not found')
          text = text.replace(old, new, 1)

          old = '''  publicHydrationPromise = (async () => {\n    await initToast(payload);\n    await restoreAuth(payload);\n    await initGlobalUI(payload);\n    notifyPublicHomeSessionHydrated();\n    return true;\n  })()\n'''
          new = '''  publicHydrationPromise = (async () => {\n    await initToast(payload);\n    const restored = await restoreAuth(payload);\n\n    /*\n      El chrome privado no aporta nada a una visita pública anónima. Sólo se\n      hidrata si realmente existe una sesión autenticada restaurada.\n    */\n    if (\n      authResultAuthenticated(restored) ||\n      lastRestore?.authenticated === true\n    ) {\n      await initGlobalUI(payload);\n    }\n\n    notifyPublicHomeSessionHydrated();\n    return true;\n  })()\n'''
          if old not in text:
              raise SystemExit('hydrate body anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''  return publicHydrationPromise;\n}\n\nasync function startRouter(\n'''
          insert = '''  return publicHydrationPromise;\n}\n\nfunction clearPublicHydrationSchedule() {\n  if (!isBrowser()) return false;\n\n  if (publicHydrationTimer) {\n    window.clearTimeout(publicHydrationTimer);\n    publicHydrationTimer = 0;\n  }\n\n  if (publicHydrationInteractionHandler) {\n    for (const eventName of PUBLIC_HYDRATION_INTERACTION_EVENTS) {\n      window.removeEventListener(\n        eventName,\n        publicHydrationInteractionHandler,\n        true\n      );\n    }\n    publicHydrationInteractionHandler = null;\n  }\n\n  return true;\n}\n\nfunction schedulePublicHomeHydration(payload = {}) {\n  if (!isBrowser()) return false;\n  if (publicHydrationPromise || publicHydrationTimer) return true;\n\n  const start = () => {\n    clearPublicHydrationSchedule();\n    void hydratePublicHomeInBackground(payload);\n  };\n\n  publicHydrationInteractionHandler = start;\n\n  for (const eventName of PUBLIC_HYDRATION_INTERACTION_EVENTS) {\n    window.addEventListener(eventName, start, {\n      once: true,\n      capture: true,\n      passive: eventName !== "keydown",\n    });\n  }\n\n  publicHydrationTimer = window.setTimeout(\n    start,\n    PUBLIC_HYDRATION_DELAY_MS\n  );\n\n  return true;\n}\n\nasync function startRouter(\n'''
          if anchor not in text:
              raise SystemExit('scheduler insertion anchor not found')
          text = text.replace(anchor, insert, 1)

          old = '''    void hydratePublicHomeInBackground(\n      payload\n    );\n'''
          new = '''    schedulePublicHomeHydration(\n      payload\n    );\n'''
          if old not in text:
              raise SystemExit('runBoot hydration anchor not found')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY

          node --check src/app/index.js
          node --check src/analytics/google-tag.js
          python .github/scripts/google_measurement_contract.py --root .
          python .github/scripts/repo_integrity.py
          bash .github/ci/validate_spa_contracts.sh
          git diff --check

      - name: Commit runtime changes
        shell: bash
        run: |
          git config user.name "Onion Support CI"
          git config user.email "cristian@onionsupport.com"
          git add src/app/index.js src/analytics/google-tag.js
          git commit -m "perf: diferir terceros e hidratación pública [public-hydration-idle-applied]"
          git push origin HEAD:perf/public-home-third-party-idle
