name: Incidencias History Mode Order Once

on:
  push:
    branches:
      - fix/incidencias-history-mode-user-close-20260817
    paths:
      - .github/scripts/fix-incidencias-history-mode-order.py
      - .github/workflows/incidencias-history-mode-order-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/incidencias-history-mode-user-close-20260817
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply ordering fix
        run: python3 .github/scripts/fix-incidencias-history-mode-order.py

      - name: Validate syntax and ordering contract
        run: |
          node --check src/views/incidencias/index.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/views/incidencias/index.js').read_text(encoding='utf-8')
          pos_read = s.index('const currentHistoryMode =')
          pos_sync = s.index('syncAttributes(\n        currentBody,\n        nextBody', pos_read)
          pos_compare = s.index('currentHistoryMode !== nextHistoryMode', pos_sync)
          if not (pos_read < pos_sync < pos_compare):
              raise SystemExit('history mode must be read before currentBody attribute sync')
          PY

      - name: Commit and remove one-shot files
        run: |
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git rm -f .github/scripts/fix-incidencias-history-mode-order.py \
                    .github/workflows/incidencias-history-mode-order-once.yml
          git add src/views/incidencias/index.js
          git commit -m "fix(incidencias): detectar cambio de modo antes de sincronizar DOM"
          git push origin HEAD:fix/incidencias-history-mode-user-close-20260817
