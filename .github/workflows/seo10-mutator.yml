name: SEO 10 One-shot Refactor

on:
  push:
    branches:
      - seo/extreme-10-structure

permissions:
  contents: write

jobs:
  mutate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: seo/extreme-10-structure
          fetch-depth: 0
          persist-credentials: true

      - name: Apply canonical SEO 10/10 refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import html as html_lib
          import json
          import re

          ROOT = Path.cwd()

          def read(path):
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path, text):
              (ROOT / path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              write(path, text.replace(old, new, 1))

          # 1) Root entity graph: WebSite is published by the canonical LocalBusiness.
          old_root_schema = '''  <script type="application/ld+json">
            {
              "@context": "https://schema.org",
              "@type": "WebSite",
              "@id": "https://onionsupport.com/#website",
              "url": "https://onionsupport.com/",
              "name": "Onion Support",
              "alternateName": "Onion Support · Soluciones IT",
              "inLanguage": "es"
            }
          </script>'''

          new_root_schema = '''  <script type="application/ld+json">
            {
              "@context": "https://schema.org",
              "@graph": [
                {
                  "@type": "WebSite",
                  "@id": "https://onionsupport.com/#website",
                  "url": "https://onionsupport.com/",
                  "name": "Onion Support",
                  "alternateName": "Onion Support · Soluciones IT",
                  "inLanguage": "es",
                  "publisher": { "@id": "https://onionsupport.com/#business" }
                },
                {
                  "@type": "LocalBusiness",
                  "@id": "https://onionsupport.com/#business",
                  "name": "Onion Support",
                  "url": "https://onionsupport.com/",
                  "image": "https://onionsupport.com/src/media/img/Cristian_Avila_480.webp",
                  "logo": "https://onionsupport.com/src/media/img/favicon_black_circle_128.webp",
                  "email": "cristian@onionsupport.com",
                  "telephone": "+34629946615",
                  "areaServed": "Sant Vicenç de Castellet, Barcelona y alrededores",
                  "address": {
                    "@type": "PostalAddress",
                    "addressLocality": "Sant Vicenç de Castellet",
                    "postalCode": "08295",
                    "addressRegion": "Cataluña",
                    "addressCountry": "ES"
                  }
                }
              ]
            }
          </script>'''
          replace_once("index.html", old_root_schema, new_root_schema)

          # 2) Runtime landing graph shares the exact same business identity.
          template_path = "src/views/public/home/template.js"
          template = read(template_path)
          template = template.replace(
              'public.home.template.final.productivo.2026.23-system-icon-10-10',
              'public.home.template.final.productivo.2026.24-seo-structure-10-10',
              1,
          )
          old_business = '''const LOCAL_BUSINESS_SCHEMA = {
            "@context": "https://schema.org",
            "@type": "LocalBusiness",
            name: BUSINESS.name,
            url: `https://${BUSINESS.domain}/`,
            email: BUSINESS.email,
            telephone: BUSINESS.phoneTel,
            areaServed: "Sant Vicenç de Castellet, Barcelona y alrededores",
            address: {
              "@type": "PostalAddress",
              addressLocality: "Sant Vicenç de Castellet",
              postalCode: BUSINESS.postalCode,
              addressRegion: BUSINESS.region,
              addressCountry: "ES",
            },
          };'''
          new_business = '''const LOCAL_BUSINESS_SCHEMA = {
            "@context": "https://schema.org",
            "@type": "LocalBusiness",
            "@id": `https://${BUSINESS.domain}/#business`,
            name: BUSINESS.name,
            url: `https://${BUSINESS.domain}/`,
            image: `https://${BUSINESS.domain}/src/media/img/Cristian_Avila_480.webp`,
            logo: `https://${BUSINESS.domain}/src/media/img/favicon_black_circle_128.webp`,
            email: BUSINESS.email,
            telephone: BUSINESS.phoneTel,
            areaServed: "Sant Vicenç de Castellet, Barcelona y alrededores",
            address: {
              "@type": "PostalAddress",
              addressLocality: "Sant Vicenç de Castellet",
              postalCode: BUSINESS.postalCode,
              addressRegion: BUSINESS.region,
              addressCountry: "ES",
            },
          };'''
          if template.count(old_business) != 1:
              raise SystemExit("template.js: canonical LocalBusiness block not found exactly once")
          template = template.replace(old_business, new_business, 1)

          service_hrefs = {
              "Ordenadores y portátiles": "/reparacion-ordenadores",
              "SSD, RAM y componentes": "/reparacion-ordenadores",
              "Sistema operativo": "/soporte-informatico",
              "Optimización real": "/soporte-informatico",
              "WiFi y redes": "/redes-wifi",
              "Impresoras y periféricos": "/impresoras",
              "Diagnóstico técnico": "/soporte-informatico",
              "Seguridad y limpieza": "/soporte-informatico",
              "Portfolio técnico": "/soporte-empresas",
          }
          for title, href in service_hrefs.items():
              old = f'    title: "{title}",\n    text:'
              new = f'    title: "{title}",\n    href: "{href}",\n    text:'
              if template.count(old) != 1:
                  raise SystemExit(f"template.js: service target not unique: {title}")
              template = template.replace(old, new, 1)

          old_render_services = '''function renderServices() {
            return SERVICES.map((service, index) => `
              <article class="public-home-service-card" data-public-home-reveal="true" data-public-home-magnetic="true" style="--public-home-reveal-index:${escapeAttr(index)};">
                <span class="public-home-service-icon" aria-hidden="true">${renderIcon(service.icon)}</span>
                <h3>${escapeHtml(service.title)}</h3>
                <p>${escapeHtml(service.text)}</p>
              </article>
            `).join("");
          }'''
          new_render_services = '''function renderServices() {
            return SERVICES.map((service, index) => `
              <a class="public-home-service-card" href="${escapeAttr(service.href)}" aria-label="${escapeAttr(`${service.title} · Ver servicio`)}" data-public-home-service-link="true" data-public-home-reveal="true" data-public-home-magnetic="true" style="--public-home-reveal-index:${escapeAttr(index)};">
                <span class="public-home-service-icon" aria-hidden="true">${renderIcon(service.icon)}</span>
                <h3>${escapeHtml(service.title)}</h3>
                <p>${escapeHtml(service.text)}</p>
              </a>
            `).join("");
          }'''
          if template.count(old_render_services) != 1:
              raise SystemExit("template.js: renderServices canonical block not found exactly once")
          template = template.replace(old_render_services, new_render_services, 1)
          write(template_path, template)

          # 3) Every public service page declares its hierarchy and reuses the canonical business @id.
          service_labels = {
              "reparacion-ordenadores": "Reparación de ordenadores",
              "soporte-informatico": "Soporte informático",
              "redes-wifi": "WiFi y redes",
              "impresoras": "Impresoras y periféricos",
              "soporte-empresas": "Soporte informático para empresas",
          }
          provider_old = '<div itemprop="provider" itemscope itemtype="https://schema.org/LocalBusiness">'
          provider_new = '<div itemprop="provider" itemscope itemtype="https://schema.org/LocalBusiness" itemid="https://onionsupport.com/#business">'

          for slug, label in service_labels.items():
              path = f"seo/{slug}.html"
              source = read(path)
              canonical = f"https://onionsupport.com/{slug}"
              title_match = re.search(r"<title>(.*?)</title>", source, re.S | re.I)
              if not title_match:
                  raise SystemExit(f"{path}: missing title")
              page_name = html_lib.unescape(" ".join(title_match.group(1).split()))

              if source.count(provider_old) != 1:
                  raise SystemExit(f"{path}: provider block target not unique")
              source = source.replace(provider_old, provider_new, 1)

              schema = {
                  "@context": "https://schema.org",
                  "@graph": [
                      {
                          "@type": "WebPage",
                          "@id": f"{canonical}#webpage",
                          "url": canonical,
                          "name": page_name,
                          "isPartOf": {"@id": "https://onionsupport.com/#website"},
                          "about": {"@id": "https://onionsupport.com/#business"},
                          "breadcrumb": {"@id": f"{canonical}#breadcrumb"},
                          "inLanguage": "es",
                      },
                      {
                          "@type": "BreadcrumbList",
                          "@id": f"{canonical}#breadcrumb",
                          "itemListElement": [
                              {
                                  "@type": "ListItem",
                                  "position": 1,
                                  "name": "Onion Support",
                                  "item": "https://onionsupport.com/",
                              },
                              {
                                  "@type": "ListItem",
                                  "position": 2,
                                  "name": label,
                                  "item": canonical,
                              },
                          ],
                      },
                  ],
              }
              json_ld = json.dumps(schema, ensure_ascii=False, indent=2).replace("<", "\\u003c")
              block = "\n  <script type=\"application/ld+json\" data-onion-schema=\"service-hierarchy\">\n" + "\n".join("    " + line for line in json_ld.splitlines()) + "\n  </script>\n"
              marker = '\n  <link rel="icon" href="/favicon.ico" sizes="any">'
              if source.count(marker) != 1:
                  raise SystemExit(f"{path}: favicon insertion marker not unique")
              source = source.replace(marker, block + marker, 1)
              write(path, source)

          # 4) Sitemap signals the changed public surfaces without changing URL eligibility.
          sitemap_path = "sitemap.xml"
          sitemap = read(sitemap_path)
          sitemap = sitemap.replace("<lastmod>2026-08-25</lastmod>", "<lastmod>2026-08-31</lastmod>")
          write(sitemap_path, sitemap)

          # 5) Mobile synthetic budget now matches Google's good Core Web Vitals target for LCP.
          mobile_path = ".github/lighthouse/mobile.json"
          mobile = json.loads(read(mobile_path))
          mobile_rules = mobile["ci"]["assert"]["assertions"]
          mobile_rules["categories:performance"][1]["minScore"] = 0.92
          mobile_rules["first-contentful-paint"][1]["maxNumericValue"] = 1800
          mobile_rules["largest-contentful-paint"][1]["maxNumericValue"] = 2500
          mobile_rules["total-blocking-time"][1]["maxNumericValue"] = 300
          write(mobile_path, json.dumps(mobile, ensure_ascii=False, indent=2) + "\n")

          # Add one representative static SEO page to the recurring Lighthouse production sample.
          workflow_path = ".github/workflows/performance-monitor.yml"
          workflow = read(workflow_path)
          verify_old = '''          for url in \\
                    "https://onionsupport.com/" \\
                    "https://onionsupport.com/login"; do'''
          verify_new = '''          for url in \\
                    "https://onionsupport.com/" \\
                    "https://onionsupport.com/login" \\
                    "https://onionsupport.com/reparacion-ordenadores"; do'''
          if workflow.count(verify_old) != 1:
              raise SystemExit("performance-monitor.yml: verify URL block not found exactly once")
          workflow = workflow.replace(verify_old, verify_new, 1)
          urls_old = '''          urls: |
                    https://onionsupport.com/
                    https://onionsupport.com/login'''
          urls_new = '''          urls: |
                    https://onionsupport.com/
                    https://onionsupport.com/login
                    https://onionsupport.com/reparacion-ordenadores'''
          if workflow.count(urls_old) != 1:
              raise SystemExit("performance-monitor.yml: Lighthouse URL block not found exactly once")
          workflow = workflow.replace(urls_old, urls_new, 1)
          write(workflow_path, workflow)

          # 6) Make the quality contracts executable, not merely documentary.
          contract_path = ".github/scripts/performance-monitor-contract.mjs"
          contract = read(contract_path)
          contract = contract.replace(
              '  "https://onionsupport.com/login",\n',
              '  "https://onionsupport.com/login",\n  "https://onionsupport.com/reparacion-ordenadores",\n',
              1,
          )
          anchor = '''assert.equal(
            desktop?.ci?.collect?.settings?.preset,
            "desktop",
            "el perfil desktop debe usar preset=desktop"
          );
          '''
          hardening = '''assert.equal(
            desktop?.ci?.collect?.settings?.preset,
            "desktop",
            "el perfil desktop debe usar preset=desktop"
          );

          const mobileRules = assertions(mobile);
          const desktopRules = assertions(desktop);

          assert.equal(
            mobileRules["categories:performance"]?.[1]?.minScore,
            0.92,
            "mobile: performance median warning budget must be >= 0.92"
          );
          assert.equal(
            mobileRules["first-contentful-paint"]?.[1]?.maxNumericValue,
            1800,
            "mobile: FCP warning budget must be 1800ms"
          );
          assert.equal(
            mobileRules["largest-contentful-paint"]?.[1]?.maxNumericValue,
            2500,
            "mobile: LCP warning budget must match the 2.5s good threshold"
          );
          assert.equal(
            mobileRules["total-blocking-time"]?.[1]?.maxNumericValue,
            300,
            "mobile: TBT warning budget must be 300ms"
          );
          for (const [label, rules] of [["mobile", mobileRules], ["desktop", desktopRules]]) {
            assert.equal(
              rules["cumulative-layout-shift"]?.[1]?.maxNumericValue,
              0.1,
              `${label}: CLS warning budget must stay <= 0.1`
            );
            assert.ok(
              rules["largest-contentful-paint"]?.[1]?.maxNumericValue <= 2500,
              `${label}: LCP warning budget cannot exceed 2500ms`
            );
          }
          '''
          if contract.count(anchor) != 1:
              raise SystemExit("performance-monitor-contract.mjs: desktop anchor not unique")
          contract = contract.replace(anchor, hardening, 1)
          write(contract_path, contract)

          home_contract_path = ".github/scripts/public_home_integrity.py"
          home_contract = read(home_contract_path)
          required_anchor = '''    "src/views/public/login/template.js",
          )'''
          required_new = '''    "src/views/public/login/template.js",
              "seo/reparacion-ordenadores.html",
              "seo/soporte-informatico.html",
              "seo/redes-wifi.html",
              "seo/impresoras.html",
              "seo/soporte-empresas.html",
          )'''
          if home_contract.count(required_anchor) != 1:
              raise SystemExit("public_home_integrity.py: REQUIRED anchor not unique")
          home_contract = home_contract.replace(required_anchor, required_new, 1)

          assertion_anchor = '''    require(
                  errors,
                  len(modules) == 1 and modules[0].get("src") == "/src/main.js",
                  "index.html debe ejecutar únicamente /src/main.js como módulo",
              )
          '''
          assertion_new = assertion_anchor + '''
              for public_path in (
                  "/reparacion-ordenadores",
                  "/soporte-informatico",
                  "/redes-wifi",
                  "/impresoras",
                  "/soporte-empresas",
              ):
                  require(
                      errors,
                      f'href: "{public_path}"' in home_template,
                      f"La landing debe enlazar semánticamente el servicio público {public_path}",
                  )

              require(
                  errors,
                  'data-public-home-service-link="true"' in home_template,
                  "Las tarjetas de servicio deben ser enlaces HTML rastreables",
              )
              require(
                  errors,
                  '"@id": `https://${BUSINESS.domain}/#business`' in home_template,
                  "El LocalBusiness runtime debe reutilizar el @id canónico",
              )
              require(
                  errors,
                  '"publisher": { "@id": "https://onionsupport.com/#business" }' in index,
                  "El WebSite raíz debe apuntar al LocalBusiness canónico",
              )

              service_hierarchy = {
                  "seo/reparacion-ordenadores.html": "https://onionsupport.com/reparacion-ordenadores",
                  "seo/soporte-informatico.html": "https://onionsupport.com/soporte-informatico",
                  "seo/redes-wifi.html": "https://onionsupport.com/redes-wifi",
                  "seo/impresoras.html": "https://onionsupport.com/impresoras",
                  "seo/soporte-empresas.html": "https://onionsupport.com/soporte-empresas",
              }
              for relative, canonical in service_hierarchy.items():
                  source = read(relative)
                  require(
                      errors,
                      'data-onion-schema="service-hierarchy"' in source,
                      f"{relative} debe declarar jerarquía WebPage/BreadcrumbList",
                  )
                  require(
                      errors,
                      '"@type": "BreadcrumbList"' in source,
                      f"{relative} debe declarar BreadcrumbList",
                  )
                  require(
                      errors,
                      f'"item": "{canonical}"' in source,
                      f"{relative} debe cerrar el breadcrumb sobre su canonical",
                  )
                  require(
                      errors,
                      'itemid="https://onionsupport.com/#business"' in source,
                      f"{relative} debe reutilizar la identidad canónica del proveedor",
                  )
          '''
          if home_contract.count(assertion_anchor) != 1:
              raise SystemExit("public_home_integrity.py: assertion anchor not unique")
          home_contract = home_contract.replace(assertion_anchor, assertion_new, 1)
          write(home_contract_path, home_contract)

          # Local safety checks before committing.
          assert '"@graph": [' in read("index.html")
          assert 'data-public-home-service-link="true"' in read(template_path)
          assert '"@type": "BreadcrumbList"' in read("seo/reparacion-ordenadores.html")
          assert 'https://onionsupport.com/reparacion-ordenadores' in read(workflow_path)
          PY

      - name: Run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/performance-monitor-contract.mjs
          python3 .github/scripts/public_home_integrity.py
          python3 -m json.tool .github/lighthouse/mobile.json >/dev/null
          python3 -m json.tool .github/lighthouse/desktop.json >/dev/null
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          print('SEO 10 XML contract OK')
          PY

      - name: Commit final tree and remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git rm .github/workflows/seo10-mutator.yml
          git add index.html sitemap.xml src/views/public/home/template.js seo/*.html .github/lighthouse/mobile.json .github/workflows/performance-monitor.yml .github/scripts/performance-monitor-contract.mjs .github/scripts/public_home_integrity.py
          git diff --cached --check
          git commit -m "seo: harden public architecture to 10/10"
          git push origin HEAD:seo/extreme-10-structure
