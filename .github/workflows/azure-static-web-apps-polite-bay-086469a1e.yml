name: Azure Static Web Apps CI/CD

run-name: SWA · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name || 'manual' }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

  workflow_dispatch:

concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  APP_LOCATION: "/"
  API_LOCATION: ""
  OUTPUT_LOCATION: ""
  PRODUCTION_BRANCH: "main"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >-
      (
        github.event_name == 'push' &&
        github.ref_name == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == 'main'
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.base_ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    env:
      SWA_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Validate static SPA package
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SWA_API_TOKEN:-}" ]]; then
            echo "::error::Falta el secret AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E."
            exit 1
          fi

          required_files=(
            "index.html"
            "staticwebapp.config.json"
            "site.webmanifest"
            "robots.txt"
            "sitemap.xml"
            "favicon.ico"
            "src/main.js"
            "src/preboot/theme.js"
            "src/css/app.css"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Archivo obligatorio no encontrado."
              exit 1
            fi
          done

          python3 -m json.tool staticwebapp.config.json >/dev/null
          python3 -m json.tool site.webmanifest >/dev/null

          required_index_refs=(
            "/src/preboot/theme.js"
            "/src/css/app.css"
            "/src/main.js"
          )

          for ref in "${required_index_refs[@]}"; do
            if ! grep -Fq "$ref" index.html; then
              echo "::error file=index.html::Referencia obligatoria no encontrada: $ref"
              exit 1
            fi
          done

          echo "Onion SPA static package OK."

      - name: Deploy static SPA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload

          production_branch: ${{ env.PRODUCTION_BRANCH }}

          app_location: ${{ env.APP_LOCATION }}
          api_location: ${{ env.API_LOCATION }}
          output_location: ${{ env.OUTPUT_LOCATION }}

          skip_app_build: true
          skip_api_build: true

  close_preview:
    name: Close PR Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository

    env:
      SWA_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}

    steps:
      - name: Validate deployment token
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SWA_API_TOKEN:-}" ]]; then
            echo "::error::Falta el secret AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E."
            exit 1
          fi

      - name: Close PR preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: close
