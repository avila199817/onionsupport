<!doctype html>
<html
  lang="es"
  dir="ltr"
  data-app="onion"
  data-app-name="Onion Support"
  data-locale="es"
  data-theme="system"
  data-theme-mode="system"
  data-theme-ready="false"
  data-app-state="booting"
  data-app-loading="true"
  data-app-ready="false"
  data-route-mode="boot"
  data-css-route-mode="route"
  data-css-route-layer-contract="self-layered-v1"
  data-chrome="hidden"
  class="app-booting app-loading no-js"
>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <base href="/">

  <meta name="application-name" content="Onion Support">
  <meta name="apple-mobile-web-app-title" content="Onion Support">

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <meta
    name="format-detection"
    content="telephone=no, date=no, address=no, email=no"
  >

  <meta
    name="color-scheme"
    content="light dark"
  >

  <meta
    name="theme-color"
    content="#0a0c11"
    data-onion-theme-color="true"
  >

  <meta
    name="theme-color"
    media="(prefers-color-scheme: light)"
    content="#ffffff"
    data-onion-theme-color-light="true"
  >

  <meta
    name="theme-color"
    media="(prefers-color-scheme: dark)"
    content="#0a0c11"
    data-onion-theme-color-dark="true"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta property="og:image:type" content="image/webp">
  <meta property="og:image:width" content="480">
  <meta property="og:image:height" content="600">
  <link
    rel="icon"
    href="/favicon.ico"
    sizes="any"
  >

  <link
    rel="manifest"
    href="/site.webmanifest"
  >

  <!-- Root-only warmup: no arrastra recursos de la landing a rutas privadas. -->
  <script async src="/src/preboot/public-home-preload.js"></script>

  <!-- Google tag (GA4). Bootstrap local canónico; el remoto se difiere internamente. -->

  <!--
    Se ejecuta antes de pintar la interfaz para fijar el tema
    y evitar flashes claro/oscuro durante el arranque.
  -->
  <script src="/src/preboot/theme.js"></script>

  <link
    rel="stylesheet"
    href="/src/css/app.css"
  >

  <!--
    Sólo se adelantan recursos que main.js necesita antes del Router.
    Las mejoras post-router permanecen realmente diferidas.

    main.js vive al final del body para preservar el HTML semántico, pero su
    descarga empieza desde head para recortar el cold boot sin ejecutarlo antes.

    Autoridad post-router:
    /src/features/mobile-datalist/index.js se carga desde
    /src/app/enhancements.js, nunca como script ejecutable de index.html.
  -->
  <link
    rel="modulepreload"
    href="/src/main.js"
    data-onion-build-preload="main"
  >
  <link
    rel="modulepreload"
    href="/src/app/enhancements.js"
    data-onion-build-preload="enhancements"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="/src/css/core/noscript.css"
    >
  </noscript>
  <!-- public-site-v3: generated metadata -->
  <title>Onion Support</title>
  <meta name="description" content="Soporte informático para particulares, autónomos y empresas en España. Asistencia remota, diagnóstico claro y soluciones para que tu tecnología funcione.">
  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <meta name="bingbot" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">
  <meta property="og:site_name" content="Onion Support">
  <meta property="og:title" content="Onion Support">
  <meta property="og:description" content="Soporte informático para particulares, autónomos y empresas en España. Asistencia remota, diagnóstico claro y soluciones para que tu tecnología funcione.">
  <meta property="og:url" content="https://onionsupport.com/">
  <meta property="og:image" content="https://onionsupport.com/src/media/img/Cristian_Avila_480.webp">
  <meta property="og:image:alt" content="Cristian Ávila, técnico informático de Onion Support">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Onion Support">
  <meta name="twitter:description" content="Soporte informático para particulares, autónomos y empresas en España. Asistencia remota, diagnóstico claro y soluciones para que tu tecnología funcione.">
  <meta name="twitter:image" content="https://onionsupport.com/src/media/img/Cristian_Avila_480.webp">
  <meta name="twitter:image:alt" content="Cristian Ávila, técnico informático de Onion Support">
  <link rel="canonical" href="https://onionsupport.com/">
  <link rel="alternate" hreflang="es-ES" href="https://onionsupport.com/">
  <link rel="alternate" hreflang="x-default" href="https://onionsupport.com/">
  <script type="application/ld+json" data-onion-site-metadata="v3" data-onion-schema="service-hierarchy">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "https://onionsupport.com/#website",
      "url": "https://onionsupport.com/",
      "name": "Onion Support",
      "alternateName": "onionsupport.com",
      "inLanguage": "es",
      "publisher": {
        "@id": "https://onionsupport.com/#business"
      }
    },
    {
      "@type": "Organization",
      "@id": "https://onionsupport.com/#business",
      "name": "Onion Support",
      "url": "https://onionsupport.com/",
      "image": "https://onionsupport.com/src/media/img/Cristian_Avila_480.webp",
      "logo": "https://onionsupport.com/src/media/img/favicon_black_circle_128.webp",
      "email": "cristian@onionsupport.com",
      "telephone": "+34629946615",

      "address": {

      "inLanguage": "es",
      "isPartOf": {

  <!-- /public-site-v3 -->
</head>

<body
  class="app-booting app-loading"
  data-app="onion"
  data-app-name="Onion Support"
  data-density="default"
  data-app-state="booting"
  data-app-loading="true"
  data-app-ready="false"
  data-route-mode="boot"
  data-chrome="hidden"
>
  <a
    class="sr-only sr-only-focusable app-skip-link"
    href="#main-content"
    data-skip-link="true"
  >
    Saltar al contenido principal
  </a>

  <div
    id="app-loader"
    class="app-loader is-visible"
    data-app-loader="true"
    data-loader-visible="true"
    data-loader-state="booting"
    role="status"
    aria-live="polite"
    aria-busy="true"
    aria-atomic="true"
    aria-hidden="false"
    aria-label="Cargando Onion Support"
  >
    <div
      class="app-loader__backdrop"
      data-loader-backdrop="true"
      aria-hidden="true"
    ></div>

    <div
      class="app-loader__brand app-loader__brand--solo"
      data-loader-brand="true"
      data-loader-logo-card="true"
      aria-hidden="true"
    >
      <div
        class="app-loader__logo-fallback app-loader__logo-shell"
        data-loader-logo-shell="true"
        data-loader-logo-fallback="true"
        aria-hidden="true"
      >
        <picture
          class="app-loader__logo-picture"
          data-loader-logo-picture="true"
        >
          <source
            type="image/webp"
            srcset="/src/media/img/favicon_black_circle_128.webp"
          >
          <img
            class="app-loader__logo"
            src="/favicon.ico"
            width="48"
            height="48"
            alt=""
            loading="eager"
            decoding="async"
            fetchpriority="high"
            draggable="false"
            data-loader-logo="true"
          >
        </picture>
      </div>
    </div>
  </div>

  <noscript>
    <div
      id="noscript-root"
      class="layout noscript-layout"
      data-noscript-root="true"
    >
      <main
        class="main-content noscript-main"
        role="main"
        aria-label="Contenido principal"
      >
        <section
          class="noscript-box"
          lang="es"
        >
          <p class="noscript-title">Onion Support</p>

          <p>
            La experiencia completa de Onion Support necesita JavaScript para
            cargar la web y el panel privado.
          </p>

          <p>
            También puedes contactar por WhatsApp o llamada en el
            <strong>629 946 615</strong>.
          </p>

          <p class="noscript-services-label">
            Servicios que puedes consultar sin JavaScript:
          </p>

          <nav
            class="noscript-services"
            aria-label="Servicios técnicos de Onion Support"
          >
            <a href="/reparacion-ordenadores">Reparación de ordenadores</a>
            <a href="/soporte-informatico">Soporte informático</a>
            <a href="/redes-wifi">WiFi y redes</a>
            <a href="/impresoras">Impresoras y periféricos</a>
            <a href="/soporte-empresas">Soporte informático para empresas</a>
            <a href="/login">Iniciar sesión</a>
          </nav>
        </section>
      </main>
    </div>
  </noscript>

  <div
    id="app-shell"
    class="layout app-shell"
    data-app-shell="true"
    data-shell="visible"
    data-shell-state="booting"
    data-chrome="hidden"
    data-route-mode="boot"
    aria-busy="true"
    aria-hidden="false"
  >
    <div
      id="sidebar-mount"
      data-sidebar-mount="true"
      data-chrome="hidden"
      data-route-mode="boot"
      hidden
      aria-hidden="true"
    ></div>

    <div
      id="topbar-mount"
      data-topbar-mount="true"
      data-chrome="hidden"
      data-route-mode="boot"
      hidden
      aria-hidden="true"
    ></div>

    <main
      id="main-content"
      class="main-content"
      role="main"
      aria-label="Contenido principal"
      tabindex="-1"
      aria-busy="true"
      aria-hidden="false"
      data-main-content="true"
      data-shell="visible"
      data-shell-state="booting"
      data-chrome="hidden"
      data-route-mode="boot"
    >
      <div
        id="table-head"
        class="table-head"
        data-tablehead="true"
        data-chrome="hidden"
        data-route-mode="boot"
        hidden
        aria-hidden="true"
      >
        <div
          id="tablehead-container"
          data-tablehead-container="true"
        ></div>
      </div>

      <div
        id="app-content"
        data-app-content="true"
        data-shell="visible"
        data-shell-state="booting"
        data-route-mode="boot"
        aria-busy="true"
        aria-hidden="false"
      >
        <div
          id="view-container"
          data-view-root="true"
          data-router-view="true"
          data-view-container="true"
          data-shell="visible"
          data-shell-state="booting"
          data-route-mode="boot"
          tabindex="-1"
          aria-busy="true"
          aria-hidden="false"
        ></div>
      </div>
    </main>
  </div>

  <!-- Único entrypoint ejecutable de la SPA. -->
  <script
    type="module"
    src="/src/main.js"
  ></script>
</body>
</html>
