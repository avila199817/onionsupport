name: Apply light support step numbers

on:
  push:
    branches:
      - fix/light-support-step-numbers

permissions:
  contents: write

jobs:
  apply:
    name: Apply source-level support step polish
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout working branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/light-support-step-numbers
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: true

      - name: Apply exact source changes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> bool:
              source = path.read_text(encoding="utf-8")
              if old in source:
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f"{label}: expected one source token, found {count}")
                  path.write_text(source.replace(old, new, 1), encoding="utf-8")
                  return True
              if new in source:
                  return False
              raise SystemExit(f"{label}: neither source nor target token found")

          changed = False

          support_path = Path("src/features/public-support/index.js")
          support_replacements = (
              (
                  '<div class="public-support-flow-item"><span>01</span><div><strong>Vinculamos el caso</strong>',
                  '<div class="public-support-flow-item"><span>1</span><div><strong>Vinculamos el caso</strong>',
                  "step 1",
              ),
              (
                  '<div class="public-support-flow-item"><span>02</span><div><strong>Creamos tu acceso si hace falta</strong>',
                  '<div class="public-support-flow-item"><span>2</span><div><strong>Creamos tu acceso si hace falta</strong>',
                  "step 2",
              ),
              (
                  '<div class="public-support-flow-item"><span>03</span><div><strong>Cliente, solo por Onion Support</strong>',
                  '<div class="public-support-flow-item"><span>3</span><div><strong>Cliente, solo por Onion Support</strong>',
                  "step 3",
              ),
          )
          for old, new, label in support_replacements:
              changed = replace_once(support_path, old, new, label) or changed

          theme_path = Path("src/css/compositions/public-system-theme-support.css")
          theme_source = theme_path.read_text(encoding="utf-8")
          theme_block = '''
          html:is([data-theme="light"], .theme-light) .public-home .public-support-flow > .public-support-flow-item > span {
            color: var(--public-home-accent-3);
            border-color: rgb(11 97 255 / .30);
            background:
              linear-gradient(180deg, rgb(19 148 255 / .12), rgb(11 97 255 / .075)),
              rgb(255 255 255 / .86);
            box-shadow:
              inset 0 1px 0 #ffffff,
              0 8px 18px rgb(11 97 255 / .10);
          }
          '''.strip()
          theme_anchor = '''
          html:is([data-theme="light"], .theme-light) .public-home .public-support-flow-item:hover {
            border-color: rgb(19 148 255 / .17);
            background:
              linear-gradient(180deg, rgb(239 249 255 / .96), rgb(247 251 255 / .90)),
              #ffffff;
            box-shadow:
              inset 0 1px 0 #ffffff,
              0 14px 30px rgb(31 67 103 / .10);
          }
          '''.strip()
          if theme_block not in theme_source:
              if theme_source.count(theme_anchor) != 1:
                  raise SystemExit("light step indicator anchor is missing or ambiguous")
              theme_source = theme_source.replace(
                  theme_anchor,
                  f"{theme_anchor}\n\n{theme_block}",
                  1,
              )
              theme_path.write_text(theme_source, encoding="utf-8")
              changed = True

          contract_path = Path(".github/scripts/public_system_theme_contract.mjs")
          contract_source = contract_path.read_text(encoding="utf-8")

          markup_contract = '''
          for (const [token, message] of [
            ['<span>1</span><div><strong>Vinculamos el caso</strong>', "El flujo público debe mostrar el paso 1 sin cero inicial"],
            ['<span>2</span><div><strong>Creamos tu acceso si hace falta</strong>', "El flujo público debe mostrar el paso 2 sin cero inicial"],
            ['<span>3</span><div><strong>Cliente, solo por Onion Support</strong>', "El flujo público debe mostrar el paso 3 sin cero inicial"],
          ]) {
            assert.ok(publicSupport.includes(token), message);
          }

          assert.doesNotMatch(
            publicSupport,
            /<span>0[123]<\\/span>/,
            "El flujo público no puede recuperar ceros iniciales en sus pasos"
          );
          '''.strip()
          markup_anchor = '''
          for (const [token, message] of [
            ['link.dataset.publicSupportIntakeLink = "true";', "Los CTA internos deben publicar su marcador semántico"],
            ['label.textContent = "Abrir incidencia";', "Los CTA con span deben recibir el texto Abrir incidencia"],
            ['link.textContent = "Abrir incidencia";', "Los CTA sin span deben recibir el texto Abrir incidencia"],
          ]) {
            assert.ok(publicSupport.includes(token), message);
          }
          '''.strip()
          if markup_contract not in contract_source:
              if contract_source.count(markup_anchor) != 1:
                  raise SystemExit("public support markup contract anchor is missing or ambiguous")
              contract_source = contract_source.replace(
                  markup_anchor,
                  f"{markup_anchor}\n\n{markup_contract}",
                  1,
              )
              changed = True

          css_assertion = '  [/\\.public-support-flow > \\.public-support-flow-item > span\\s*\\{[\\s\\S]*?color:\\s*var\\(--public-home-accent-3\\);/, "Los pasos 1, 2 y 3 deben usar azul intenso en modo light"],\n'
          css_anchor = '  [/\\.public-home \\.public-support-form\\s*\\{/, "Falta el formulario público light"],\n'
          if css_assertion not in contract_source:
              if contract_source.count(css_anchor) != 1:
                  raise SystemExit("light CSS assertion anchor is missing or ambiguous")
              contract_source = contract_source.replace(
                  css_anchor,
                  css_anchor + css_assertion,
                  1,
              )
              changed = True

          selector = '  ".public-support-flow > .public-support-flow-item > span",\n'
          selector_anchor = '  ".public-support-field input",\n'
          if selector not in contract_source:
              if contract_source.count(selector_anchor) != 1:
                  raise SystemExit("light selector contract anchor is missing or ambiguous")
              contract_source = contract_source.replace(
                  selector_anchor,
                  selector_anchor + selector,
                  1,
              )
              changed = True

          new_console = 'console.log("✅ public system theme contract (device/system · home + auth · light/dark · WhatsApp/intake/phone-prefix/steps)");'
          old_console = 'console.log("✅ public system theme contract (device/system · home + auth · light/dark · WhatsApp/intake/phone-prefix white-blue)");'
          if old_console in contract_source:
              contract_source = contract_source.replace(old_console, new_console, 1)
              changed = True
          elif new_console not in contract_source:
              raise SystemExit("public theme contract summary token is missing")

          contract_path.write_text(contract_source, encoding="utf-8")

          print("source changes applied" if changed else "source already converged")
          PY

      - name: Validate exact contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/features/public-support/index.js
          node --check .github/scripts/public_system_theme_contract.mjs
          node .github/scripts/public_system_theme_contract.mjs
          git diff --check

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Branch already contains the requested source changes."
            exit 0
          fi

          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add \
            src/features/public-support/index.js \
            src/css/compositions/public-system-theme-support.css \
            .github/scripts/public_system_theme_contract.mjs
          git commit -m "fix(public): pasos simples y azul intenso en light"
          git push origin "HEAD:${GITHUB_REF_NAME}"
