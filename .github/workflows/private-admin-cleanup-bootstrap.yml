name: Private Admin Cleanup Bootstrap

on:
  push:
    branches:
      - cleanup/private-admin-dead-refresh

permissions:
  contents: write

concurrency:
  group: private-admin-cleanup-bootstrap
  cancel-in-progress: false

jobs:
  patch:
    name: Apply audited dead-refresh cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply fail-closed cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str = "") -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 cleanup block, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          facturas_template = Path("src/views/facturas/facturas.template.js")
          text = facturas_template.read_text(encoding="utf-8")
          pattern = re.compile(r'^\s*<button type="button" id="facturas-refresh-btn"[^\n]*</button>\n', re.MULTILINE)
          text, count = pattern.subn("", text, count=1)
          if count != 1:
              raise SystemExit(f"facturas.template.js: expected exactly 1 hidden refresh button, found {count}")
          facturas_template.write_text(text, encoding="utf-8")

          replace_once(
              "src/css/views/facturas/index.css",
              '#facturas-refresh-btn,\n.facturas-hero-actions > [data-facturas-action="refresh"] {\n  display: none;\n}\n\n',
          )
          replace_once(
              "src/css/views/clientes/index.css",
              '#clientes-refresh-btn,\n.clientes-hero-actions > [data-clientes-action="refresh"] {\n  display: none !important;\n}\n\n',
          )
          replace_once(
              "src/css/views/usuarios/index.css",
              '#usuarios-refresh-btn,\n.usuarios-hero-actions > [data-usuarios-action="refresh"] {\n  display: none !important;\n}\n\n',
          )
          PY

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate audited contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/repo_integrity.py
          python3 .github/scripts/incidencias_scale_contract.py
          python3 .github/scripts/clientes_scale_contract.py
          python3 .github/scripts/facturas_continuous_scroll_contract.py
          python3 .github/scripts/usuarios_scale_contract.py
          python3 .github/scripts/private_admin_alignment_contract.py
          node .github/scripts/continuous_scroll_smoke.mjs
          bash .github/ci/validate_spa_contracts.sh
          git diff --check

      - name: Commit cleanup to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add \
            src/views/facturas/facturas.template.js \
            src/css/views/facturas/index.css \
            src/css/views/clientes/index.css \
            src/css/views/usuarios/index.css
          if git diff --cached --quiet; then
            echo "Expected cleanup produced no diff"
            exit 1
          fi
          git commit -m "chore: remove dead manual refresh remnants"
          git push origin "HEAD:${GITHUB_REF_NAME}"
