# =========================================================
# ONION SUPPORT — AZURE STATIC WEB APPS CI/CD
# Production contract:
#   Frontend canonical: https://www.onionsupport.com
#   Same-origin API:    https://www.onionsupport.com/api/*
#   Direct backend:     https://api.onionsupport.com
#   Azure SWA:          onion-panel
#   Linked App Service: oniontech
#
# Design goals:
#   - Validate the exact commit that is deployed.
#   - Deploy static files directly (no Oryx/application build).
#   - Never retry an upload blindly.
#   - Poll the deployed environment until exact release bytes are visible.
#   - Make production verification blocking.
#   - Keep PR preview lifecycle deterministic.
#   - Pin third-party actions by immutable commit SHA.
# =========================================================

name: Azure Static Web Apps CI/CD

run-name: SWA · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name || 'manual' }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  APP_LOCATION: "/"
  API_LOCATION: ""
  OUTPUT_LOCATION: ""
  PUBLIC_SITE_URL: "https://www.onionsupport.com"
  DIRECT_API_URL: "https://api.onionsupport.com"

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    if: >-
      (
        github.event_name == 'push' &&
        github.ref_name == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == 'main'
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.base_ref == 'main'
      )

    outputs:
      validated_sha: ${{ steps.revision.outputs.sha }}

    defaults:
      run:
        working-directory: candidate

    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Checkout trusted validation tooling
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-validation-source
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Lock validated revision
        id: revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          checked_sha="$(git rev-parse HEAD)"

          if [[ "${checked_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error title=Checkout no determinista::Esperado ${EXPECTED_SHA}, obtenido ${checked_sha}."
            exit 1
          fi

          echo "sha=${checked_sha}" >> "${GITHUB_OUTPUT}"
          echo "Validated SHA: ${checked_sha}"

      - name: Stage trusted validation tooling
        env:
          EXTERNAL_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail

          destination="${RUNNER_TEMP}/onion-validation"
          rm -rf "${destination}"
          mkdir -p "${destination}"

          if [[ "${EXTERNAL_PR}" == "true" ]]; then
            source_root="../trusted-validation-source"
            echo "External PR: validators locked to immutable base SHA."
          else
            source_root="."
            echo "Trusted repository revision: validators taken from candidate SHA."
          fi

          install -m 0755 "${source_root}/.github/ci/validate_static_release.sh"             "${destination}/validate_static_release.sh"
          install -m 0755 "${source_root}/.github/ci/validate_production_contract.sh"             "${destination}/validate_production_contract.sh"
          install -m 0755 "${source_root}/.github/ci/validate_spa_contracts.sh"             "${destination}/validate_spa_contracts.sh"
          install -m 0644 "${source_root}/.github/scripts/repo_integrity.py"             "${destination}/repo_integrity.py"
          install -m 0755 "${source_root}/.github/ci/validate_candidate_paths.py" "${destination}/validate_candidate_paths.py"

      - name: Validate candidate path boundary
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: python3 "${RUNNER_TEMP}/onion-validation/validate_candidate_paths.py"

      - name: Validate static release contract
        run: bash "${RUNNER_TEMP}/onion-validation/validate_static_release.sh"

      - name: Validate repository integrity
        env:
          ONION_REPO_ROOT: ${{ github.workspace }}/candidate
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/onion-validation/repo_integrity.py"

      - name: Validate production SEO and routing contract
        run: bash "${RUNNER_TEMP}/onion-validation/validate_production_contract.sh"

      - name: Reject legacy API domain
        run: |
          set -euo pipefail

          legacy_domain="onionit"".""net"

          if git grep -n -I -F "${legacy_domain}" -- .; then
            echo "::error title=Dominio API legado detectado::El release aún contiene referencias a ${legacy_domain}."
            exit 1
          fi

          echo "Sin referencias al dominio API legado."

      - name: Validate critical SPA contracts
        run: bash "${RUNNER_TEMP}/onion-validation/validate_spa_contracts.sh"
  deploy_production:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate

    # Production deploys only from the canonical main ref.
    if: >-
      (
        github.event_name == 'push' &&
        github.ref_name == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == 'main'
      )

    permissions:
      contents: read

    env:
      VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.VALIDATED_SHA }}
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Assert immutable release input
        run: |
          set -euo pipefail

          checked_sha="$(git rev-parse HEAD)"

          if [[ "${checked_sha}" != "${VALIDATED_SHA}" ]]; then
            echo "::error title=SHA de deploy incorrecto::Validado ${VALIDATED_SHA}, checkout ${checked_sha}."
            exit 1
          fi

          echo "Deploying immutable SHA: ${VALIDATED_SHA}"

      - name: Validate deployment token
        env:
          SWA_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}
        run: |
          set -euo pipefail

          if [[ -z "${SWA_API_TOKEN:-}" ]]; then
            echo "::error title=Secret no configurado::Falta AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E."
            exit 1
          fi

      - name: Stage production verifiers
        run: |
          install -m 0755 .github/ci/verify_release_bytes.sh "${RUNNER_TEMP}/verify_release_bytes.sh"
          install -m 0755 .github/ci/verify_production.sh "${RUNNER_TEMP}/verify_production.sh"

      - name: Deploy static SPA
        id: deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_BAY_086469A1E }}
          action: upload
          app_location: ${{ env.APP_LOCATION }}
          api_location: ${{ env.API_LOCATION }}
          output_location: ${{ env.OUTPUT_LOCATION }}
          skip_app_build: true

      - name: Verify deployed release bytes
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          VERIFY_CANONICAL: "true"
        run: bash "${RUNNER_TEMP}/verify_release_bytes.sh"

      - name: Verify production security, routing and backend
        run: bash "${RUNNER_TEMP}/verify_production.sh"
