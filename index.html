<!DOCTYPE html>
<html
  lang="es"
  data-app="onion"
  data-app-name="Onion Support"
  data-theme="dark"
  data-theme-mode="system"
  data-theme-source="initial"
  data-app-state="booting"
  data-route-mode="boot"
  data-shell-state="booting"
  class="app-booting"
>
<head>
  <!-- =========================================================
       ONION SUPPORT — SPA SHELL
       Archivo: /index.html

       Contrato:
       - Shell físico privado de la SPA.
       - Sin JS inline.
       - Sin CSS inline.
       - Sin Google Fonts ni assets externos.
       - Tema inicial resuelto por /src/preboot/theme.js antes del CSS.
       - CSS centralizado en /src/css/app.css.
       - JS centralizado en /src/main.js.
       - Router renderiza exclusivamente en #view-container.
       - Sidebar monta en #sidebar-mount.
       - Topbar monta en #topbar-mount.
       - Loader inicial estático, controlado después por la app.
       - Preparado para CSP estricta mediante staticwebapp.config.json.
  ========================================================= -->

  <!-- =========================
       META BASE
  ========================= -->
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Onion Support</title>

  <meta
    name="application-name"
    content="Onion Support"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Onion Support"
  >

  <meta
    name="description"
    content="Onion Support · Panel privado SaaS de soporte, incidencias, facturación y gestión interna."
  >

  <!-- =========================
       PRIVACY / INDEXING
  ========================= -->
  <meta
    name="robots"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="googlebot"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="bingbot"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <meta
    name="format-detection"
    content="telephone=no, date=no, address=no, email=no"
  >

  <!-- =========================
       THEME / BROWSER CHROME
  ========================= -->
  <meta
    name="color-scheme"
    content="dark light"
  >

  <meta
    name="theme-color"
    content="#0a0c11"
    data-onion-theme-color="true"
  >

  <meta
    name="msapplication-TileColor"
    content="#0a0c11"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <!-- =========================
       BASE SPA
  ========================= -->
  <base href="/">

  <!-- =========================
       ICONS / MANIFEST
  ========================= -->
  <link
    rel="icon"
    href="/src/media/img/favicon_black_circle.png?v=5"
    type="image/png"
  >

  <link
    rel="shortcut icon"
    href="/src/media/img/favicon_black_circle.png?v=5"
    type="image/png"
  >

  <link
    rel="apple-touch-icon"
    href="/src/media/img/favicon_black_circle.png?v=5"
  >

  <link
    rel="manifest"
    href="/site.webmanifest?v=5"
  >

  <!-- =========================
       PERFORMANCE · LOCAL ASSETS ONLY
  ========================= -->
  <link
    rel="preload"
    href="/src/media/img/favicon_white.png?v=5"
    as="image"
    type="image/png"
    fetchpriority="high"
  >

  <link
    rel="preload"
    href="/src/media/img/favicon_black.png?v=5"
    as="image"
    type="image/png"
    fetchpriority="low"
  >

  <link
    rel="modulepreload"
    href="/src/main.js"
  >

  <!-- =========================
       THEME PREBOOT
       Debe ejecutarse antes de aplicar /src/css/app.css.
  ========================= -->
  <script src="/src/preboot/theme.js"></script>

  <!-- =========================
       CSS ENTRYPOINT
  ========================= -->
  <link
    rel="stylesheet"
    href="/src/css/app.css"
  >

  <!-- =========================
       NOSCRIPT CSS
  ========================= -->
  <noscript>
    <link
      rel="stylesheet"
      href="/src/css/core/noscript.css"
    >
  </noscript>
</head>

<body
  class="app-booting app-loading"
  data-app="onion"
  data-app-name="Onion Support"
  data-density="default"
  data-app-loading="true"
  data-authenticated="false"
  data-route-mode="boot"
  data-shell-state="booting"
>
  <!-- =========================================================
       ACCESSIBILITY
  ========================================================= -->
  <a
    class="sr-only sr-only-focusable app-skip-link"
    href="#main-content"
    data-skip-link="true"
  >
    Saltar al contenido principal
  </a>

  <!-- =========================================================
       STATIC BOOT LOADER
  ========================================================= -->
  <div
    id="app-loader"
    class="app-loader is-visible"
    data-app-loader="true"
    data-loader-visible="true"
    data-loader-state="booting"
    role="status"
    aria-live="polite"
    aria-busy="true"
    aria-hidden="false"
    aria-labelledby="app-loader-title"
    aria-describedby="app-loader-text app-loader-subtext"
  >
    <div
      class="app-loader__backdrop"
      data-loader-backdrop="true"
      aria-hidden="true"
    ></div>

    <div
      class="app-loader__card"
      data-loader-card="true"
    >
      <div
        class="app-loader__brand"
        data-loader-brand="true"
        aria-hidden="true"
      >
        <img
          class="app-loader__logo app-loader__logo--dark"
          src="/src/media/img/favicon_white.png?v=5"
          alt=""
          width="64"
          height="64"
          loading="eager"
          decoding="async"
          fetchpriority="high"
          draggable="false"
        >

        <img
          class="app-loader__logo app-loader__logo--light"
          src="/src/media/img/favicon_black.png?v=5"
          alt=""
          width="64"
          height="64"
          loading="eager"
          decoding="async"
          fetchpriority="low"
          draggable="false"
        >

        <div
          class="app-loader__logo-fallback"
          data-loader-logo-fallback="true"
          aria-hidden="true"
        >
          O
        </div>
      </div>

      <div class="app-loader__copy">
        <strong
          id="app-loader-title"
          class="app-loader__title"
        >
          Onion Support
        </strong>

        <span
          id="app-loader-text"
          class="app-loader__text"
        >
          Cargando sesión...
        </span>

        <small
          id="app-loader-subtext"
          class="app-loader__subtext"
        >
          Preparando panel seguro
        </small>
      </div>

      <div
        class="app-loader__bar"
        aria-hidden="true"
      >
        <span class="app-loader__bar-fill"></span>
      </div>
    </div>
  </div>

  <!-- =========================================================
       NOSCRIPT FALLBACK
  ========================================================= -->
  <noscript>
    <div class="layout noscript-layout">
      <main
        class="main-content noscript-main"
        role="main"
        aria-label="Contenido principal"
      >
        <div id="noscript-content">
          <section class="noscript-box">
            <h1>JavaScript es necesario</h1>

            <p>
              Onion Support necesita JavaScript para cargar la navegación SPA,
              el panel, las vistas y la autenticación.
            </p>
          </section>
        </div>
      </main>
    </div>
  </noscript>

  <!-- =========================================================
       APP SHELL
  ========================================================= -->
  <div
    id="app-shell"
    class="layout app-shell"
    data-app-shell="true"
    data-shell="booting"
    data-shell-interactive="false"
    data-route-mode="boot"
    aria-busy="true"
    aria-hidden="true"
  >
    <!-- =========================
         SIDEBAR MOUNT
    ========================= -->
    <div
      id="sidebar-mount"
      data-sidebar-mount="true"
      aria-hidden="true"
    ></div>

    <!-- =========================
         TOPBAR MOUNT
    ========================= -->
    <div
      id="topbar-mount"
      data-topbar-mount="true"
      aria-hidden="true"
    ></div>

    <!-- =========================
         MAIN CONTENT
    ========================= -->
    <main
      id="main-content"
      class="main-content"
      role="main"
      aria-label="Contenido principal"
      tabindex="-1"
      aria-busy="true"
      data-main-content="true"
      data-route-mode="boot"
    >
      <!-- =========================
           TABLEHEAD SLOT
      ========================= -->
      <div
        id="table-head"
        class="table-head"
        data-tablehead="true"
        hidden
        aria-hidden="true"
      >
        <div
          id="tablehead-container"
          data-tablehead-container="true"
        ></div>
      </div>

      <!-- =========================
           ROUTER VIEW
      ========================= -->
      <div
        id="app-content"
        data-app-content="true"
      >
        <div
          id="view-container"
          data-view-root="true"
          data-router-view="true"
          aria-busy="true"
        ></div>
      </div>
    </main>
  </div>

  <!-- =========================
       APP ENTRYPOINT
  ========================= -->
  <script
    type="module"
    src="/src/main.js"
  ></script>
</body>
</html>
