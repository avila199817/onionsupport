name: One-shot Router single-resolution patch

on:
  push:
    branches:
      - perf/router-single-resolution

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          router_path = Path("src/router/index.js")
          router = router_path.read_text(encoding="utf-8")

          old_version = 'export const ROUTER_VERSION =\n  "router.minimal.v12-phase-attribution";'
          new_version = 'export const ROUTER_VERSION =\n  "router.minimal.v13-single-route-resolution";'
          if router.count(old_version) != 1:
              raise SystemExit("Router version anchor is not unique")
          router = router.replace(old_version, new_version, 1)

          execute_start = router.find("async function executeRender(\n")
          execute_end = router.find("\nfunction render(\n", execute_start)
          if execute_start < 0 or execute_end <= execute_start:
              raise SystemExit("Could not isolate executeRender")
          execute = router[execute_start:execute_end]

          if execute.count("  let match =\n") != 1:
              raise SystemExit("executeRender initial match declaration is not unique")
          execute = execute.replace("  let match =\n", "  const match =\n", 1)

          refresh_anchor = "    /*\n      Auth pudo cambiar durante la espera.\n"
          route_guard_anchor = "    if (\n      !match.route\n    ) {\n"
          refresh_start = execute.find(refresh_anchor)
          refresh_end = execute.find(route_guard_anchor, refresh_start)
          if refresh_start < 0 or refresh_end <= refresh_start:
              raise SystemExit("Redundant post-auth resolution anchors not found")
          if execute.find(refresh_anchor, refresh_start + 1) != -1:
              raise SystemExit("Redundant post-auth resolution anchor is not unique")
          execute = execute[:refresh_start] + execute[refresh_end:]
          router = router[:execute_start] + execute + router[execute_end:]

          policy_anchor = "        opaqueNavigationPerformanceIds:\n          true,\n"
          policy_replacement = policy_anchor + "\n        singleRouteResolutionPerTransition:\n          true,\n"
          if router.count(policy_anchor) != 1:
              raise SystemExit("Router policy anchor is not unique")
          router = router.replace(policy_anchor, policy_replacement, 1)
          router_path.write_text(router, encoding="utf-8")

          contract_path = Path(".github/scripts/router_runtime_contract.mjs")
          contract = contract_path.read_text(encoding="utf-8")
          old_contract_version = '  "router.minimal.v12-phase-attribution"'
          if contract.count(old_contract_version) != 1:
              raise SystemExit("Router contract version anchor is not unique")
          contract = contract.replace(
              old_contract_version,
              '  "router.minimal.v13-single-route-resolution"',
              1,
          )

          policy_assert = "assert.equal(snapshot.policy.opaqueNavigationPerformanceIds, true);\n"
          if contract.count(policy_assert) != 1:
              raise SystemExit("Router contract policy anchor is not unique")
          contract = contract.replace(
              policy_assert,
              policy_assert + "assert.equal(snapshot.policy.singleRouteResolutionPerTransition, true);\n",
              1,
          )

          phase_anchor = 'const phaseCallStart = source.indexOf("module.recordRoutePhase({");\n'
          if contract.count(phase_anchor) != 1:
              raise SystemExit("Router contract phase anchor is not unique")
          single_resolution_contract = '''const executeRenderStart = source.indexOf("async function executeRender(");
          const executeRenderEnd = source.indexOf("\\nfunction render(", executeRenderStart);
          assert.ok(
            executeRenderStart >= 0 && executeRenderEnd > executeRenderStart,
            "Router contract must isolate executeRender()"
          );
          const executeRenderSource = source.slice(executeRenderStart, executeRenderEnd);
          assert.equal(
            (executeRenderSource.match(/\\bgetRouteMatch\\s*\\(/g) || []).length,
            1,
            "each Router transition must resolve the route exactly once"
          );
          assert.equal(
            (executeRenderSource.match(/\\bsetRoutePending\\s*\\(/g) || []).length,
            1,
            "each Router transition must publish pending route state exactly once"
          );
          assert.equal(
            executeRenderSource.includes("refreshResolveStartedAt"),
            false,
            "Router must not retain the redundant post-auth route resolution"
          );

          '''.replace("          ", "")
          contract = contract.replace(
              phase_anchor,
              single_resolution_contract + phase_anchor,
              1,
          )
          contract_path.write_text(contract, encoding="utf-8")
          PY

          node --check src/router/index.js
          node --check .github/scripts/router_runtime_contract.mjs
          bash .github/ci/validate_spa_contracts.sh
          git diff --check

      - name: Commit patched Router
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-router-single-resolution.yml
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git diff --cached --check
          git commit -m "Perf: resolve each Router transition once"
          git push origin HEAD:perf/router-single-resolution
