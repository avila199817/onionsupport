name: Servidor navigation latency bootstrap

on:
  push:
    branches:
      - fix/servidor-route-lag

permissions:
  contents: write

jobs:
  prepare-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use exact Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Patch Servidor navigation lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Controller owns/cancels its current network work.
          replace_once(
              "src/views/server/index.js",
              "    loadSequence: 0,\n    loadTask: null,\n\n    clickHandler: null,",
              "    loadSequence: 0,\n    loadTask: null,\n    loadAbortController: null,\n\n    clickHandler: null,",
          )

          replace_once(
              "src/views/server/index.js",
              "    return state.snapshot;\n  }\n\n  async function load({",
              '''    return state.snapshot;\n  }\n\n  function abortLoad(\n    reason = "server-load-aborted"\n  ) {\n    const requestController =\n      state.loadAbortController;\n\n    state.loadAbortController =\n      null;\n\n    if (!requestController) {\n      return false;\n    }\n\n    try {\n      if (\n        requestController.signal\n          ?.aborted !== true\n      ) {\n        requestController.abort(\n          reason\n        );\n      }\n    } catch {\n      try {\n        requestController.abort();\n      } catch {\n        // noop\n      }\n    }\n\n    return true;\n  }\n\n  function createLoadSignal() {\n    abortLoad(\n      "server-load-replaced"\n    );\n\n    if (\n      typeof AbortController ===\n      "undefined"\n    ) {\n      return null;\n    }\n\n    const requestController =\n      new AbortController();\n\n    state.loadAbortController =\n      requestController;\n\n    return requestController.signal;\n  }\n\n  async function load({''',
          )

          replace_once(
              "src/views/server/index.js",
              "    const hadSnapshot =\n      Boolean(\n        state.snapshot\n          ?.checkedAt\n      );\n\n    state.error = \"\";",
              "    const hadSnapshot =\n      Boolean(\n        state.snapshot\n          ?.checkedAt\n      );\n\n    const requestSignal =\n      createLoadSignal();\n\n    state.error = \"\";",
          )

          replace_once(
              "src/views/server/index.js",
              '''              force\n            ? await refreshServerSnapshotApi({\n                source:\n                  `${SERVIDOR_INDEX_SOURCE}.refresh`,\n              })\n            : await loadServerSnapshotApi({\n                source:\n                  `${SERVIDOR_INDEX_SOURCE}.load`,\n              });''',
              '''              force\n            ? await refreshServerSnapshotApi({\n                source:\n                  `${SERVIDOR_INDEX_SOURCE}.refresh`,\n                signal:\n                  requestSignal,\n              })\n            : await loadServerSnapshotApi({\n                source:\n                  `${SERVIDOR_INDEX_SOURCE}.load`,\n                signal:\n                  requestSignal,\n              });''',
          )

          replace_once(
              "src/views/server/index.js",
              '''        if (\n          state.loadTask ===\n          task\n        ) {\n          state.loadTask =\n            null;\n        }''',
              '''        if (\n          state.loadAbortController\n            ?.signal ===\n          requestSignal\n        ) {\n          state.loadAbortController =\n            null;\n        }\n\n        if (\n          state.loadTask ===\n          task\n        ) {\n          state.loadTask =\n            null;\n        }''',
          )

          # 2) Critical fix: paint immediately and do NOT hold Router commit behind network.
          replace_once(
              "src/views/server/index.js",
              '''    await load({\n      force: false,\n      silent:\n        Boolean(\n          cached\n        ),\n    });\n\n    return getSnapshot();''',
              '''    /*\n      La navegación NO espera health/costes.\n      El host ya contiene loading/cache y el Router puede comprometerlo\n      inmediatamente. La I/O continúa bajo ownership del controller.\n    */\n    void load({\n      force: false,\n      silent:\n        Boolean(\n          cached\n        ),\n    });\n\n    return controller;''',
          )

          replace_once(
              "src/views/server/index.js",
              '''    state.loadSequence += 1;\n\n    stopLive({''',
              '''    state.loadSequence += 1;\n\n    abortLoad(\n      "server-view-destroyed"\n    );\n\n    stopLive({''',
          )

          # 3) API boundary must propagate cancellation to Core Http.
          for old, new in [
              (
                  '''          source:\n            cleanText(\n              options.source,\n              "views.server.api"\n            ),\n        }\n      );''',
                  '''          source:\n            cleanText(\n              options.source,\n              "views.server.api"\n            ),\n\n          signal:\n            options.signal ||\n            null,\n        }\n      );''',
              ),
          ]:
              p = Path("src/views/server/server.api.base.js")
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f"server.api.base.js: expected 2 HTTP option anchors, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # Cost request follows the same abort signal.
          p = Path("src/views/server/server.api.js")
          text = p.read_text(encoding="utf-8")
          old = '''      source: safeText(options.source, "views.server.api.costs"),\n    });'''
          new = '''      source: safeText(options.source, "views.server.api.costs"),\n      signal: options.signal || null,\n    });'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"server.api.js: expected 2 cost HTTP option anchors, found {count}")
          p.write_text(text.replace(old, new), encoding="utf-8")

          # 4) Regression contract: navigation must never regress into network-gated mount.
          contract = r'''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          const [index, apiBase, api] = await Promise.all([
            readFile("src/views/server/index.js", "utf8"),
            readFile("src/views/server/server.api.base.js", "utf8"),
            readFile("src/views/server/server.api.js", "utf8"),
          ]);

          const mountStart = index.indexOf("  async function mount(");
          const destroyStart = index.indexOf("  async function destroy(");
          assert.ok(mountStart >= 0 && destroyStart > mountStart, "Servidor mount/destroy boundaries must exist");
          const mount = index.slice(mountStart, destroyStart);

          assert.match(mount, /void load\(\{/);
          assert.match(mount, /return controller;/);
          assert.doesNotMatch(mount, /await load\(\{/);

          assert.match(index, /loadAbortController:\s*null/);
          assert.match(index, /function abortLoad\(/);
          assert.match(index, /server-view-destroyed/);
          assert.match(index, /signal:\s*requestSignal/);

          const baseSignalCount = (apiBase.match(/signal:\s*\n\s*options\.signal\s*\|\|\s*\n\s*null/g) || []).length;
          assert.equal(baseSignalCount, 2, "Health GET/request must both forward the abort signal");

          const costSignalCount = (api.match(/signal:\s*options\.signal\s*\|\|\s*null/g) || []).length;
          assert.equal(costSignalCount, 2, "Cost GET/request must both forward the abort signal");

          assert.match(api, /const healthPromise = Base\.loadServerSnapshot\(opts\);/);
          assert.match(api, /const costsPromise = resolveCostsForDashboard\(opts\);/);

          console.log("Servidor navigation performance contract: PASS · immediate route commit · abortable health/cost I/O");
          '''

          Path(".github/scripts/servidor_navigation_performance_contract.mjs").write_text(contract, encoding="utf-8")

          replace_once(
              "package.json",
              'node .github/scripts/whatsapp_route_contract.mjs && python3 .github/scripts/repo_integrity.py',
              'node .github/scripts/whatsapp_route_contract.mjs && node .github/scripts/servidor_navigation_performance_contract.mjs && python3 .github/scripts/repo_integrity.py',
          )
          PY

      - name: Validate focused fix
        shell: bash
        run: |
          set -euo pipefail
          node --check src/views/server/index.js
          node --check src/views/server/server.api.base.js
          node --check src/views/server/server.api.js
          node --check .github/scripts/servidor_navigation_performance_contract.mjs
          node .github/scripts/servidor_navigation_performance_contract.mjs
          python3 .github/scripts/repo_integrity.py

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Create final local commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/servidor-lag-bootstrap.yml
          git config user.name "Onion Support Automation"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "perf(servidor): commit route before observability I/O"

      - name: Validate final committed candidate
        shell: bash
        env:
          PUBLIC_SITE_URL: https://onionsupport.com
          DIRECT_API_URL: https://api.onionsupport.com
        run: |
          set -euo pipefail
          test ! -e .github/workflows/servidor-lag-bootstrap.yml
          git status --short
          npm run validate

      - name: Push validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/servidor-route-lag
