name: TEMP Correo extreme audit

on:
  push:
    branches:
      - polish/correo-extreme-v7

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: polish/correo-extreme-v7
          fetch-depth: 1
          persist-credentials: false

      - name: Static Correo audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          index = (root / 'src/views/correo/index.js').read_text(encoding='utf-8')
          template = (root / 'src/views/correo/correo.template.js').read_text(encoding='utf-8')
          api = (root / 'src/views/correo/correo.api.js').read_text(encoding='utf-8')
          css_base = (root / 'src/css/views/correo/index.css').read_text(encoding='utf-8')
          css_viewport = (root / 'src/css/views/correo/viewport.css').read_text(encoding='utf-8')
          styles = (root / 'src/router/styles.js').read_text(encoding='utf-8')
          runtime = index + '\n' + template
          css = css_base + '\n' + css_viewport

          # Only class-selector-like occurrences, not CSS variable names.
          class_re = re.compile(r'\.([a-zA-Z_][a-zA-Z0-9_-]*)')
          runtime_class_re = re.compile(r'correo-[a-z0-9_-]+', re.I)
          runtime_classes = set(runtime_class_re.findall(runtime))
          base_classes = {c for c in class_re.findall(css_base) if c.startswith('correo-')}
          viewport_classes = {c for c in class_re.findall(css_viewport) if c.startswith('correo-')}
          all_css_classes = base_classes | viewport_classes

          print('=== FILE SIZES ===')
          for p in [
              'src/views/correo/index.js',
              'src/views/correo/correo.template.js',
              'src/views/correo/correo.api.js',
              'src/css/views/correo/index.css',
              'src/css/views/correo/viewport.css',
          ]:
              text = (root / p).read_text(encoding='utf-8')
              print(f'{p}: {len(text.splitlines())} lines / {len(text)} chars')

          print('\n=== CSS AUTHORITY ===')
          print('runtime class-like ids:', len(runtime_classes))
          print('base selector classes:', len(base_classes))
          print('viewport selector classes:', len(viewport_classes))
          print('selector classes in BOTH:', len(base_classes & viewport_classes))
          print('\n'.join(sorted(base_classes & viewport_classes)))

          viewport_missing = sorted(
              c for c in runtime_classes
              if c not in viewport_classes and c in base_classes
          )
          print('\n=== LIVE CLASSES NEEDING BASE CSS ===')
          print('count:', len(viewport_missing))
          print('\n'.join(viewport_missing))

          dead_base = sorted(c for c in base_classes if c not in runtime_classes)
          dead_viewport = sorted(c for c in viewport_classes if c not in runtime_classes)
          print('\n=== BASE SELECTORS WITH NO RUNTIME CLASS REFERENCE ===')
          print('count:', len(dead_base))
          print('\n'.join(dead_base))
          print('\n=== VIEWPORT SELECTORS WITH NO RUNTIME CLASS REFERENCE ===')
          print('count:', len(dead_viewport))
          print('\n'.join(dead_viewport))

          print('\n=== ACTION CONTRACT ===')
          template_actions = set(re.findall(r'data-correo-action=\\?"([a-z0-9-]+)', template))
          handled_actions = set(re.findall(r'action === "([a-z0-9-]+)"', index))
          print('template without handler:', sorted(template_actions - handled_actions))
          print('handler without static template action:', sorted(handled_actions - template_actions))

          print('\n=== RISK MARKERS ===')
          markers = {
              'window.confirm': index.count('window.confirm('),
              'hardcoded mailbox': (index + template).count('cristian@onionsupport.com'),
              'fake add-account action': (index + template).count('add-account'),
              'updateDraft API definitions': api.count('updateDraft('),
              'updateDraft controller use': index.count('CorreoApi.updateDraft('),
              'cachedAt occurrences': (index + template).count('cachedAt'),
              'route CSS manifest entries': styles.count('/src/css/views/correo/'),
              'compose aria-modal': template.count('aria-modal="true"'),
              'focus trap markers': index.count('focusableElements') + index.count('trapModalFocus'),
              'IME markers': index.count('compositionstart') + index.count('compositionend') + index.count('isComposing'),
              'list abort markers': index.count('listAbortController') + index.count('abortListRequest'),
              'dead count query': index.count('[data-correo-count]'),
              'dead folder title query': index.count('[data-correo-folder-title]'),
              'infinite sentinel markup': template.count('data-correo-infinite-sentinel'),
          }
          for key, value in markers.items():
              print(f'{key}: {value}')
          PY

      - name: Existing repository gates
        shell: bash
        run: |
          set -euo pipefail
          node --check src/views/correo/index.js
          node --check src/views/correo/correo.template.js
          node --check src/views/correo/correo.api.js
          python3 .github/scripts/repo_integrity.py
          bash .github/ci/validate_spa_contracts.sh
          git diff --check
