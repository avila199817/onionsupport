<!DOCTYPE html>
<html lang="es">
<head>
  <!-- =========================================================
       ONION SUPPORT — INDEX / SPA SHELL
       FINAL PRO SYSTEM v4

       FIX CRÍTICO:
       - loader ya NO viene hardcodeado
       - no fuerza dark al cargar
       - theme se resuelve antes del runtime
       - loader será montado desde JS
       - evita flash dark inicial
  ========================================================= -->

  <!-- =========================
       META BASE
  ========================= -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Onion Support</title>

  <meta
    name="description"
    content="Onion Support · Panel SaaS de soporte, incidencias, facturación y gestión interna."
  >

  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1f1f1f">

  <!-- =========================
       BASE SPA
  ========================= -->
  <base href="/">

  <!-- =========================
       ICONS
  ========================= -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico">

  <!-- =========================
       PERFORMANCE
  ========================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <!-- =========================
       FONTS
  ========================= -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  >

  <!-- =========================
       PREBOOT THEME FIX
       ejecuta ANTES del CSS paint final
  ========================= -->
  <script>
    (() => {
      try {
        const keys = [
          "onion_theme",
          "onion:theme",
          "theme"
        ];

        let theme = null;

        for (const key of keys) {
          const value = localStorage.getItem(key);

          if (
            value === "dark" ||
            value === "light"
          ) {
            theme = value;
            break;
          }
        }

        if (!theme) {
          theme =
            window.matchMedia &&
            window.matchMedia(
              "(prefers-color-scheme: light)"
            ).matches
              ? "light"
              : "dark";
        }

        document.documentElement.setAttribute(
          "data-theme",
          theme
        );
      } catch (error) {
        document.documentElement.setAttribute(
          "data-theme",
          "dark"
        );
      }
    })();
  </script>

  <!-- =========================
       CSS ORDER
  ========================= -->

  <!-- TOKENS -->
  <link rel="stylesheet" href="/src/css/tokens/variables.css">
  <link rel="stylesheet" href="/src/css/tokens/light.css">

  <!-- CORE -->
  <link rel="stylesheet" href="/src/css/core/reset.css">
  <link rel="stylesheet" href="/src/css/core/layout.css">
  <link rel="stylesheet" href="/src/css/core/core.css">
  <link rel="stylesheet" href="/src/css/core/loader.css">

  <!-- LAYOUT -->
  <link rel="stylesheet" href="/src/css/layout/sidebar.css">
  <link rel="stylesheet" href="/src/css/layout/topbar.css">

  <!-- COMPONENTS -->
  <link rel="stylesheet" href="/src/css/components/ui.css">

  <!-- VIEWS -->
  <link rel="stylesheet" href="/src/css/auth/login.css">

  <!-- =========================
       NOSCRIPT
  ========================= -->
  <noscript>
    <style>
      html,
      body{
        margin:0;
        min-height:100%;
        background:#111111;
        color:#ffffff;
        font-family:Inter,system-ui,sans-serif;
      }

      .layout{

        max-width:760px;
        margin:48px auto;
        padding:24px 28px;
        border-radius:18px;
        border:1px solid rgba(255,255,255,.08);
        background:rgba(255,255,255,.04);
      }

      .noscript-box h1{
        margin:0 0 12px;
        font-size:28px;
      }

      .noscript-box p{
        margin:0;
        line-height:1.6;
        color:rgba(255,255,255,.78);
      }
    </style>
  </noscript>
</head>

<body
  data-app="onion"
  data-density="default"
>

       NOSCRIPT FALLBACK
  ========================================================= -->

    <div class="layout">
      <main
        class="main-content"
        role="main"
        aria-label="Contenido principal"
      >
        <div id="app-content">

            <section class="noscript-box">

            </section>
          </div>
        </div>
      </main>
    </div>
  </noscript>

  <!-- =========================================================
       APP LAYOUT
       Sidebar y Topbar montados por JS
  ========================================================= -->
  <div
    class="layout"
    id="app-shell"
  >
    <!-- sidebar mount -->

    <!-- topbar mount -->

    <main
      class="main-content"
      id="main-content"
      role="main"
      aria-label="Contenido principal"
    >
      <div id="app-content">
        <div
          id="view-container"
          data-view-root
          aria-live="polite"
        ></div>
      </div>
    </main>
  </div>

  <!-- =========================
       APP ENTRY
  ========================= -->
  <script
    type="module"
    src="/src/app.js"
  ></script>
</body>
