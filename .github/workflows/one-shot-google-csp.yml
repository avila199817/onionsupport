name: One-shot Google CSP finalizer

on:
  push:
    branches:
      - chore/google-csp-final
    paths:
      - .github/workflows/one-shot-google-csp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: chore/google-csp-final
          fetch-depth: 1

      - name: Apply strict Google measurement CSP allowlist
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('staticwebapp.config.json')
          text = path.read_text(encoding='utf-8')

          old = "img-src 'self' data: blob: https://api.onionsupport.com https://*.onionsupport.com https://*.blob.core.windows.net https://*.google-analytics.com; media-src 'self' data: blob: https://*.blob.core.windows.net; connect-src 'self' https://api.onionsupport.com https://*.onionsupport.com https://*.blob.core.windows.net https://www.googletagmanager.com https://*.google-analytics.com wss://api.onionsupport.com wss://*.onionsupport.com;"
          new = "img-src 'self' data: blob: https://api.onionsupport.com https://*.onionsupport.com https://*.blob.core.windows.net https://*.google-analytics.com https://www.googletagmanager.com; media-src 'self' data: blob: https://*.blob.core.windows.net; connect-src 'self' https://api.onionsupport.com https://*.onionsupport.com https://*.blob.core.windows.net https://www.googletagmanager.com https://*.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://www.google.com wss://api.onionsupport.com wss://*.onionsupport.com;"

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one CSP anchor, found {count}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate JSON and exact allowlist
        run: |
          python3 -m json.tool staticwebapp.config.json >/dev/null
          grep -F "https://analytics.google.com" staticwebapp.config.json
          grep -F "https://stats.g.doubleclick.net" staticwebapp.config.json
          grep -F "https://www.google.com" staticwebapp.config.json
          grep -F "img-src 'self' data: blob: https://api.onionsupport.com https://*.onionsupport.com https://*.blob.core.windows.net https://*.google-analytics.com https://www.googletagmanager.com" staticwebapp.config.json

      - name: Remove one-shot workflow and commit patch
        run: |
          rm .github/workflows/one-shot-google-csp.yml
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add staticwebapp.config.json .github/workflows/one-shot-google-csp.yml
          git commit -m "fix(analytics): allow required Google measurement endpoints"
          git push origin HEAD:chore/google-csp-final
