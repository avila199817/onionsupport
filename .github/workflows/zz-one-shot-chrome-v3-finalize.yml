name: One-shot App Chrome V3 finalize

on:
  push:
    branches:
      - refactor/app-chrome-v3-single-layout

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/app-chrome-v3-single-layout

      - name: Consolidate final geometry ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chrome_path = Path("src/css/layout/chrome.css")
          chrome = chrome_path.read_text(encoding="utf-8")

          old = "  --chrome-z-topbar: var(--z-topbar, 50);\n"
          new = (
              "  --chrome-z-root: var(--z-sidebar, 40);\n"
              "  --chrome-z-topbar: var(--z-topbar, 50);\n"
          )
          if old not in chrome:
              raise SystemExit("chrome.css: z token marker missing")
          chrome = chrome.replace(old, new, 1)

          old = (
              "  block-size: 100vh;\n"
              "  block-size: 100svh;\n"
              "  block-size: 100dvh;\n\n"
              "  pointer-events: none;\n"
              "  isolation: isolate;\n"
          )
          new = (
              "  block-size: 100vh;\n"
              "  block-size: 100svh;\n"
              "  block-size: 100dvh;\n\n"
              "  z-index: var(--chrome-z-root);\n\n"
              "  pointer-events: none;\n"
              "  isolation: isolate;\n"
          )
          if old not in chrome:
              raise SystemExit("chrome.css: root geometry marker missing")
          chrome = chrome.replace(old, new, 1)

          marker = "/* =========================================================\n   MOBILE-ONLY CHROME NODES\n========================================================= */"
          if marker not in chrome:
              raise SystemExit("chrome.css: mobile nodes marker missing")

          desktop_sidebar = r'''/* =========================================================
   SIDEBAR WIDTH · SAME AUTHORITY AS TOPBAR/MAIN
========================================================= */

.sidebar {
  inline-size: var(--chrome-sidebar-open-width);
  min-inline-size: var(--chrome-sidebar-open-width);
  max-inline-size: var(--chrome-sidebar-open-width);

  transition:
    inline-size var(--chrome-motion-duration) var(--chrome-motion-ease),
    border-color var(--sb-fast) var(--sb-ease-fast),
    background-color var(--sb-fast) var(--sb-ease-fast),
    box-shadow var(--sb-fast) var(--sb-ease-fast);
}

.sidebar:is(
  .is-open,
  [data-open="true"],
  [data-sidebar-state="open"]
) {
  --sb-pad-x: var(--sidebar-inline-padding, 8px);

  inline-size: var(--chrome-sidebar-open-width);
  min-inline-size: var(--chrome-sidebar-open-width);
  max-inline-size: var(--chrome-sidebar-open-width);
}

.sidebar:is(
  .is-collapsed,
  [data-open="false"],
  [data-sidebar-state="collapsed"]
) {
  --sb-pad-x: 0px;

  inline-size: var(--chrome-sidebar-collapsed-width);
  min-inline-size: var(--chrome-sidebar-collapsed-width);
  max-inline-size: var(--chrome-sidebar-collapsed-width);
}

'''
          chrome = chrome.replace(marker, desktop_sidebar + marker, 1)
          chrome_path.write_text(chrome, encoding="utf-8")

          sidebar_path = Path("src/css/layout/sidebar.css")
          sidebar = sidebar_path.read_text(encoding="utf-8")

          old = r'''  --sb-open-w:
    var(--sidebar-width, 260px);

  --sb-collapsed-w:
    var(--sidebar-collapsed, 72px);

  --sb-mobile-collapsed-w:
    var(
      --sidebar-mobile-collapsed-width,
      60px
    );

  --sb-mobile-open-w:
    min(
      clamp(286px, 42vw, 322px),
      calc(100vw - 12px)
    );

  --sb-current-w:
    var(--sb-open-w);

'''
          new = r'''  --sb-collapsed-w:
    var(--sidebar-collapsed, 72px);

'''
          if old not in sidebar:
              raise SystemExit("sidebar.css: obsolete width tokens marker missing")
          sidebar = sidebar.replace(old, new, 1)

          old = r'''  --sb-open-duration: .32s;
  --sb-close-duration: .26s;

  --sb-ease:
    cubic-bezier(.22, .86, .24, 1);

'''
          if old not in sidebar:
              raise SystemExit("sidebar.css: obsolete motion tokens marker missing")
          sidebar = sidebar.replace(old, "", 1)

          old = r'''  inline-size:
    var(--sb-current-w);

  min-inline-size:
    var(--sb-current-w);

  max-inline-size:
    var(--sb-current-w);

'''
          if old not in sidebar:
              raise SystemExit("sidebar.css: root width block missing")
          sidebar = sidebar.replace(old, "", 1)

          old = r'''  transition:
    inline-size
      var(--sb-open-duration)
      var(--sb-ease),
    border-color
      var(--sb-fast)
      var(--sb-ease-fast),
    background-color
      var(--sb-fast)
      var(--sb-ease-fast),
    box-shadow
      var(--sb-fast)
      var(--sb-ease-fast);

'''
          new = r'''  transition:
    border-color
      var(--sb-fast)
      var(--sb-ease-fast),
    background-color
      var(--sb-fast)
      var(--sb-ease-fast),
    box-shadow
      var(--sb-fast)
      var(--sb-ease-fast);

'''
          if old not in sidebar:
              raise SystemExit("sidebar.css: root transition block missing")
          sidebar = sidebar.replace(old, new, 1)

          start = sidebar.find("/* =========================================================\n   STATE")
          end = sidebar.find("/* =========================================================\n   STRUCTURE", start)
          if start < 0 or end < 0:
              raise SystemExit("sidebar.css: state section markers missing")
          sidebar = sidebar[:start] + sidebar[end:]
          sidebar_path.write_text(sidebar, encoding="utf-8")

          layout_path = Path("src/css/core/layout.css")
          layout = layout_path.read_text(encoding="utf-8")
          layout = layout.replace(
              "   - Capas de mounts sin duplicar el CSS visual de Sidebar/Topbar.\n",
              "   - Delegar mounts y chrome al layout canónico de App Chrome.\n",
              1,
          )

          for block in (
              "  --layout-topbar-mount-z:\n    var(--z-topbar, 30);\n\n",
              "  --layout-sidebar-mount-z:\n    var(--z-sidebar, 40);\n\n",
              "  --layout-sidebar-motion-duration-mobile: .26s;\n\n",
          ):
              if block not in layout:
                  raise SystemExit(f"layout.css: expected obsolete token missing: {block!r}")
              layout = layout.replace(block, "", 1)

          layout_path.write_text(layout, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          test -f src/css/layout/chrome.css
          test ! -f src/css/layout/mobile-shell.css
          ! grep -q '@layer layout' src/css/layout/chrome.css
          ! grep -q -- '--sb-current-w' src/css/layout/sidebar.css
          ! grep -q 'SIDEBAR OFFSET BRIDGE' src/css/layout/topbar.css
          python .github/scripts/repo_integrity.py
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add src/css/layout/chrome.css src/css/layout/sidebar.css src/css/core/layout.css
          git commit -m "refactor(chrome): consolidar autoridad geométrica final"
          git push origin HEAD:refactor/app-chrome-v3-single-layout
