name: TEMP Facturas Create

on:
  push:
    branches:
      - polish/facturas-create-extreme-20260817
    paths:
      - .github/workflows/_temp_facturas_create_extreme.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/facturas-create-extreme-20260817
          fetch-depth: 0

      - name: Apply refactor
        run: python3 .github/_temp_facturas_patch.py

      - name: Validate
        shell: bash
        run: |
          node --check src/views/facturas/index.js
          node --check src/views/facturas/facturas.template.create.js
          git diff --check
          ! grep -q '!important' src/css/views/facturas/create.css
          grep -q 'renderFacturaCreateClientSearchSlot' src/views/facturas/index.js
          grep -q 'data-facturas-create-body="true"' src/views/facturas/facturas.template.create.js

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add src/views/facturas/index.js src/views/facturas/facturas.template.create.js src/css/views/facturas/create.css
          git diff --cached --check
          git commit -m "refactor(facturas): afinar modal create y eliminar parpadeo de búsqueda"
          git push origin HEAD:polish/facturas-create-extreme-20260817
