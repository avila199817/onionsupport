name: Repository Sweep Helper

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: repo-sweep-helper-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout sweep branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Consolidate legacy route and CI
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one target, got {text.count(old)}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          def remove_exact(path, needle, expected):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(needle)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences of {needle!r}, got {count}")
              p.write_text(text.replace(needle, ""), encoding="utf-8")

          # /ajustes remains a legacy URL, but Cuenta owns module and CSS.
          routes = "src/router/routes.js"
          replace_once(
              routes,
              'export const ROUTES_VERSION =\n  "routes.minimal.v8.2-correo-preview";',
              'export const ROUTES_VERSION =\n  "routes.minimal.v8.3-cuenta-legacy-alias";',
          )
          replace_once(
              routes,
              '''  ajustes: Object.freeze({\n    moduleKey: "ajustes",\n    loadModule: () =>\n      import(\n        "../views/ajustes/index.js"\n      ),\n    names: Object.freeze([\n      "AjustesView",\n    ]),\n  }),''',
              '''  ajustes: Object.freeze({\n    moduleKey: "cuenta",\n    loadModule: () =>\n      import(\n        "../views/cuenta/index.js"\n      ),\n    names: Object.freeze([\n      "CuentaView",\n    ]),\n  }),''',
          )

          styles = "src/router/styles.js"
          replace_once(
              styles,
              '  "route-styles.v5-correo-viewport-final";',
              '  "route-styles.v6-cuenta-legacy-alias";',
          )
          replace_once(
              styles,
              '''  ajustes: Object.freeze([\n    "/src/css/views/ajustes/index.css",\n  ]),''',
              '''  ajustes: Object.freeze([\n    "/src/css/views/cuenta/index.css",\n  ]),''',
          )

          sidebar = "src/ui/sidebar/template.js"
          replace_once(
              sidebar,
              '  "sidebar.template.unified.v3-hardened";',
              '  "sidebar.template.unified.v4-single-account-entry";',
          )
          remove_exact(sidebar, '  ajustes: "ajustes",\n', 1)
          remove_exact(
              sidebar,
              '  ajustes:\n    "M4 7h9.5 M17.5 7H20 M15.5 5a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z M4 12h2.5 M10.5 12H20 M8.5 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z M4 17h9.5 M17.5 17H20 M15.5 15a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z",\n',
              1,
          )
          remove_exact(
              sidebar,
              '''  const ajustesHref =\n    safeInternalHref(options.ajustesHref || options.settingsHref || "", "") ||\n    userScopedPrivateHref(ROUTES.ajustes || "/ajustes", currentUser);\n\n''',
              1,
          )
          remove_exact(
              sidebar,
              '''      createAccountMenuItem({\n        label: "Ajustes",\n        iconName: ICONS.ajustes,\n        action: "navigate",\n        href: ajustesHref,\n      }),\n''',
              1,
          )

          workflow = ".github/workflows/azure-static-web-apps-polite-bay-086469a1e.yml"
          p = Path(workflow)
          text = p.read_text(encoding="utf-8")
          start = '      - name: Audit JS imports non blocking\n'
          end = '      - name: Validate critical SPA contracts\n'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit("Azure workflow: import audit boundaries not unique")
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          text = before + '''      - name: Validate repository integrity\n        run: |\n          set -euo pipefail\n          python3 .github/scripts/repo_integrity.py\n\n''' + end + after

          if text.count('  PRODUCTION_BRANCH: "main"\n') != 1:
              raise SystemExit("Azure workflow: PRODUCTION_BRANCH env mismatch")
          text = text.replace('  PRODUCTION_BRANCH: "main"\n', '')

          lines = text.splitlines(keepends=True)
          production_input_lines = [
              line for line in lines
              if line.lstrip().startswith("production_branch:")
          ]
          if len(production_input_lines) != 3:
              raise SystemExit(
                  f"Azure workflow: production_branch input mismatch ({len(production_input_lines)})"
              )
          lines = [
              line for line in lines
              if not line.lstrip().startswith("production_branch:")
          ]
          text = "".join(lines)

          if text.count('          skip_api_build: true\n') != 3:
              raise SystemExit("Azure workflow: skip_api_build input mismatch")
          text = text.replace('          skip_api_build: true\n', '')
          p.write_text(text, encoding="utf-8")

          # The legacy implementation is removed entirely; the router keeps the URL alias.
          shutil.rmtree("src/views/ajustes")
          shutil.rmtree("src/css/views/ajustes")

          # This workflow is only a one-shot repository migration helper.
          Path(".github/workflows/repo-sweep-helper.yml").unlink()
          PY

          python3 .github/scripts/repo_integrity.py

          if grep -R -nE 'production_branch:|skip_api_build:' .github/workflows/azure-static-web-apps-polite-bay-086469a1e.yml; then
            echo "Unsupported Azure action inputs remain"
            exit 1
          fi

          git diff --check

      - name: Commit sweep
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git commit -m "refactor(repo): consolidar Ajustes y endurecer CI"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
