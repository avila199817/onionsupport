<!DOCTYPE html>
<html
  lang="es"
  data-app="onion"
  data-app-name="Onion Support"
  data-theme="dark"
  data-theme-mode="system"
  data-theme-source="initial"
  data-route-mode="boot"
  class="app-booting app-loading theme-dark"
>
<head>
  <!-- =========================================================
       ONION SUPPORT — INDEX / SPA SHELL
       Archivo: /index.html

       PRO SAAS PANEL · SPA PRIVATE APP · BOOT LOADER READY
       CSP CLEAN · ZERO INLINE JS/CSS · NO EXTERNAL FONTS
       FINAL EXTREME 10/10

       OBJETIVOS:
       - shell SPA privado, no landing pública
       - sin scripts inline
       - sin CSS inline
       - sin Google Fonts / fonts.gstatic / dependencias externas
       - theme system-first con preboot externo
       - loader estático visible desde refresh
       - sidebar/topbar montados por JS
       - tablehead dinámico preparado
       - restore de sesión sin flash visual
       - URLs SPA resueltas por Azure Static Web Apps
       - no indexar rutas privadas/auth/técnicas
       - favicon real sin preload innecesario
       - base enterprise estable

       IMPORTANTE:
       - /src/preboot/theme.js debe ser JS puro.
       - /src/preboot/theme.js no debe contener <script>.
       - /src/preboot/theme.js no debe contener HTML.
       - index.html debe empezar siempre por <!DOCTYPE html>.
       - Las fuentes se resuelven por variables.css con system-ui.
  ========================================================= -->

  <!-- =========================
       META BASE
  ========================= -->
  <meta charset="UTF-8">

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Onion Support</title>

  <meta
    name="application-name"
    content="Onion Support"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Onion Support"
  >

  <meta
    name="description"
    content="Onion Support · Panel privado SaaS de soporte, incidencias, facturación y gestión interna."
  >

  <!-- App privada: no indexar panel/auth/rutas SPA -->
  <meta
    name="robots"
    content="noindex, nofollow, noarchive, noimageindex"
  >

  <meta
    name="googlebot"
    content="noindex, nofollow, noarchive, noimageindex"
  >

  <meta
    name="bingbot"
    content="noindex, nofollow, noarchive, noimageindex"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <meta
    name="format-detection"
    content="telephone=no, date=no, address=no, email=no"
  >

  <meta
    name="color-scheme"
    content="dark light"
  >

  <meta
    name="theme-color"
    content="#0a0c11"
    data-onion-theme-color="true"
  >

  <meta
    name="msapplication-TileColor"
    content="#0a0c11"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <!-- =========================
       BASE SPA
  ========================= -->
  <base href="/">

  <!-- =========================
       FAVICON / APP ICONS
       Sin manifest hasta crear /site.webmanifest real.
       Esto evita el 404 visto en consola.
  ========================= -->
  <link
    rel="icon"
    href="/src/media/img/favicon_black_circle.png"
    type="image/png"
  >

  <link
    rel="shortcut icon"
    href="/src/media/img/favicon_black_circle.png"
    type="image/png"
  >

  <link
    rel="apple-touch-icon"
    href="/src/media/img/favicon_black_circle.png"
  >

  <!-- =========================
       PERFORMANCE · APP ASSETS
       Sin preconnect/dns-prefetch a Google Fonts.
       Sin fuentes externas.
  ========================= -->

  <!-- Loader logos: se usan inmediatamente en el boot loader -->
  <link
    rel="preload"
    href="/src/media/img/favicon_white.png"
    as="image"
    type="image/png"
    fetchpriority="high"
  >

  <link
    rel="preload"
    href="/src/media/img/favicon_black.png"
    as="image"
    type="image/png"
    fetchpriority="high"
  >

  <!-- Entrada principal SPA -->
  <link
    rel="modulepreload"
    href="/src/main.js"
  >

  <!-- =========================
       PREBOOT THEME
       CSP CLEAN:
       - externo
       - síncrono
       - antes del CSS final
       - resuelve data-theme real:
         dark/light según system o storage
  ========================= -->
  <script src="/src/preboot/theme.js"></script>

  <!-- =========================
       CSS ORDER
       Orden estable:
       1. tokens
       2. theme overrides
       3. reset/core/layout
       4. shell components
       5. auth/public technical views
  ========================= -->

  <!-- TOKENS -->
  <link
    rel="stylesheet"
    href="/src/css/tokens/variables.css"
  >

  <link
    rel="stylesheet"
    href="/src/css/tokens/light.css"
  >

  <!-- CORE -->
  <link
    rel="stylesheet"
    href="/src/css/core/reset.css"
  >

  <link
    rel="stylesheet"
    href="/src/css/core/layout.css"
  >

  <link
    rel="stylesheet"
    href="/src/css/core/core.css"
  >

  <link
    rel="stylesheet"
    href="/src/css/core/loader.css"
  >

  <!-- LAYOUT -->
  <link
    rel="stylesheet"
    href="/src/css/layout/sidebar.css"
  >

  <link
    rel="stylesheet"
    href="/src/css/layout/topbar.css"
  >

  <!-- COMPONENTS -->
  <link
    rel="stylesheet"
    href="/src/css/components/ui.css"
  >

  <!-- AUTH / PUBLIC TECHNICAL VIEWS -->
  <link
    rel="stylesheet"
    href="/src/css/auth/login.css"
  >

  <!-- =========================
       NOSCRIPT CSS EXTERNO
       CSP CLEAN:
       - sin <style> inline
  ========================= -->
  <noscript>
    <link
      rel="stylesheet"
      href="/src/css/core/noscript.css"
    >
  </noscript>
</head>

<body
  class="app-booting app-loading theme-dark"
  data-app="onion"
  data-density="default"
  data-app-loading="true"
  data-authenticated="false"
  data-route-mode="boot"
  data-shell-state="booting"
  data-theme="dark"
  data-theme-mode="system"
  data-theme-source="initial"
>
  <!-- =========================================================
       BOOT LOADER ESTÁTICO
       - visible desde refresh antes de JS
       - controlado después por loader.js / main.js
       - sin inline script
       - sin inline style
       - logos dependientes de html[data-theme]
  ========================================================= -->
  <div
    id="app-loader"
    class="app-loader is-visible"
    data-app-loader="true"
    data-loader-visible="true"
    data-loader-state="booting"
    role="status"
    aria-live="polite"
    aria-busy="true"
    aria-hidden="false"
  >
    <div
      class="app-loader__backdrop"
      data-loader-backdrop="true"
      aria-hidden="true"
    ></div>

    <div
      class="app-loader__card"
      data-loader-card="true"
    >
      <div
        class="app-loader__brand"
        data-loader-brand="true"
        aria-hidden="true"
      >
        <img
          class="app-loader__logo app-loader__logo--dark"
          src="/src/media/img/favicon_white.png"
          alt=""
          width="64"
          height="64"
          loading="eager"
          decoding="async"
          fetchpriority="high"
          draggable="false"
        >

        <img
          class="app-loader__logo app-loader__logo--light"
          src="/src/media/img/favicon_black.png"
          alt=""
          width="64"
          height="64"
          loading="eager"
          decoding="async"
          fetchpriority="high"
          draggable="false"
        >

        <div
          class="app-loader__logo-fallback"
          data-loader-logo-fallback="true"
          aria-hidden="true"
        >
          O
        </div>
      </div>

      <div class="app-loader__copy">
        <strong class="app-loader__title">
          Onion Support
        </strong>

        <span class="app-loader__text">
          Cargando sesión...
        </span>

        <small class="app-loader__subtext">
          Preparando panel seguro
        </small>
      </div>

      <div
        class="app-loader__bar"
        aria-hidden="true"
      >
        <span class="app-loader__bar-fill"></span>
      </div>
    </div>
  </div>

  <!-- =========================================================
       NOSCRIPT FALLBACK
  ========================================================= -->
  <noscript>
    <div class="layout noscript-layout">
      <main
        class="main-content"
        role="main"
        aria-label="Contenido principal"
      >
        <div id="noscript-content">
          <section class="noscript-box">
            <h1>JavaScript es necesario</h1>

            <p>
              Onion Support necesita JavaScript para cargar
              la navegación SPA, el panel, las vistas y la autenticación.
            </p>
          </section>
        </div>
      </main>
    </div>
  </noscript>

  <!-- =========================================================
       APP LAYOUT
       - Sidebar montado por JS
       - Topbar montado por JS
       - Tablehead dinámico preparado
       - View root estable para Router
       - Loader inicial ya existe y lo controla JS
  ========================================================= -->
  <div
    id="app-shell"
    class="layout app-shell"
    data-app-shell="true"
    data-shell="booting"
    data-route-mode="boot"
    aria-busy="true"
    aria-hidden="false"
  >
    <!-- SIDEBAR MOUNT -->
    <div
      id="sidebar-mount"
      data-sidebar-mount="true"
      aria-hidden="false"
    ></div>

    <!-- TOPBAR MOUNT -->
    <div
      id="topbar-mount"
      data-topbar-mount="true"
      aria-hidden="false"
    ></div>

    <!-- MAIN CONTENT -->
    <main
      id="main-content"
      class="main-content"
      role="main"
      aria-label="Contenido principal"
      tabindex="-1"
      aria-busy="true"
      data-main-content="true"
      data-route-mode="boot"
    >
      <!-- TABLEHEAD DYNAMIC SLOT -->
      <div
        id="table-head"
        class="table-head"
        data-tablehead="true"
        hidden
        aria-hidden="true"
      >
        <div
          id="tablehead-container"
          data-tablehead-container="true"
        ></div>
      </div>

      <!-- VIEW ROOT -->
      <div
        id="app-content"
        data-app-content="true"
      >
        <div
          id="view-container"
          data-view-root="true"
          data-router-view="true"
          aria-live="polite"
          aria-busy="true"
        ></div>
      </div>
    </main>
  </div>

  <!-- =========================
       APP ENTRY
       CSP CLEAN:
       - módulo externo
       - sin inline bootstrap
  ========================= -->
  <script
    type="module"
    src="/src/main.js"
  ></script>
</body>
</html>
