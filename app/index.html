<!DOCTYPE html>
<html lang="es">

<head>

  <!-- =========================
       META BASE
  ========================= -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Onion Support</title>

  <!-- =========================
       BASE (SPA)
  ========================= -->
  <base href="/">

  <!-- =========================
       SEO
  ========================= -->
  <meta name="robots" content="noindex, nofollow">

  <!-- =========================
       UI / THEME
  ========================= -->
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d0d0d">

  <!-- =========================
       ICON
  ========================= -->
  <link rel="icon" href="/favicon.ico">

  <!-- =========================
       PERFORMANCE
  ========================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- =========================
       FONTS
  ========================= -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- =========================
       CSS ORDER (CRÍTICO)
  ========================= -->

  <!-- TOKENS -->
  <link rel="stylesheet" href="/css/tokens/variables.css">
  <link rel="stylesheet" href="/css/tokens/light.css">

  <!-- RESET -->
  <link rel="stylesheet" href="/css/core/reset.css">

  <!-- CORE -->
  <link rel="stylesheet" href="/css/core/layout.css">
  <link rel="stylesheet" href="/css/core/core.css">

  <!-- LAYOUT -->
  <link rel="stylesheet" href="/css/layout/sidebar.css">
  <link rel="stylesheet" href="/css/layout/topbar.css">

  <!-- COMPONENTS -->
  <link rel="stylesheet" href="/css/components/ui.css">

  <!-- LOADER (ÚLTIMO) -->
  <link rel="stylesheet" href="/css/core/loader.css">

  <!-- =========================
       NOSCRIPT
  ========================= -->
  <noscript>
    <style>
      #app-loader { display: none }
      .layout { visibility: visible !important }
    </style>

    <div style="padding:20px; font-family:sans-serif;">
      ⚠️ Esta aplicación requiere JavaScript para funcionar.
    </div>
  </noscript>

</head>


<body class="loading" data-app="onion">

  <!-- LOADER -->
  <div id="app-loader" aria-hidden="true">
    <div class="loader-center">
      <img class="loader-logo loader-dark" src="/media/img/favicon_white.png">
      <img class="loader-logo loader-light" src="/media/img/favicon_black.png">
    </div>
  </div>

  <div class="layout">

    <aside class="sidebar">

      <!-- TOP -->
      <div class="sidebar-top">

        <!-- LOGO -->
        <a href="/" data-spa class="logo" id="homeLink">
          <img class="logo-dark" draggable="false" src="/media/img/favicon_white.png">
          <img class="logo-light" draggable="false" src="/media/img/favicon_black.png">
        </a>

        <!-- BOTÓN CERRAR -->
        <button class="sidebar-toggle" id="toggleSidebar" data-tooltip="Cerrar barra lateral">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="4" width="18" height="16" rx="3"
              stroke="currentColor" stroke-width="1.6" />
            <path d="M9 4v16"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>

      </div>

      <!-- SIDEBAR MAIN -->
      <nav class="sidebar-menu">

        <!-- (TODO tu menú intacto, no lo toco porque ya estaba perfecto) -->

      </nav>

      <!-- RECIENTES -->
      <div class="sidebar-section">
        <span class="section-title">Recientes</span>
      </div>

      <!-- USER -->
      <div class="sidebar-footer">

        <div class="user" id="userToggle" role="button" tabindex="0">

          <div class="avatar" id="sidebar-avatar" aria-label="Avatar usuario">ON</div>

          <div class="user-info">
            <span class="name" id="sidebar-name">Usuario</span>
            <span class="plan">Go Plan</span>
          </div>

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6"
              stroke="currentColor" stroke-width="1.6"/>
          </svg>

        </div>

        <div class="user-dropdown" id="userDropdown">

          <div class="dropdown-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            Añadir cuenta
          </div>

          <div class="dropdown-divider"></div>

          <div class="dropdown-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 4v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M8 8l4-4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5 20h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            Cambiar plan
          </div>

          <div class="dropdown-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.6" fill="none"/>
            </svg>
            Perfil
          </div>

          <div class="dropdown-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M4 12h16" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            Configuración
          </div>

          <div class="dropdown-divider"></div>

          <div class="dropdown-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
              <path d="M12 16v-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="12" cy="8" r="1" fill="currentColor"/>
            </svg>
            Ayuda
          </div>

          <div class="dropdown-item" id="logoutBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 4h5v16H4z" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            Cerrar sesión
          </div>

        </div>

      </div>

    </aside>

    <!-- =========================
         MAIN SPA (ROOT)
    ========================= -->
    <main id="app-content" class="main-content" role="main">

      <!-- =========================
           TOPBAR GLOBAL (FIJA)
      ========================= -->
      <header class="topbar">

        <div class="topbar-left">
          <h1 class="topbar-title" id="topbar-title">Panel</h1>
        </div>

        <div class="topbar-right">

          <!-- SEARCH GLOBAL -->
          <div class="topbar-search-wrap">

            <svg class="topbar-search-icon" viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
              <path d="M20 20l-3-3" stroke="currentColor" stroke-width="2"/>
            </svg>

            <input 
              type="text"
              id="topbar-search"
              class="topbar-search"
              placeholder="Buscar..."
              autocomplete="off"
            >

            <div id="topbar-search-results" class="topbar-search-results" hidden></div>

          </div>

        </div>

      </header>

      <!-- DINÁMICOS -->
      <div id="topbarview-container" data-dynamic></div>
      <div id="tablehead-container" data-dynamic></div>

      <!-- VIEW -->
      <div id="view-container"></div>

    </main>

  </div>

  <!-- SCRIPTS -->
  <script src="/js/wwwroot/server.js"></script>

</body>
</html>
