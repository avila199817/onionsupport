name: TMP · Incidencias final polish

on:
  push:
    branches:
      - work/incidencias-final-polish-20260819
    paths:
      - .github/workflows/_tmp-incidencias-final-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/incidencias-final-polish-20260819
          fetch-depth: 0

      - name: Apply final Incidencias polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 exact match, found {count}")
              return text.replace(old, new, 1)

          # -------------------------------------------------
          # 1) Detail template: clean copy + avatar parity
          # -------------------------------------------------
          path = Path("src/views/incidencias/incidencias.template.modal.js")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              '  "incidencias.template.modal.extreme.v31.single-submit";',
              '  "incidencias.template.modal.extreme.v32.avatar-parity";',
              "detail template version",
          )

          text = replace_once(
              text,
              '          <span>Estado, prioridad y tipo de incidencia · Los cambios se aplican con la acción del final del modal.</span>',
              '          <span>Estado, prioridad y tipo de incidencia</span>',
              "admin helper copy",
          )

          text = replace_once(
              text,
              '''  const tone =\n    hashText(\n      `${name}:${email}:${getTicketId(detail)}`\n    ) % 10;''',
              '''  const identity =\n    email ||\n    name;\n\n  const tone =\n    hashText(identity) % 10;''',
              "detail avatar identity",
          )

          path.write_text(text, encoding="utf-8")

          # -------------------------------------------------
          # 2) Detail CSS: exact same avatar palette as table
          # -------------------------------------------------
          path = Path("src/css/views/incidencias/detail.css")
          text = path.read_text(encoding="utf-8")

          old_frame = '''.incidencias-modal-avatar-frame {\n  display: grid;\n  place-items: center;\n  overflow: hidden;\n  border: 1px solid var(--border-default);\n  border-radius: var(--incidencias-modal-avatar-radius);\n  background: var(--solid-bg-2);\n  color: var(--text-strong);\n  font-size: var(--font-lg);\n  font-weight: var(--weight-black);\n  letter-spacing: var(--letter-tight);\n}\n'''

          new_frame = '''.incidencias-modal-avatar-frame {\n  --inc-avatar-a: var(--accent);\n  --inc-avatar-b: var(--info);\n  display: grid;\n  place-items: center;\n  overflow: hidden;\n  border: 1px solid color-mix(in srgb, var(--inc-avatar-a) 44%, var(--border-default));\n  border-radius: var(--incidencias-modal-avatar-radius);\n  background: linear-gradient(135deg, var(--inc-avatar-a), var(--inc-avatar-b));\n  color: var(--text-on-accent, #fff);\n  box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 18%, transparent);\n  font-size: var(--font-lg);\n  font-weight: var(--weight-black);\n  letter-spacing: var(--letter-tight);\n}\n\n.incidencias-modal-avatar-frame[data-avatar-tone="0"] { --inc-avatar-a: var(--accent); --inc-avatar-b: var(--info); }\n.incidencias-modal-avatar-frame[data-avatar-tone="1"] { --inc-avatar-a: var(--success); --inc-avatar-b: var(--info); }\n.incidencias-modal-avatar-frame[data-avatar-tone="2"] { --inc-avatar-a: var(--warning); --inc-avatar-b: var(--accent); }\n.incidencias-modal-avatar-frame[data-avatar-tone="3"] { --inc-avatar-a: var(--error); --inc-avatar-b: var(--warning); }\n.incidencias-modal-avatar-frame[data-avatar-tone="4"] { --inc-avatar-a: var(--info); --inc-avatar-b: var(--accent); }\n.incidencias-modal-avatar-frame[data-avatar-tone="5"] { --inc-avatar-a: var(--success); --inc-avatar-b: var(--accent); }\n.incidencias-modal-avatar-frame[data-avatar-tone="6"] { --inc-avatar-a: var(--info); --inc-avatar-b: var(--success); }\n.incidencias-modal-avatar-frame[data-avatar-tone="7"] { --inc-avatar-a: var(--warning); --inc-avatar-b: var(--error); }\n.incidencias-modal-avatar-frame[data-avatar-tone="8"] { --inc-avatar-a: var(--error); --inc-avatar-b: var(--accent); }\n.incidencias-modal-avatar-frame[data-avatar-tone="9"] { --inc-avatar-a: var(--accent); --inc-avatar-b: var(--success); }\n'''

          text = replace_once(text, old_frame, new_frame, "detail avatar frame")
          path.write_text(text, encoding="utf-8")

          # -------------------------------------------------
          # 3) Main template: remove manual Refresh UI contract
          # -------------------------------------------------
          path = Path("src/views/incidencias/incidencias.template.js")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              'export const INCIDENCIAS_TEMPLATE_VERSION = "incidencias.template.extreme.v22.attachments-sort-avatar-tones";',
              'export const INCIDENCIAS_TEMPLATE_VERSION = "incidencias.template.extreme.v23.autonomous-refresh";',
              "list template version",
          )

          text = replace_once(
              text,
              '  REFRESH: "refresh",\n',
              '',
              "remove refresh action",
          )

          old_refresh_button = '''          <button type="button" id="incidencias-refresh-btn" class="incidencias-btn${vm.refreshing ? " is-loading" : ""}" data-incidencias-action="${INCIDENCIAS_ACTIONS.REFRESH}" ${htmlAttrs({ disabled: vm.refreshing || vm.loading, "aria-disabled": vm.refreshing || vm.loading ? "true" : false, "aria-busy": vm.refreshing ? "true" : false })}>\n            ${vm.refreshing ? spinner("Actualizando...") : `${icon("refresh")}<span>Actualizar</span>`}\n          </button>\n'''
          text = replace_once(text, old_refresh_button, '', "remove refresh button")
          path.write_text(text, encoding="utf-8")

          # -------------------------------------------------
          # 4) Controller: autonomous, silent, non-disruptive freshness
          # -------------------------------------------------
          path = Path("src/views/incidencias/index.js")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              '''  listIncidencias,\n  hydrateIncidenciasFromCache,''',
              '''  listIncidencias,\n  hydrateIncidenciasFromCache,\n  INCIDENCIAS_CACHE_TTL_MS,''',
              "import cache ttl",
          )

          text = replace_once(
              text,
              '  "incidencias.index.extreme.v32.single-detail-submit";',
              '  "incidencias.index.extreme.v33.autonomous-refresh";',
              "index version",
          )

          text = replace_once(
              text,
              '''const DEFAULT_SORT_MODE = "date";\n\nconst USER_SEARCH_MIN_LENGTH = 2;''',
              '''const DEFAULT_SORT_MODE = "date";\nconst AUTO_REFRESH_INTERVAL_MS = INCIDENCIAS_CACHE_TTL_MS;\n\nconst USER_SEARCH_MIN_LENGTH = 2;''',
              "auto refresh interval",
          )

          text = replace_once(
              text,
              '''  let loadSeq = 0;\n  let userSearchSeq = 0;''',
              '''  let loadSeq = 0;\n  let autoRefreshTimer = 0;\n  let autoRefreshRunning = false;\n  let userSearchSeq = 0;''',
              "auto refresh state",
          )

          text = replace_once(
              text,
              '''      for (const selector of [\n        ".incidencias-history-copy",\n        ".incidencias-filter-pills",''',
              '''      for (const selector of [\n        ".incidencias-hero-meta",\n        ".incidencias-stats",\n        ".incidencias-history-copy",\n        ".incidencias-filter-pills",''',
              "list patch stats",
          )

          text = replace_once(
              text,
              '''    const force =\n      options.force === true;\n\n    const hasItems =''',
              '''    const force =\n      options.force === true;\n\n    const background =\n      options.background === true;\n\n    const hasItems =''',
              "load background flag",
          )

          text = replace_once(
              text,
              '''      render();\n\n      return response;''',
              '''      render(\n        background\n          ? {\n              listPatch: true,\n              skipModals: true,\n            }\n          : {}\n      );\n\n      return response;''',
              "load success background render",
          )

          text = replace_once(
              text,
              '''      if (items.length) {\n        render();\n        return null;\n      }''',
              '''      if (items.length) {\n        render(\n          background\n            ? {\n                listPatch: true,\n                skipModals: true,\n              }\n            : {}\n        );\n        return null;\n      }''',
              "load error background render",
          )

          old_refresh_fn = '''  async function refresh() {\n    return load({\n      force: true,\n      silent: false,\n    });\n  }\n'''

          new_refresh_fn = '''  async function refresh() {\n    return load({\n      force: true,\n      silent: false,\n    });\n  }\n\n  function pageIsVisible() {\n    if (!isBrowser()) {\n      return false;\n    }\n\n    return document.visibilityState !== "hidden";\n  }\n\n  async function refreshInBackground() {\n    if (\n      destroyed ||\n      !mounted ||\n      !pageIsVisible() ||\n      autoRefreshRunning ||\n      loading ||\n      refreshing ||\n      creating ||\n      createModal.submitting ||\n      detailModal.submitting\n    ) {\n      return false;\n    }\n\n    autoRefreshRunning = true;\n\n    try {\n      await load({\n        force: false,\n        silent: true,\n        background: true,\n      });\n\n      return true;\n    } finally {\n      autoRefreshRunning = false;\n    }\n  }\n\n  function stopAutoRefresh() {\n    if (!autoRefreshTimer || !isBrowser()) {\n      autoRefreshTimer = 0;\n      return false;\n    }\n\n    window.clearInterval(autoRefreshTimer);\n    autoRefreshTimer = 0;\n    return true;\n  }\n\n  function startAutoRefresh() {\n    if (!isBrowser()) {\n      return false;\n    }\n\n    stopAutoRefresh();\n\n    autoRefreshTimer = window.setInterval(() => {\n      void refreshInBackground();\n    }, AUTO_REFRESH_INTERVAL_MS);\n\n    return true;\n  }\n\n  function onWindowFocus() {\n    void refreshInBackground();\n  }\n\n  function onVisibilityChange() {\n    if (pageIsVisible()) {\n      void refreshInBackground();\n    }\n  }\n'''

          text = replace_once(text, old_refresh_fn, new_refresh_fn, "autonomous refresh functions")

          old_action = '''    if (\n      type ===\n      INCIDENCIAS_ACTIONS.REFRESH\n    ) {\n      return refresh();\n    }\n\n'''
          text = replace_once(text, old_action, '', "remove refresh action handler")

          text = replace_once(
              text,
              '''        window.addEventListener(\n          "beforeunload",\n          onBeforeUnload\n        );\n      }''',
              '''        window.addEventListener(\n          "beforeunload",\n          onBeforeUnload\n        );\n\n        window.addEventListener(\n          "focus",\n          onWindowFocus\n        );\n\n        document.addEventListener(\n          "visibilitychange",\n          onVisibilityChange\n        );\n\n        startAutoRefresh();\n      }''',
              "mount auto refresh",
          )

          text = replace_once(
              text,
              '''        window.removeEventListener(\n          "beforeunload",\n          onBeforeUnload\n        );\n      }''',
              '''        window.removeEventListener(\n          "beforeunload",\n          onBeforeUnload\n        );\n\n        window.removeEventListener(\n          "focus",\n          onWindowFocus\n        );\n\n        document.removeEventListener(\n          "visibilitychange",\n          onVisibilityChange\n        );\n\n        stopAutoRefresh();\n      }''',
              "destroy auto refresh",
          )

          text = replace_once(
              text,
              '''        loading,\n        refreshing,\n        creating,''',
              '''        loading,\n        refreshing,\n        creating,\n\n        autoRefresh: {\n          enabled: Boolean(autoRefreshTimer),\n          running: autoRefreshRunning,\n          intervalMs: AUTO_REFRESH_INTERVAL_MS,\n        },''',
              "snapshot auto refresh",
          )

          text = replace_once(
              text,
              '''          beforeUnloadProtection: true,\n\n          detailMultilinePreserved: true,''',
              '''          beforeUnloadProtection: true,\n          autonomousRefresh: true,\n          refreshOnWindowFocus: true,\n          refreshOnVisibilityReturn: true,\n          manualRefreshButton: false,\n\n          detailMultilinePreserved: true,''',
              "snapshot policy",
          )

          path.write_text(text, encoding="utf-8")

          # -------------------------------------------------
          # Cleanup the temporary workflow itself.
          # -------------------------------------------------
          Path(".github/workflows/_tmp-incidencias-final-polish.yml").unlink()
          PY

      - name: Verify final contracts
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "Los cambios se aplican con la acción del final del modal" src/views/incidencias
          ! grep -R "incidencias-refresh-btn\|INCIDENCIAS_ACTIONS.REFRESH" src/views/incidencias
          grep -q 'INCIDENCIAS_CACHE_TTL_MS' src/views/incidencias/index.js
          grep -q 'visibilitychange' src/views/incidencias/index.js
          grep -q 'window.setInterval' src/views/incidencias/index.js
          grep -q 'background: true' src/views/incidencias/index.js
          grep -q 'hashText(identity) % 10' src/views/incidencias/incidencias.template.modal.js
          grep -q 'incidencias-modal-avatar-frame\[data-avatar-tone="7"\]' src/css/views/incidencias/detail.css
          grep -q 'linear-gradient(135deg, var(--inc-avatar-a), var(--inc-avatar-b))' src/css/views/incidencias/detail.css
          git diff --check

      - name: Commit final polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(incidencias): cerrar avatar y refresco autónomo"
          git push origin HEAD:work/incidencias-final-polish-20260819
