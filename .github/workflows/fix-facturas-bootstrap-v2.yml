name: Fix Facturas Bootstrap V2

on:
  push:
    branches:
      - fix/facturas-mobile-resend-confirm

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope bootstrap to resend confirm only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/facturas-resend-polish-bootstrap-v2.yml')
          text = p.read_text(encoding='utf-8')
          replacements = [
              (
                  'if "window.confirm(question)" in index:\n              pattern = re.compile(',
                  'if "¿Quieres volver a enviarla?" in index:\n              pattern = re.compile(',
              ),
              (
                  'if "window.confirm(question)" in index:\n              raise SystemExit("native resend confirm survived replacement")',
                  'if "¿Quieres volver a enviarla?" in index:\n              raise SystemExit("native resend confirm survived replacement")',
              ),
              (
                  'reject(INDEX, "window.confirm(", "Resend confirmation must not use the browser-native confirm dialog")',
                  'reject(INDEX, "¿Quieres volver a enviarla?", "Resend confirmation must not use the browser-native confirm dialog")',
              ),
          ]
          changed = False
          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'bootstrap fix anchor mismatch: {old[:60]}')
              text = text.replace(old, new, 1)
              changed = True
          if changed:
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit bootstrap correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Bootstrap already corrected"
            exit 0
          fi
          git config user.name "Onion Support Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/facturas-resend-polish-bootstrap-v2.yml
          git commit -m "chore: scope facturas bootstrap to resend"
          git push origin HEAD:fix/facturas-mobile-resend-confirm
