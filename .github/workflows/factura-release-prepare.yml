name: Prepare and validate factura release
on:
  push:
    branches: [fix/factura-create-production-20260910]
    paths: [.github/workflows/factura-release-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'avila199817/onionsupport' && github.ref == 'refs/heads/fix/factura-create-production-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.commit.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 10
          persist-credentials: true
      - name: Apply readable patch and verify exact delivered bytes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7f1a2f4178b19309bd4e8950e373d77ab2a54551 HEAD
          git apply --check .github/factura-core-release.patch
          git apply .github/factura-core-release.patch
          sha256sum --check <<'SUMS'
          65298d72acb4c34dc164d5471c24405de7ab7094d11f1cc911a1c77c11d07567  package.json
          cfc20b85cf2057b3e6d781aede638075e1e5b8636748051aad9c9b6f7408113f  src/views/facturas/facturas.create-dom.js
          7d5dfa792d56b9141b2984f66d13e751efb263557ec18e4e5d57e2696d90e705  src/views/facturas/facturas.template.create.js
          0ef3fd19db75a5350de1581ba58bd08be320fc1ba736a768398815ae5bb2c7fb  src/views/facturas/index.js
          aec56b6ff3d5312bc47205b46e54800401c92970999d9cfbc37a1088b59eef7a  tools/factura-create-browser-contract.mjs
          SUMS
          git add package.json src/views/facturas/facturas.create-dom.js src/views/facturas/facturas.template.create.js src/views/facturas/index.js tools/factura-create-browser-contract.mjs
          git rm .github/factura-core-release.patch .github/workflows/factura-release-prepare.yml
          git diff --cached --check
          expected=$(printf '%s\n' package.json src/views/facturas/facturas.create-dom.js src/views/facturas/facturas.template.create.js src/views/facturas/index.js tools/factura-create-browser-contract.mjs | sort)
          actual=$(git diff --cached --name-only 7f1a2f4178b19309bd4e8950e373d77ab2a54551 | sort)
          [[ "$actual" == "$expected" ]]
      - name: Commit only to the release branch; never main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(facturas): apply stable create modal and authoritative incident search'
          git push origin HEAD:refs/heads/fix/factura-create-production-20260910
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Candidate SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
  validate:
    name: Full invoice release validation
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ONION_RELEASE_SHA: ${{ needs.prepare.outputs.candidate }}
      CHROMIUM_PATH: /usr/bin/google-chrome
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Use locked npm and dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare npm@10.9.8 --activate
          [[ "$(node --version)" == v22.23.2 ]]
          [[ "$(npm --version)" == 10.9.8 ]]
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Invoice create browser regressions
        run: node tools/factura-create-browser-contract.mjs
      - name: Complete source, build, reproducibility and browser validation
        run: npm run validate:ci
