name: TEMP Fix Entity Overlay Entrypoint Contract

on:
  push:
    branches:
      - feat/global-entity-overlay

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/global-entity-overlay
          fetch-depth: 1
          persist-credentials: true

      - name: Align entrypoint contract
        run: python3 tools/patch_entity_overlay_entrypoint_contract.py

      - name: Validate corrected branch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/app_entrypoint_integrity.py
          node .github/scripts/entity_overlay_contract.mjs
          python3 .github/scripts/repo_integrity.py
          bash .github/ci/validate_spa_contracts.sh
          python3 .github/scripts/google_measurement_contract.py --root .
          git diff --check

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Onion Support CI"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git commit -m "fix: alinear contrato del entrypoint con overlay global"
          git push origin HEAD:feat/global-entity-overlay
