name: Incidencias History No Box Once

on:
  push:
    branches:
      - fix/incidencias-history-no-outer-box-20260817
    paths:
      - .github/scripts/patch-incidencias-history-no-box.py
      - .github/workflows/incidencias-history-no-box-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/incidencias-history-no-outer-box-20260817
          fetch-depth: 0

      - name: Apply CSS patch
        run: python3 .github/scripts/patch-incidencias-history-no-box.py

      - name: Validate clean history shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = Path('src/css/views/incidencias/detail.css').read_text(encoding='utf-8')
          start = css.index('.incidencias-modal-history-view {')
          end = css.index('.incidencias-modal-history-view-head {', start)
          block = css[start:end]
          required = [
              'min-block-size: 0;',
              'border: 0;',
              'border-radius: 0;',
              'background: transparent;',
              'box-shadow: none;',
          ]
          for token in required:
              if token not in block:
                  raise SystemExit(f'Missing {token}')
          if '!important' in block:
              raise SystemExit('New history shell must not use !important')
          PY

      - name: Commit CSS and remove one-shot files
        run: |
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git rm .github/scripts/patch-incidencias-history-no-box.py \
                 .github/workflows/incidencias-history-no-box-once.yml
          git add src/css/views/incidencias/detail.css
          git commit -m "style(incidencias): quitar caja exterior del historial"
          git push origin HEAD:fix/incidencias-history-no-outer-box-20260817
