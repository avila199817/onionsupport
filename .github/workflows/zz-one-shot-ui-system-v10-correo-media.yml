name: One-shot UI System V10 Correo Media

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

env:
  TARGET_BRANCH: refactor/ui-system-v10-correo-media-policy

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/ui-system-v10-correo-media-policy'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Guard trigger
        run: |
          set -euo pipefail
          test -f .github/.ui-system-v10-correo-media-trigger

      - name: Apply Correo media V10
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_system_v10_correo_media.py

      - name: Validate repository
        run: |
          set -euo pipefail
          python3 .github/scripts/repo_integrity.py
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Validate media authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/views/correo/index.js').read_text(encoding='utf-8')
          assert 'function safeImageUrl' not in text
          assert 'sanitizeRuntimeImageUrl(' in text
          assert 'from "../../core/media.js"' in text
          print('Correo canonical media policy OK')
          PY

      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add \
            src/views/correo/index.js \
            .github/scripts/repo_integrity.py \
            docs/UI_SYSTEM_V10_AUDIT.md
          if git diff --cached --quiet; then
            echo "Sin cambios de migración."
            exit 0
          fi
          git commit -m "refactor(correo): usar política canónica de media"
          git push origin HEAD:${TARGET_BRANCH}
