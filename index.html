<!doctype html>
<html
  lang="es"
  dir="ltr"
  data-app="onion"
  data-app-name="Onion Support"
  data-locale="es"
  data-theme="system"
  data-theme-mode="system"
  data-theme-ready="false"
  data-app-state="booting"
  data-app-loading="true"
  data-app-ready="false"
  data-route-mode="boot"
  data-css-route-mode="route"
  data-css-route-layer-contract="self-layered-v1"
  data-chrome="hidden"
  class="app-booting app-loading no-js"
>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <base href="/">

  <title>Onion Support · Soluciones IT</title>

  <meta
    name="description"
    content="Onion Support · Servicio técnico informático en Sant Vicenç de Castellet. Reparación de ordenadores, portátiles, SSD, RAM, redes, impresoras y asistencia a domicilio."
  >

  <meta name="application-name" content="Onion Support">
  <meta name="apple-mobile-web-app-title" content="Onion Support">

  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <meta name="bingbot" content="index, follow">

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <meta
    name="format-detection"
    content="telephone=no, date=no, address=no, email=no"
  >

  <meta
    name="color-scheme"
    content="light dark"
  >

  <meta
    name="theme-color"
    content="#0a0c11"
    data-onion-theme-color="true"
  >

  <meta
    name="theme-color"
    media="(prefers-color-scheme: light)"
    content="#ffffff"
    data-onion-theme-color-light="true"
  >

  <meta
    name="theme-color"
    media="(prefers-color-scheme: dark)"
    content="#0a0c11"
    data-onion-theme-color-dark="true"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <link
    rel="canonical"
    href="https://www.onionsupport.com/"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:locale"
    content="es_ES"
  >

  <meta
    property="og:site_name"
    content="Onion Support"
  >

  <meta
    property="og:title"
    content="Onion Support · Soluciones IT"
  >

  <meta
    property="og:description"
    content="Servicio técnico informático en Sant Vicenç de Castellet. Reparación de ordenadores, portátiles, optimización, redes, impresoras y asistencia a domicilio."
  >

  <meta
    property="og:url"
    content="https://www.onionsupport.com/"
  >

  <meta
    name="twitter:card"
    content="summary"
  >

  <meta
    name="twitter:title"
    content="Onion Support · Soluciones IT"
  >

  <meta
    name="twitter:description"
    content="Servicio técnico informático en Sant Vicenç de Castellet. Reparación, optimización y asistencia a domicilio."
  >

  <link
    rel="icon"
    href="/favicon.ico"
    sizes="any"
  >

  <link
    rel="manifest"
    href="/site.webmanifest"
  >

  <!--
    Se ejecuta antes de pintar la interfaz para fijar el tema
    y evitar flashes claro/oscuro durante el arranque.
  -->
  <script src="/src/preboot/theme.js"></script>

  <link
    rel="stylesheet"
    href="/src/css/app.css"
  >

  <link
    rel="stylesheet"
    href="/src/css/views/public/mobile-polish.css"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="/src/css/core/noscript.css"
    >
  </noscript>
</head>

<body
  class="app-booting app-loading"
  data-app="onion"
  data-app-name="Onion Support"
  data-density="default"
  data-app-state="booting"
  data-app-loading="true"
  data-app-ready="false"
  data-route-mode="boot"
  data-chrome="hidden"
>
  <a
    class="sr-only sr-only-focusable app-skip-link"
    href="#main-content"
    data-skip-link="true"
  >
    Saltar al contenido principal
  </a>

  <div
    id="app-loader"
    class="app-loader is-visible"
    data-app-loader="true"
    data-loader-visible="true"
    data-loader-state="booting"
    role="status"
    aria-live="polite"
    aria-busy="true"
    aria-atomic="true"
    aria-hidden="false"
    aria-label="Cargando Onion Support"
  >
    <div
      class="app-loader__backdrop"
      data-loader-backdrop="true"
      aria-hidden="true"
    ></div>

    <div
      class="app-loader__brand app-loader__brand--solo"
      data-loader-brand="true"
      data-loader-logo-card="true"
      aria-hidden="true"
    >
      <div
        class="app-loader__logo-fallback app-loader__logo-shell"
        data-loader-logo-shell="true"
        data-loader-logo-fallback="true"
        aria-hidden="true"
      >
        <picture
          class="app-loader__logo-picture"
          data-loader-logo-picture="true"
        >
          <img
            class="app-loader__logo"
            src="/favicon.ico"
            width="48"
            height="48"
            alt=""
            loading="eager"
            decoding="async"
            fetchpriority="high"
            draggable="false"
            data-loader-logo="true"
          >
        </picture>
      </div>
    </div>
  </div>

  <noscript>
    <div
      id="noscript-root"
      class="layout noscript-layout"
      data-noscript-root="true"
    >
      <main
        class="main-content noscript-main"
        role="main"
        aria-label="Contenido principal"
      >
        <section
          class="noscript-box"
          lang="es"
        >
          <h1>Se requiere JavaScript</h1>

          <p>
            Onion Support necesita JavaScript para cargar correctamente la web
            y el panel privado.
          </p>

          <p>
            También puedes contactar por WhatsApp o llamada en el
            <strong>629 946 615</strong>.
          </p>
        </section>
      </main>
    </div>
  </noscript>

  <div
    id="app-shell"
    class="layout app-shell"
    data-app-shell="true"
    data-shell="visible"
    data-shell-state="booting"
    data-chrome="hidden"
    data-route-mode="boot"
    aria-busy="true"
    aria-hidden="false"
  >
    <div
      id="sidebar-mount"
      data-sidebar-mount="true"
      data-chrome="hidden"
      data-route-mode="boot"
      hidden
      aria-hidden="true"
    ></div>

    <div
      id="topbar-mount"
      data-topbar-mount="true"
      data-chrome="hidden"
      data-route-mode="boot"
      hidden
      aria-hidden="true"
    ></div>

    <main
      id="main-content"
      class="main-content"
      role="main"
      aria-label="Contenido principal"
      tabindex="-1"
      aria-busy="true"
      aria-hidden="false"
      data-main-content="true"
      data-shell="visible"
      data-shell-state="booting"
      data-chrome="hidden"
      data-route-mode="boot"
    >
      <div
        id="table-head"
        class="table-head"
        data-tablehead="true"
        data-chrome="hidden"
        data-route-mode="boot"
        hidden
        aria-hidden="true"
      >
        <div
          id="tablehead-container"
          data-tablehead-container="true"
        ></div>
      </div>

      <div
        id="app-content"
        data-app-content="true"
        data-shell="visible"
        data-shell-state="booting"
        data-route-mode="boot"
        aria-busy="true"
        aria-hidden="false"
      >
        <div
          id="view-container"
          data-view-root="true"
          data-router-view="true"
          data-view-container="true"
          data-shell="visible"
          data-shell-state="booting"
          data-route-mode="boot"
          tabindex="-1"
          aria-busy="true"
          aria-hidden="false"
        ></div>
      </div>
    </main>
  </div>

  <script
    type="module"
    src="/src/main.js"
  ></script>

  <script
    type="module"
    src="/src/features/public-support/mobile-polish.js"
  ></script>

  <script
    type="module"
    src="/src/features/public-support/index.js"
  ></script>
</body>
</html>
