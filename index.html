<!DOCTYPE html>
<html
  lang="es"
  data-app="onion"
  data-app-name="Onion Support"
  data-theme="dark"
  data-theme-mode="system"
  data-theme-source="initial"
  data-app-state="booting"
  data-route-mode="boot"
  data-shell-state="booting"
  class="app-booting"
>
<head>
  <!-- =========================================================
       ONION SUPPORT — INDEX / SPA SHELL
       Archivo: /index.html

       PRO SAAS PANEL · PRIVATE SPA · ENTERPRISE BOOT SHELL
       CSP READY · ZERO INLINE JS/CSS · NO EXTERNAL FONTS
       TOKEN PRO SYSTEM · THEME PREBOOT · STATIC LOADER
       FINAL EXTREME 10/10

       OBJETIVOS:
       - Shell SPA privado, no landing pública.
       - Sin scripts inline.
       - Sin CSS inline.
       - Sin Google Fonts / fonts.gstatic / dependencias externas.
       - CSS centralizado desde /src/css/app.css.
       - variables.css como Token Pro System / fuente de verdad.
       - Tema inicial resuelto por /src/preboot/theme.js antes del CSS.
       - Loader estático visible desde refresh.
       - Loader controlado después por JS.
       - Sidebar y topbar montados por JS.
       - Tablehead dinámico preparado.
       - Restore de sesión sin flash visual.
       - URLs SPA resueltas por Azure Static Web Apps.
       - Panel privado no indexable.
       - PWA coherente mediante /site.webmanifest.
       - Favicons oficiales Onion Support.
       - Preparado para CSP estricta vía headers.

       CONTRATO DE BOOT:
       - index.html declara estructura y estado mínimo inicial.
       - theme.js decide el tema real: dark/light/system/storage.
       - main.js arranca la aplicación.
       - loader.js oculta el loader y limpia estados app-booting/app-loading.
       - Router renderiza en #view-container.
       - SidebarUI monta en #sidebar-mount.
       - TopbarUI monta en #topbar-mount.

       IMPORTANTE:
       - El tema inicial vive en <html>.
       - <body> no nace con data-theme ni theme-dark/theme-light.
       - No hardcodear clases theme-dark/theme-light en index.html.
       - theme.js puede sincronizar <body> cuando document.body exista.
       - loader.css debe decidir logos mediante html[data-theme].
       - La CSP real debe aplicarse desde headers, por ejemplo:
         staticwebapp.config.json en Azure Static Web Apps.
  ========================================================= -->

  <!-- =========================
       META BASE
  ========================= -->
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Onion Support</title>

  <meta
    name="application-name"
    content="Onion Support"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Onion Support"
  >

  <meta
    name="description"
    content="Onion Support · Panel privado SaaS de soporte, incidencias, facturación y gestión interna."
  >

  <!-- =========================
       PRIVACY / INDEXING
       App privada: no indexar panel, auth ni rutas SPA.
  ========================= -->
  <meta
    name="robots"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="googlebot"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="bingbot"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <meta
    name="format-detection"
    content="telephone=no, date=no, address=no, email=no"
  >

  <!-- =========================
       THEME / BROWSER CHROME
       theme.js/runtime pueden actualizar theme-color.
  ========================= -->
  <meta
    name="color-scheme"
    content="dark light"
  >

  <meta
    name="theme-color"
    content="#0a0c11"
    data-onion-theme-color="true"
  >

  <meta
    name="msapplication-TileColor"
    content="#0a0c11"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <!-- =========================
       BASE SPA
       Correcto para Azure Static Web Apps sirviendo desde raíz.
  ========================= -->
  <base href="/">

  <!-- =========================
       FAVICON / APP ICONS

       Set principal Onion Support:
       - favicon_support.png
       - favicon_white.png
       - favicon_black_circle.png
       - favicon_black.png

       Recomendación:
       - Mantener /favicon.ico como fallback raíz.
       - Usar PNGs reales para app icons, loader y PWA.
       - Evitar referencias a /favicon.svg.
  ========================= -->
  <link
    rel="icon"
    href="/favicon.ico?v=3"
    sizes="any"
    type="image/x-icon"
  >

  <link
    rel="shortcut icon"
    href="/favicon.ico?v=3"
    type="image/x-icon"
  >

  <link
    rel="icon"
    href="/src/media/img/favicon_support.png?v=3"
    type="image/png"
  >

  <link
    rel="apple-touch-icon"
    href="/src/media/img/favicon_black_circle.png?v=3"
  >

  <!-- =========================
       PWA MANIFEST

       El repo contiene /site.webmanifest.
       El manifest debe declarar PNG/ICO reales.
       No declarar favicon.svg.
  ========================= -->
  <link
    rel="manifest"
    href="/site.webmanifest?v=3"
  >

  <!-- =========================
       PERFORMANCE · APP ASSETS
       Sin preconnect/dns-prefetch a Google Fonts.
       Sin fuentes externas.
  ========================= -->

  <!-- Loader inicial para tema dark / fondo oscuro -->
  <link
    rel="preload"
    href="/src/media/img/favicon_white.png?v=3"
    as="image"
    type="image/png"
    fetchpriority="high"
  >

  <!-- Loader inicial para tema light / fondo claro -->
  <link
    rel="preload"
    href="/src/media/img/favicon_black.png?v=3"
    as="image"
    type="image/png"
    fetchpriority="low"
  >

  <!-- Entrada principal SPA -->
  <link
    rel="modulepreload"
    href="/src/main.js"
  >

  <!-- =========================
       PREBOOT THEME
       CSP READY:
       - script externo
       - síncrono
       - antes del CSS final
       - actualiza html[data-theme]
       - evita flash dark/light incorrecto

       /src/preboot/theme.js debe ser JS puro:
       - sin <script>
       - sin HTML
       - sin CSS inline
  ========================= -->
  <script src="/src/preboot/theme.js"></script>

  <!-- =========================
       CSS ENTRYPOINT
       /src/css/app.css importa:
       - tokens/variables.css
       - tokens/light.css
       - core/reset.css
       - core/core.css
       - core/layout.css
       - core/loader.css
       - layout/sidebar.css
       - layout/topbar.css
       - components/ui.css
       - views/*.css
       - auth/login.css

       IMPORTANTE:
       - No meter <style> inline.
       - No meter CSS dinámico desde JS salvo fallback extremo.
       - Las vistas viven en /src/css/views/.
  ========================= -->
  <link
    rel="stylesheet"
    href="/src/css/app.css"
  >

  <!-- =========================
       NOSCRIPT CSS EXTERNO
       CSP READY:
       - sin <style> inline
       - separado porque solo aplica sin JS
  ========================= -->
  <noscript>
    <link
      rel="stylesheet"
      href="/src/css/core/noscript.css"
    >
  </noscript>
</head>

<body
  class="app-booting app-loading"
  data-app="onion"
  data-app-name="Onion Support"
  data-density="default"
  data-app-loading="true"
  data-authenticated="false"
  data-route-mode="boot"
  data-shell-state="booting"
>
  <!-- =========================================================
       ACCESSIBILITY · SKIP LINK
       Requiere soporte global para:
       - .sr-only
       - .sr-only-focusable
       - .app-skip-link
  ========================================================= -->
  <a
    class="sr-only sr-only-focusable app-skip-link"
    href="#main-content"
    data-skip-link="true"
  >
    Saltar al contenido principal
  </a>

  <!-- =========================================================
       BOOT LOADER ESTÁTICO
       - Visible desde refresh antes de JS.
       - Controlado después por src/app/loader.js / main.js.
       - Sin inline script.
       - Sin inline style.
       - Logos dependientes de html[data-theme].
       - Accesible mediante role="status".
       - Ocultación esperada por JS:
         · remove html/body app-booting/app-loading
         · data-app-loading="false"
         · data-loader-visible="false"
         · data-loader-state="hidden"
         · aria-busy="false"
         · aria-hidden="true"
  ========================================================= -->
  <div
    id="app-loader"
    class="app-loader is-visible"
    data-app-loader="true"
    data-loader-visible="true"
    data-loader-state="booting"
    role="status"
    aria-live="polite"
    aria-busy="true"
    aria-hidden="false"
    aria-labelledby="app-loader-title"
    aria-describedby="app-loader-text app-loader-subtext"
  >
    <div
      class="app-loader__backdrop"
      data-loader-backdrop="true"
      aria-hidden="true"
    ></div>

    <div
      class="app-loader__card"
      data-loader-card="true"
    >
      <div
        class="app-loader__brand"
        data-loader-brand="true"
        aria-hidden="true"
      >
        <img
          class="app-loader__logo app-loader__logo--dark"
          src="/src/media/img/favicon_white.png?v=3"
          alt=""
          width="64"
          height="64"
          loading="eager"
          decoding="async"
          fetchpriority="high"
          draggable="false"
        >

        <img
          class="app-loader__logo app-loader__logo--light"
          src="/src/media/img/favicon_black.png?v=3"
          alt=""
          width="64"
          height="64"
          loading="eager"
          decoding="async"
          fetchpriority="low"
          draggable="false"
        >

        <div
          class="app-loader__logo-fallback"
          data-loader-logo-fallback="true"
          aria-hidden="true"
        >
          O
        </div>
      </div>

      <div class="app-loader__copy">
        <strong
          id="app-loader-title"
          class="app-loader__title"
        >
          Onion Support
        </strong>

        <span
          id="app-loader-text"
          class="app-loader__text"
        >
          Cargando sesión...
        </span>

        <small
          id="app-loader-subtext"
          class="app-loader__subtext"
        >
          Preparando panel seguro
        </small>
      </div>

      <div
        class="app-loader__bar"
        aria-hidden="true"
      >
        <span class="app-loader__bar-fill"></span>
      </div>
    </div>
  </div>

  <!-- =========================================================
       NOSCRIPT FALLBACK
       Si JS está desactivado, noscript.css debe:
       - ocultar el loader si procede
       - mostrar layout noscript usable
  ========================================================= -->
  <noscript>
    <div class="layout noscript-layout">
      <main
        class="main-content noscript-main"
        role="main"
        aria-label="Contenido principal"
      >
        <div id="noscript-content">
          <section class="noscript-box">
            <h1>JavaScript es necesario</h1>

            <p>
              Onion Support necesita JavaScript para cargar la navegación SPA,
              el panel, las vistas y la autenticación.
            </p>
          </section>
        </div>
      </main>
    </div>
  </noscript>

  <!-- =========================================================
       APP LAYOUT
       - Sidebar montado por JS.
       - Topbar montado por JS.
       - Tablehead dinámico preparado.
       - View root estable para Router.
       - Loader inicial ya existe y lo controla JS.
       - Shell no interactivo durante boot.
  ========================================================= -->
  <div
    id="app-shell"
    class="layout app-shell"
    data-app-shell="true"
    data-shell="booting"
    data-shell-interactive="false"
    data-route-mode="boot"
    aria-busy="true"
    aria-hidden="true"
  >
    <!-- =========================
         SIDEBAR MOUNT
    ========================= -->
    <div
      id="sidebar-mount"
      data-sidebar-mount="true"
      aria-hidden="true"
    ></div>

    <!-- =========================
         TOPBAR MOUNT
    ========================= -->
    <div
      id="topbar-mount"
      data-topbar-mount="true"
      aria-hidden="true"
    ></div>

    <!-- =========================
         MAIN CONTENT
    ========================= -->
    <main
      id="main-content"
      class="main-content"
      role="main"
      aria-label="Contenido principal"
      tabindex="-1"
      aria-busy="true"
      data-main-content="true"
      data-route-mode="boot"
    >
      <!-- =========================
           TABLEHEAD DYNAMIC SLOT
      ========================= -->
      <div
        id="table-head"
        class="table-head"
        data-tablehead="true"
        hidden
        aria-hidden="true"
      >
        <div
          id="tablehead-container"
          data-tablehead-container="true"
        ></div>
      </div>

      <!-- =========================
           VIEW ROOT
      ========================= -->
      <div
        id="app-content"
        data-app-content="true"
      >
        <div
          id="view-container"
          data-view-root="true"
          data-router-view="true"
          aria-busy="true"
        ></div>
      </div>
    </main>
  </div>

  <!-- =========================
       APP ENTRY
       CSP READY:
       - módulo externo
       - sin inline bootstrap
  ========================= -->
  <script
    type="module"
    src="/src/main.js"
  ></script>
</body>
</html>
