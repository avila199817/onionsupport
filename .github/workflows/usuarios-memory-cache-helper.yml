name: Usuarios Memory Cache Helper

on:
  push:
    branches:
      - refactor/usuarios-memory-cache-only

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'refactor(usuarios): mantener cache administrativo sólo en memoria') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: refactor/usuarios-memory-cache-only
          fetch-depth: 1
          persist-credentials: true

      - name: Remove persistent Usuarios cache
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/views/usuarios/usuarios.api.js")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'PRODUCTIVO · BACKEND CONTRACT REAL · HTTP ÚNICO · V4',
              'PRODUCTIVO · BACKEND CONTRACT REAL · HTTP ÚNICO · V5',
              1,
          )
          text = text.replace(
              '  "usuarios.api.backend-contract.v4.canonical-user-state";',
              '  "usuarios.api.backend-contract.v5.memory-only-cache";',
              1,
          )

          for snippet in (
              'export const USUARIOS_CACHE_KEY =\n  "onion.support.usuarios.cache.v4";\n\n',
              'const CACHE_SCHEMA_VERSION = 4;\n\n',
          ):
              if text.count(snippet) != 1:
                  raise SystemExit(f"cache constant mismatch: {snippet!r}")
              text = text.replace(snippet, "")

          cache_start = '/* =========================================================\n   CACHE\n========================================================= */\n'
          state_start = '/* =========================================================\n   STATE / STORE\n========================================================= */\n'
          if text.count(cache_start) != 1 or text.count(state_start) != 1:
              raise SystemExit("Usuarios cache section boundaries not unique")
          before, rest = text.split(cache_start, 1)
          _, after = rest.split(state_start, 1)
          memory_section = '''/* =========================================================\n   MEMORY CACHE\n========================================================= */\n\n/*\n  Usuarios contiene datos administrativos (email, teléfono, dirección,\n  permisos y seguridad). El cache vive sólo en memoria del módulo: navegar\n  por la SPA sigue siendo instantáneo, pero un hard refresh no deja un\n  directorio de usuarios persistido en el dispositivo.\n\n  Se conserva el nombre interno por compatibilidad del controlador; ya no\n  hidrata ni escribe almacenamiento del navegador.\n*/\nfunction hydrateStateFromCache() {\n  return Boolean(\n    usuariosState.loaded ||\n    usuariosState.items.length\n  );\n}\n\n'''
          text = before + memory_section + state_start + after

          text, count = re.subn(
              r'''function syncUsuariosCollection\(\{\n  items = \[\],\n  remoteCount = null,\n  lastSyncAt = Date\.now\(\),\n  writeCache = true,\n\} = \{\}\) \{''',
              '''function syncUsuariosCollection({\n  items = [],\n  remoteCount = null,\n  lastSyncAt = Date.now(),\n} = {}) {''',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("syncUsuariosCollection signature mismatch")

          old = '''  if (writeCache) {\n    writeCachePayload();\n  }\n\n  return list;'''
          if text.count(old) != 1:
              raise SystemExit("syncUsuariosCollection write mismatch")
          text = text.replace(old, '  return list;', 1)

          if text.count('  writeCachePayload();\n\n  return normalized;') != 1:
              raise SystemExit("syncUsuarioDetail write mismatch")
          text = text.replace(
              '  writeCachePayload();\n\n  return normalized;',
              '  return normalized;',
              1,
          )

          text = text.replace(
              '''export function hydrateFromCache({\n  freshOnly = true,\n} = {}) {\n  hydrateStateFromCache({\n    freshOnly,\n  });''',
              '''export function hydrateFromCache() {\n  hydrateStateFromCache();''',
              1,
          )
          text = text.replace(
              '''  hydrateStateFromCache({\n    freshOnly: true,\n  });\n\n  const existingInflight =''',
              '''  hydrateStateFromCache();\n\n  const existingInflight =''',
              1,
          )

          text = re.sub(
              r'''\n    cacheKey:\n      USUARIOS_CACHE_KEY,\n\n    cacheSchema:\n      CACHE_SCHEMA_VERSION,''',
              '',
              text,
              count=1,
          )

          text = text.replace(
              '   - No persistir activationUrl, tokens, secretos ni SAS.\n   - No persistir blob: URLs temporales.\n',
              '   - Sin persistencia browser del directorio administrativo.\n   - No persistir activationUrl, tokens, secretos, SAS ni blob: URLs.\n',
              1,
          )

          path.write_text(text, encoding="utf-8")

          final = path.read_text(encoding="utf-8")
          forbidden = [
              "localStorage",
              "USUARIOS_CACHE_KEY",
              "CACHE_SCHEMA_VERSION",
              "writeCachePayload",
              "toCacheUsuario",
              "avatarUrlForCache",
          ]
          for token in forbidden:
              if token in final:
                  raise SystemExit(f"Usuarios persistent cache residue: {token}")
          PY

          node --check src/views/usuarios/usuarios.api.js
          python3 .github/scripts/repo_integrity.py
          git diff --check

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add src/views/usuarios/usuarios.api.js
          git commit -m "refactor(usuarios): mantener cache administrativo sólo en memoria"
          git push origin HEAD:refactor/usuarios-memory-cache-only
