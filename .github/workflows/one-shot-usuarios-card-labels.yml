name: One-shot usuarios card labels

on:
  push:
    branches:
      - fix/usuarios-card-labels

permissions:
  contents: write

concurrency:
  group: one-shot-usuarios-card-labels
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/usuarios-card-labels
          fetch-depth: 1
          persist-credentials: true

      - name: Use exact Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Apply exact Usuarios card label changes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const path = "src/views/usuarios/usuarios.template.js";
          let source = readFileSync(path, "utf8");
          const edits = [
            ['["all", "accent", "users", "Cargados", stats.total]', '["all", "accent", "users", "Usuarios", stats.total]'],
            ['["active", "success", "check", "Activos cargados", stats.active]', '["active", "success", "check", "Activos", stats.active]'],
            ['["pending", "warning", "clock", "Pendientes cargados", stats.pending]', '["pending", "warning", "clock", "Pendientes", stats.pending]'],
            ['["blocked", "danger", "lock", "Bloqueados cargados", stats.blocked]', '["blocked", "danger", "lock", "Bloqueados", stats.blocked]'],
          ];

          for (const [before, after] of edits) {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`Missing expected Usuarios card label: ${before}`);
            if (source.indexOf(before, first + before.length) >= 0) throw new Error(`Expected unique Usuarios card label: ${before}`);
            source = source.slice(0, first) + after + source.slice(first + before.length);
          }
          writeFileSync(path, source);
          NODE

          git diff --check
          ! grep -Eq '"Activos cargados"|"Pendientes cargados"|"Bloqueados cargados"' src/views/usuarios/usuarios.template.js
          grep -Fq '["all", "accent", "users", "Usuarios", stats.total]' src/views/usuarios/usuarios.template.js

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Usuarios scale contract
        run: python3 .github/scripts/usuarios_scale_contract.py

      - name: Commit candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/usuarios/usuarios.template.js
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes produced" >&2; exit 1; }
          git commit -m "fix(usuarios): simplify status card labels"

      - name: Verify production build envelope
        run: npm run build && npm run check:dist

      - name: Push verified change
        run: git push origin HEAD:fix/usuarios-card-labels
