name: One-shot native shell runtime patch

on:
  push:
    branches:
      - perf/native-shell-runtime-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          sidebar = "src/ui/sidebar/index.js"
          topbar = "src/ui/topbar/index.js"

          replace_once(
              sidebar,
              'export const SIDEBAR_VERSION =\n  "sidebar.controller.v4-canonical-media";',
              'export const SIDEBAR_VERSION =\n  "sidebar.controller.v5-native-runtime-state";',
          )
          replace_once(
              sidebar,
              '''function readCoreState() {
            try {
              if (
                isFunction(
                  AppCore?.getState
                )
              ) {
                return (
                  AppCore.getState() ||
                  {}
                );
              }
            } catch {
              // fallback abajo
            }
          
            return isObject(
              AppCore?.state
            )
              ? AppCore.state
              : {};
          }''',
              '''function readCoreState() {
            try {
              if (
                isFunction(
                  AppCore?.runtimeState?.read
                )
              ) {
                return (
                  AppCore.runtimeState.read() ||
                  {}
                );
              }
            } catch {
              // noop
            }
          
            return {};
          }''',
          )

          replace_once(
              topbar,
              'export const TOPBAR_VERSION =\n  "topbar.controller.backend-search.v7-canonical-routes";',
              'export const TOPBAR_VERSION =\n  "topbar.controller.backend-search.v8-native-runtime-state";',
          )
          replace_once(
              topbar,
              '''function getCoreState() {
            try {
              if (
                isFunction(
                  AppCore?.getState
                )
              ) {
                return (
                  AppCore.getState() ||
                  {}
                );
              }
            } catch {
              // fallback abajo
            }
          
            return (
              isObject(
                AppCore?.state
              )
                ? AppCore.state
                : {}
            );
          }''',
              '''function getCoreState() {
            try {
              if (
                isFunction(
                  AppCore?.runtimeState?.read
                )
              ) {
                return (
                  AppCore.runtimeState.read() ||
                  {}
                );
              }
            } catch {
              // noop
            }
          
            return {};
          }''',
          )

          contract = r'''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          
          const files = [
            {
              path: "src/ui/sidebar/index.js",
              version: "sidebar.controller.v5-native-runtime-state",
              reader: "readCoreState",
            },
            {
              path: "src/ui/topbar/index.js",
              version: "topbar.controller.backend-search.v8-native-runtime-state",
              reader: "getCoreState",
            },
          ];
          
          for (const file of files) {
            const source = await readFile(file.path, "utf8");
          
            assert.equal(
              source.includes(file.version),
              true,
              `${file.path} must expose the native runtime-state version`
            );
            assert.equal(
              source.includes("AppCore.runtimeState.read()"),
              true,
              `${file.path} must consume Core's zero-copy runtime read port`
            );
            assert.equal(
              source.includes("AppCore.getState()"),
              false,
              `${file.path} hot sync must not build a public Core snapshot`
            );
          
            const directStatePatterns = [
              /\bAppCore\s*\.\s*state\s*\.\s*[A-Za-z_$][\w$]*/,
              /\bAppCore\s*\.\s*state\s*\[/,
              /\bAppCore\s*\.\s*state\s*=/,
              /\bObject\s*\.\s*assign\s*\(\s*AppCore\s*\.\s*state\b/,
              /\bdelete\s+AppCore\s*\.\s*state\b/,
            ];
          
            for (const pattern of directStatePatterns) {
              assert.equal(
                pattern.test(source),
                false,
                `${file.path} must not depend on direct AppCore.state access: ${pattern}`
              );
            }
          
            const readerIndex = source.indexOf(`function ${file.reader}()`);
            assert.notEqual(readerIndex, -1, `${file.path} must keep its state reader`);
            const nextFunctionIndex = source.indexOf("\nfunction ", readerIndex + 10);
            const readerSource = source.slice(
              readerIndex,
              nextFunctionIndex === -1 ? source.length : nextFunctionIndex
            );
            assert.equal(
              readerSource.includes("runtimeState?.read"),
              true,
              `${file.path} state reader must feature-detect runtimeState.read`
            );
            assert.equal(
              readerSource.includes("return {};"),
              true,
              `${file.path} state reader must fail closed when the runtime port is unavailable`
            );
          }
          
          console.log(
            "Shell runtime contract OK · Sidebar/Topbar zero-copy Core reads · no public snapshots"
          );
          '''
          Path(".github/scripts/shell_runtime_contract.mjs").write_text(
              contract.replace("          ", ""),
              encoding="utf-8",
          )

          validate = Path(".github/ci/validate_spa_contracts.sh")
          text = validate.read_text(encoding="utf-8")
          needle = "node --experimental-default-type=module .github/scripts/router_runtime_contract.mjs\n"
          addition = needle + "node --experimental-default-type=module .github/scripts/shell_runtime_contract.mjs\n"
          if text.count(needle) != 1:
              raise SystemExit("validate_spa_contracts.sh: router contract anchor not unique")
          validate.write_text(text.replace(needle, addition, 1), encoding="utf-8")
          PY

          node --check src/ui/sidebar/index.js
          node --check src/ui/topbar/index.js
          node --check .github/scripts/shell_runtime_contract.mjs
          bash .github/ci/validate_spa_contracts.sh
          git diff --check

      - name: Commit patched shell
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-native-shell.yml
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git diff --cached --check
          git commit -m "Perf: move shell state reads to native runtime port"
          git push origin HEAD:perf/native-shell-runtime-state
