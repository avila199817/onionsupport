<!DOCTYPE html>
<html
  lang="es"
  data-app="onion"
  data-app-name="Onion Support"
  data-theme="dark"
  data-theme-mode="system"
  data-theme-source="initial"
  data-app-state="booting"
  data-app-loading="true"
  data-app-booting="true"
  data-app-ready="false"
  data-route-mode="boot"
  data-shell="visible"
  data-shell-state="booting"
  data-chrome="hidden"
  class="app-booting app-loading"
>
<head>
  <!-- =========================================================
       ONION SUPPORT — SPA ENTRY SHELL
       Archivo: /index.html

       Contrato:
       - Puerta física de entrada de la SPA.
       - Sin JS inline.
       - Sin CSS inline.
       - Sin llamadas API.
       - Sin lógica auth.
       - Sin lógica router.
       - Sin assets externos.
       - Tema inicial: /src/preboot/theme.js
       - CSS global: /src/css/app.css
       - JS entrypoint: /src/main.js
       - Vista SPA: #view-container
       - Sidebar: #sidebar-mount
       - Topbar: #topbar-mount
  ========================================================= -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <base href="/">

  <title>Onion Support</title>

  <meta
    name="application-name"
    content="Onion Support"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Onion Support"
  >

  <meta
    name="description"
    content="Onion Support · Panel privado SaaS de soporte, incidencias, facturación y gestión interna."
  >

  <meta
    name="robots"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="googlebot"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="bingbot"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <meta
    name="format-detection"
    content="telephone=no, date=no, address=no, email=no"
  >

  <meta
    name="color-scheme"
    content="dark light"
  >

  <meta
    name="theme-color"
    content="#0a0c11"
    data-onion-theme-color="true"
  >

  <meta
    name="msapplication-TileColor"
    content="#0a0c11"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <link
    rel="icon"
    href="/src/media/img/favicon_black_circle.png?v=5"
    type="image/png"
  >

  <link
    rel="shortcut icon"
    href="/src/media/img/favicon_black_circle.png?v=5"
    type="image/png"
  >

  <link
    rel="apple-touch-icon"
    href="/src/media/img/favicon_black_circle.png?v=5"
  >

  <link
    rel="manifest"
    href="/site.webmanifest?v=5"
  >

  <link
    rel="preload"
    href="/src/media/img/favicon_white.png?v=5"
    as="image"
    type="image/png"
    fetchpriority="high"
  >

  <link
    rel="preload"
    href="/src/media/img/favicon_black.png?v=5"
    as="image"
    type="image/png"
    fetchpriority="low"
  >

  <link
    rel="modulepreload"
    href="/src/main.js"
  >

  <!-- Tema inicial antes del CSS para evitar parpadeo. -->
  <script src="/src/preboot/theme.js"></script>

  <link
    rel="stylesheet"
    href="/src/css/app.css"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="/src/css/core/noscript.css"
    >
  </noscript>
</head>

<body
  class="app-booting app-loading"
  data-app="onion"
  data-app-name="Onion Support"
  data-density="default"
  data-app-loading="true"
  data-app-booting="true"
  data-app-ready="false"
  data-authenticated="false"
  data-route-mode="boot"
  data-shell="visible"
  data-shell-state="booting"
  data-chrome="hidden"
>
  <a
    class="sr-only sr-only-focusable app-skip-link"
    href="#main-content"
    data-skip-link="true"
  >
    Saltar al contenido principal
  </a>

  <div
    id="app-loader"
    class="app-loader is-visible"
    data-app-loader="true"
    data-loader-visible="true"
    data-loader-state="booting"
    role="status"
    aria-live="polite"
    aria-busy="true"
    aria-hidden="false"
    aria-labelledby="app-loader-title"
    aria-describedby="app-loader-text app-loader-subtext"
  >
    <div
      class="app-loader__backdrop"
      data-loader-backdrop="true"
      aria-hidden="true"
    ></div>

    <div
      class="app-loader__card"
      data-loader-card="true"
    >
      <div
        class="app-loader__brand"
        data-loader-brand="true"
        aria-hidden="true"
      >
        <img
          class="app-loader__logo app-loader__logo--dark"
          src="/src/media/img/favicon_white.png?v=5"
          alt=""
          width="64"
          height="64"
          loading="eager"
          decoding="async"
          fetchpriority="high"
          draggable="false"
          data-loader-logo-dark="true"
        >

        <img
          class="app-loader__logo app-loader__logo--light"
          src="/src/media/img/favicon_black.png?v=5"
          alt=""
          width="64"
          height="64"
          loading="eager"
          decoding="async"
          fetchpriority="low"
          draggable="false"
          data-loader-logo-light="true"
        >

        <div
          class="app-loader__logo-fallback"
          data-loader-logo-fallback="true"
          aria-hidden="true"
        >
          O
        </div>
      </div>

      <div
        class="app-loader__copy"
        data-loader-copy="true"
      >
        <strong
          id="app-loader-title"
          class="app-loader__title"
          data-loader-title="true"
        >
          Onion Support
        </strong>

        <span
          id="app-loader-text"
          class="app-loader__text"
          data-loader-text="true"
        >
          Cargando sesión...
        </span>

        <small
          id="app-loader-subtext"
          class="app-loader__subtext"
          data-loader-subtext="true"
        >
          Preparando panel seguro
        </small>
      </div>

      <div
        class="app-loader__bar"
        aria-hidden="true"
        data-loader-bar="true"
      >
        <span class="app-loader__bar-fill"></span>
      </div>
    </div>
  </div>

  <noscript>
    <div
      id="noscript-root"
      class="layout noscript-layout"
      data-noscript-root="true"
    >
      <main
        class="main-content noscript-main"
        role="main"
        aria-label="Contenido principal"
      >
        <div id="noscript-content">
          <section class="noscript-box">
            <h1>JavaScript es necesario</h1>

            <p>
              Onion Support necesita JavaScript para cargar la navegación SPA,
              el panel, las vistas y la autenticación.
            </p>
          </section>
        </div>
      </main>
    </div>
  </noscript>

  <div
    id="app-shell"
    class="layout app-shell"
    data-app-shell="true"
    data-shell="visible"
    data-shell-state="booting"
    data-shell-interactive="false"
    data-chrome="hidden"
    data-route-mode="boot"
    aria-busy="true"
    aria-hidden="true"
  >
    <div
      id="sidebar-mount"
      data-sidebar-mount="true"
      data-shell="visible"
      data-shell-state="booting"
      data-chrome="hidden"
      data-route-mode="boot"
      hidden
      aria-hidden="true"
    ></div>

    <div
      id="topbar-mount"
      data-topbar-mount="true"
      data-shell="visible"
      data-shell-state="booting"
      data-chrome="hidden"
      data-route-mode="boot"
      hidden
      aria-hidden="true"
    ></div>

    <main
      id="main-content"
      class="main-content"
      role="main"
      aria-label="Contenido principal"
      tabindex="-1"
      aria-busy="true"
      aria-hidden="false"
      data-main-content="true"
      data-shell="visible"
      data-shell-state="booting"
      data-chrome="hidden"
      data-route-mode="boot"
    >
      <div
        id="table-head"
        class="table-head"
        data-tablehead="true"
        data-shell="visible"
        data-shell-state="booting"
        data-chrome="hidden"
        data-route-mode="boot"
        hidden
        aria-hidden="true"
      >
        <div
          id="tablehead-container"
          data-tablehead-container="true"
        ></div>
      </div>

      <div
        id="app-content"
        data-app-content="true"
        data-shell="visible"
        data-shell-state="booting"
        data-route-mode="boot"
        aria-busy="true"
      >
        <div
          id="view-container"
          data-view-root="true"
          data-router-view="true"
          data-view-container="true"
          data-shell="visible"
          data-shell-state="booting"
          data-route-mode="boot"
          tabindex="-1"
          aria-busy="true"
          aria-hidden="false"
        ></div>
      </div>
    </main>
  </div>

  <script
    type="module"
    src="/src/main.js"
  ></script>
</body>
</html>
