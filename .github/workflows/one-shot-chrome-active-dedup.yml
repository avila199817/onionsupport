name: One-shot chrome active-menu dedup patch

on:
  push:
    branches:
      - perf/chrome-active-dedup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          router_path = Path("src/router/index.js")
          router = router_path.read_text(encoding="utf-8")

          old_version = 'export const ROUTER_VERSION =\n  "router.minimal.v13-single-route-resolution";'
          new_version = 'export const ROUTER_VERSION =\n  "router.minimal.v14-chrome-active-dedup";'
          if router.count(old_version) != 1:
              raise SystemExit("Router version anchor is not unique")
          router = router.replace(old_version, new_version, 1)

          chrome_start = router.find("    const chromeStartedAt =\n")
          chrome_end = router.find("    recordTransitionPhase(\n      transition,\n      route,\n      \"chrome\",", chrome_start)
          if chrome_start < 0 or chrome_end <= chrome_start:
              raise SystemExit("Could not isolate successful chrome phase")
          chrome = router[chrome_start:chrome_end]
          sync_index = chrome.find("    syncChrome(\n")
          active_start = chrome.find("    setActiveMenu(\n", sync_index)
          if sync_index < 0 or active_start < 0:
              raise SystemExit("Could not find post-sync active-menu call")
          next_call = chrome.find("    recordTransitionPhase(\n", active_start)
          if next_call != -1:
              raise SystemExit("Unexpected phase recorder inside isolated pre-record chrome slice")
          # The isolated slice ends immediately before recordTransitionPhase, so remove
          # from the post-sync setActiveMenu call to the end of the slice.
          chrome = chrome[:active_start]
          router = router[:chrome_start] + chrome + router[chrome_end:]

          policy_anchor = "        singleRouteResolutionPerTransition:\n          true,\n"
          policy_replacement = policy_anchor + "\n        postCommitActiveMenuDedup:\n          true,\n"
          if router.count(policy_anchor) != 1:
              raise SystemExit("Router policy anchor is not unique")
          router = router.replace(policy_anchor, policy_replacement, 1)
          router_path.write_text(router, encoding="utf-8")

          contract_path = Path(".github/scripts/router_runtime_contract.mjs")
          contract = contract_path.read_text(encoding="utf-8")
          old_contract_version = '  "router.minimal.v13-single-route-resolution"'
          if contract.count(old_contract_version) != 1:
              raise SystemExit("Router contract version anchor is not unique")
          contract = contract.replace(
              old_contract_version,
              '  "router.minimal.v14-chrome-active-dedup"',
              1,
          )

          policy_assert = "assert.equal(snapshot.policy.singleRouteResolutionPerTransition, true);\n"
          if contract.count(policy_assert) != 1:
              raise SystemExit("Router contract policy anchor is not unique")
          contract = contract.replace(
              policy_assert,
              policy_assert + "assert.equal(snapshot.policy.postCommitActiveMenuDedup, true);\n",
              1,
          )

          phase_anchor = 'const phaseCallStart = source.indexOf("module.recordRoutePhase({");\n'
          if contract.count(phase_anchor) != 1:
              raise SystemExit("Router phase contract anchor is not unique")
          dedup_contract = '''const chromePhaseStart = source.indexOf("const chromeStartedAt =");
          const chromePhaseEnd = source.indexOf(
            'recordTransitionPhase(\\n      transition,\\n      route,\\n      "chrome"',
            chromePhaseStart
          );
          assert.ok(
            chromePhaseStart >= 0 && chromePhaseEnd > chromePhaseStart,
            "Router contract must isolate the successful post-commit chrome phase"
          );
          const chromePhaseSource = source.slice(chromePhaseStart, chromePhaseEnd);
          assert.equal(
            chromePhaseSource.includes("syncChrome("),
            true,
            "successful commit must still sync Sidebar/Topbar"
          );
          assert.equal(
            chromePhaseSource.includes("setActiveMenu("),
            false,
            "Router must not re-walk active menu after Sidebar sync"
          );
          
          '''.replace("          ", "")
          contract = contract.replace(phase_anchor, dedup_contract + phase_anchor, 1)
          contract_path.write_text(contract, encoding="utf-8")
          PY

          node --check src/router/index.js
          node --check .github/scripts/router_runtime_contract.mjs
          bash .github/ci/validate_spa_contracts.sh
          git diff --check

      - name: Commit patched Router
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-chrome-active-dedup.yml
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git diff --cached --check
          git commit -m "Perf: dedupe post-commit active menu sync"
          git push origin HEAD:perf/chrome-active-dedup
