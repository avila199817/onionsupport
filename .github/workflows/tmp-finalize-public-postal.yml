name: Temporary public postal finalizer

on:
  push:
    branches:
      - fix/public-postal-autocomplete-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/public-postal-autocomplete-final
          fetch-depth: 1

      - name: Build local INE postal index and patch canonical intake
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv
          import io
          import json
          import urllib.request

          ROOT = Path('.')
          INTAKE = ROOT / 'src/features/public-support/index.js'
          INTEGRITY = ROOT / '.github/scripts/public_home_integrity.py'
          DOCS = ROOT / 'docs/PUBLIC_TICKET_INTAKE.md'
          DATA = ROOT / 'src/data/es-postal-municipalities.2026-01.json'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, got {count}')
              return text.replace(old, new, 1)

          province_names = {
              '01': 'Álava', '02': 'Albacete', '03': 'Alicante', '04': 'Almería',
              '05': 'Ávila', '06': 'Badajoz', '07': 'Illes Balears', '08': 'Barcelona',
              '09': 'Burgos', '10': 'Cáceres', '11': 'Cádiz', '12': 'Castellón',
              '13': 'Ciudad Real', '14': 'Córdoba', '15': 'A Coruña', '16': 'Cuenca',
              '17': 'Girona', '18': 'Granada', '19': 'Guadalajara', '20': 'Gipuzkoa',
              '21': 'Huelva', '22': 'Huesca', '23': 'Jaén', '24': 'León',
              '25': 'Lleida', '26': 'La Rioja', '27': 'Lugo', '28': 'Madrid',
              '29': 'Málaga', '30': 'Murcia', '31': 'Navarra', '32': 'Ourense',
              '33': 'Asturias', '34': 'Palencia', '35': 'Las Palmas',
              '36': 'Pontevedra', '37': 'Salamanca', '38': 'Santa Cruz de Tenerife',
              '39': 'Cantabria', '40': 'Segovia', '41': 'Sevilla', '42': 'Soria',
              '43': 'Tarragona', '44': 'Teruel', '45': 'Toledo', '46': 'Valencia',
              '47': 'Valladolid', '48': 'Bizkaia', '49': 'Zamora', '50': 'Zaragoza',
              '51': 'Ceuta', '52': 'Melilla',
          }

          # Build a deterministic, same-origin lookup from the pinned INE-derived edition.
          upstream = (
              'https://raw.githubusercontent.com/regi-es/'
              'ds-codigos-postales-ine-es/2026-01/data/codigos_postales_municipios.csv'
          )
          request = urllib.request.Request(upstream, headers={'User-Agent': 'OnionSupport-CI/1.0'})
          with urllib.request.urlopen(request, timeout=60) as response:
              csv_text = response.read().decode('utf-8-sig')

          postal = {}
          for row in csv.DictReader(io.StringIO(csv_text)):
              cp = str(row.get('codigo_postal') or '').strip()
              municipality_id = str(row.get('municipio_id') or '').strip()
              city = str(row.get('municipio_nombre') or '').strip()
              province = province_names.get(municipality_id[:2], '')
              if len(cp) != 5 or not cp.isdigit() or not city or not province:
                  continue
              item = {'city': city, 'province': province}
              bucket = postal.setdefault(cp, [])
              if item not in bucket:
                  bucket.append(item)

          for cp in postal:
              postal[cp].sort(key=lambda item: (item['city'].casefold(), item['province'].casefold()))

          if len(postal) < 10000:
              raise SystemExit(f'postal dataset unexpectedly small: {len(postal)}')
          sample = postal.get('08130') or []
          if not any(item == {'city': 'Santa Perpètua de Mogoda', 'province': 'Barcelona'} for item in sample):
              raise SystemExit(f'08130 sample mismatch: {sample!r}')

          DATA.parent.mkdir(parents=True, exist_ok=True)
          DATA.write_text(
              json.dumps(
                  {
                      'version': 'INE-2026-01',
                      'source': 'Fuente: sitio web del INE: www.ine.es',
                      'upstream': 'regi-es/ds-codigos-postales-ine-es@2026-01',
                      'postalCodes': dict(sorted(postal.items())),
                  },
                  ensure_ascii=False,
                  separators=(',', ':'),
              ) + '\n',
              encoding='utf-8',
          )

          s = INTAKE.read_text(encoding='utf-8')
          s = replace_once(
              s,
              '  "public-support.intake.v9-structured-address";',
              '  "public-support.intake.v10-postal-autofill";',
              'version',
          )

          constants_old = '''const SPAIN_PREFIX = "+34";\nconst ACTIVE_TICKET_ERROR_CODES = new Set(['''
          constants_new = '''const SPAIN_PREFIX = "+34";\nconst POSTAL_DATA_URL = "/src/data/es-postal-municipalities.2026-01.json";\nconst POSTAL_CITY_LIST_ID = "public-support-city-options";\nconst POSTAL_PROVINCES = Object.freeze({\n  "01": "Álava", "02": "Albacete", "03": "Alicante", "04": "Almería",\n  "05": "Ávila", "06": "Badajoz", "07": "Illes Balears", "08": "Barcelona",\n  "09": "Burgos", "10": "Cáceres", "11": "Cádiz", "12": "Castellón",\n  "13": "Ciudad Real", "14": "Córdoba", "15": "A Coruña", "16": "Cuenca",\n  "17": "Girona", "18": "Granada", "19": "Guadalajara", "20": "Gipuzkoa",\n  "21": "Huelva", "22": "Huesca", "23": "Jaén", "24": "León",\n  "25": "Lleida", "26": "La Rioja", "27": "Lugo", "28": "Madrid",\n  "29": "Málaga", "30": "Murcia", "31": "Navarra", "32": "Ourense",\n  "33": "Asturias", "34": "Palencia", "35": "Las Palmas", "36": "Pontevedra",\n  "37": "Salamanca", "38": "Santa Cruz de Tenerife", "39": "Cantabria",\n  "40": "Segovia", "41": "Sevilla", "42": "Soria", "43": "Tarragona",\n  "44": "Teruel", "45": "Toledo", "46": "Valencia", "47": "Valladolid",\n  "48": "Bizkaia", "49": "Zamora", "50": "Zaragoza", "51": "Ceuta", "52": "Melilla",\n});\nconst ACTIVE_TICKET_ERROR_CODES = new Set(['''
          s = replace_once(s, constants_old, constants_new, 'postal constants')

          state_old = '''let observer = null;\nlet scanFrame = 0;\nlet mountRoot = null;\nlet installed = false;\nlet destroyed = false;'''
          state_new = '''let observer = null;\nlet scanFrame = 0;\nlet mountRoot = null;\nlet installed = false;\nlet destroyed = false;\nlet postalDataPromise = null;\nconst postalMatches = new WeakMap();'''
          s = replace_once(s, state_old, state_new, 'postal state')

          form_old = '''          ${field("postalCode", "Código postal", "text", "08001", "postal-code", 5, "numeric")}\n          ${field("city", "Ciudad", "text", "Barcelona", "address-level2", 90)}\n          ${field("province", "Provincia", "text", "Barcelona", "address-level1", 90)}\n          ${field("country", "País", "text", "España", "country-name", 90, "", "España", { readonly: true })}'''
          form_new = '''          ${field("postalCode", "Código postal", "text", "08001", "postal-code", 5, "numeric")}\n          ${field("city", "Ciudad", "text", "Barcelona", "address-level2", 90, "", "", { list: POSTAL_CITY_LIST_ID })}\n          <datalist id="${POSTAL_CITY_LIST_ID}"></datalist>\n          ${field("province", "Provincia", "text", "Barcelona", "address-level1", 90)}'''
          s = replace_once(s, form_old, form_new, 'country removal / city datalist')

          field_old = '''  const required = options?.required === false ? "" : " required";\n  const readonly = options?.readonly === true ? ` readonly aria-readonly="true"` : "";\n  const phoneAttrs = name === "phone"'''
          field_new = '''  const required = options?.required === false ? "" : " required";\n  const readonly = options?.readonly === true ? ` readonly aria-readonly="true"` : "";\n  const list = text(options?.list) ? ` list="${text(options.list)}"` : "";\n  const phoneAttrs = name === "phone"'''
          s = replace_once(s, field_old, field_new, 'field list option')
          s = replace_once(
              s,
              'type="${type}"${mode}${initialValue}${phoneAttrs}${readonly}\\n      autocomplete=',
              'type="${type}"${mode}${initialValue}${phoneAttrs}${readonly}${list}\\n      autocomplete=',
              'field list attribute',
          )

          postal_functions_anchor = '''function normalizeSpanishPhone(value = "") {\n  const national = nationalSpanishDigits(value);\n  if (!/^[6789]\\d{8}$/.test(national)) return "";\n\n  return `${SPAIN_PREFIX} ${national.slice(0, 3)} ${national.slice(3, 6)} ${national.slice(6, 9)}`;\n}\n\nfunction prefill(root) {'''
          postal_functions_new = '''function normalizeSpanishPhone(value = "") {\n  const national = nationalSpanishDigits(value);\n  if (!/^[6789]\\d{8}$/.test(national)) return "";\n\n  return `${SPAIN_PREFIX} ${national.slice(0, 3)} ${national.slice(3, 6)} ${national.slice(6, 9)}`;\n}\n\nfunction normalizePostalCode(value = "") {\n  return String(value ?? "").replace(/\\D/g, "").slice(0, 5);\n}\n\nfunction normalizePlaceName(value = "") {\n  return text(value)\n    .toLocaleLowerCase("es-ES")\n    .normalize("NFD")\n    .replace(/[\\u0300-\\u036f]/g, "");\n}\n\nfunction provinceFromPostalPrefix(postalCode = "") {\n  const code = normalizePostalCode(postalCode);\n  return code.length >= 2 ? POSTAL_PROVINCES[code.slice(0, 2)] || "" : "";\n}\n\nfunction postalDatalist(form) {\n  return form?.querySelector?.(`#${POSTAL_CITY_LIST_ID}`) || null;\n}\n\nfunction clearPostalMarkers(input) {\n  if (!input?.dataset) return false;\n  delete input.dataset.publicSupportPostalAutofill;\n  delete input.dataset.publicSupportPostalCode;\n  return true;\n}\n\nfunction clearStalePostalAutofill(input, postalCode) {\n  if (!input || input.dataset.publicSupportPostalAutofill !== "true") return false;\n  if (input.dataset.publicSupportPostalCode === postalCode) return false;\n  input.value = "";\n  clearPostalMarkers(input);\n  return true;\n}\n\nfunction setPostalAutofill(input, value, postalCode) {\n  const clean = text(value);\n  if (!input || !clean) return false;\n\n  const canWrite =\n    !text(input.value) || input.dataset.publicSupportPostalAutofill === "true";\n  if (!canWrite) return false;\n\n  input.value = clean;\n  input.dataset.publicSupportPostalAutofill = "true";\n  input.dataset.publicSupportPostalCode = postalCode;\n  return true;\n}\n\nfunction updatePostalDatalist(form, matches = []) {\n  const list = postalDatalist(form);\n  if (!list) return false;\n\n  const fragment = document.createDocumentFragment();\n  const seen = new Set();\n  for (const match of matches) {\n    const city = text(match?.city);\n    if (!city || seen.has(city)) continue;\n    seen.add(city);\n    const option = document.createElement("option");\n    option.value = city;\n    fragment.appendChild(option);\n  }\n  list.replaceChildren(fragment);\n  return true;\n}\n\nasync function loadPostalData() {\n  if (!postalDataPromise) {\n    postalDataPromise = fetch(POSTAL_DATA_URL, {\n      credentials: "same-origin",\n      cache: "force-cache",\n    })\n      .then((response) => {\n        if (!response.ok) throw new Error(`postal-index-${response.status}`);\n        return response.json();\n      })\n      .then((data) => object(data?.postalCodes) ? data : null)\n      .catch(() => null);\n  }\n\n  return postalDataPromise;\n}\n\nfunction syncProvinceFromCity(form) {\n  const cityInput = form?.elements?.namedItem?.("city");\n  const provinceInput = form?.elements?.namedItem?.("province");\n  const postalInput = form?.elements?.namedItem?.("postalCode");\n  if (!cityInput || !provinceInput || !postalInput) return false;\n\n  const matches = postalMatches.get(form) || [];\n  const wanted = normalizePlaceName(cityInput.value);\n  if (!wanted) return false;\n\n  const match = matches.find((item) => normalizePlaceName(item?.city) === wanted);\n  if (!match) return false;\n\n  return setPostalAutofill(\n    provinceInput,\n    match.province,\n    normalizePostalCode(postalInput.value)\n  );\n}\n\nasync function syncPostalAddress(form) {\n  const postalInput = form?.elements?.namedItem?.("postalCode");\n  const cityInput = form?.elements?.namedItem?.("city");\n  const provinceInput = form?.elements?.namedItem?.("province");\n  if (!postalInput || !cityInput || !provinceInput) return false;\n\n  const postalCode = normalizePostalCode(postalInput.value);\n  if (postalInput.value !== postalCode) postalInput.value = postalCode;\n\n  clearStalePostalAutofill(cityInput, postalCode);\n  clearStalePostalAutofill(provinceInput, postalCode);\n\n  const prefixProvince = provinceFromPostalPrefix(postalCode);\n  if (prefixProvince) setPostalAutofill(provinceInput, prefixProvince, postalCode);\n\n  if (postalCode.length !== 5) {\n    postalMatches.delete(form);\n    updatePostalDatalist(form);\n    return false;\n  }\n\n  const data = await loadPostalData();\n  if (normalizePostalCode(postalInput.value) !== postalCode) return false;\n\n  const rawMatches = data?.postalCodes?.[postalCode];\n  const matches = Array.isArray(rawMatches)\n    ? rawMatches.filter((item) => text(item?.city) && text(item?.province))\n    : [];\n\n  postalMatches.set(form, matches);\n  updatePostalDatalist(form, matches);\n  if (!matches.length) return false;\n\n  const provinces = [...new Set(matches.map((item) => text(item.province)).filter(Boolean))];\n  if (provinces.length === 1) {\n    setPostalAutofill(provinceInput, provinces[0], postalCode);\n  }\n\n  if (matches.length === 1) {\n    setPostalAutofill(cityInput, matches[0].city, postalCode);\n    setPostalAutofill(provinceInput, matches[0].province, postalCode);\n    return true;\n  }\n\n  syncProvinceFromCity(form);\n  return true;\n}\n\nfunction prefill(root) {'''
          s = replace_once(s, postal_functions_anchor, postal_functions_new, 'postal functions')

          country_rule = '''    country: (v) => {\n      const normalized = text(v).toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g, "");\n      return ["espana", "es", "spain"].includes(normalized) ? "" : "Este formulario solo admite direcciones de España.";\n    },\n'''
          if s.count(country_rule) != 1:
              raise SystemExit(f'country validation: expected 1 occurrence, got {s.count(country_rule)}')
          s = s.replace(country_rule, '', 1)

          on_input_old = '''function onInput(event) {\n  const input = event.target;\n  const form = input?.closest?.(FORM);\n  if (!form || !input?.name) return;\n\n  if (input.name !== "website") {\n    clearIdempotency(form);\n    setFieldError(form, input, "");\n    syncSubmitState(form);\n\n    if (!showSubmissionLock(form)) status(form);\n  }\n\n  if (input.name === "description") {\n    const counter = form.querySelector("[data-public-support-counter]");\n    if (counter) counter.textContent = `${String(input.value || "").length} / 4000`;\n  }\n}'''
          on_input_new = '''function onInput(event) {\n  const input = event.target;\n  const form = input?.closest?.(FORM);\n  if (!form || !input?.name) return;\n\n  if (input.name === "postalCode") {\n    input.value = normalizePostalCode(input.value);\n    void syncPostalAddress(form);\n  } else if (input.name === "city") {\n    clearPostalMarkers(input);\n    syncProvinceFromCity(form);\n  } else if (input.name === "province") {\n    clearPostalMarkers(input);\n  }\n\n  if (input.name !== "website") {\n    clearIdempotency(form);\n    setFieldError(form, input, "");\n    syncSubmitState(form);\n\n    if (!showSubmissionLock(form)) status(form);\n  }\n\n  if (input.name === "description") {\n    const counter = form.querySelector("[data-public-support-counter]");\n    if (counter) counter.textContent = `${String(input.value || "").length} / 4000`;\n  }\n}'''
          s = replace_once(s, on_input_old, on_input_new, 'onInput')

          INTAKE.write_text(s, encoding='utf-8')

          d = DOCS.read_text(encoding='utf-8')
          docs_anchor = '''La dirección de un alta nueva viaja estructurada: `address` es calle/número y se complementa con `addressLine2`, `postalCode`, `city`, `province` y `country`. `addressLine2` es opcional; CP, ciudad, provincia y país se validan de nuevo en backend. Para usuarios existentes estos campos nunca sobrescriben el perfil canónico.\n'''
          docs_new = docs_anchor + '''\nEn la UI pública no se muestra País porque el intake solo admite España; el payload sigue enviando `country: "España"`. Al completar un CP de 5 dígitos, la home consulta **únicamente un índice estático same-origin** incluido en la propia release para sugerir/autocompletar municipio y provincia. Si un CP corresponde a varios municipios, no se elige uno arbitrariamente: Ciudad conserva edición manual y ofrece las localidades válidas. El índice está fijado a la edición `2026-01` de `regi-es/ds-codigos-postales-ine-es`, elaborada con datos abiertos del INE. Fuente: sitio web del INE: www.ine.es.\n'''
          d = replace_once(d, docs_anchor, docs_new, 'docs postal behavior')
          DOCS.write_text(d, encoding='utf-8')

          i = INTEGRITY.read_text(encoding='utf-8')
          i = replace_once(i, 'import re\nimport sys\n', 'import json\nimport re\nimport sys\n', 'integrity json import')
          i = replace_once(
              i,
              '    "src/features/public-support/index.js",\n',
              '    "src/features/public-support/index.js",\n    "src/data/es-postal-municipalities.2026-01.json",\n',
              'integrity required postal data',
          )
          i = replace_once(
              i,
              "        ('public-support.intake.v9-structured-address', \"Falta versión final del contrato público\"),",
              "        ('public-support.intake.v10-postal-autofill', \"Falta versión final del contrato público\"),",
              'integrity intake version',
          )
          snippet_anchor = '''        ('country: "España"', "Falta país canónico en payload"),\n        ('...addressParts(user)', "Falta prefill estructurado desde usuario existente"),'''
          snippet_new = '''        ('country: "España"', "Falta país canónico en payload"),\n        ('POSTAL_DATA_URL = "/src/data/es-postal-municipalities.2026-01.json"', "Falta índice postal local"),\n        ('fetch(POSTAL_DATA_URL', "El autocompletado postal debe ser same-origin y lazy"),\n        ('syncPostalAddress(form)', "Falta autocompletado de CP/municipio/provincia"),\n        ('POSTAL_CITY_LIST_ID', "Falta selector nativo para CP con varios municipios"),\n        ('...addressParts(user)', "Falta prefill estructurado desde usuario existente"),'''
          i = replace_once(i, snippet_anchor, snippet_new, 'integrity postal snippets')

          marker = '''    require(\n        errors,\n        "SPAIN_PHONE_DEFAULT" not in intake,'''
          postal_guard = '''    require(\n        errors,\n        'field("country"' not in intake,\n        "País no debe renderizarse como campo visible en el intake español",\n    )\n    require(\n        errors,\n        "raw.githubusercontent.com" not in intake\n        and "cdn.jsdelivr.net" not in intake\n        and "geonames.org" not in intake,\n        "El runtime público no puede depender de servicios postales externos",\n    )\n\n    postal_data = json.loads(read("src/data/es-postal-municipalities.2026-01.json"))\n    require(\n        errors,\n        postal_data.get("source") == "Fuente: sitio web del INE: www.ine.es",\n        "El índice postal debe conservar atribución al INE",\n    )\n    sample_08130 = postal_data.get("postalCodes", {}).get("08130", [])\n    require(\n        errors,\n        any(\n            item.get("city") == "Santa Perpètua de Mogoda"\n            and item.get("province") == "Barcelona"\n            for item in sample_08130\n        ),\n        "El índice postal no resuelve correctamente el CP 08130",\n    )\n\n'''
          i = replace_once(i, marker, postal_guard + marker, 'integrity postal guards')
          INTEGRITY.write_text(i, encoding='utf-8')

          print(f'POSTAL_CODES={len(postal)}')
          print(f'POSTAL_DATA_BYTES={DATA.stat().st_size}')
          print('PATCH_PUBLIC_POSTAL: PASS')
          PY

      - name: Validate final tree
        run: |
          set -euo pipefail
          node --check src/features/public-support/index.js
          node --check src/features/public-home-experience/index.js
          python3 -m json.tool src/data/es-postal-municipalities.2026-01.json >/dev/null
          python3 .github/scripts/public_home_integrity.py
          python3 .github/scripts/public_home_performance.py
          python3 .github/scripts/repo_integrity.py
          test ! -e src/features/public-support-structured/index.js
          grep -Fq 'public-support.intake.v10-postal-autofill' src/features/public-support/index.js
          grep -Fq 'country: "España"' src/features/public-support/index.js
          ! grep -Fq 'field("country"' src/features/public-support/index.js
          grep -Fq '"08130"' src/data/es-postal-municipalities.2026-01.json
          echo 'FINAL_TREE_VALIDATION: PASS'

      - name: Commit final tree and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'Onion Support CI'
          git config user.email 'ci@onionsupport.com'
          git rm .github/workflows/tmp-finalize-public-postal.yml
          git add src/features/public-support/index.js \
                  src/data/es-postal-municipalities.2026-01.json \
                  .github/scripts/public_home_integrity.py \
                  docs/PUBLIC_TICKET_INTAKE.md
          git diff --cached --check
          git commit -m 'fix: autocomplete Spanish postal address locally'
          git push origin HEAD:fix/public-postal-autocomplete-final
