name: Clientes Runtime Parity Bootstrap

on:
  push:
    branches:
      - fix/clientes-incidencias-runtime-parity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align Clientes mount with Incidencias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path("src/views/clientes/index.js")
          contract_path = Path(".github/scripts/clientes_scale_contract.py")

          index = index_path.read_text(encoding="utf-8")
          old = '''    attach();
              clearPageState();
              loading = true;
              renderNow();
              await requestPage({ append: false, silent: false });
              return snapshot();'''.replace("              ", "    ")
          new = '''    attach();
              clearPageState();

              // Incidencias pattern: paint immediately; network revalidation must not block route commit.
              void requestPage({ append: false, silent: false });
              return snapshot();'''.replace("              ", "    ")

          if new not in index:
              count = index.count(old)
              if count != 1:
                  raise SystemExit(f"CLIENTES_MOUNT_PATCH: expected 1 mount block, found {count}")
              index = index.replace(old, new, 1)
              index = index.replace(
                  '"clientes.index.cursor.v12.progressive-reconciliation";',
                  '"clientes.index.cursor.v13.nonblocking-mount";',
                  1,
              )
              index_path.write_text(index, encoding="utf-8")

          contract = contract_path.read_text(encoding="utf-8")
          marker = '''require(
              "visibleLimit" not in controller,
              "main Clientes controller must not simulate pagination with visibleLimit",
          )'''.replace("              ", "    ")
          addition = marker + '''
          require(
              "void requestPage({ append: false, silent: false });" in controller
              and "await requestPage({ append: false, silent: false });" not in controller,
              "Clientes route mount must paint immediately and never await first-page network I/O",
          )'''.replace("          ", "")
          if "Clientes route mount must paint immediately" not in contract:
              if contract.count(marker) != 1:
                  raise SystemExit("CLIENTES_CONTRACT_PATCH: mount marker not unique")
              contract = contract.replace(marker, addition, 1)
              contract_path.write_text(contract, encoding="utf-8")
          PY

      - name: Validate focused change
        shell: bash
        run: |
          node --check src/views/clientes/index.js
          python .github/scripts/clientes_scale_contract.py
          python .github/scripts/private_admin_alignment_contract.py
          python .github/scripts/repo_integrity.py
          node .github/scripts/continuous_scroll_smoke.mjs
          git diff --check

      - name: Commit focused change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Onion Support Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/clientes/index.js .github/scripts/clientes_scale_contract.py
          git commit -m "perf: make clientes route mount non-blocking"
          git push origin HEAD:fix/clientes-incidencias-runtime-parity
