name: TEMP Lean Public Graph Trigger

on:
  push:
    branches:
      - perf/public-home-fast-boot

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[lean-public-graph]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: perf/public-home-fast-boot
          fetch-depth: 1
          persist-credentials: true

      - name: Extract and run patch
        shell: bash
        run: |
          awk '
            /python - <<'"'"'PY'"'"'/ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/tmp-lean-public-graph.yml > /tmp/lean_patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/lean_patch.py')
          t = p.read_text(encoding='utf-8')
          start = t.find("anchor = '''function isFunction(value) {")
          end = t.find("helpers = anchor +", start)
          if start < 0 or end < 0:
              raise SystemExit('embedded isFunction anchor bounds not found')
          replacement = '''anchor = \'\'\'function isFunction(value) {\n  return (\n    typeof value === "function"\n  );\n}\n\'\'\'\n          '''
          p.write_text(t[:start] + replacement + t[end:], encoding='utf-8')
          PY
          python /tmp/lean_patch.py
          node --check src/app/index.js
          node --check src/router/index.js
          node --check src/main.js
          node --check src/preboot/public-home-preload.js
          git diff --check
          bash .github/ci/validate_spa_contracts.sh
          python .github/scripts/app_entrypoint_integrity.py
          python .github/scripts/boot_visual_integrity.py

      - name: Commit lean graph
        shell: bash
        run: |
          git config user.name "Onion Support CI"
          git config user.email "cristian@onionsupport.com"
          git add src/app/index.js src/router/index.js src/main.js index.html src/preboot/public-home-preload.js
          git commit -m "perf: adelgazar el grafo crítico de la home pública [lean-public-graph]"
          git push origin HEAD:perf/public-home-fast-boot
