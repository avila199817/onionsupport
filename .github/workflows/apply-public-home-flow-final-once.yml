name: Apply final public-home flow repair once

on:
  push:
    branches:
      - fix/public-home-flow-final

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/public-home-flow-final
          fetch-depth: 0
          persist-credentials: true

      - name: Integrate structured address and coalesce observers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for label, before, after in replacements:
                  count = s.count(before)
                  if count != 1:
                      raise SystemExit(f'{path}: {label}: expected 1 anchor, got {count}')
                  s = s.replace(before, after, 1)
              p.write_text(s, encoding='utf-8')

          patch('src/features/public-support/index.js', [
              ('version', '"public-support.intake.v8-existing-user-no-client";', '"public-support.intake.v9-structured-address";'),
              ('state', '''let observer = null;\nlet retryTimer = 0;\nlet mountRoot = null;\nlet installed = false;\nlet destroyed = false;''', '''let observer = null;\nlet scanFrame = 0;\nlet mountRoot = null;\nlet installed = false;\nlet destroyed = false;'''),
              ('address helper', '''function address(user) {\n  const value = first(user?.address, user?.direccion, user?.profile?.address, "");\n  if (typeof value === "string") return text(value);\n  if (!object(value)) return "";\n\n  return text([\n    first(value.street, value.line1, value.calle, ""),\n    first(value.number, value.numero, ""),\n    first(value.postalCode, value.zip, value.cp, ""),\n    first(value.city, value.locality, value.localidad, ""),\n    first(value.region, value.province, value.provincia, ""),\n  ].filter(Boolean).join(", "));\n}''', '''function addressParts(user) {\n  const value = first(user?.address, user?.direccion, user?.profile?.address, "");\n\n  if (typeof value === "string") {\n    return {\n      address: text(value),\n      addressLine2: "",\n      postalCode: text(first(user?.cp, user?.postalCode, "")),\n      city: text(first(user?.ciudad, user?.city, "")),\n      province: text(first(user?.provincia, user?.province, "")),\n      country: text(first(user?.pais, user?.country, "España"), "España"),\n    };\n  }\n\n  const current = object(value) || {};\n\n  return {\n    address: text(first(current.street, current.line1, current.calle, user?.calle, "")),\n    addressLine2: text(first(current.line2, current.linea2, user?.linea2, "")),\n    postalCode: text(first(current.postalCode, current.zip, current.cp, user?.postalCode, user?.cp, "")),\n    city: text(first(current.city, current.locality, current.localidad, current.ciudad, user?.city, user?.ciudad, "")),\n    province: text(first(current.region, current.province, current.provincia, user?.province, user?.provincia, "")),\n    country: text(first(current.country, current.pais, user?.country, user?.pais, "España"), "España"),\n  };\n}'''),
              ('form fields', '${field("address", "Dirección", "text", "Calle, número, localidad y CP", "street-address", 220)}', '''${field("address", "Calle y número", "text", "Calle y número", "address-line1", 180)}\n          ${field("addressLine2", "Piso / puerta", "text", "Piso, puerta, escalera (opcional)", "address-line2", 120, "", "", { required: false })}\n          ${field("postalCode", "Código postal", "text", "08001", "postal-code", 5, "numeric")}\n          ${field("city", "Ciudad", "text", "Barcelona", "address-level2", 90)}\n          ${field("province", "Provincia", "text", "Barcelona", "address-level1", 90)}\n          ${field("country", "País", "text", "España", "country-name", 90, "", "España", { readonly: true })}'''),
              ('field helper', '''function field(name, label, type, placeholder, autocomplete, maxlength, inputmode = "", value = "") {\n  const mode = inputmode ? ` inputmode="${inputmode}"` : "";\n  const initialValue = value ? ` value="${value}"` : "";\n  const phoneAttrs = name === "phone"\n    ? ` aria-label="Teléfono de España"`\n    : "";\n\n  return `<div class="public-support-field">\n    <label for="public-support-${name}">${label}</label>\n    <input id="public-support-${name}" name="${name}" type="${type}"${mode}${initialValue}${phoneAttrs}\n      autocomplete="${autocomplete}" maxlength="${maxlength}" required placeholder="${placeholder}">\n    ${errorNode(name)}\n  </div>`;\n}''', '''function field(\n  name,\n  label,\n  type,\n  placeholder,\n  autocomplete,\n  maxlength,\n  inputmode = "",\n  value = "",\n  options = {}\n) {\n  const mode = inputmode ? ` inputmode="${inputmode}"` : "";\n  const initialValue = value ? ` value="${value}"` : "";\n  const required = options?.required === false ? "" : " required";\n  const readonly = options?.readonly === true ? ` readonly aria-readonly="true"` : "";\n  const phoneAttrs = name === "phone"\n    ? ` aria-label="Teléfono de España"`\n    : "";\n\n  return `<div class="public-support-field">\n    <label for="public-support-${name}">${label}</label>\n    <input id="public-support-${name}" name="${name}" type="${type}"${mode}${initialValue}${phoneAttrs}${readonly}\n      autocomplete="${autocomplete}" maxlength="${maxlength}"${required} placeholder="${placeholder}">\n    ${errorNode(name)}\n  </div>`;\n}'''),
              ('prefill', '''  const values = {\n    email: email(user),\n    address: address(user),\n  };''', '''  const values = {\n    email: email(user),\n    ...addressParts(user),\n  };'''),
              ('validation', '''    address: (v) => v.length >= 8 ? "" : "Introduce una dirección completa.",\n    subject: (v) => v.length >= 4 ? "" : "Resume el problema en el asunto.",''', '''    address: (v) => v.length >= 5 ? "" : "Introduce la calle y el número.",\n    postalCode: (v) => /^\\d{5}$/.test(v) ? "" : "Introduce un código postal español válido de 5 dígitos.",\n    city: (v) => v.length >= 2 ? "" : "Introduce la ciudad.",\n    province: (v) => v.length >= 2 ? "" : "Introduce la provincia.",\n    country: (v) => {\n      const normalized = text(v).toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g, "");\n      return ["espana", "es", "spain"].includes(normalized) ? "" : "Este formulario solo admite direcciones de España.";\n    },\n    subject: (v) => v.length >= 4 ? "" : "Resume el problema en el asunto.",'''),
              ('payload', '''    phone: normalizeSpanishPhone(data.get("phone")),\n    address: text(data.get("address")).slice(0, 220),\n    subject: text(data.get("subject")).slice(0, 140),''', '''    phone: normalizeSpanishPhone(data.get("phone")),\n    address: text(data.get("address")).slice(0, 180),\n    addressLine2: text(data.get("addressLine2")).slice(0, 120),\n    postalCode: text(data.get("postalCode")).slice(0, 5),\n    city: text(data.get("city")).slice(0, 90),\n    province: text(data.get("province")).slice(0, 90),\n    country: "España",\n    subject: text(data.get("subject")).slice(0, 140),'''),
              ('queue scan', '''function scan() {\n  if (destroyed || typeof document === "undefined") return false;\n\n  const scope = mountRoot || document;\n  let found = false;\n  scope.querySelectorAll(HOME).forEach((root) => {\n    found = enhance(root) || found;\n  });\n  return found;\n}\n''', '''function scan() {\n  if (destroyed || typeof document === "undefined") return false;\n\n  const scope = mountRoot || document;\n  let found = false;\n  scope.querySelectorAll(HOME).forEach((root) => {\n    found = enhance(root) || found;\n  });\n  return found;\n}\n\nfunction queueScan() {\n  if (destroyed || typeof window === "undefined" || scanFrame) return false;\n  scanFrame = window.requestAnimationFrame(() => {\n    scanFrame = 0;\n    scan();\n  });\n  return true;\n}\n'''),
              ('install', '''  window.addEventListener("onion:main:ready", scan);\n  document.addEventListener("public-home:ready", scan, true);\n\n  observer = new MutationObserver(scan);\n  observer.observe(root, { childList: true, subtree: true });\n\n  if (!scan()) {\n    let attempts = 0;\n    retryTimer = window.setInterval(() => {\n      attempts += 1;\n      if (scan() || attempts >= 12) {\n        clearInterval(retryTimer);\n        retryTimer = 0;\n      }\n    }, 750);\n  }''', '''  window.addEventListener("onion:main:ready", queueScan);\n  document.addEventListener("public-home:ready", queueScan, true);\n\n  observer = new MutationObserver(queueScan);\n  observer.observe(root, { childList: true, subtree: true });\n  scan();'''),
              ('destroy', '''  window.removeEventListener("onion:main:ready", scan);\n  document.removeEventListener("public-home:ready", scan, true);\n\n  observer?.disconnect();\n  observer = null;\n\n  if (retryTimer) clearInterval(retryTimer);\n  retryTimer = 0;\n  mountRoot = null;''', '''  window.removeEventListener("onion:main:ready", queueScan);\n  document.removeEventListener("public-home:ready", queueScan, true);\n\n  observer?.disconnect();\n  observer = null;\n\n  if (scanFrame) window.cancelAnimationFrame(scanFrame);\n  scanFrame = 0;\n  mountRoot = null;'''),
          ])

          patch('src/features/public-home-experience/index.js', [
              ('version', '"public-home.experience.v2-account-toggle-national-phone";', '"public-home.experience.v3-coalesced-observer";'),
              ('state', '''let observer = null;\nlet retryTimer = 0;\nlet destroyed = false;\nlet logoutPending = false;''', '''let observer = null;\nlet scanFrame = 0;\nlet destroyed = false;\nlet logoutPending = false;'''),
              ('queue scan', '''function scan() {\n  if (destroyed || typeof document === "undefined") return false;\n\n  let found = false;\n\n  document.querySelectorAll(HOME).forEach((root) => {\n    found = enhance(root) || found;\n  });\n\n  return found;\n}\n''', '''function scan() {\n  if (destroyed || typeof document === "undefined") return false;\n\n  let found = false;\n\n  document.querySelectorAll(HOME).forEach((root) => {\n    found = enhance(root) || found;\n  });\n\n  return found;\n}\n\nfunction queueScan() {\n  if (destroyed || typeof window === "undefined" || scanFrame) return false;\n  scanFrame = window.requestAnimationFrame(() => {\n    scanFrame = 0;\n    scan();\n  });\n  return true;\n}\n'''),
              ('install', '''  window.addEventListener("onion:main:ready", scan);\n  document.addEventListener("public-home:ready", scan, true);\n\n  const mount =\n    document.querySelector("#view-container") ||\n    document.querySelector("[data-router-view]") ||\n    document.querySelector("[data-app-content]") ||\n    document.body;\n\n  observer = new MutationObserver(scan);\n  observer.observe(mount, { childList: true, subtree: true });\n\n  if (!scan()) {\n    let attempts = 0;\n\n    retryTimer = window.setInterval(() => {\n      attempts += 1;\n\n      if (scan() || attempts >= 12) {\n        window.clearInterval(retryTimer);\n        retryTimer = 0;\n      }\n    }, 500);\n  }''', '''  window.addEventListener("onion:main:ready", queueScan);\n  document.addEventListener("public-home:ready", queueScan, true);\n\n  const mount =\n    document.querySelector("#view-container") ||\n    document.querySelector("[data-router-view]") ||\n    document.querySelector("[data-app-content]") ||\n    document.body;\n\n  observer = new MutationObserver(queueScan);\n  observer.observe(mount, { childList: true, subtree: true });\n  scan();'''),
              ('destroy', '''  window.removeEventListener("onion:main:ready", scan);\n  document.removeEventListener("public-home:ready", scan, true);\n\n  observer?.disconnect();\n  observer = null;\n\n  if (retryTimer) window.clearInterval(retryTimer);\n  retryTimer = 0;\n\n  return true;''', '''  window.removeEventListener("onion:main:ready", queueScan);\n  document.removeEventListener("public-home:ready", queueScan, true);\n\n  observer?.disconnect();\n  observer = null;\n\n  if (scanFrame) window.cancelAnimationFrame(scanFrame);\n  scanFrame = 0;\n\n  return true;'''),
          ])

          patch('src/app/enhancements.js', [
              ('version', '"app.enhancements.v4-public-support-structured-address";', '"app.enhancements.v5-public-home-flow-final";'),
              ('remove adapter', '''  Object.freeze({\n    key: "public-support-structured-address",\n    load: () => import("../features/public-support-structured/index.js"),\n  }),\n''', ''),
          ])

          patch('.github/scripts/public_home_integrity.py', [
              ('forbid adapter', '''FORBIDDEN = (\n    "src/features/public-support/mobile-polish.js",\n    "src/css/views/public/mobile-polish.css",\n    "noop",\n)''', '''FORBIDDEN = (\n    "src/features/public-support/mobile-polish.js",\n    "src/features/public-support-structured/index.js",\n    "src/css/views/public/mobile-polish.css",\n    "noop",\n)'''),
              ('intake version', "('public-support.intake.v8-existing-user-no-client', \"Falta versión final del contrato público\"),", "('public-support.intake.v9-structured-address', \"Falta versión final del contrato público\"),"),
              ('structured checks', '''        ('"onion:public-support:accepted"', "El evento de aceptación debe ser semánticamente neutro"),\n    ):''', '''        ('"onion:public-support:accepted"', "El evento de aceptación debe ser semánticamente neutro"),\n        ('postalCode: text(data.get("postalCode")).slice(0, 5)', "Falta CP estructurado en payload"),\n        ('city: text(data.get("city")).slice(0, 90)', "Falta ciudad estructurada en payload"),\n        ('province: text(data.get("province")).slice(0, 90)', "Falta provincia estructurada en payload"),\n        ('country: "España"', "Falta país canónico en payload"),\n        ('...addressParts(user)', "Falta prefill estructurado desde usuario existente"),\n        ('new MutationObserver(queueScan)', "El intake debe coalescer mutaciones por frame"),\n    ):'''),
              ('experience checks', '("formatNationalPhone", "Falta formato progresivo nacional de teléfono"),', '("public-home.experience.v3-coalesced-observer", "Falta versión coalescida del Home"),\n        ("new MutationObserver(queueScan)", "El Home debe coalescer mutaciones por frame"),\n        ("formatNationalPhone", "Falta formato progresivo nacional de teléfono"),'),
          ])

          patch('docs/PUBLIC_TICKET_INTAKE.md', [
              ('request', '''  "phone": "+34 600 000 000",\n  "address": "Calle, número, CP, localidad",\n  "subject": "El portátil no arranca",''', '''  "phone": "+34 600 000 000",\n  "address": "Calle y número",\n  "addressLine2": "Piso, puerta o escalera",\n  "postalCode": "08001",\n  "city": "Barcelona",\n  "province": "Barcelona",\n  "country": "España",\n  "subject": "El portátil no arranca",'''),
              ('rules', '''El frontend no envía roles, `userId`, `clienteId`, estado de cuenta, tokens, flags de activación ni IDs de ticket elegidos por el visitante.\n''', '''La dirección de un alta nueva viaja estructurada: `address` es calle/número y se complementa con `addressLine2`, `postalCode`, `city`, `province` y `country`. `addressLine2` es opcional; CP, ciudad, provincia y país se validan de nuevo en backend. Para usuarios existentes estos campos nunca sobrescriben el perfil canónico.\n\nEl frontend no envía roles, `userId`, `clienteId`, estado de cuenta, tokens, flags de activación ni IDs de ticket elegidos por el visitante.\n'''),
          ])

          structured = Path('src/features/public-support-structured/index.js')
          if not structured.exists():
              raise SystemExit('structured adapter missing before cleanup')
          structured.unlink()

          intake = Path('src/features/public-support/index.js').read_text(encoding='utf-8')
          home_exp = Path('src/features/public-home-experience/index.js').read_text(encoding='utf-8')
          enh = Path('src/app/enhancements.js').read_text(encoding='utf-8')
          for token in [
              'public-support.intake.v9-structured-address',
              'postalCode: text(data.get("postalCode")).slice(0, 5)',
              'city: text(data.get("city")).slice(0, 90)',
              'province: text(data.get("province")).slice(0, 90)',
              'country: "España"',
              'new MutationObserver(queueScan)',
          ]:
              if token not in intake:
                  raise SystemExit(f'intake invariant missing: {token}')
          if 'setInterval(' in intake:
              raise SystemExit('intake polling still present')
          if 'setInterval(' in home_exp:
              raise SystemExit('home experience polling still present')
          if 'public-support-structured' in enh:
              raise SystemExit('duplicate structured enhancement still registered')
          if Path('src/features/public-support-structured/index.js').exists():
              raise SystemExit('duplicate structured module still exists')
          PY

      - name: Validate final public web flow
        shell: bash
        run: |
          set -euo pipefail
          node --check src/features/public-support/index.js
          node --check src/features/public-support-progress/index.js
          node --check src/features/public-home-experience/index.js
          node --check src/app/enhancements.js
          python3 .github/scripts/public_home_integrity.py
          python3 .github/scripts/public_home_performance.py
          python3 .github/scripts/boot_visual_integrity.py
          python3 .github/scripts/repo_integrity.py
          python3 .github/scripts/app_entrypoint_integrity.py

      - name: Remove one-shot workflow and commit final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-public-home-flow-final-once.yml
          git add src/features/public-support/index.js \
                  src/features/public-home-experience/index.js \
                  src/app/enhancements.js \
                  .github/scripts/public_home_integrity.py \
                  docs/PUBLIC_TICKET_INTAKE.md \
                  src/features/public-support-structured/index.js
          git commit -m "fix: finalize public home flow"
          git push origin HEAD:fix/public-home-flow-final
