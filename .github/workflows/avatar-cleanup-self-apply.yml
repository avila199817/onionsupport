name: Avatar Cleanup Self Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor == 'avila199817' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/system-hygiene-avatar-residue'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact cleanup branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: chore/system-hygiene-avatar-residue
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Apply deterministic cleanup
        run: node tools/apply-avatar-authority-cleanup.mjs

      - name: Validate changed JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              *.js|*.mjs) node --check "$file" ;;
            esac
          done < <(git diff --name-only)

      - name: Commit cleanup back to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Cleanup already applied; nothing to commit."
            exit 0
          fi
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add src
          git commit -m "Eliminar residuos legacy de AvatarSystem"
          git push origin HEAD:chore/system-hygiene-avatar-residue
