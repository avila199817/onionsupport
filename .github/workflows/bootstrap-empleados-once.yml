name: Bootstrap Empleados placeholder

on:
  push:
    branches:
      - feat/empleados-placeholder
    paths:
      - .github/workflows/bootstrap-empleados-once.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-empleados-placeholder
  cancel-in-progress: false

jobs:
  apply:
    name: Apply Empleados route and placeholder
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/empleados-placeholder
          fetch-depth: 0

      - name: Apply exact source changes
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(relative_path: str, old: str, new: str) -> None:
              path = ROOT / relative_path
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{relative_path}: expected one exact replacement, found {count}"
                  )
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          # Core route policy: Empleados is a real admin-only private route.
          replace_once(
              "src/core/config.js",
              '  usuarios: "/usuarios",\n  correo: "/correo",',
              '  usuarios: "/usuarios",\n  empleados: "/empleados",\n  correo: "/correo",',
          )
          replace_once(
              "src/core/config.js",
              '  ROUTES.usuarios,\n  ROUTES.correo,',
              '  ROUTES.usuarios,\n  ROUTES.empleados,\n  ROUTES.correo,',
          )

          # Router path, name, lazy loader and immutable route definition.
          replace_once(
              "src/router/routes.js",
              '''  USUARIOS:\n    ROUTES.usuarios ||\n    "/usuarios",\n\n  CORREO:''',
              '''  USUARIOS:\n    ROUTES.usuarios ||\n    "/usuarios",\n\n  EMPLEADOS:\n    ROUTES.empleados ||\n    "/empleados",\n\n  CORREO:''',
          )
          replace_once(
              "src/router/routes.js",
              '  USUARIOS: "usuarios",\n  CORREO: "correo",',
              '  USUARIOS: "usuarios",\n  EMPLEADOS: "empleados",\n  CORREO: "correo",',
          )
          replace_once(
              "src/router/routes.js",
              '''  usuarios: Object.freeze({\n    moduleKey: "usuarios",\n    loadModule: () =>\n      import(\n        "../views/usuarios/index.js"\n      ),\n    names: Object.freeze([\n      "UsuariosView",\n    ]),\n  }),\n\n  correo: Object.freeze({''',
              '''  usuarios: Object.freeze({\n    moduleKey: "usuarios",\n    loadModule: () =>\n      import(\n        "../views/usuarios/index.js"\n      ),\n    names: Object.freeze([\n      "UsuariosView",\n    ]),\n  }),\n\n  empleados: Object.freeze({\n    moduleKey: "empleados",\n    loadModule: () =>\n      import(\n        "../views/empleados/index.js"\n      ),\n    names: Object.freeze([\n      "EmpleadosView",\n    ]),\n  }),\n\n  correo: Object.freeze({''',
          )
          replace_once(
              "src/router/routes.js",
              '''  createRoute({\n    path: ROUTE_PATHS.USUARIOS,\n    name: ROUTE_NAMES.USUARIOS,\n    title: "Usuarios",\n    viewKey: "usuarios",\n    adminOnly: true,\n    order: 50,\n  }),\n\n  createRoute({\n    path: ROUTE_PATHS.CORREO,''',
              '''  createRoute({\n    path: ROUTE_PATHS.USUARIOS,\n    name: ROUTE_NAMES.USUARIOS,\n    title: "Usuarios",\n    viewKey: "usuarios",\n    adminOnly: true,\n    order: 50,\n  }),\n\n  createRoute({\n    path: ROUTE_PATHS.EMPLEADOS,\n    name: ROUTE_NAMES.EMPLEADOS,\n    title: "Empleados",\n    viewKey: "empleados",\n    adminOnly: true,\n    order: 52,\n  }),\n\n  createRoute({\n    path: ROUTE_PATHS.CORREO,''',
          )

          # Dedicated route stylesheet.
          replace_once(
              "src/router/styles.js",
              '''  usuarios: Object.freeze([\n    "/src/css/components/detail-modal.css",\n    "/src/css/views/usuarios/index.css",\n    "/src/css/views/usuarios/create.css",\n  ]),\n\n  correo: Object.freeze([''',
              '''  usuarios: Object.freeze([\n    "/src/css/components/detail-modal.css",\n    "/src/css/views/usuarios/index.css",\n    "/src/css/views/usuarios/create.css",\n  ]),\n\n  empleados: Object.freeze([\n    "/src/css/views/empleados/index.css",\n  ]),\n\n  correo: Object.freeze([''',
          )

          # Sidebar icon registry: employee badge / ID card.
          replace_once(
              "src/ui/sidebar/template.js",
              '  usuarios: "usuarios",\n  cuenta: "cuenta",',
              '  usuarios: "usuarios",\n  empleados: "empleados",\n  cuenta: "cuenta",',
          )
          replace_once(
              "src/ui/sidebar/template.js",
              '''  usuarios:\n    "M12 11.5a4.25 4.25 0 1 0 0-8.5 4.25 4.25 0 0 0 0 8.5Z M4.25 21c.6-4.1 3.7-6.75 7.75-6.75S19.15 16.9 19.75 21",\n  cuenta:''',
              '''  usuarios:\n    "M12 11.5a4.25 4.25 0 1 0 0-8.5 4.25 4.25 0 0 0 0 8.5Z M4.25 21c.6-4.1 3.7-6.75 7.75-6.75S19.15 16.9 19.75 21",\n  empleados:\n    "M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M8 11a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z M5.5 16.5c.35-2.1 1.45-3.4 2.5-3.4s2.15 1.3 2.5 3.4 M13.5 8H18 M13.5 11.5H18 M13.5 15h3",\n  cuenta:''',
          )
          replace_once(
              "src/ui/sidebar/index.js",
              '''  if (\n    clean ===\n    ROUTES.usuarios\n  ) {\n    return "usuarios";\n  }\n\n  if (\n    clean ===\n    ROUTES.servidor''',
              '''  if (\n    clean ===\n    ROUTES.usuarios\n  ) {\n    return "usuarios";\n  }\n\n  if (\n    clean ===\n    ROUTES.empleados\n  ) {\n    return "empleados";\n  }\n\n  if (\n    clean ===\n    ROUTES.servidor''',
          )

          view_path = ROOT / "src/views/empleados/index.js"
          view_path.parent.mkdir(parents=True, exist_ok=True)
          view_path.write_text('''/* =========================================================\n   Onion Support - Empleados Placeholder\n   Archivo: /src/views/empleados/index.js\n\n   Objetivo:\n   - Reservar el dominio Empleados dentro de la navegación privada.\n   - Separar desde el inicio equipo interno, usuarios y clientes.\n   - No consumir API, Store, Auth ni datos hasta definir el contrato.\n========================================================= */\n\n"use strict";\n\nexport const EMPLEADOS_VIEW_VERSION =\n  "empleados.placeholder.v1-reserved-domain";\nexport const EMPLEADOS_VIEW_NAME =\n  "EmpleadosView";\n\nconst SVG_NS =\n  "http://www.w3.org/2000/svg";\nconst EMPLOYEE_ICON_PATH =\n  "M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M8 11a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z M5.5 16.5c.35-2.1 1.45-3.4 2.5-3.4s2.15 1.3 2.5 3.4 M13.5 8H18 M13.5 11.5H18 M13.5 15h3";\n\nfunction isBrowser() {\n  return (\n    typeof window !== "undefined" &&\n    typeof document !== "undefined"\n  );\n}\n\nfunction isHost(value = null) {\n  return Boolean(\n    isBrowser() &&\n    value &&\n    value.nodeType === 1 &&\n    typeof value.replaceChildren === "function"\n  );\n}\n\nfunction element(\n  tag = "div",\n  className = "",\n  text = ""\n) {\n  const node = document.createElement(tag);\n  if (className) node.className = className;\n  if (text) node.textContent = text;\n  return node;\n}\n\nfunction createEmployeeIcon() {\n  const shell = element(\n    "span",\n    "empleados-placeholder-icon"\n  );\n  shell.setAttribute("aria-hidden", "true");\n\n  const svg = document.createElementNS(SVG_NS, "svg");\n  svg.setAttribute("viewBox", "0 0 24 24");\n  svg.setAttribute("fill", "none");\n  svg.setAttribute("stroke", "currentColor");\n  svg.setAttribute("stroke-width", "1.8");\n  svg.setAttribute("stroke-linecap", "round");\n  svg.setAttribute("stroke-linejoin", "round");\n  svg.setAttribute("focusable", "false");\n\n  const path = document.createElementNS(SVG_NS, "path");\n  path.setAttribute("d", EMPLOYEE_ICON_PATH);\n  svg.append(path);\n  shell.append(svg);\n\n  return shell;\n}\n\nexport function EmpleadosView(\n  host = null\n) {\n  if (!isHost(host)) return null;\n\n  const root = element(\n    "section",\n    "empleados-view"\n  );\n  root.dataset.view = "empleados";\n  root.setAttribute(\n    "aria-labelledby",\n    "empleados-view-title"\n  );\n\n  const card = element(\n    "article",\n    "empleados-placeholder"\n  );\n\n  const badge = element(\n    "span",\n    "empleados-placeholder-badge",\n    "Módulo reservado"\n  );\n\n  const title = element(\n    "h1",\n    "empleados-placeholder-title",\n    "Empleados"\n  );\n  title.id = "empleados-view-title";\n\n  const description = element(\n    "p",\n    "empleados-placeholder-description",\n    "Aquí vivirá la gestión del equipo interno, separada de Usuarios y Clientes."\n  );\n\n  const note = element(\n    "p",\n    "empleados-placeholder-note",\n    "La ruta ya está preparada. Todavía no carga datos ni conecta con ninguna API."\n  );\n\n  card.append(\n    createEmployeeIcon(),\n    badge,\n    title,\n    description,\n    note\n  );\n  root.append(card);\n  host.replaceChildren(root);\n\n  let destroyed = false;\n\n  return Object.freeze({\n    root,\n    destroy() {\n      if (destroyed) return false;\n      destroyed = true;\n      if (root.parentNode) root.remove();\n      return true;\n    },\n  });\n}\n\nexport default EmpleadosView;\n''', encoding="utf-8")

          css_path = ROOT / "src/css/views/empleados/index.css"
          css_path.parent.mkdir(parents=True, exist_ok=True)
          css_path.write_text('''/* =========================================================\n   Onion Support - Empleados Placeholder\n   Archivo: /src/css/views/empleados/index.css\n========================================================= */\n\n@layer views {\n  .empleados-view {\n    min-inline-size: 0;\n    min-block-size: 100%;\n    display: grid;\n    place-items: center;\n    padding: clamp(var(--space-lg), 4vw, var(--space-4xl));\n  }\n\n  .empleados-placeholder {\n    position: relative;\n    isolation: isolate;\n    overflow: hidden;\n    inline-size: min(100%, 720px);\n    min-block-size: 360px;\n    display: grid;\n    justify-items: center;\n    align-content: center;\n    gap: var(--space-md);\n    padding: clamp(var(--space-2xl), 6vw, var(--space-5xl));\n    border: 1px solid var(--panel-border);\n    border-radius: var(--panel-radius);\n    background:\n      radial-gradient(\n        circle at 50% 0%,\n        var(--accent-subtle),\n        transparent 58%\n      ),\n      var(--panel-bg);\n    box-shadow: var(--panel-shadow);\n    text-align: center;\n  }\n\n  .empleados-placeholder::after {\n    content: "";\n    position: absolute;\n    z-index: -1;\n    inset-inline: 12%;\n    inset-block-end: -38%;\n    block-size: 62%;\n    border-radius: 50%;\n    background: var(--accent-ghost);\n    filter: blur(34px);\n    pointer-events: none;\n  }\n\n  .empleados-placeholder-icon {\n    inline-size: 68px;\n    block-size: 68px;\n    display: grid;\n    place-items: center;\n    border: 1px solid var(--border-default);\n    border-radius: var(--radius-xl);\n    background: var(--surface-glass);\n    color: var(--text-strong);\n    box-shadow: var(--shadow-sm);\n  }\n\n  .empleados-placeholder-icon svg {\n    inline-size: 36px;\n    block-size: 36px;\n  }\n\n  .empleados-placeholder-badge {\n    display: inline-flex;\n    align-items: center;\n    gap: var(--space-xs);\n    min-block-size: 28px;\n    padding-inline: var(--space-sm);\n    border: 1px solid var(--border-success);\n    border-radius: var(--radius-pill);\n    background: var(--success-soft);\n    color: var(--success-strong);\n    font-size: var(--font-xs);\n    font-weight: 700;\n    letter-spacing: .035em;\n    text-transform: uppercase;\n  }\n\n  .empleados-placeholder-badge::before {\n    content: "";\n    inline-size: 6px;\n    block-size: 6px;\n    border-radius: 50%;\n    background: currentColor;\n    box-shadow: 0 0 0 4px var(--success-soft);\n  }\n\n  .empleados-placeholder-title {\n    margin: 0;\n    color: var(--text-strong);\n    font-size: clamp(var(--font-3xl), 4vw, var(--font-4xl));\n    line-height: 1.05;\n    letter-spacing: -.035em;\n  }\n\n  .empleados-placeholder-description,\n  .empleados-placeholder-note {\n    margin: 0;\n    max-inline-size: 56ch;\n  }\n\n  .empleados-placeholder-description {\n    color: var(--text);\n    font-size: var(--font-lg);\n    line-height: 1.55;\n  }\n\n  .empleados-placeholder-note {\n    color: var(--text-muted);\n    font-size: var(--font-sm);\n    line-height: 1.5;\n  }\n\n  @media (max-width: 640px) {\n    .empleados-view {\n      place-items: start stretch;\n      padding: var(--space-md);\n    }\n\n    .empleados-placeholder {\n      min-block-size: 320px;\n      padding: var(--space-2xl) var(--space-lg);\n    }\n  }\n}\n''', encoding="utf-8")

          # This workflow is a one-shot patch carrier and must not remain in the PR.
          (ROOT / ".github/workflows/bootstrap-empleados-once.yml").unlink()
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/core/config.js
          node --check src/router/routes.js
          node --check src/router/styles.js
          node --check src/ui/sidebar/template.js
          node --check src/ui/sidebar/index.js
          node --check src/views/empleados/index.js

      - name: Commit final feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git diff --cached --check
          git commit -m "Añadir vista placeholder de Empleados"
          git push origin HEAD:feat/empleados-placeholder
