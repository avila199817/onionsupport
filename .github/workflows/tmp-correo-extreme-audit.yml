      if (sequence !== listSequence || signal.aborted || requestController.signal.aborted) return;
      state.loadingMessages = false;
      state.loadingMore = false;
      renderList();
      toast(errorMessage(error, "No se pudieron cargar los mensajes."), "error");
    } finally {
      if (listAbortController === requestController) listAbortController = null;
    }
  }

