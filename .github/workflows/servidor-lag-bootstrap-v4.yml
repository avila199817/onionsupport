name: Servidor navigation latency bootstrap v4

on:
  push:
    branches:
      - fix/servidor-route-lag

permissions:
  contents: write

jobs:
  prepare-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use exact Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Apply Servidor latency patch
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/^contract = '''/contract = r'''/" .github/scripts/servidor_lag_patch.py
          python3 .github/scripts/servidor_lag_patch.py

      - name: Validate focused fix
        shell: bash
        run: |
          set -euo pipefail
          node --check src/views/server/index.js
          node --check src/views/server/server.api.base.js
          node --check src/views/server/server.api.js
          node --check .github/scripts/servidor_navigation_performance_contract.mjs
          node .github/scripts/servidor_navigation_performance_contract.mjs
          python3 .github/scripts/repo_integrity.py

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/servidor_lag_patch.py
          rm -f .github/workflows/servidor-lag-bootstrap.yml
          rm -f .github/workflows/servidor-lag-bootstrap-v2.yml
          rm -f .github/workflows/servidor-lag-bootstrap-v3.yml
          rm -f .github/workflows/servidor-lag-bootstrap-v4.yml
          git config user.name "Onion Support Automation"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "perf(servidor): commit route before observability I/O"

      - name: Validate final committed candidate
        shell: bash
        env:
          PUBLIC_SITE_URL: https://onionsupport.com
          DIRECT_API_URL: https://api.onionsupport.com
        run: |
          set -euo pipefail
          test ! -e .github/scripts/servidor_lag_patch.py
          test ! -e .github/workflows/servidor-lag-bootstrap.yml
          test ! -e .github/workflows/servidor-lag-bootstrap-v2.yml
          test ! -e .github/workflows/servidor-lag-bootstrap-v3.yml
          test ! -e .github/workflows/servidor-lag-bootstrap-v4.yml
          git status --short
          npm run validate

      - name: Push validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/servidor-route-lag
