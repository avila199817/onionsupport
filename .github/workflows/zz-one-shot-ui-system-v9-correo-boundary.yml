name: One-shot UI System V9 Correo Boundary

on:
  push:
    branches:
      - refactor/ui-system-v9-correo-boundary
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

env:
  TARGET_BRANCH: refactor/ui-system-v9-correo-boundary

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'refactor/ui-system-v9-correo-boundary')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Guard trigger
        run: |
          set -euo pipefail
          test -f .github/.ui-system-v9-correo-boundary-trigger || {
            echo "Trigger aún no presente; no hay migración que aplicar."
            exit 0
          }

      - name: Apply Correo boundary V9
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_system_v9_correo_boundary.py

      - name: Validate repository
        run: |
          set -euo pipefail
          python3 .github/scripts/repo_integrity.py
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Validate Correo boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          api = Path('src/views/correo/correo.api.js').read_text(encoding='utf-8')
          view = Path('src/views/correo/index.js').read_text(encoding='utf-8')
          assert 'localStorage' not in api
          assert 'function primeNotificationPreference()' in view
          assert view.count('onion.correo.notifications.v1') == 1
          print('Correo API/UI boundary OK')
          PY

      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add \
            src/views/correo/correo.api.js \
            src/views/correo/index.js \
            .github/scripts/repo_integrity.py \
            docs/UI_SYSTEM_V9_AUDIT.md
          if git diff --cached --quiet; then
            echo "Sin cambios de migración."
            exit 0
          fi
          git commit -m "refactor(correo): separar API de preferencia browser"
          git push origin HEAD:${TARGET_BRANCH}
