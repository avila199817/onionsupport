name: Codex Clientes Legacy Cleanup

on:
  push:
    branches:
      - codex/clientes-remove-legacy-facades

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Remove Clientes legacy facades
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def block(text):
              return textwrap.dedent(text).strip("\n")

          def replace_exact(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} exact matches, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new))

          def replace_regex(path, pattern, repl, expected=1, flags=0):
              text = read(path)
              updated, count = re.subn(pattern, repl, text, flags=flags)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} regex matches, found {count}: {pattern}")
              write(path, updated)

          index_path = "src/views/clientes/index.js"
          replace_regex(
              index_path,
              r'import \{\n\s+init as initLegacyCreateBridge,\n\s+openCreate as openLegacyCreate,\n\s+destroy as destroyLegacyCreateBridge,\n\} from "\./clientes\.index\.legacy\.js";',
              'import { createClientesCreateController } from "./clientes.create-controller.js";',
          )
          replace_regex(
              index_path,
              r'  let legacyBridgeHost = null;\n  let legacyBridgeReady = false;',
              '  let createController = null;',
          )
          replace_regex(
              index_path,
              r'  async function ensureLegacyCreateBridge\(\) \{.*?\n  \}\n\n  async function openCreate\(\) \{',
              block('''
              function ensureCreateController() {
                if (createController) return createController;

                createController = createClientesCreateController({
                  getRole: () => getCurrentRole(context),
                  getUser: getCurrentUser,
                  isAdmin: () => isAdmin(context),
                  showToast,
                  emitEvent,
                  onCreated,
                });
                return createController;
              }

              async function openCreate() {
              '''),
              flags=re.S,
          )
          replace_regex(
              index_path,
              r'      if \(!\(await ensureLegacyCreateBridge\(\)\)\) return false;\n      return \(await openLegacyCreate\(\)\) !== false;',
              '      return ensureCreateController().open() !== false;',
          )
          replace_regex(
              index_path,
              r'\n    if \(isBrowser\(\)\) \{\n      window\.addEventListener\("clientes:create:success", onCreated\);\n    \}',
              '',
          )
          replace_regex(
              index_path,
              r'\n      if \(isBrowser\(\)\) \{\n        window\.removeEventListener\("clientes:create:success", onCreated\);\n        clearSearchTimer\(\);\n      \}',
              '\n      if (isBrowser()) {\n        clearSearchTimer();\n      }',
          )
          replace_regex(
              index_path,
              r'    if \(legacyBridgeReady\) \{\n      try \{ await destroyLegacyCreateBridge\(\{ clear: true \}\); \} catch \{ /\* noop \*/ \}\n    \}\n    legacyBridgeReady = false;\n    legacyBridgeHost = null;',
              '    try { createController?.destroy?.(); } catch { /* noop */ }\n    createController = null;',
          )

          template_path = "src/views/clientes/clientes.template.js"
          replace_exact(
              template_path,
              '"./clientes.template.legacy.js"',
              '"./clientes.model.js"',
              expected=2,
          )

          contract_path = ".github/scripts/clientes_scale_contract.py"
          contract = read(contract_path)
          for assignment in (
              'api_compat = read("src/views/clientes/clientes.api.legacy.js")\n',
              'template_compat = read("src/views/clientes/clientes.template.legacy.js")\n',
              'legacy_controller = read("src/views/clientes/clientes.index.legacy.js")\n',
          ):
              if contract.count(assignment) != 1:
                  raise SystemExit(f"contract: missing assignment {assignment.strip()}")
              contract = contract.replace(assignment, "", 1)

          def remove_require_by_message(text, message):
              needle = f'"{message}"'
              pos = text.find(needle)
              if pos < 0:
                  raise SystemExit(f"contract: missing require message: {message}")
              start = text.rfind("require(", 0, pos)
              if start < 0:
                  raise SystemExit(f"contract: missing require start for: {message}")
              end = text.find("\n)\n", pos)
              if end < 0:
                  raise SystemExit(f"contract: missing require end for: {message}")
              return text[:start] + text[end + 3:]

          for message in (
              "legacy API path must be a zero-logic facade over the canonical API",
              "legacy template path must be a zero-logic facade over the canonical model",
              "legacy index path must be a thin compatibility facade, never a second listing controller",
          ):
              contract = remove_require_by_message(contract, message)

          contract = contract.replace(
              "# Compatibility files may re-export/delegate only; they must not own logic.",
              "# Retired Clientes compatibility paths must stay absent after consumer migration.",
              1,
          )
          marker = "# ---------------------------------------------------------------------------\n# LIST API / CURSOR SCALE CONTRACT."
          if contract.count(marker) != 1:
              raise SystemExit("contract: LIST API marker not found exactly once")
          direct_contract = block('''
          # Retired compatibility paths must remain absent after the final consumer migration.
          for legacy_path in (
              "src/views/clientes/clientes.index.legacy.js",
              "src/views/clientes/clientes.template.legacy.js",
              "src/views/clientes/clientes.api.legacy.js",
          ):
              require(
                  not (ROOT / legacy_path).exists(),
                  f"retired Clientes facade must stay removed: {legacy_path}",
              )

          require(
              'from "./clientes.model.js"' in template
              and "clientes.template.legacy.js" not in template,
              "Clientes template must import the canonical model directly",
          )
          require(
              'from "./clientes.create-controller.js"' in controller
              and "createClientesCreateController" in controller
              and "clientes.index.legacy.js" not in controller
              and "legacyBridge" not in controller
              and "onCreated," in controller,
              "main Clientes controller must own create lifecycle directly and refresh after creation",
          )

          ''') + "\n\n"
          contract = contract.replace(marker, direct_contract + marker, 1)
          write(contract_path, contract)

          replace_exact(
              "docs/UI_MODAL_SYSTEM.md",
              '| Clientes: alta y detalle | `views/clientes/clientes.index.legacy.js`, `clientes.template.modal.js` |',
              '| Clientes: alta y detalle | `views/clientes/clientes.create-controller.js`, `clientes.template.modal.js` |',
          )
          replace_exact(
              "docs/PROJECT_CONTEXT.md",
              '| `src/views/clientes/clientes.api.js` | Página y detalle en memoria; caché persistente de dataset deshabilitada. `clientes.api.legacy.js` sólo reexporta la API | Verificar aislamiento y borrado entre sesiones; retirar la fachada sin consumidores en una entrega acotada. |',
              '| `src/views/clientes/clientes.api.js` | Página y detalle en memoria; caché persistente de dataset deshabilitada. | Verificar aislamiento y borrado entre sesiones; no queda una segunda ruta de compatibilidad de API. |',
          )

          roadmap_path = "docs/ROADMAP.md"
          replace_regex(
              roadmap_path,
              r'Tras verificar esta release, el siguiente bloque acotado de código es retirar las\nfachadas `clientes\.index\.legacy\.js`, `clientes\.template\.legacy\.js` y\n`clientes\.api\.legacy\.js`:.*?con una prueba de apertura, cancelación, creación y reapertura del modal\.\n',
              block('''
              Las tres fachadas legacy de Clientes quedan retiradas tras migrar sus últimos
              consumidores. La vista abre y desmonta directamente el controlador canónico de alta,
              conserva las validaciones existentes y refresca el listado mediante el callback de
              creación; el contrato impide reintroducir rutas de compatibilidad paralelas.

              Tras publicar y verificar este corte, el siguiente bloque acotado es F1: ejecutar el
              recorrido vertical autenticado frontend/backend con cuentas y fixtures controlados y
              registrar request IDs y limpieza sin exponer datos privados.
              ''') + "\n",
              flags=re.S,
          )
          replace_exact(
              roadmap_path,
              '**Estado:** consolidación de identidad en curso; recorrido autenticado completo pendiente. **Responsables:** frontend y backend.',
              '**Estado:** identidad y fachadas de Clientes consolidadas en código; recorrido autenticado completo pendiente. **Responsables:** frontend y backend.',
          )

          for legacy in (
              Path("src/views/clientes/clientes.index.legacy.js"),
              Path("src/views/clientes/clientes.template.legacy.js"),
              Path("src/views/clientes/clientes.api.legacy.js"),
          ):
              if not legacy.exists():
                  raise SystemExit(f"expected legacy facade before removal: {legacy}")
              legacy.unlink()

          # The helper workflow must not remain in the candidate tree.
          workflow = Path(".github/workflows/codex-clientes-legacy-cleanup.yml")
          if workflow.exists():
              workflow.unlink()

          # Runtime and user-facing docs must not retain consumers/references to retired paths.
          checked = [
              Path("src/views/clientes/index.js"),
              Path("src/views/clientes/clientes.template.js"),
              Path("docs/UI_MODAL_SYSTEM.md"),
              Path("docs/PROJECT_CONTEXT.md"),
              Path("docs/ROADMAP.md"),
          ]
          retired = (
              "clientes.index.legacy.js",
              "clientes.template.legacy.js",
              "clientes.api.legacy.js",
          )
          leftovers = []
          for path in checked:
              text = path.read_text(encoding="utf-8")
              for name in retired:
                  if name in text:
                      leftovers.append(f"{path}: {name}")
          if leftovers:
              raise SystemExit("retired facade references remain:\n" + "\n".join(leftovers))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate source contracts
        run: npm run validate:source

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes generated"; exit 1; }
          git commit -m "refactor(clientes): retirar fachadas legacy finales"
          git push origin HEAD:codex/clientes-remove-legacy-facades
