<!doctype html>
<html
  lang="en"
  dir="ltr"
  data-app="onion"
  data-app-name="Onion Support"
  data-locale="en"
  data-locale-source="initial"
  data-locale-fallback="en"
  data-locale-supported="ca es en"
  data-theme="system"
  data-theme-mode="system"
  data-theme-source="initial"
  data-theme-ready="false"
  data-app-state="booting"
  data-app-loading="true"
  data-app-booting="true"
  data-app-ready="false"
  data-authenticated="false"
  data-route-mode="boot"
  data-shell="visible"
  data-shell-state="booting"
  data-shell-interactive="false"
  data-chrome="hidden"
  class="app-booting app-loading"
>
<head>
  <!-- =========================================================
       Onion Support - SPA Entry
       Archivo: /index.html

       Responsabilidad:
       - Entrada física única de la SPA.
       - Declarar mounts reales.
       - Cargar preboot/theme antes del CSS.
       - Cargar /src/main.js como entrypoint único.
       - Sin JS inline.
       - Sin CSS inline.
       - Sin auth.
       - Sin router.
       - Sin API.
       - Sin clientes HTTP.
  ========================================================= -->

  <meta charset="UTF-8">
  <base href="/">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Onion Support</title>

  <meta
    name="application-name"
    content="Onion Support"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Onion Support"
  >

  <meta
    name="description"
    content="Onion Support · Panel privado SaaS de soporte, incidencias, facturación y gestión interna."
  >

  <meta
    name="robots"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="googlebot"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="bingbot"
    content="noindex, nofollow, noarchive, noimageindex, nosnippet"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <meta
    name="format-detection"
    content="telephone=no, date=no, address=no, email=no"
  >

  <meta
    name="color-scheme"
    content="light dark"
  >

  <meta
    name="theme-color"
    media="(prefers-color-scheme: light)"
    content="#ffffff"
    data-onion-theme-color-light="true"
  >

  <meta
    name="theme-color"
    media="(prefers-color-scheme: dark)"
    content="#0a0c11"
    data-onion-theme-color-dark="true"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <link
    rel="icon"
    href="/favicon.ico"
    sizes="any"
  >

  <link
    rel="icon"
    href="/src/media/img/favicon_black_circle.png?v=6"
    type="image/png"
    sizes="128x128"
  >

  <link
    rel="shortcut icon"
    href="/src/media/img/favicon_black_circle.png?v=6"
    type="image/png"
    sizes="128x128"
  >

  <link
    rel="apple-touch-icon"
    href="/src/media/img/favicon_black_circle.png?v=6"
    sizes="128x128"
  >

  <link
    rel="manifest"
    href="/site.webmanifest?v=6"
  >

  <link
    rel="preload"
    href="/src/media/img/favicon_white.png?v=6"
    as="image"
    type="image/png"
    fetchpriority="high"
  >

  <link
    rel="preload"
    href="/src/media/img/favicon_black.png?v=6"
    as="image"
    type="image/png"
    fetchpriority="low"
  >

  <link
    rel="modulepreload"
    href="/src/main.js"
  >

  <script src="/src/preboot/theme.js"></script>

  <link
    rel="stylesheet"
    href="/src/css/app.css"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="/src/css/core/noscript.css"
    >
  </noscript>
</head>

<body
  class="app-booting app-loading"
  data-app="onion"
  data-app-name="Onion Support"
  data-density="default"
  data-app-loading="true"
  data-app-booting="true"
  data-app-ready="false"
  data-authenticated="false"
  data-route-mode="boot"
  data-shell="visible"
  data-shell-state="booting"
  data-shell-interactive="false"
  data-chrome="hidden"
>
  <a
    class="sr-only sr-only-focusable app-skip-link"
    href="#main-content"
    data-skip-link="true"
  >
    Skip to main content
  </a>

  <div
    id="app-loader"
    class="app-loader is-visible"
    data-app-loader="true"
    data-loader-visible="true"
    data-loader-state="booting"
    role="status"
    aria-live="polite"
    aria-busy="true"
    aria-hidden="false"
    aria-labelledby="app-loader-title"
    aria-describedby="app-loader-text app-loader-subtext"
  >
    <div
      class="app-loader__backdrop"
      data-loader-backdrop="true"
      aria-hidden="true"
    ></div>

    <div
      class="app-loader__card"
      data-loader-card="true"
    >
      <div
        class="app-loader__brand"
        data-loader-brand="true"
        aria-hidden="true"
      >
        <img
          class="app-loader__logo app-loader__logo--dark"
          src="/src/media/img/favicon_white.png?v=6"
          alt=""
          width="64"
          height="64"
          loading="eager"
          decoding="async"
          fetchpriority="high"
          draggable="false"
          data-loader-logo-dark="true"
        >

        <img
          class="app-loader__logo app-loader__logo--light"
          src="/src/media/img/favicon_black.png?v=6"
          alt=""
          width="64"
          height="64"
          loading="eager"
          decoding="async"
          fetchpriority="low"
          draggable="false"
          data-loader-logo-light="true"
        >

        <div
          class="app-loader__logo-fallback"
          data-loader-logo-fallback="true"
          aria-hidden="true"
        >
          O
        </div>
      </div>

      <div
        class="app-loader__copy"
        data-loader-copy="true"
      >
        <strong
          id="app-loader-title"
          class="app-loader__title"
          data-loader-title="true"
        >
          Onion Support
        </strong>

        <span
          id="app-loader-text"
          class="app-loader__text"
          data-loader-text="true"
        >
          Loading session...
        </span>

        <small
          id="app-loader-subtext"
          class="app-loader__subtext"
          data-loader-subtext="true"
        >
          Preparing secure panel
        </small>
      </div>

      <div
        class="app-loader__bar"
        aria-hidden="true"
        data-loader-bar="true"
      >
        <span class="app-loader__bar-fill"></span>
      </div>
    </div>
  </div>

  <noscript>
    <div
      id="noscript-root"
      class="layout noscript-layout"
      data-noscript-root="true"
    >
      <main
        class="main-content noscript-main"
        role="main"
        aria-label="Main content"
      >
        <section
          class="noscript-box"
          lang="en"
        >
          <h1>JavaScript required</h1>

          <p>
            Onion Support requires JavaScript to load the private panel.
          </p>
        </section>
      </main>
    </div>
  </noscript>

  <div
    id="app-shell"
    class="layout app-shell"
    data-app-shell="true"
    data-shell="visible"
    data-shell-state="booting"
    data-shell-interactive="false"
    data-chrome="hidden"
    data-route-mode="boot"
    aria-busy="true"
    aria-hidden="false"
  >
    <div
      id="sidebar-mount"
      data-sidebar-mount="true"
      data-shell="visible"
      data-shell-state="booting"
      data-chrome="hidden"
      data-route-mode="boot"
      aria-hidden="false"
    ></div>

    <div
      id="topbar-mount"
      data-topbar-mount="true"
      data-shell="visible"
      data-shell-state="booting"
      data-chrome="hidden"
      data-route-mode="boot"
      aria-hidden="false"
    ></div>

    <main
      id="main-content"
      class="main-content"
      role="main"
      aria-label="Main content"
      tabindex="-1"
      aria-busy="true"
      aria-hidden="false"
      data-main-content="true"
      data-shell="visible"
      data-shell-state="booting"
      data-chrome="hidden"
      data-route-mode="boot"
    >
      <div
        id="table-head"
        class="table-head"
        data-tablehead="true"
        data-shell="visible"
        data-shell-state="booting"
        data-chrome="hidden"
        data-route-mode="boot"
        hidden
        aria-hidden="true"
      >
        <div
          id="tablehead-container"
          data-tablehead-container="true"
        ></div>
      </div>

      <div
        id="app-content"
        data-app-content="true"
        data-shell="visible"
        data-shell-state="booting"
        data-route-mode="boot"
        aria-busy="true"
      >
        <div
          id="view-container"
          data-view-root="true"
          data-router-view="true"
          data-view-container="true"
          data-shell="visible"
          data-shell-state="booting"
          data-route-mode="boot"
          tabindex="-1"
          aria-busy="true"
          aria-hidden="false"
        ></div>
      </div>
    </main>
  </div>

  <script
    type="module"
    src="/src/main.js"
  ></script>
</body>
</html>
