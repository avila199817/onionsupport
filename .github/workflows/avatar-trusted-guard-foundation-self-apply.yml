name: Avatar Trusted Guard Foundation Self Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor == 'avila199817' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/avatar-trusted-guard-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact foundation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: chore/avatar-trusted-guard-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Apply migration-safe V16 guard
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/scripts/repo_integrity.py')
          source = path.read_text(encoding='utf-8')

          legacy_tuple = '''        "src/views/clientes/clientes.template.js": (\n            "clientes.template.cursor.v12.private-admin-visual-parity",\n            "clientes-avatar--tone-${avatarTone(current)}",\n            "clientes-table-loading-row",\n            "clientes-refresh-overlay",\n        ),'''
          bridged_tuple = '''        "src/views/clientes/clientes.template.js": (\n            "clientes.template.cursor.v12.private-admin-visual-parity",\n            "clientes-table-loading-row",\n            "clientes-refresh-overlay",\n        ),'''

          if source.count(legacy_tuple) != 1:
              raise SystemExit('V16 legacy Clientes tuple not found exactly once')
          source = source.replace(legacy_tuple, bridged_tuple)

          anchor = '''    for relative in (\n        "src/css/views/facturas/index.css",\n        "src/css/views/clientes/index.css",\n        "src/css/views/usuarios/index.css",\n    ):'''
          bridge = '''    clientes_template = (ROOT / "src/views/clientes/clientes.template.js").read_text(encoding="utf-8")\n    legacy_avatar_contract = "clientes-avatar--tone-${avatarTone(current)}" in clientes_template\n    global_avatar_contract = all(\n        token in clientes_template\n        for token in (\n            "resolveAvatarPresentation",\n            'data-avatar-system="true"',\n            'data-avatar-host="true"',\n            'data-avatar-tone="${attr(String(presentation.tone))}"',\n        )\n    )\n\n    if legacy_avatar_contract == global_avatar_contract:\n        errors.append(\n            "src/views/clientes/clientes.template.js :: V16 exige exactamente una autoridad de avatar conocida: legacy o AvatarSystem global"\n        )\n\n'''

          if source.count(anchor) != 1:
              raise SystemExit('V16 breakpoint anchor not found exactly once')
          source = source.replace(anchor, bridge + anchor)
          path.write_text(source, encoding='utf-8')

      - name: Validate foundation syntax and current main compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/repo_integrity.py
          python3 .github/scripts/repo_integrity.py

      - name: Commit foundation guard
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Foundation already applied."
            exit 0
          fi
          git config user.name "Onion Support"
          git config user.email "cristian@onionsupport.com"
          git add .github/scripts/repo_integrity.py
          git commit -m "Permitir migración segura de autoridad de avatar V16"
          git push origin HEAD:chore/avatar-trusted-guard-foundation
